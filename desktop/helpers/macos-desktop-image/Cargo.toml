[package]
name = "mrk-desktop-image"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false
autobins = false
build = "build.rs"

# A distinct image graph: not the ordinary bin or an observation/headless role.
[workspace]
[lib]
name = "mrk_desktop_image"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
mobile-release-kit-desktop = { path = "../../src-tauri", default-features = false, features = ["macos-installed-desktop-image"] }

[patch.crates-io]
zbus = { path = "../../vendor/zbus-5.19.0" }

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
