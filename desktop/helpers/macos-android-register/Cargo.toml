[package]
name = "mrk-android-register"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

# Separate headless Cargo graph. Never select this feature in the app graph.
[workspace]
[dependencies]
mobile-release-kit-desktop = { path = "../../src-tauri", default-features = false, features = ["macos-android-registration-helper"] }

# Same reviewed first-party supplier binding as the core; transitive manifest
# patches are not inherited by a new workspace root.
[patch.crates-io]
zbus = { path = "../../vendor/zbus-5.19.0" }

[profile.release]
panic = "unwind"
