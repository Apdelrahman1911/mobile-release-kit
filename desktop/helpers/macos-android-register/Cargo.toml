[package]
name = "mrk-android-register"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false
autobins = false

# Isolated resident image graph. Historical src/main.rs remains inert SOURCE.
[workspace]
[lib]
name = "mrk_resident_image"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

# No named default feature: preserve the ordinary compiler-artifact features [].
[features]
e2-native-fixture = ["mrk-macos-installed-native/e2-native-fixture"]

[dependencies]
mobile-release-kit-desktop = { path = "../../src-tauri", default-features = false, features = ["macos-installed-resident-image"] }

mrk-macos-installed-native = { path = "../../native/macos-installed-native", features = ["resident-image"] }

# Same reviewed first-party supplier binding as the core; transitive manifest
# patches are not inherited by a new workspace root.
[patch.crates-io]
zbus = { path = "../../vendor/zbus-5.19.0" }

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
