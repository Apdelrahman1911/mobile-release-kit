[package]
name = "mrk-macos-installed-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = []
# Instrumented installed-app qualification only; never a shipping control.
installed-observation = []
# Only the separate fixed helper Cargo graph selects this role.
vault-helper = []
# Separate fixed protected Android registration service; never a UI/vault role.
android-registration-helper = []
# Ordinary product image; facade alone performs inherited argv admission.
desktop-image = []
# Only the actual returning resident cdylib selects this image adapter.
resident-image = ["android-registration-helper"]
# Explicit nonshipping E2 image graph only; never selected by default.
e2-native-fixture = []
# Fixed abrupt removal fixture only; never selected by any ordinary role.
installed-removal-abrupt-fixture = []
# Explicit nonshipping package signer; excluded from every ordinary/image role.
package-producer-signing = []

[build-dependencies]
cc = "=1.4.6"

# Explicit nonshipping peer only. No default app/package target includes it.
[[example]]
name = "wrapping_peer_reader"
path = "examples/wrapping_peer_reader.rs"
test = false
required-features = ["installed-observation"]

[[example]]
name = "wrapping_private_cohort"
path = "examples/wrapping_private_cohort.rs"
test = false
required-features = ["installed-observation"]

# Fixed fixture client image; never an ordinary executable or default example.
[[example]]
name = "e2_maintenance_client"
path = "examples/e2_maintenance_client.rs"
crate-type = ["cdylib"]
test = false
bench = false
required-features = ["desktop-image", "e2-native-fixture"]

[dependencies]
zeroize = { version = "=1.9.0", default-features = false }
nix = { version = "=0.30.1", default-features = false, features = ["fs", "mount", "user"] }
