[package]
name = "mobile-release-kit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
build = "build.rs"
description = "Read-only desktop foundation for the Mobile Release Kit core"

[lib]
name = "mobile_release_desktop"
path = "src/lib.rs"

[[bin]]
name = "mobile-release-kit-desktop"
path = "src/main.rs"
required-features = ["desktop-shell"]

[features]
default = []
desktop-shell = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
development-runtime = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tauri = { version = "=2.9.5", optional = true, default-features = false, features = ["wry", "compression"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
tauri-build = { version = "=2.5.3", optional = true, features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
