[package]
name = "mobile-release-kit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
build = "build.rs"
description = "Read-only desktop foundation for the Mobile Release Kit core"

[lib]
name = "mobile_release_desktop"
path = "src/lib.rs"

[[bin]]
name = "mobile-release-kit-desktop"
path = "src/main.rs"
required-features = ["desktop-shell"]

[[test]]
name = "session-gtk-qualification"
path = "tests/session_gtk_qualification.rs"
harness = false
required-features = ["desktop-shell", "development-runtime"]

[features]
default = []
desktop-shell = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:webkit2gtk", "dep:gtk"]
development-runtime = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
tokio = { version = "=1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tauri = { version = "=2.11.5", optional = true, default-features = false, features = ["wry", "compression"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["fs"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dev-dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true, default-features = false, features = [] }
webkit2gtk = { version = "=2.0.2", optional = true, default-features = false, features = ["v2_20"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "thread", "system"] }
mrk-linux-mount-observation = { path = "../native/linux-mount-observation" }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true, features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
