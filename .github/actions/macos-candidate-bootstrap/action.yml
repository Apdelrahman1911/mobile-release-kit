name: "Fresh macOS candidate part admission"
description: "Admit this actual hosted runner and fresh SOURCE/work originals"
inputs:
  work-root:
    description: "Exact completed prepare work basename; destination must be absent"
    required: true
runs:
  using: "composite"
  steps:
    - name: "Admit only this exact disposable-hosted source route"
      shell: "bash"
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]] || exit 1
        case "$MRK_MACOS_NATIVE_SCOPE" in
          disabled) [[ "$MRK_MACOS_PACKAGE_ROLE" == ordinary-image ]] || exit 1 ;;
          project-identity-native|tool-setup|git-native)
            [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate && "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$MRK_MACOS_PACKAGE_ROLE" == installed-shell-observation ]] || exit 1
            [[ "$MRK_MACOS_SAME_PACKAGE_SCOPE" == disabled && "$MRK_MACOS_REMOVAL_CASE" == disabled && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
            [[ "${MRK_MACOS_AQUA_SCOPE:-disabled}" == disabled && "${MRK_MACOS_XCODE_SETUP_SCOPE:-disabled}" == disabled ]] || exit 1
            ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_SAME_PACKAGE_SCOPE" in
          disabled) ;;
          same-package-noop) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_ANDROID_UI_SCOPE" in
          disabled|android-signed-build) ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_IOS_UI_SCOPE" in
          disabled) ;;
          ios-unsigned-archive|ios-pending-recovery)
            [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
            ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_TARGET" in
          aarch64-apple-darwin)
            [[ "$RUNNER_ARCH" == ARM64 && "$MRK_MACOS_MACHINE" == arm64 && "$(/usr/bin/uname -m)" == arm64 ]] || exit 1
            case "$MRK_MACOS_RUNNER:$MRK_MACOS_HOSTED_JOB" in
              macos-26:github-hosted-macos26-arm64) expected_host_major=26 ;;
              xcode-27:github-hosted-xcode27-arm64)
                # Separate source-only matrix selection; never a tool or
                # ordinary image fallback, and never a Git nomination.
                [[ "$MRK_MACOS_NATIVE_SCOPE" == git-native && "$MRK_MACOS_PACKAGE_ROLE" == installed-shell-observation && "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ]] || exit 1
                expected_host_major=27
                ;;
              *) exit 1 ;;
            esac
            expected_supplier_receipt=e6b23316078020c513ab1b05b3b55e4f87b8d15908a8dee022ad5ee03b8f763e
            expected_supplier_tar=ead75b364118139561a34da6aa48e3c54791e152154ab32c46196b0223962359
            expected_supplier_source=c6551aa07d0673436aa9587b3a039889d22449c3
            expected_supplier_run=40473858216
            expected_supplier_attempt=1
            expected_supplier_artifact=12719943283
            ;;
          x86_64-apple-darwin)
            [[ "$MRK_MACOS_RUNNER" == macos-26-intel && "$RUNNER_ARCH" == X64 && "$MRK_MACOS_MACHINE" == x86_64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-x86_64 && "$(/usr/bin/uname -m)" == x86_64 ]] || exit 1
            expected_host_major=26
            expected_supplier_receipt=afba303207b19692b73fb1288b56afcd73378fc29b0b0ede4ff10eb2e0f949b8
            expected_supplier_tar=ff976626b48e95abc414d46ff91f1ebb183416356bb4706b8e673b7c9018ca9c
            expected_supplier_source=a2f7a10b4c86305f5ee65c6779ceaf6b128cd8fa
            expected_supplier_run=38343340695
            expected_supplier_attempt=1
            expected_supplier_artifact=11787588635
            ;;
          *) exit 1 ;;
        esac
        [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed || "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview || "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update || "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ) ]] || exit 1
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update ]]; then
          [[ "$MRK_MACOS_SAME_PACKAGE_SCOPE" == disabled && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
        fi
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature ]]; then
          [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
        fi
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle ]]; then
          [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
          case "$MRK_MACOS_REMOVAL_CASE" in ordinary|abrupt) ;; *) exit 1 ;; esac
        else
          [[ "$MRK_MACOS_REMOVAL_CASE" == disabled ]] || exit 1
        fi
        case "$MRK_MACOS_SAVED_FILE_UI_SCOPE" in
          ordinary-seven) ;;
          saved-version-recovery|workflow-refusal|release-evidence|remaining-three) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
          *) exit 1 ;;
        esac
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
        [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]] || exit 1
        # Fresh supplier pins never replace the separate current-core source binding.
        [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == 10d3f2cf13155335444c8376a346d89581c03a43f0ae642e67401e379745dca2 ]] || exit 1
        [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
        [[ "$MRK_MACOS_RUNTIME_SUPPLIER" == fresh-public-source ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" == "$expected_supplier_receipt" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" == "$expected_supplier_tar" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" == "$expected_supplier_source" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" == "$expected_supplier_run" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" == "$expected_supplier_attempt" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" == "$expected_supplier_artifact" ]] || exit 1
        [[ "$MRK_BUNDLED_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_PROTOCOL_SHA256" == 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5 ]] || exit 1
        [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == d4a639b396eaa60385b223a154710e99a2862e67 ]] || exit 1
        [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == d4a639b396eaa60385b223a154710e99a2862e67 ]] || exit 1
        [[ "$(/usr/bin/sw_vers -productVersion)" == "$expected_host_major".* ]] || exit 1
        [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]] || exit 1
    - name: "Select DATA stager Python, not the packaged interpreter"
      id: "python"
      uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
      with:
        python-version: "3.14.7"
    - name: "Select the fixed configured signed runtime before any payload download"
      shell: "bash"
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail
        umask 077
        [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$MRK_PYTHON" == /* && -x "$MRK_PYTHON" ]] || exit 1
        selection=$(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C TZ=UTC \
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py runtime-signing-selection --target "$MRK_MACOS_TARGET")
        [[ ${#selection} -le 4096 ]] || exit 1
        "$MRK_PYTHON" -I -S -B - "$selection" <<'PY_SIGNING_SELECTION'
        import json, os, re, stat, sys
        value = json.loads(sys.argv[1])
        fields = {
            "runtimeManifestSha256": "MRK_BUNDLED_RUNTIME_MANIFEST_SHA256",
            "signedPythonSha256": "MRK_MACOS_SIGNED_PYTHON_SHA256",
            "signingReceiptSha256": "MRK_MACOS_SIGNING_RECEIPT_SHA256",
            "signingSourceCommit": "MRK_MACOS_SIGNING_SOURCE_COMMIT",
            "signingRunId": "MRK_MACOS_SIGNING_RUN_ID",
            "signingRunAttempt": "MRK_MACOS_SIGNING_RUN_ATTEMPT",
            "signingArtifactId": "MRK_MACOS_SIGNING_ARTIFACT_ID",
            "producerProfileSha256": "MRK_MACOS_SIGNING_PRODUCER_PROFILE_SHA256",
            "serviceProfileSha256": "MRK_MACOS_SIGNING_SERVICE_PROFILE_SHA256",
            "nominationSha256": "MRK_MACOS_SIGNING_BINDING_SHA256",
        }
        fixed = {"schemaVersion", "kind", "target", "state", "sourceInputsSha256", "nativeAuthority"}
        if (type(value) is not dict or set(value) != set(fields) | fixed
                or type(value["schemaVersion"]) is not int or value["schemaVersion"] != 1
                or value["kind"] != "configured-signed-runtime-selection-data"
                or value["state"] != "configured" or value["target"] != os.environ["MRK_MACOS_TARGET"]
                or value["nativeAuthority"] is not False
                or value["sourceInputsSha256"] != os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"]):
            raise ValueError("fixed configured runtime selection required")
        for key in fields:
            item = value[key]
            if key in ("signingRunId", "signingRunAttempt", "signingArtifactId"):
                valid = type(item) is str and re.fullmatch(r"[1-9][0-9]{0,15}", item) and int(item) <= 9007199254740991
            else:
                width = 40 if key == "signingSourceCommit" else 64
                valid = type(item) is str and re.fullmatch(r"[0-9a-f]{" + str(width) + r"}", item) and item != "0" * width
            if not valid: raise ValueError("fixed public signing field refused")
        body = "".join(name + "=" + value[key] + "\n" for key, name in fields.items()).encode("ascii")
        if len(body) > 4096: raise ValueError("signing selection output bound")
        fd = os.open(os.environ["GITHUB_ENV"], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_CLOEXEC)
        try:
            info = os.fstat(fd)
            if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.getuid():
                raise ValueError("original workflow environment file refused")
            view = memoryview(body)
            while view:
                count = os.write(fd, view)
                if count <= 0: raise OSError("signing selection write refused")
                view = view[count:]
            os.fsync(fd)
        finally:
            os.close(fd)
        PY_SIGNING_SELECTION
        # Resolve the separate fixed Store SOURCE selection before any payload download.
        /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C TZ=UTC \
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py store-signing-selection --target "$MRK_MACOS_TARGET"
    - name: "Select fixed frontend compiler"
      uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38"
      with:
        node-version: "24.20.0"
        package-manager-cache: false
    - name: "Reserve fresh work and record exact source and actual tool bindings"
      id: "work"
      shell: "bash"
      env:
        MRK_PART_WORK_ROOT: "${{ inputs.work-root }}"
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail
        umask 077
        [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
        [[ ! -e desktop/node_modules && ! -L desktop/node_modules && ! -e desktop/dist && ! -L desktop/dist ]] || exit 1
        root="$MRK_PART_WORK_ROOT"
        [[ "$root" =~ ^/Users/runner/work/_temp/mrk-macos-installed\.[A-Za-z0-9]{8}$ && ! -e "$root" && ! -L "$root" ]] || exit 1
        /bin/mkdir -m 700 "$root"
        printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
        printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$root" >> "$GITHUB_ENV"
        "$MRK_PYTHON" -I -S -B - "$root/source-admission.json" <<'PY'
        import json, os, subprocess, sys
        build_target = os.environ["MRK_MACOS_TARGET"]
        supplier_routes = {
            "aarch64-apple-darwin": (".github/workflows/desktop-macos-cpython-source-build.yml", "refs/heads/verify/desktop-macos-cpython-source-build"),
            "x86_64-apple-darwin": (".github/workflows/desktop-macos-cpython-source-build-intel.yml", "refs/heads/verify/desktop-macos-cpython-source-build-intel"),
        }
        if build_target not in supplier_routes: raise ValueError("source-binding-target")
        tools = {}
        for name, command in (
            ("cltSdkPath", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-path"]),
            ("cltSdkVersion", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-version"]),
            ("cltSdkBuild", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-build-version"]),
            ("cltCompiler", ["/usr/bin/xcrun", "--sdk", "macosx", "clang", "--version"]),
            ("node", ["node", "--version"]),
            ("python", [sys.executable, "-I", "-S", "-B", "--version"]),
        ):
            result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True, timeout=15)
            if not result.stdout or len(result.stdout) > 4096: raise ValueError("tool version output refused")
            tools[name] = {"command": command, "output": result.stdout.decode("utf-8", "strict").strip()}
        work_info = os.stat(os.path.dirname(sys.argv[1]), follow_symlinks=False)
        source_tree = subprocess.run(["git", "-c", "core.fsmonitor=false", "rev-parse", "HEAD^{tree}"], check=True, stdout=subprocess.PIPE, timeout=15).stdout.decode().strip()
        value = {"schemaVersion": 1, "source": os.environ["GITHUB_SHA"], "workflowSource": os.environ["GITHUB_WORKFLOW_SHA"],
                 "tree": source_tree, "workDirectory": [work_info.st_dev, work_info.st_ino, work_info.st_uid],
                 "packageRole": os.environ["MRK_MACOS_PACKAGE_ROLE"], "target": build_target,
                 "frontendAbsentAtAdmission": True,
                 "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                 "runtimeManifestSha256": os.environ["MRK_BUNDLED_RUNTIME_MANIFEST_SHA256"],
                 "runtimeSourceInputsSha256": os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"],
                 "protocolSha256": os.environ["MRK_BUNDLED_PROTOCOL_SHA256"],
                 "githubPreflightToolingSha": os.environ["MRK_GITHUB_PREFLIGHT_TOOLING_SHA"],
                 "githubReleaseToolingSha": os.environ["MRK_GITHUB_RELEASE_TOOLING_SHA"],
                 "signedPythonDerivation": {
                     "nominationSha256": os.environ["MRK_MACOS_SIGNING_BINDING_SHA256"],
                     "signingSourceCommit": os.environ["MRK_MACOS_SIGNING_SOURCE_COMMIT"],
                     "runId": os.environ["MRK_MACOS_SIGNING_RUN_ID"],
                     "runAttempt": os.environ["MRK_MACOS_SIGNING_RUN_ATTEMPT"],
                     "artifactId": os.environ["MRK_MACOS_SIGNING_ARTIFACT_ID"],
                     "signedPythonSha256": os.environ["MRK_MACOS_SIGNED_PYTHON_SHA256"],
                     "signingReceiptSha256": os.environ["MRK_MACOS_SIGNING_RECEIPT_SHA256"],
                     "producerProfileSha256": os.environ["MRK_MACOS_SIGNING_PRODUCER_PROFILE_SHA256"],
                     "serviceProfileSha256": os.environ["MRK_MACOS_SIGNING_SERVICE_PROFILE_SHA256"],
                 },
                 "freshPythonSupplier": {
                     "origin": os.environ["MRK_MACOS_RUNTIME_SUPPLIER"],
                     "repository": "Apdelrahman1911/mobile-release-kit",
                     "workflow": supplier_routes[build_target][0],
                     "ref": supplier_routes[build_target][1],
                     "source": os.environ["MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT"],
                     "runId": os.environ["MRK_MACOS_PYTHON_SUPPLIER_RUN_ID"],
                     "runAttempt": os.environ["MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT"],
                     "artifactId": os.environ["MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID"],
                     "receiptSha256": os.environ["MRK_MACOS_PYTHON_SUPPLIER_SHA256"],
                     "tarSha256": os.environ["MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256"],
                 },
                 "scope": "engineering-acl-probe-five-regressions-fixed-fixture-package-install-only", "fixedFixtureCases": 8,
                 "aclPrimitiveCases": 6,
                 "selectedRegressionGroups": [2, 1, 2], "developerDir": os.environ["DEVELOPER_DIR"], "tools": tools,
                 "actualAquaSaveGate": "pending"}
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-app-signature":
            value.update(scope="whole-app-signature-only", fixedFixtureCases=0, aclPrimitiveCases=0,
                selectedRegressionGroups=[], instrumented=False, applicationLaunched=False,
                fullUIQualified=False, distributionQualified=False, actualAquaSaveGate="not-selected")
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-candidate":
            value.update(scope="current-macos-candidate", fixedFixtureCases=0, aclPrimitiveCases=0,
                selectedRegressionGroups=[], instrumented=False, applicationLaunched=False,
                fullUIQualified=False, distributionQualified=False, actualAquaSaveGate="not-selected")
        if os.environ["MRK_MACOS_NATIVE_SCOPE"] in ("project-identity-native", "tool-setup", "git-native"):
            # Preparation only: actual launch/Apply/recovery is not yet observed.
            value.update(instrumented=True, applicationLaunched=False)
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-installed":
            # Source-admission facts for the ordinary, separately built app;
            # never a completed launch, UI, distribution or consumer verdict.
            value.update(instrumented=False, applicationLaunched=False,
                         fullUIQualified=False, distributionQualified=False)
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-positive-update":
            value.update(scope="positive-macos-update-distribution", fixedFixtureCases=0, aclPrimitiveCases=0,
                selectedRegressionGroups=[], instrumented=False, applicationLaunched=False,
                fullUIQualified=False, distributionQualified=False, actualAquaSaveGate="not-selected")
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-preview":
            value.update({"scope": "normal-macos-early-preview", "fixedFixtureCases": 8, "aclPrimitiveCases": 0,
                          "selectedRegressionGroups": [], "instrumented": False, "applicationLaunched": False,
                          "fullUIQualified": False, "distributionQualified": False})
        if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-removal-lifecycle":
            case = os.environ["MRK_MACOS_REMOVAL_CASE"]
            if build_target not in supplier_routes or case not in ("ordinary", "abrupt"):
                raise ValueError("removal fixed source case")
            correlation = os.urandom(16).hex()
            if correlation == "0" * 32: raise ValueError("removal fresh correlation")
            value.update(scope="same-package-removal-lifecycle-preparation-only", removalCase=case,
                removalCorrelation=correlation, fixedFixtureCases=0, aclPrimitiveCases=0,
                selectedRegressionGroups=[], instrumented=case == "abrupt", applicationLaunched=False,
                fullUIQualified=False, removalQualified=False, powerLossQualified=False, distributionQualified=False)
            with open(os.environ["GITHUB_ENV"], "a", encoding="ascii") as environment:
                environment.write("MRK_MACOS_REMOVAL_CORRELATION=" + correlation + "\n")
        # The final source binding does not exist until the one actual Store
        # composition has supplied its immutable S/M. Never overwrite it.
        del value["runtimeManifestSha256"], value["runtimeSourceInputsSha256"]
        value["runtimeCompositionPending"] = True
        data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
        if len(data) > 65536: raise ValueError("source/tool binding size refused")
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
        try:
            while data:
                n = os.write(fd, data)
                if not n: raise RuntimeError("write refused")
                data = data[n:]
            os.fsync(fd)
        finally: os.close(fd)
        PY
    - name: "Bind the complete reviewed first-party checkout before compilation"
      id: "source"
      shell: "bash"
      run: |
        set -euo pipefail
        set -o noclobber
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || exit 1
        "$MRK_PYTHON" -I -S -B - "$MRK_MACOS_WORK/source-inventory.json" <<'PY_SOURCE'
        import hashlib, json, os, stat, subprocess, sys
        def git(*args):
            return subprocess.run(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null", *args], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15).stdout
        rows = git("ls-tree", "-r", "-z", "--full-tree", "HEAD").split(b"\0")
        if rows[-1] or len(rows) > 4096: raise ValueError("tracked inventory bound")
        files = []
        for row in rows[:-1]:
            header, raw_name = row.split(b"\t", 1)
            mode, kind, blob = header.split(b" ")
            name = raw_name.decode("utf-8", "strict")
            if kind != b"blob" or mode not in (b"100644", b"100755") or any(p in ("", ".", "..") for p in name.split("/")): raise ValueError("tracked inventory path/type")
            fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
            try:
                before = os.fstat(fd)
                if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 32 * 1024 * 1024: raise ValueError("tracked input refused")
                digest = hashlib.sha256()
                blob_digest = hashlib.sha1(b"blob " + str(before.st_size).encode() + b"\0")
                size = 0
                while block := os.read(fd, 65536):
                    size += len(block)
                    if size > before.st_size: raise ValueError("tracked input grew")
                    digest.update(block)
                    blob_digest.update(block)
                after = os.fstat(fd)
                sig = lambda s: (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                if size != before.st_size or sig(before) != sig(after) or sig(after) != sig(os.stat(name, follow_symlinks=False)): raise ValueError("tracked input changed")
            finally:
                os.close(fd)
            if blob_digest.hexdigest() != blob.decode() or bool(before.st_mode & 0o111) != (mode == b"100755"): raise ValueError("tracked blob or executable mode mismatch")
            files.append({"path": name, "gitMode": mode.decode(), "blob": blob.decode(), "size": size, "sha256": digest.hexdigest()})
        value = {"source": os.environ["GITHUB_SHA"], "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
        data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
        if len(data) > 2 * 1024 * 1024: raise ValueError("source inventory output bound")
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
        with os.fdopen(fd, "wb") as stream:
            stream.write(data)
            stream.flush()
            os.fsync(stream.fileno())
        PY_SOURCE
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature ]]; then
          inventory_sha=$(/usr/bin/shasum -a 256 "$MRK_MACOS_WORK/source-inventory.json")
          inventory_sha=${inventory_sha%% *}
          [[ "$inventory_sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf 'app-signature-source-inventory-sha256=%s\n' "$inventory_sha" >> "$GITHUB_OUTPUT"
        fi
