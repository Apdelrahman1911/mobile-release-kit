name: "Build the fixed one-shot root Installer and scripts-only package"
description: "Shared original recipe; job retains its original result and timeout"
runs:
  using: "composite"
  steps:
    - name: "Build the fixed one-shot root Installer and scripts-only package"
      id: "recipe"
      shell: "bash"
      run: |
        set +x
        set +a
        export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
        set -euo pipefail
        set -o noclobber
        installer="$CARGO_TARGET_DIR/$MRK_MACOS_TARGET/release/mrk-macos-install"
        MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
        MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_android_helper_package.py sign-root-installer --target "$MRK_MACOS_TARGET"
        /usr/bin/codesign --verify --strict "$installer"
        "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py scripts --store-runtime --target "$MRK_MACOS_TARGET" \
          --input "$MRK_MACOS_WORK/input" --installer "$installer" \
          --expected-inventory "$MRK_MACOS_INSTALL_INVENTORY_SHA256" --expected-source "$MRK_EXPECTED_SHA" \
          --output "$MRK_MACOS_WORK/scripts" > "$MRK_MACOS_WORK/scripts-result.json"
        [[ ! -e "$MRK_MACOS_WORK/MobileReleaseKit-original.pkg" && ! -L "$MRK_MACOS_WORK/MobileReleaseKit-original.pkg" ]] || exit 1
        /usr/bin/pkgbuild --nopayload --scripts "$MRK_MACOS_WORK/scripts" \
          --identifier dev.mobile-release-kit.desktop.installed --version "$MRK_MACOS_SOURCE_PACKAGE_VERSION" \
          --install-location / --ownership recommended "$MRK_MACOS_WORK/MobileReleaseKit-original.pkg"
        "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py prepare-package --store-runtime --target "$MRK_MACOS_TARGET" \
          --scripts "$MRK_MACOS_WORK/scripts" --package "$MRK_MACOS_WORK/MobileReleaseKit-original.pkg" \
          --output "$MRK_MACOS_WORK/package-parts" > "$MRK_MACOS_WORK/package-prepare.json"
        # Native tools only write fresh outputs as this nonroot account.
        # Preparation is not final0:0 acceptance; preserve the original pkg.
        # BSD tar pads stdout even when compressed; use the fresh private file.
        [[ ! -e "$MRK_MACOS_WORK/package-parts/Scripts" && ! -L "$MRK_MACOS_WORK/package-parts/Scripts" ]] || exit 1
        set +e
        (
          cd "$MRK_MACOS_WORK/scripts" || exit
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
            /usr/bin/tar -c -z -f "$MRK_MACOS_WORK/package-parts/Scripts" --format=odc --uid=0 --gid=0 \
            --no-acls --no-xattrs --no-fflags --no-mac-metadata .
        )
        tar_status=$?
        set -e
        printf '%s\n' "$tar_status" > "$MRK_MACOS_WORK/package-tar.status"
        [[ $tar_status == 0 ]] || exit "$tar_status"
        # xar is not a streaming/O_EXCL tool: reserve its private output parent.
        case "${MRK_MACOS_PACKAGE_ROLE-}" in
          ordinary-image) package_output="$MRK_MACOS_WORK/package-component" ;;
          installed-shell-observation) package_output="$MRK_MACOS_WORK/package-unsigned" ;;
          *) exit 1 ;;
        esac
        /bin/mkdir -m 700 "$package_output"
        [[ ! -e "$package_output/MobileReleaseKit.pkg" && ! -L "$package_output/MobileReleaseKit.pkg" ]] || exit 1
        set +e
        (
          cd "$MRK_MACOS_WORK/package-parts" || exit
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
            /usr/bin/xar -c -f "$package_output/MobileReleaseKit.pkg" \
            --compression=none PackageInfo Scripts
        )
        xar_status=$?
        set -e
        printf '%s\n' "$xar_status" > "$MRK_MACOS_WORK/package-xar.status"
        [[ $xar_status == 0 ]] || exit "$xar_status"
        # Neither output is final P. The same next owner productbuilds only the
        # ordinary component; the observer keeps its completed flat package.
        unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
