name: "Check the corrected macOS minimum and actual native host before signing"
description: "Shared original recipe; job retains its original result and timeout"
runs:
  using: "composite"
  steps:
    - name: "Check the corrected macOS minimum and actual native host before signing"
      id: "recipe"
      shell: "bash"
      run: |
        set -euo pipefail
        [[ "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$(/usr/bin/id -u)" != 0 ]] || exit 1
        # Same pinned compiler/cache/target directory; no GUI or credential call.
        # The real host check establishes this runner only, not unobserved macOS 27.
        PATH="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin:/usr/bin:/bin:/usr/sbin:/sbin" RUSTC="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/rustc" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup "/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/cargo" test --manifest-path desktop/src-tauri/Cargo.toml \
          --locked --release --jobs 1 --target "$MRK_MACOS_TARGET" \
          --package mrk-macos-installed-native --lib -- --exact --test-threads=1 --color=never --format=pretty \
          tests::compiled_machine_and_translation_data_refuse_foreign_or_unknown_hosts \
          tests::actual_native_platform_observation_accepts_host | /usr/bin/tee "$MRK_MACOS_WORK/native-platform-tests.log"
        /usr/bin/grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$MRK_MACOS_WORK/native-platform-tests.log"
