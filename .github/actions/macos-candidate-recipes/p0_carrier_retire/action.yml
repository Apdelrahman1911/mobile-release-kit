name: "Retire only the known uploaded carrier export copy without touching image originals"
description: "Shared original recipe; job retains its original result and timeout"
runs:
  using: "composite"
  steps:
    - name: "Retire only the known uploaded carrier export copy without touching image originals"
      id: "recipe"
      shell: "bash"
      run: |
        set +x
        set +a
        set -euo pipefail
        umask 077
        [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_SHA" == "$MRK_EXPECTED_SHA" ]] || exit 1
        [[ "$MRK_MACOS_WORK" =~ ^/Users/runner/work/_temp/mrk-macos-installed\.[A-Za-z0-9]{8}$ ]] || exit 1
        /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC \
          "MRK_MACOS_WORK=$MRK_MACOS_WORK" "GITHUB_SHA=$GITHUB_SHA" "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
          "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "MRK_MACOS_TARGET=$MRK_MACOS_TARGET" \
          "MRK_MACOS_IOS_UI_SCOPE=$MRK_MACOS_IOS_UI_SCOPE" \
          "$MRK_PYTHON" -I -S -B - <<'PY_P0_CARRIER_RETIRE'
        import hashlib, json, os, stat, sys
        
        
        def carrier_need(value):
            if not value:
                raise RuntimeError("owned-carrier-export-retirement-refused")
        
        
        def carrier_identity(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                    info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
        
        
        def carrier_parent_identity(info):
            # Own child retirement legitimately changes parent size/nlink/times.
            return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid)
        
        
        def carrier_pending_projection(value, source, run_id, attempt, target):
            # The existing public projector already joins the private originals.
            # This readback cannot create a pending result or infer native success.
            fixed = {"schemaVersion": 1, "kind": "mrk-public-verification-evidence-v1",
                     "profile": "installed", "source": source, "workflowSource": source,
                     "runId": run_id, "runAttempt": attempt, "target": target,
                     "expectedRemovalCase": "disabled", "diagnosticOnly": True, "productReady": False}
            carrier_need(type(value) is dict and all(type(value.get(key)) is type(item) and value[key] == item
                                                    for key, item in fixed.items()))
            statuses = value.get("statuses")
            carrier_need(type(statuses) is dict)
            for name in ("normal-ui/ios-pending-recovery-test.status", "normal-ui/ios-pending-recovery-summary.status"):
                row = statuses.get(name)
                carrier_need(type(row) is dict and row.get("receiptState") == "observed"
                             and type(row.get("returncode")) is int and row["returncode"] == 0)
            positive = value.get("positiveUiObservations")
            carrier_need(type(positive) is dict)
            observed = positive.get("iosPendingRecovery")
            carrier_need(type(observed) is dict and observed.get("receiptState") == "observed"
                         and observed.get("binding") == "same-work-root-parent-context-only"
                         and observed.get("nativeSuccessInferred") is False
                         and all(observed.get(key) is True for key in
                             ("sourceAndTargetMatched", "runContextMatched", "callerStatusesMatched", "recordedRunnerOriginalsClosed")))
            counts = {"totalTestCount": 1, "passedTests": 1, "failedTests": 0, "skippedTests": 0, "expectedFailures": 0}
            carrier_need(type(observed.get("testCounts")) is dict and set(observed["testCounts"]) == set(counts)
                         and all(type(observed["testCounts"][key]) is int and observed["testCounts"][key] == item
                                 for key, item in counts.items()))
            observation = observed.get("observation")
            carrier_need(type(observation) is dict and all(type(observation.get(key)) is type(item) and observation[key] == item
                for key, item in {"sourceCommit": source, "runId": run_id, "runAttempt": attempt, "target": target,
                                  "ordinaryQuit": True}.items()))
            for name, account_status in (("inspect", "pending"), ("recover", "recovered")):
                row = observation.get(name)
                carrier_need(type(row) is dict and all(row.get(key) == item for key, item in
                    {"phase": "terminal", "outcome": "complete", "reason": "none", "accountStatus": account_status}.items()))
            account = observed.get("account")
            carrier_need(type(account) is dict and all(account.get(key) is True for key in
                ("exactPendingSessionRecovered", "originalOwnedNativeAndControlsRemoved", "persistentOriginalLeaseRetained",
                 "baselineIdentitiesMatched", "baselinePreferencesMatched", "projectMarkerUnchanged")))
            for name in ("producer", "nativeReadback"):
                row = account.get(name)
                carrier_need(type(row) is dict and all(row.get(key) is True for key in
                    ("commandFinalities", "leaseClosed", "sessionClosed", "handlersRestored", "fixtureDescriptorsClosed", "originalDeadlineMet")))
            return True
        
        
        def retire_carrier(work, source, run_id, attempt, target, ios_scope="ios-unsigned-archive"):
            # One known export only. No scan, recursive delete, image-original rewrite,
            # process stop, signing input or protected installation is permitted here.
            carrier_need(os.getuid() != 0 and os.getuid() == os.geteuid()
                         and type(work) is str and os.path.isabs(work)
                         and target in ("aarch64-apple-darwin", "x86_64-apple-darwin")
                         and ios_scope in ("disabled", "ios-unsigned-archive", "ios-pending-recovery"))
            flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
            parent = output = None
            opened = []
            try:
                parent = os.open(work, flags | os.O_DIRECTORY)
                pinfo = os.fstat(parent)
                carrier_need(stat.S_ISDIR(pinfo.st_mode) and stat.S_IMODE(pinfo.st_mode) == 0o700
                             and (pinfo.st_uid, pinfo.st_gid) == (os.getuid(), os.getgid())
                             and carrier_identity(os.stat(work, follow_symlinks=False)) == carrier_identity(pinfo))
                output = os.open("p0-carrier-input", flags | os.O_DIRECTORY, dir_fd=parent)
                oinfo = os.fstat(output)
                carrier_need(stat.S_ISDIR(oinfo.st_mode) and stat.S_IMODE(oinfo.st_mode) == 0o555
                             and oinfo.st_nlink == 2 and (oinfo.st_uid, oinfo.st_gid) == (pinfo.st_uid, pinfo.st_gid)
                             and carrier_identity(os.stat("p0-carrier-input", dir_fd=parent, follow_symlinks=False)) == carrier_identity(oinfo))
                limits = {"MobileReleaseKit.dmg": 512 * 1024 * 1024, "PREVIEW.json": 16384}
                carrier_need(set(os.listdir(output)) == set(limits))
                observations = {}
                for name, limit in sorted(limits.items()):
                    fd = os.open(name, flags, dir_fd=output)
                    opened.append(fd)
                    info = os.fstat(fd)
                    carrier_need(stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o444
                                 and info.st_nlink == 1 and (info.st_uid, info.st_gid) == (pinfo.st_uid, pinfo.st_gid)
                                 and 0 < info.st_size <= limit
                                 and carrier_identity(os.stat(name, dir_fd=output, follow_symlinks=False)) == carrier_identity(info))
                    count, digest, small = 0, hashlib.sha256(), bytearray()
                    while True:
                        piece = os.read(fd, min(1024 * 1024, limit + 1 - count))
                        if not piece:
                            break
                        count += len(piece)
                        carrier_need(count <= limit)
                        digest.update(piece)
                        if name == "PREVIEW.json":
                            small.extend(piece)
                    carrier_need(count == info.st_size and carrier_identity(os.fstat(fd)) == carrier_identity(info)
                                 and carrier_identity(os.stat(name, dir_fd=output, follow_symlinks=False)) == carrier_identity(info))
                    observations[name] = (fd, info, count, digest.hexdigest(), bytes(small))
                carrier_need(sum(row[2] for row in observations.values()) <= 512 * 1024 * 1024)
                def pairs(rows):
                    value = {}
                    for key, item in rows:
                        carrier_need(key not in value)
                        value[key] = item
                    return value
                def constant(_):
                    carrier_need(False)
                summary = json.loads(observations["PREVIEW.json"][4], object_pairs_hook=pairs, parse_constant=constant)
                platform = "macOS26-arm64" if target == "aarch64-apple-darwin" else "macOS26-x86_64"
                carrier_need(type(summary) is dict and type(summary.get("schemaVersion")) is int and summary["schemaVersion"] == 2
                             and summary.get("scope") == "normal-macos-early-preview"
                             and summary.get("workflow") == ".github/workflows/desktop-macos-installed.yml"
                             and summary.get("sourceCommit") == source and summary.get("runId") == run_id
                             and summary.get("runAttempt") == attempt and summary.get("platform") == platform
                             and summary.get("packageRole") == "ordinary-image" and summary.get("instrumented") is False
                             and summary.get("fullUIQualified") is False and summary.get("distributionQualified") is False
                             and summary.get("productReady") is False and type(summary.get("distributionBytes")) is int
                             and summary["distributionBytes"] == observations["MobileReleaseKit.dmg"][2]
                             and summary.get("distributionSha256") == observations["MobileReleaseKit.dmg"][3])
                pending = None
                if ios_scope == "ios-pending-recovery":
                    pending_fd = os.open("public-verification-evidence.json", flags, dir_fd=parent)
                    opened.append(pending_fd)
                    pending_info = os.fstat(pending_fd)
                    carrier_need(stat.S_ISREG(pending_info.st_mode) and stat.S_IMODE(pending_info.st_mode) == 0o600
                                 and pending_info.st_nlink == 1 and (pending_info.st_uid, pending_info.st_gid) == (pinfo.st_uid, pinfo.st_gid)
                                 and 0 < pending_info.st_size <= 128 * 1024
                                 and carrier_identity(os.stat("public-verification-evidence.json", dir_fd=parent, follow_symlinks=False)) == carrier_identity(pending_info))
                    pending_body = bytearray()
                    while True:
                        piece = os.read(pending_fd, min(65536, 128 * 1024 + 1 - len(pending_body)))
                        if not piece: break
                        pending_body.extend(piece)
                        carrier_need(len(pending_body) <= 128 * 1024)
                    carrier_need(len(pending_body) == pending_info.st_size
                                 and carrier_identity(os.fstat(pending_fd)) == carrier_identity(pending_info)
                                 == carrier_identity(os.stat("public-verification-evidence.json", dir_fd=parent, follow_symlinks=False)))
                    carrier_pending_projection(json.loads(pending_body, object_pairs_hook=pairs, parse_constant=constant),
                                               source, run_id, attempt, target)
                    pending = (pending_fd, pending_info)
                carrier_need(carrier_parent_identity(os.fstat(parent)) == carrier_parent_identity(pinfo)
                             == carrier_parent_identity(os.stat(work, follow_symlinks=False))
                             and set(os.listdir(output)) == set(limits)
                             and carrier_identity(os.fstat(output)) == carrier_identity(oinfo)
                             and carrier_identity(os.stat("p0-carrier-input", dir_fd=parent, follow_symlinks=False)) == carrier_identity(oinfo))
                for name, (fd, info, _, _, _) in observations.items():
                    carrier_need(carrier_identity(os.fstat(fd)) == carrier_identity(info)
                                 and carrier_identity(os.stat(name, dir_fd=output, follow_symlinks=False)) == carrier_identity(info))
                # Only after the complete known roster/hash/POST is admitted may this
                # synchronous task-owned duplicate be removed. Partial failure is failure.
                if pending is not None:
                    pending_fd, pending_info = pending
                    carrier_need(carrier_identity(os.fstat(pending_fd)) == carrier_identity(pending_info)
                                 == carrier_identity(os.stat("public-verification-evidence.json", dir_fd=parent, follow_symlinks=False)))
                os.fchmod(output, 0o700)
                for name, (fd, info, _, _, _) in observations.items():
                    carrier_need(carrier_identity(os.fstat(fd)) == carrier_identity(info)
                                 and carrier_identity(os.stat(name, dir_fd=output, follow_symlinks=False)) == carrier_identity(info))
                    os.unlink(name, dir_fd=output)
                    carrier_need(os.fstat(fd).st_nlink == 0)
                carrier_need(os.listdir(output) == [])
                os.fsync(output)
                final = os.fstat(output)
                carrier_need((final.st_dev, final.st_ino, final.st_uid, final.st_gid)
                             == (oinfo.st_dev, oinfo.st_ino, oinfo.st_uid, oinfo.st_gid)
                             and carrier_identity(os.stat("p0-carrier-input", dir_fd=parent, follow_symlinks=False)) == carrier_identity(final))
                os.rmdir("p0-carrier-input", dir_fd=parent)
                os.fsync(parent)
                carrier_need(carrier_parent_identity(os.fstat(parent)) == carrier_parent_identity(pinfo)
                             == carrier_parent_identity(os.stat(work, follow_symlinks=False)))
            finally:
                # Never retry a close: an unknown consuming close fails this step.
                primary = sys.exc_info()[1]
                errors = []
                originals = ([parent] if parent is not None else []) + ([output] if output is not None else []) + opened
                for fd in reversed(originals):
                    try:
                        os.close(fd)
                    except OSError as exc:
                        errors.append(exc)
                if errors:
                    if primary is None:
                        raise errors[0]
                    primary.add_note("owned-carrier-export-close-errors:" + str(len(errors)))
        
        
        if __name__ == "__main__":
            retire_carrier(os.environ["MRK_MACOS_WORK"], os.environ["GITHUB_SHA"],
                           os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"], os.environ["MRK_MACOS_TARGET"],
                           os.environ["MRK_MACOS_IOS_UI_SCOPE"])
        PY_P0_CARRIER_RETIRE
