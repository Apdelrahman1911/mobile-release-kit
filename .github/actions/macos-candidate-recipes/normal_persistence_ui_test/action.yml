name: "Exercise synthetic encrypted credentials through the ordinary Mac UI"
description: "Shared original recipe; job retains its original result and timeout"
runs:
  using: "composite"
  steps:
    - name: "Exercise synthetic encrypted credentials through the ordinary Mac UI"
      id: "recipe"
      shell: "bash"
      run: |
        set -euo pipefail
        set -o noclobber
        umask 077
        # Finite per-file logical size only; not RAM, total disk, service limits or finality.
        set +e
        ulimit -f 1048576
        file_limit_status=$?
        set -e
        printf '%s\n' "$file_limit_status" > "$MRK_MACOS_WORK/normal-ui/persistence-test-file-limit.status" || exit $?
        [[ "$file_limit_status" == 0 ]] || exit "$file_limit_status"
        set +e
        "$MRK_PYTHON" -I -S -B - <<'PY_UI_FILE_BUDGET'
        import json, os, resource
        expected = 1024 * 1024 * 1024
        actual = resource.getrlimit(resource.RLIMIT_FSIZE)
        source = os.environ["GITHUB_SHA"]
        if source != os.environ["GITHUB_WORKFLOW_SHA"] or source != os.environ["MRK_EXPECTED_SHA"]:
            raise ValueError("ordinary XCTest file-budget source binding differs")
        admitted = actual == (expected, expected)
        value = {"schemaVersion": 1, "scope": "ordinary-xctest-shell-child-file-budget-only",
                 "sourceCommit": source, "workflowSourceCommit": os.environ["GITHUB_WORKFLOW_SHA"],
                 "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                 "phase": "persistence-test", "expectedBytes": expected, "softBytes": actual[0], "hardBytes": actual[1],
                 "admitted": admitted, "nativeSuccessInferred": False, "serviceLimitsObserved": False,
                 "productQualified": False}
        data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
        if len(data) > 4096: raise ValueError("ordinary XCTest file-budget fact bound")
        fd = os.open(os.path.join(os.environ["MRK_MACOS_WORK"], "normal-ui/persistence-test-file-budget.json"),
                     os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
        try:
            with os.fdopen(fd, "wb", closefd=False) as output:
                output.write(data); output.flush(); os.fsync(fd)
        finally: os.close(fd)
        if not admitted:
            raise ValueError("actual ordinary XCTest file allowance differs from the finite reviewed budget")
        PY_UI_FILE_BUDGET
        file_budget_status=$?
        set -e
        printf '%s\n' "$file_budget_status" > "$MRK_MACOS_WORK/normal-ui/persistence-test-file-budget.status" || exit $?
        [[ "$file_budget_status" == 0 ]] || exit "$file_budget_status"
        clean() {
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner \
            USER=runner LOGNAME=runner "TMPDIR=$MRK_MACOS_WORK/normal-ui/tmp/" \
            LANG=en_US.UTF-8 TZ=UTC LC_ALL=en_US.UTF-8 "DEVELOPER_DIR=$DEVELOPER_DIR" \
            "TEST_RUNNER_MRK_NORMAL_UI_HOSTED_JOB=$MRK_MACOS_HOSTED_JOB" \
            "TEST_RUNNER_MRK_NORMAL_UI_APPLICATION_SOURCE=$GITHUB_SHA" \
            "TEST_RUNNER_MRK_NORMAL_UI_HARNESS_SOURCE=$GITHUB_SHA" "$@"
        }
        # The default app-data absence is admitted by the original test BEFORE launch.
        # Real ordinary controls; no observer argument, Keychain repair or retry.
        set +e
        clean "$MRK_PYTHON" -I -S -B desktop/tools/macos_normal_ui_runner.py --target "$MRK_MACOS_TARGET" test-without-building \
          -project desktop/native/macos-normal-ui/MRKNormalAppUI.xcodeproj -scheme MRKNormalAppUI \
          -configuration Debug -destination "platform=macOS,arch=$MRK_MACOS_MACHINE" -destination-timeout 15 \
          -derivedDataPath "$MRK_MACOS_WORK/normal-ui/DerivedData" \
          -resultBundlePath "$MRK_MACOS_WORK/normal-ui/persistence-test.xcresult" \
          -only-testing:MRKNormalAppUITests/NormalAppUITests/testSyntheticPersistentCredentials \
          -parallel-testing-enabled NO -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 300 \
          -disableAutomaticPackageResolution \
          > "$MRK_MACOS_WORK/normal-ui/persistence-test.log" 2>&1
        test_status=$?
        set -e
        printf '%s\n' "$test_status" > "$MRK_MACOS_WORK/normal-ui/persistence-test.status"
        # Never export the raw XCTest tail: it can contain secure-field keystrokes.
        # These finite stage/count facts are diagnostics, not test/finality receipts.
        "$MRK_PYTHON" -I -S -B - <<'PY_PERSISTENCE_DIAGNOSTICS'
        import json, os, re, stat
        from pathlib import Path
        root = Path(os.environ["MRK_MACOS_WORK"]) / "normal-ui"
        path = root / "persistence-test.log"
        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
        try:
            before = os.fstat(fd)
            if (not stat.S_ISREG(before.st_mode) or before.st_uid != os.getuid() or before.st_nlink != 1
                    or before.st_mode & 0o022 or not 0 <= before.st_size <= 16 * 1024 * 1024):
                raise ValueError("fixed UI diagnostic log shape refused")
            offset = max(0, before.st_size - 262144)
            os.lseek(fd, offset, os.SEEK_SET)
            with os.fdopen(fd, "rb", closefd=False) as stream: data = stream.read(262145)
            identity = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink,
                                  s.st_size, s.st_mtime_ns, s.st_ctime_ns)
            if (len(data) != before.st_size - offset or identity(before) != identity(os.fstat(fd))
                    or identity(before) != identity(os.stat(path, follow_symlinks=False))):
                raise ValueError("fixed UI diagnostic log changed")
        finally: os.close(fd)
        stages = {"persistence-" + name for name in ("admission", "launch", "project-and-initialize",
            "save-and-bind-p12", "save-and-bind-profile", "context-invalidation", "lock-reopen-rebind",
            "replacement-cancel", "replace-current-record", "delete-and-quit",
            "restart-launch", "restart-unlock", "restart-rebind-and-quit")}
        events = []
        for raw in data.splitlines():
            match = re.fullmatch(rb"MRK_NORMAL_PROJECT_STAGE=([a-z0-9-]+);result=(started|passed|failed)(;laterStages=not-run)?", raw.strip())
            if match and match[1].decode("ascii") in stages:
                events.append({"stage": match[1].decode("ascii"), "result": match[2].decode("ascii")})
            match = re.fullmatch(rb"MRK_NORMAL_PROJECT_QUERY=stage:([a-z0-9-]+);buttons:([0-9]{1,3});textFields:([0-9]{1,3});comboBoxes:([0-9]{1,3});sheets:([0-9]{1,2})", raw.strip())
            if match and match[1].decode("ascii") in stages:
                counts = list(map(int, match.groups()[1:]))
                if all(value <= 256 for value in counts[:3]) and counts[3] <= 16:
                    events.append({"stage": match[1].decode("ascii"), "roleCounts": counts})
            if len(events) > 64: raise ValueError("fixed UI diagnostic event bound")
        result = {"schemaVersion": 1, "scope": "normal-persistence-ui-diagnostics-only",
                  "boundedTailBytes": len(data), "originalLogBytes": before.st_size, "events": events,
                  "nativeSuccessInferred": False, "rawTextExported": False}
        fd = os.open(root / "persistence-diagnostics.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
        try:
            with os.fdopen(fd, "w", closefd=False) as output:
                json.dump(result, output, sort_keys=True); output.write("\n"); output.flush(); os.fsync(fd)
        finally: os.close(fd)
        PY_PERSISTENCE_DIAGNOSTICS
        [[ "$test_status" == 0 ]] || exit "$test_status"
