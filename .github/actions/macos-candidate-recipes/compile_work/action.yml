name: "Admit the exact nonroot ARM compile-only route and fresh work"
description: "Shared original recipe; job retains its original result and timeout"
outputs:
  root:
    description: "Original selected step output"
    value: "${{ steps.recipe.outputs.root }}"
runs:
  using: "composite"
  steps:
    - name: "Admit the exact nonroot ARM compile-only route and fresh work"
      id: "recipe"
      shell: "bash"
      run: |
        set -euo pipefail
        set +x
        set +a
        umask 077
        git config --local core.autocrlf false
        /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14 -I -S -B - <<'PY_SHIPPING_COMPILE_ADMIT'
        import hashlib, json, os, platform, re, stat, sys, tempfile, time, venv
        from pathlib import Path
        
        
        def need(value, reason):
            if not value: raise ValueError(reason)
        
        
        def compile_public_data(value, source, run_id, run_attempt):
            """Closed prior compile observations, never receipt-publication authority."""
            def check(ok):
                need(ok, 'compile-public-data')
        
            def digest(item):
                check(type(item) is str and re.fullmatch(r'[0-9a-f]{64}', item) is not None)
                return item
        
            def integer(item, low, high):
                check(type(item) is int and low <= item <= high)
                return item
        
            def nullable_bool(item):
                check(item is None or type(item) is bool)
                return item
        
            roles = ('node-version', 'npm-version', 'rustc-version', 'cargo-version',
                     'npm-ci', 'frontend-build', 'shipping-image-build')
            fact_names = ('originalPending', 'sourcePost', 'toolsPost', 'frontendGenerated',
                          'facadeArtifactVerified', 'inputOriginalsKnown', 'toolOriginalsClosed',
                          'generatedOutputsRetired', 'shippingGraphCompiled', 'installedQualified',
                          'runtimeQualified', 'launched', 'signed', 'pythonControllerPrepared',
                          'pythonControllerPost', 'pythonControllerRetired')
            conditions = ('controller-record', 'controller-base', 'controller-row', 'controller-roster',
                          'controller-file', 'controller-config', 'controller-runtime', 'controller-original-changed',
                          'controller-total', 'controller-directory', 'controller-short-read', 'controller-deadline',
                          'controller-unexpected-process', 'controller-work-root', 'controller-template',
                          'controller-publication', 'controller-source-copy', 'controller-operation',
                          'cargo-output-bound', 'cargo-line-bound', 'cargo-document', 'cargo-finished',
                          'cargo-facade-count', 'cargo-target-shape', 'cargo-real-facade', 'cargo-app-count',
                          'cargo-shipping-feature', 'compile-artifact-file', 'compile-artifact-short', 'compile-artifact-post')
            owner_reasons = ('incomplete-output', 'output-bound', 'protocol-or-ownership',
                             'command-failed-or-incomplete', 'cleanup-unconfirmed', 'exec-rejected',
                             'stopped-before-exec', 'parent-ended', 'observer-ended', 'fence-collision', 'unknown')
            check(type(value) is dict and type(source) is str and re.fullmatch(r'[0-9a-f]{40}', source)
                  and source != '0' * 40 and all(type(item) is str and re.fullmatch(r'[1-9][0-9]{0,19}', item)
                                               for item in (run_id, run_attempt)))
            fixed = dict(schemaVersion=1, scope='fixed-arm-shipping-image-compile-only', source=source,
                         workflowSource=source, runId=run_id, runAttempt=run_attempt, target='aarch64-apple-darwin')
            check(type(value.get('schemaVersion')) is int and all(value.get(key) == item for key, item in fixed.items()))
            facts = {}
            for name in fact_names:
                check(name not in value or type(value[name]) is bool)
                facts[name] = value.get(name)
            check(type(facts['shippingGraphCompiled']) is bool
                  and all(facts[name] is False for name in ('installedQualified', 'runtimeQualified', 'launched', 'signed')))
            rows = value.get('commands')
            check(type(rows) is list and len(rows) <= len(roles))
            commands = []
            for index, row in enumerate(rows):
                check(type(row) is dict and row.get('role') == roles[index]
                      and type(row.get('returned')) is bool and type(row.get('capturesSettled')) is bool)
                out = integer(row.get('stdoutBytes'), 0, 4096 if index < 4 else 4 * 1024 * 1024)
                err = integer(row.get('stderrBytes'), 0, 4096 if index < 4 else 4 * 1024 * 1024)
                check(out + err <= (4096 if index < 4 else 4 * 1024 * 1024))
                commands.append(dict(role=roles[index], returned=row['returned'], capturesSettled=row['capturesSettled'],
                                     returncode=integer(row.get('returncode'), -(2**31), 2**31 - 1),
                                     stdoutBytes=out, stderrBytes=err,
                                     stdoutSha256=digest(row.get('stdoutSha256')), stderrSha256=digest(row.get('stderrSha256'))))
            inventory = None
            if 'sourceInventoryBytes' in value or 'sourceInventorySha256' in value:
                inventory = dict(bytes=integer(value.get('sourceInventoryBytes'), 1, 2 * 1024 * 1024),
                                 sha256=digest(value.get('sourceInventorySha256')))
            facade = None
            if 'facadeArtifact' in value:
                item = value['facadeArtifact']
                check(type(item) is dict)
                facade = dict(bytes=integer(item.get('bytes'), 1, 256 * 1024 * 1024), sha256=digest(item.get('sha256')))
            failure = None
            if value.get('failure') is not None:
                item = value['failure']
                check(type(item) is dict)
                stages = ('python-base', 'python-create', 'python-census', 'python-publication', 'admission',
                          'source-tool-post', 'generated-cleanup', 'tool-close', 'public-capture') + roles
                stage, condition = item.get('stage'), item.get('condition')
                check(type(stage) is str and (condition is None or type(condition) is str))
                failure = dict(stage=stage if stage in stages else 'other',
                               condition=condition if condition in conditions else None if condition is None else 'unclassified',
                               ownerDiagnostic=None)
                if 'ownerDiagnostic' in item:
                    observed = item['ownerDiagnostic']
                    check(type(observed) is dict and type(observed.get('available')) is bool)
                    typed = observed.get('typedFacts', [])
                    check(type(typed) is list and len(typed) <= 16
                          and (observed['available'] or not typed))
                    projected = []
                    for row in typed:
                        check(type(row) is dict and type(row.get('kind')) is str and row['kind'] in ('process-error', 'interrupted')
                              and type(row.get('reason')) is str and row['reason'] in owner_reasons)
                        mask = row.get('ownerFailureMask')
                        check(mask is None or type(mask) is int and 1 <= mask <= 63)
                        projected.append(dict(kind=row['kind'], reason=row['reason'], ownerFailureMask=mask,
                                              **{key: nullable_bool(row.get(key)) for key in ('dispatched', 'contained', 'cleanupComplete')}))
                    failure['ownerDiagnostic'] = dict(available=observed['available'], typedFacts=projected,
                                                      chainTruncated=nullable_bool(observed.get('chainTruncated')))
            if facts['shippingGraphCompiled']:
                check(len(commands) == len(roles) and all(row['returned'] and row['capturesSettled'] and row['returncode'] == 0 for row in commands)
                      and facts['originalPending'] is False and failure is None and inventory is not None and facade is not None
                      and all(facts[name] is True for name in ('sourcePost', 'toolsPost', 'frontendGenerated', 'facadeArtifactVerified',
                          'inputOriginalsKnown', 'toolOriginalsClosed', 'generatedOutputsRetired', 'pythonControllerPrepared',
                          'pythonControllerPost', 'pythonControllerRetired')))
            result = dict(kind='mrk-public-shipping-compile-evidence-v1', **fixed, facts=facts,
                          commands=commands, sourceInventory=inventory, facadeArtifact=facade, failure=failure)
            check(len((json.dumps(result, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n').encode('ascii')) <= 16384)
            return result
        
        
        prep_start = time.monotonic()
        prep_work_end, prep_hard_end = prep_start + 45, prep_start + 60
        
        
        def identity(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                    info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
        
        
        # Fixed, disposable hosted-controller preparation, not a packaged Python runtime.
        CONTROLLER_BASE = '/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14'
        CONTROLLER_DIRS = ('', 'bin', 'include', 'lib', 'lib/python3.14', 'lib/python3.14/site-packages')
        CONTROLLER_EXES = ('bin/python3.14', 'bin/python3', 'bin/python', 'bin/𝜋thon')
        CONTROLLER_SCRIPTS = ('bin/Activate.ps1', 'bin/activate', 'bin/activate.fish', 'bin/activate.csh')
        CONTROLLER_FILES = ('pyvenv.cfg',) + CONTROLLER_EXES + CONTROLLER_SCRIPTS
        CONTROLLER_REASONS = ('controller-record', 'controller-base', 'controller-row', 'controller-roster',
                              'controller-file', 'controller-config', 'controller-runtime', 'controller-original-changed',
                              'controller-total', 'controller-directory', 'controller-short-read', 'controller-deadline',
                              'controller-unexpected-process', 'controller-work-root', 'controller-template',
                              'controller-publication', 'controller-source-copy', 'controller-operation')
        
        
        def controller_config_data(work):
            root = str(work / 'python-controller')
            return ('home = ' + str(Path(CONTROLLER_BASE).parent) + '\n'
                    'include-system-site-packages = false\nversion = 3.14.7\n'
                    'executable = ' + CONTROLLER_BASE + '\n'
                    'command = ' + CONTROLLER_BASE + ' -m venv --copies --without-pip --without-scm-ignore-files ' + root + '\n').encode('utf-8')
        
        
        def controller_audit_data(event):
            return (event not in ('subprocess.Popen', 'os.system', 'os.fork', 'os.forkpty', 'os.posix_spawn', 'os.exec')
                    and not event.startswith('socket.'))
        
        
        def controller_record_data(value, work, work_identity):
            need(type(value) is dict and set(value) == {'schemaVersion', 'baseExecutable', 'baseIdentity', 'baseSha256',
                 'baseOriginalClosed', 'relativeExecutable', 'rows', 'totalBytes'}
                 and type(value['schemaVersion']) is int and value['schemaVersion'] == 1
                 and value['baseExecutable'] == CONTROLLER_BASE and value['relativeExecutable'] == 'bin/python3.14'
                 and value['baseOriginalClosed'] is True, 'controller-record')
            base = value['baseIdentity']
            need(type(base) is list and len(base) == 9 and all(type(item) is int and item >= 0 for item in base)
                 and base[1] > 0 and base[2] in (stat.S_IFREG | 0o755, stat.S_IFREG | 0o775)
                 and base[3:6] == [0, 80, 1] and 0 < base[6] <= 1024 * 1024
                 and type(value['baseSha256']) is str and re.fullmatch(r'[0-9a-f]{64}', value['baseSha256']), 'controller-base')
            rows = value['rows']
            roster = CONTROLLER_DIRS + CONTROLLER_FILES
            need(type(rows) is list and len(rows) == len(roster) == 15, 'controller-roster')
            seen, total = set(), 0
            config = controller_config_data(work)
            for index, (row, name) in enumerate(zip(rows, roster, strict=True)):
                need(type(row) is dict and set(row) == {'path', 'identity', 'sha256'} and row['path'] == name,
                     'controller-row')
                info = row['identity']
                need(type(info) is list and len(info) == 9 and all(type(item) is int and item >= 0 for item in info)
                     and info[0] == work_identity[0] and info[1] > 0 and info[3:5] == list(work_identity[3:5])
                     and tuple(info[:2]) not in seen, 'controller-row')
                seen.add(tuple(info[:2]))
                if index < len(CONTROLLER_DIRS):
                    need(info[2] == stat.S_IFDIR | 0o700 and info[5] > 0 and row['sha256'] is None, 'controller-directory')
                else:
                    executable = name in CONTROLLER_EXES
                    need(info[2] == stat.S_IFREG | (0o755 if executable else 0o600) and info[5] == 1
                         and 0 < info[6] <= (1024 * 1024 if executable else 4096 if name == 'pyvenv.cfg' else 65536)
                         and type(row['sha256']) is str and re.fullmatch(r'[0-9a-f]{64}', row['sha256']), 'controller-file')
                    if executable:
                        need(info[6] == base[6] and row['sha256'] == value['baseSha256'], 'controller-source-copy')
                    elif name == 'pyvenv.cfg':
                        need(info[6] == len(config) and row['sha256'] == hashlib.sha256(config).hexdigest(), 'controller-config')
                    total += info[6]
            need(type(value['totalBytes']) is int and value['totalBytes'] == total and total <= 8 * 1024 * 1024,
                 'controller-total')
            return value
        
        
        def controller_runtime_data(value, work):
            root = str(work / 'python-controller')
            expected = dict(executable=root + '/bin/python3.14', prefix=root, execPrefix=root,
                            basePrefix=str(Path(CONTROLLER_BASE).parent.parent),
                            baseExecPrefix=str(Path(CONTROLLER_BASE).parent.parent), version=[3, 14, 7],
                            isolated=True, noSite=True, dontWriteBytecode=True, filesystemEncoding='utf-8')
            need(type(value) is dict and value == expected and all(value[key] is True
                 for key in ('isolated', 'noSite', 'dontWriteBytecode'))
                 and all(type(item) is int for item in value['version']), 'controller-runtime')
            return True
        
        
        source = os.environ['GITHUB_SHA']
        checkout = Path('/Users/runner/work/mobile-release-kit/mobile-release-kit')
        ref = 'refs/heads/verify/desktop-macos-image-compile'
        need(sys.platform == 'darwin' and sys.maxsize == 2**63 - 1 and platform.machine() == 'arm64'
             and platform.mac_ver()[0].startswith('26.') and os.getuid() != 0
             and os.getuid() == os.geteuid() and os.getgid() == os.getegid(), 'shipping-compile-host')
        need(re.fullmatch(r'[0-9a-f]{40}', source) and source != '0' * 40, 'shipping-compile-source')
        expected = dict(GITHUB_ACTIONS='true', RUNNER_ENVIRONMENT='github-hosted', RUNNER_OS='macOS', RUNNER_ARCH='ARM64',
                        GITHUB_EVENT_NAME='push', GITHUB_REPOSITORY='Apdelrahman1911/mobile-release-kit', GITHUB_REF=ref,
                        GITHUB_WORKFLOW_REF='Apdelrahman1911/mobile-release-kit/.github/workflows/desktop-macos-installed.yml@' + ref,
                        GITHUB_WORKFLOW_SHA=source, GITHUB_WORKSPACE=str(checkout), RUNNER_TEMP='/Users/runner/work/_temp',
                        MRK_MACOS_TARGET='aarch64-apple-darwin', RUSTUP_TOOLCHAIN='1.98.1', HOME='/Users/runner',
                        DEVELOPER_DIR='/Library/Developer/CommandLineTools', MACOSX_DEPLOYMENT_TARGET='26.0')
        need(all(os.environ.get(name) == value for name, value in expected.items()), 'shipping-compile-route')
        need(all(re.fullmatch(r'[1-9][0-9]{0,19}', os.environ[name]) for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')), 'shipping-compile-run')
        need(Path(os.environ['DEVELOPER_DIR']).is_dir(), 'shipping-compile-clt')
        for name in ('node_modules', 'dist'):
            try: (checkout / 'desktop' / name).lstat()
            except FileNotFoundError: pass
            else: raise ValueError('shipping-compile-existing-frontend')
        os.umask(0o077)
        need(time.monotonic() < prep_work_end, 'controller-deadline')
        work = Path(tempfile.mkdtemp(prefix='mrk-macos-image-compile.', dir='/Users/runner/work/_temp'))
        info = work.lstat()
        need(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700 and info.st_uid == os.getuid(), 'shipping-compile-original-work')
        # The exact setup-Python framework is used only for this bounded bootstrap.
        # Strict compile tool admission below never accepts its vendor 0775 mode.
        base_fd = None
        originals_known = True
        first_failure = None
        stage = 'python-base'
        observed = {}
        controller = None
        controller_root = work / 'python-controller'
        flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
        
        
        def remember(error):
            global first_failure
            if first_failure is None:
                condition = error.args[0] if type(error) is ValueError and len(error.args) == 1 else None
                first_failure = dict(stage=stage, kind=type(error).__name__,
                                     condition=condition if condition in CONTROLLER_REASONS else 'controller-operation')
        
        
        def prep_cut(cleanup=False):
            need(time.monotonic() < (prep_hard_end if cleanup else prep_work_end), 'controller-deadline')
        
        
        def work_post():
            current = work.lstat()
            need(identity(current)[:5] == identity(info)[:5], 'controller-work-root')
        
        
        def consuming_close(fd):
            global originals_known
            try:
                os.close(fd)
            except BaseException as error:
                originals_known = False
                remember(error)
                raise
        
        
        def file_body(fd, path, limit):
            prep_cut(); work_post()
            before = os.fstat(fd)
            need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and 0 < before.st_size <= limit, 'controller-file')
            body = bytearray()
            while len(body) < before.st_size:
                prep_cut()
                block = os.pread(fd, min(65536, before.st_size - len(body)), len(body))
                need(bool(block), 'controller-short-read')
                body.extend(block)
            need(not os.pread(fd, 1, len(body)) and identity(before) == identity(os.fstat(fd)) == identity(path.lstat()),
                 'controller-original-changed')
            prep_cut()
            return bytes(body), before
        
        
        def fixed_names(fd, relative):
            expected = {Path(name).name for name in CONTROLLER_DIRS + CONTROLLER_FILES if name
                        and str(Path(name).parent) == (relative or '.')}
            found = set()
            observed['directorySlot'] = CONTROLLER_DIRS.index(relative)
            observed['entryCount'], observed['unexpectedEntry'] = 0, False
            with os.scandir(fd) as entries:
                for entry in entries:
                    prep_cut()
                    observed['entryCount'] += 1
                    observed['unexpectedEntry'] = entry.name not in expected
                    need(len(found) < len(expected) and entry.name in expected and entry.name not in found, 'controller-roster')
                    found.add(entry.name)
            need(found == expected, 'controller-roster')
        
        
        def census():
            rows = []
            for index, relative in enumerate(CONTROLLER_DIRS + CONTROLLER_FILES):
                prep_cut(); work_post()
                path = controller_root / relative
                fd = os.open(path, flags | (os.O_DIRECTORY if relative in CONTROLLER_DIRS else 0))
                try:
                    original = os.fstat(fd)
                    observed['slot'], observed['identity'] = index, identity(original)
                    if relative in CONTROLLER_DIRS:
                        need(original.st_mode == stat.S_IFDIR | 0o700 and original.st_uid == os.getuid()
                             and original.st_dev == info.st_dev, 'controller-directory')
                        fixed_names(fd, relative)
                        digest = None
                    else:
                        body, original = file_body(fd, path, 1024 * 1024 if relative in CONTROLLER_EXES else 4096 if relative == 'pyvenv.cfg' else 65536)
                        digest = hashlib.sha256(body).hexdigest()
                        if relative == 'pyvenv.cfg':
                            actual_lines, expected_lines = body.splitlines(), controller_config_data(work).splitlines()
                            observed['config'] = dict(bytes=len(body), sha256=digest, lineCount=len(actual_lines),
                                                     matchingFields=[index < len(actual_lines) and actual_lines[index] == line
                                                                     for index, line in enumerate(expected_lines)])
                            need(body == controller_config_data(work), 'controller-config')
                    need(identity(original) == identity(os.fstat(fd)) == identity(path.lstat()), 'controller-original-changed')
                    rows.append(dict(path=relative, identity=list(identity(original)), sha256=digest))
                except BaseException as error:
                    remember(error)
                    raise
                finally:
                    consuming_close(fd)
                prep_cut()
            return rows
        
        
        def publish_preparation(name, value, cleanup=False):
            prep_cut(cleanup); work_post()
            raw = (json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n').encode('ascii')
            need(len(raw) <= 16384, 'controller-publication')
            path = work / name
            fd = os.open(path, os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
            try:
                before = os.fstat(fd)
                need(before.st_mode == stat.S_IFREG | 0o600 and before.st_uid == os.getuid()
                     and before.st_nlink == 1 and before.st_size == 0, 'controller-publication')
                need(os.write(fd, raw) == len(raw), 'controller-publication')
                prep_cut(cleanup); os.fsync(fd)
                current = os.fstat(fd)
                need(identity(current)[:6] == identity(before)[:6] and current.st_size == len(raw)
                     and identity(current) == identity(path.lstat())
                     and os.pread(fd, len(raw) + 1, 0) == raw
                     and identity(current) == identity(os.fstat(fd)), 'controller-publication')
                prep_cut(cleanup)
            except BaseException as error:
                remember(error)
                raise
            finally:
                consuming_close(fd)
        
        
        # This output names only our already-created root; it is not a preparation permit.
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
            stream.write('root=' + str(work) + '\n')
        try:
            prep_cut()
            observed['bootstrap'] = dict(executable=sys.executable, baseExecutable=sys._base_executable,
                                         version=list(sys.version_info[:3]), filesystemEncoding=sys.getfilesystemencoding())
            need(sys.version_info[:3] == (3, 14, 7) and sys.getfilesystemencoding() == 'utf-8'
                 and sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode
                 and sys.executable == CONTROLLER_BASE and sys._base_executable == CONTROLLER_BASE
                 and Path(CONTROLLER_BASE).resolve(strict=True) == Path(CONTROLLER_BASE), 'controller-base')
            base_fd = os.open(CONTROLLER_BASE, flags)
            base_info = os.fstat(base_fd)
            observed['baseIdentity'] = identity(base_info)
            need(base_info.st_mode in (stat.S_IFREG | 0o755, stat.S_IFREG | 0o775)
                 and (base_info.st_uid, base_info.st_gid, base_info.st_nlink) == (0, 80, 1)
                 and 0 < base_info.st_size <= 1024 * 1024, 'controller-base')
            base_body, base_info = file_body(base_fd, Path(CONTROLLER_BASE), 1024 * 1024)
            base_sha = hashlib.sha256(base_body).hexdigest()
            stage = 'python-create'
            controller_root.mkdir(mode=0o700)  # Exclusive fresh directory, never clear/adopt/retry.
            created = controller_root.lstat()
            need(created.st_mode == stat.S_IFDIR | 0o700 and created.st_uid == os.getuid()
                 and created.st_dev == info.st_dev, 'controller-directory')
        
            def preparation_audit(event, _arguments):
                need(controller_audit_data(event), 'controller-unexpected-process')
        
            sys.addaudithook(preparation_audit)
            prep_cut()
            venv.EnvBuilder(system_site_packages=False, clear=False, symlinks=False, upgrade=False,
                            with_pip=False, upgrade_deps=False, scm_ignore_files=frozenset()).create(controller_root)
            prep_cut()
            need(identity(controller_root.lstat())[:5] == identity(created)[:5], 'controller-original-changed')
            # EnvBuilder copies template modes. Only these four new unused files are
            # initialized by held FD; no vendor/template source or shared tree changes.
            for relative in CONTROLLER_SCRIPTS:
                prep_cut(); work_post()
                path = controller_root / relative
                fd = os.open(path, flags)
                try:
                    before = os.fstat(fd)
                    need(stat.S_ISREG(before.st_mode) and not before.st_mode & 0o7000
                         and before.st_uid == os.getuid() and before.st_dev == info.st_dev
                         and before.st_nlink == 1 and 0 < before.st_size <= 65536
                         and identity(before) == identity(path.lstat()), 'controller-template')
                    os.fchmod(fd, 0o600)
                    after = os.fstat(fd)
                    need(after.st_mode == stat.S_IFREG | 0o600
                         and identity(after)[:2] + identity(after)[3:8] == identity(before)[:2] + identity(before)[3:8]
                         and identity(after) == identity(path.lstat()), 'controller-template')
                    prep_cut()
                except BaseException as error:
                    remember(error)
                    raise
                finally:
                    consuming_close(fd)
            stage = 'python-census'
            rows = census()
            current_body, current_base = file_body(base_fd, Path(CONTROLLER_BASE), 1024 * 1024)
            need(identity(current_base) == identity(base_info) and current_body == base_body, 'controller-original-changed')
            fd, base_fd = base_fd, None
            consuming_close(fd)
            prep_cut()
            controller = dict(schemaVersion=1, baseExecutable=CONTROLLER_BASE, baseIdentity=list(identity(base_info)),
                              baseSha256=base_sha, baseOriginalClosed=True, relativeExecutable='bin/python3.14', rows=rows,
                              totalBytes=sum(row['identity'][6] for row in rows if row['path'] in CONTROLLER_FILES))
            controller_record_data(controller, work, identity(info))
            need(rows == census(), 'controller-original-changed')
            need(originals_known, 'controller-operation')
            stage = 'python-publication'
            binding = dict(schemaVersion=1, source=source, workflowSource=source,
                           runId=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
                           workDirectory=[info.st_dev, info.st_ino, info.st_uid], frontendAbsentAtAdmission=True,
                           pythonController=controller)
            publish_preparation('compile-binding.json', binding)
            prep_cut(); work_post()
            python = str(controller_root / 'bin/python3.14')
            need('\n' not in python and '\n' not in str(work), 'controller-runtime')
            # The subsequent controllers really execute this private venv; no activation.
            with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
                stream.write('MRK_MACOS_WORK=' + str(work) + '\nMRK_PYTHON=' + python + '\nCARGO_TARGET_DIR=' + str(work / 'cargo-target') + '\n')
            prep_cut(); work_post()
        except BaseException as error:
            remember(error)
            if base_fd is not None:
                fd, base_fd = base_fd, None
                try: consuming_close(fd)
                except BaseException: pass  # Same original attempted once; first failure retained.
            # No partial environment is adopted or removed after a failed preparation.
            failure = dict(schemaVersion=1, scope='fixed-arm-shipping-image-compile-only', source=source,
                           workflowSource=source, runId=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
                           target='aarch64-apple-darwin', commands=[], failure=first_failure,
                           pythonControllerObserved=observed, pythonControllerPrepared=False,
                           pythonControllerPost=False, pythonControllerRetired=False,
                           inputOriginalsKnown=originals_known, shippingGraphCompiled=False,
                           installedQualified=False, runtimeQualified=False, launched=False, signed=False)
            try: publish_preparation('compile-receipt.json', compile_public_data(failure, source, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']), cleanup=True)
            except BaseException: pass  # Never overwrite/retry a partial public original.
            raise SystemExit(1)
        PY_SHIPPING_COMPILE_ADMIT
