name: Read one existing Mac notarization diagnostic
on:
  push:
    branches: [verify/desktop-macos-notary-diagnostic]
permissions:
  contents: read
concurrency:
  group: desktop-macos-notary-diagnostic
  cancel-in-progress: false
jobs:
  existing-log:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-notary-diagnostic'
    environment: macos-developer-id
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Read the existing Accepted submission after local log refusal
        timeout-minutes: 6
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        shell: bash
        run: |
          set +x
          set +a
          set -euo pipefail
          umask 077
          python3 -I -S -B desktop/tools/macos_notary_diagnostic.py
      - name: Preserve only finite public diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-existing-notary-log-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mrk-notary-diagnostic-public.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
