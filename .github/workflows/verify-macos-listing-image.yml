name: Exact hosted listing image copy verification

on:
  push:
    branches: [verify/frozen-0213-listing-image]
    paths: ['.github/workflows/verify-macos-listing-image.yml']

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: macos-release-ui-7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc-listing-image-diagnostic
  cancel-in-progress: false

jobs:
  signed-ui:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.event_name == 'push' && github.ref == 'refs/heads/verify/frozen-0213-listing-image'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MRK_UI_SUITE: listing-image-diagnostic
    steps:
      - name: Admit a fresh hosted Apple Silicon console and completed qualification
        id: admit
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RELEASE_SOURCE: 7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc
          BUILD_RUN: 46048925911
          CARRIER_RUN: 46067290901
          CARRIER_ATTEMPT: 1
          QUALIFICATION_RUN: 46070187046
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 26.* && "$(id -u)" != 0 && "$RELEASE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          for run in "$BUILD_RUN" "$CARRIER_RUN" "$QUALIFICATION_RUN"; do
            [[ "$run" =~ ^[1-9][0-9]{0,19}$ ]]
          done
          [[ "$CARRIER_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "$HOME/Library/Application Support/dev.mobile-release-kit.desktop" ]]
          if [[ "$RELEASE_SOURCE" != "$GITHUB_SHA" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SOURCE...$GITHUB_SHA?per_page=1" |
              jq -e --arg source "$RELEASE_SOURCE" '
                .status == "ahead" and .base_commit.sha == $source and .merge_base_commit.sha == $source
              ' > /dev/null
          fi
          qualification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" |
            jq -e -r --arg source "$RELEASE_SOURCE" --arg repository "$GITHUB_REPOSITORY" --arg run "$QUALIFICATION_RUN" '
              select(.head_sha == $source and .event == "workflow_dispatch" and .head_branch == "main" and
                .repository.full_name == $repository and .head_repository.full_name == $repository and
                (.id | tostring) == $run and .status == "completed" and .conclusion == "success" and
                .path == ".github/workflows/desktop-macos-update-check.yml") |
              [.run_attempt, .head_commit.tree_id] | @tsv
            ')"
          IFS=$'\t' read -r attempt tree <<< "$qualification"
          [[ "$attempt" =~ ^[1-9][0-9]{0,5}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'qualification-attempt=%s\n' "$attempt" >> "$GITHUB_OUTPUT"
          printf 'release-tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1
          path: ui-action-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: 46067290901
          github-token: ${{ github.token }}
          name: macos-release-frozen-7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc-46067290901-1
          path: ${{ runner.temp }}/signed-ui-media
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: 46070187046
          github-token: ${{ github.token }}
          name: macos-release-qualified-7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc-46070187046-${{ steps.admit.outputs.qualification-attempt }}
          path: ${{ runner.temp }}/signed-ui-qualification
      - name: Select synthetic image observer and leave product source intact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp verification/native-image-qualification.py desktop/tools/macos_release_ui.py
      - name: Bind assets and attestations and install the exact signed DMG
        env:
          BUILD_RUN: 46048925911
          RELEASE_SOURCE: 7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc
          CARRIER_RUN: 46067290901
          CARRIER_ATTEMPT: 1
          QUALIFICATION_RUN: 46070187046
          QUALIFICATION_ATTEMPT: ${{ steps.admit.outputs.qualification-attempt }}
          RELEASE_TREE: ${{ steps.admit.outputs.release-tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/mrk-signed-ui.XXXXXXXX")"
          media="$RUNNER_TEMP/signed-ui-media"
          printf 'MRK_UI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          mkdir "$work/evidence"
          python -I -B desktop/tools/macos_release_media.py verify "$media" \
            --source "$RELEASE_SOURCE" --tree "$RELEASE_TREE" \
            --build-run "$BUILD_RUN" --carrier-run "$CARRIER_RUN" \
            --qualification "$RUNNER_TEMP/signed-ui-qualification/QUALIFIED.json" \
              "$QUALIFICATION_RUN" "$QUALIFICATION_ATTEMPT" "$CARRIER_ATTEMPT"
          for asset in "$media"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
              --source-digest "$RELEASE_SOURCE" --deny-self-hosted-runners \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml"
          done
          unset GH_TOKEN
          cp "$RUNNER_TEMP/signed-ui-qualification/QUALIFIED.json" "$work/evidence/QUALIFIED.json"
          python -I -B desktop/tools/macos_release_ui.py install "$media" "$work" --suite "$MRK_UI_SUITE"
      - name: Launch the signed app before connecting the UI driver
        run: |
          set -euo pipefail
          /usr/sbin/screencapture -x "$MRK_UI_WORK/evidence/before-app-launch.png"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$MRK_UI_WORK/evidence/app-launch-at.txt"
          /usr/bin/open -a '/Applications/Mobile Release Kit.app'
          sleep 6
          /usr/sbin/screencapture -x "$MRK_UI_WORK/evidence/before-ui-driver.png"
      - name: Start the same-runner observer with a one-time bearer
        id: observer
        run: |
          set -euo pipefail
          umask 077
          python -I -B - <<'PY'
          import hashlib, json, os, secrets
          from pathlib import Path
          work = Path(os.environ['MRK_UI_WORK'])
          token = secrets.token_hex(32)
          (work / 'token').write_text(token + '\n')
          previous = sorted(map(str, Path(os.environ['RUNNER_TEMP']).glob('ui-session-*/connection.json')))
          (work / 'previous-sessions.json').write_text(json.dumps(previous))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('token-digest=' + hashlib.sha256(token.encode('ascii')).hexdigest() + '\n')
          PY
          (
            set +e
            python -I -B desktop/tools/macos_release_ui.py observe "$RUNNER_TEMP/signed-ui-media" "$MRK_UI_WORK" \
              --action "$GITHUB_WORKSPACE/ui-action-source" --suite "$MRK_UI_SUITE"
            printf '%s\n' "$?" > "$MRK_UI_WORK/observer-status"
          ) > "$MRK_UI_WORK/evidence/observer.log" 2>&1 &
      - uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1
        with:
          target: macos
          transport: local
          token-sha256: ${{ steps.observer.outputs.token-digest }}
          duration-minutes: '15'
          startup-timeout-seconds: '180'
      - name: Admit the single fresh driver for the reopened signed app
        id: reopen
        if: ${{ !cancelled() && steps.observer.outcome == 'success' }}
        run: |
          set -euo pipefail
          request="$MRK_UI_WORK/reopen-token-digest"
          if [[ -f "$request" ]]; then
            IFS= read -r digest < "$request"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf 'token-digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          fi
      - uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1
        if: ${{ !cancelled() && steps.reopen.outputs.token-digest != '' }}
        with:
          target: macos
          transport: local
          token-sha256: ${{ steps.reopen.outputs.token-digest }}
          duration-minutes: '5'
          startup-timeout-seconds: '180'
      - name: Require the original UI observer result
        if: ${{ !cancelled() && steps.observer.outcome == 'success' }}
        run: |
          set -euo pipefail
          for ((waited=0; waited<10; waited++)); do
            [[ ! -f "$MRK_UI_WORK/observer-status" ]] || break
            sleep 1
          done
          python -I -B desktop/tools/macos_release_ui.py require "$RUNNER_TEMP/signed-ui-media" "$MRK_UI_WORK" --suite "$MRK_UI_SUITE"
      - name: Publish only derived source-bound image verification facts
        if: ${{ !cancelled() && env.MRK_UI_WORK != '' }}
        run: |
          set -euo pipefail
          cd "$MRK_UI_WORK/evidence"
          test -f RESULT.json && test -f INSTALLED.json && test -f SCENARIO-SUMMARY.json
          jq -ce --slurpfile installed INSTALLED.json --slurpfile summary SCENARIO-SUMMARY.json '
             select(.sourceCommit=="7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc")
             | select(.packageSha256=="1a42510801e93786d6cd32ce98c8596a166e85f863bd4f61fd105fda891d8b79")
             | select($installed[0].nativeSignaturesVerified==true and .packageSha256==$installed[0].packageSha256)
             | {sourceCommit,sourceTree,packageSha256,removeSha256,
                observerExit:$summary[0].observerExit,status:($summary[0].scenarios),
                imageFacts:(.listingImages//{}|{originalListingImagePanelExposed,originalPickerOptions,
                    nativePickerCancelledWithoutWriting,exactDestinationObserved,copiedExactBytesOnlyToReviewedFrenchLocale,
                    sourceSha256,originalGitIndexAndOtherPathsUnchanged})}
          ' RESULT.json
