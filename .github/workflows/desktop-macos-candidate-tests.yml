name: macOS saved-candidate test groups

on:
  workflow_call:
    secrets:
      MRK_MACOS_DEVELOPER_ID_P12_BASE64:
        required: false
      MRK_MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  candidate-tests:
    # On a rerun, select the successful producer attempt from the all-attempts
    # API. Never substitute the consumer's attempt or rebuild its signed app.
    if: ${{ !cancelled() && github.ref == 'refs/heads/verify/desktop-macos-candidate' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'candidate-tests')) }}
    environment: macos-developer-id
    name: Test saved candidate (${{ matrix.group }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"git-local":[{"target":"aarch64-apple-darwin","group":"git-local","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65}],"git-fetch":[{"target":"aarch64-apple-darwin","group":"git-fetch","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65}],"git-push":[{"target":"aarch64-apple-darwin","group":"git-push","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65}],"git-create":[{"target":"aarch64-apple-darwin","group":"git-create","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65}],"git-upstream":[{"target":"aarch64-apple-darwin","group":"git-upstream","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65}],"service-cli":[{"target":"aarch64-apple-darwin","group":"service-cli","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":65}],"public-acquisition":[{"target":"aarch64-apple-darwin","group":"public-acquisition","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":160}],"sdk-registration":[{"target":"aarch64-apple-darwin","group":"sdk-registration","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":165}],"upload-keys":[{"target":"aarch64-apple-darwin","group":"upload-keys","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190}],"cold-restart":[{"target":"aarch64-apple-darwin","group":"cold-restart","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190}],"backup":[{"target":"aarch64-apple-darwin","group":"backup","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190}]}')[github.event.inputs.test_group] || fromJSON('[{"target":"aarch64-apple-darwin","group":"git-local","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"git-fetch","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"git-push","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"git-create","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"git-upstream","native_scope":"git-native","runner":"xcode-27","hosted_job":"github-hosted-xcode27-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"service-cli","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":65},{"target":"aarch64-apple-darwin","group":"public-acquisition","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":160},{"target":"aarch64-apple-darwin","group":"sdk-registration","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":165},{"target":"aarch64-apple-darwin","group":"upload-keys","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190},{"target":"aarch64-apple-darwin","group":"cold-restart","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190},{"target":"aarch64-apple-darwin","group":"backup","native_scope":"tool-setup","runner":"macos-26","hosted_job":"github-hosted-macos26-arm64","timeout":190}]') }}
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      MRK_MACOS_TARGET: aarch64-apple-darwin
      MRK_MACOS_RUNNER: ${{ matrix.runner }}
      MRK_MACOS_MACHINE: arm64
      MRK_MACOS_HOSTED_JOB: ${{ matrix.hosted_job }}
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      MRK_MACOS_PACKAGE_ROLE: installed-shell-observation
      MRK_MACOS_NATIVE_SCOPE: ${{ matrix.native_scope }}
      MRK_MACOS_PREPARED_TEST: 'true'
      MRK_MACOS_PREPARED_RESUME: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      MRK_MACOS_STORE_RUNTIME: signed-component
      MRK_MACOS_SAME_PACKAGE_SCOPE: disabled
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only the disposable hosted prepared-input route
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ]] || exit 1
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
          case "$MRK_MACOS_TARGET/$RUNNER_ARCH/$(/usr/bin/uname -m)" in
            aarch64-apple-darwin/ARM64/arm64|x86_64-apple-darwin/X64/x86_64) ;;
            *) exit 1 ;;
          esac
          expected_host_major=26
          if [[ "$MRK_MACOS_NATIVE_SCOPE" == git-native ]]; then expected_host_major=27; fi
          [[ "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/sw_vers -productVersion)" == "$expected_host_major".* ]] || exit 1
      - name: Check signing credential availability before downloading the package
        timeout-minutes: 1
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          if [[ -z "$SIGNING_IDENTITY" || -z "$SIGNING_PASSWORD" ]]; then
            printf '%s\n' '::error::The test job did not receive its macos-developer-id signing credentials.'
            exit 1
          fi
          unset SIGNING_IDENTITY SIGNING_PASSWORD
      - name: Check out the exact current harness source without credentials
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select DATA Python, never the packaged interpreter
        id: python
        timeout-minutes: 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Reserve one fresh consumer work directory
        id: work
        timeout-minutes: 1
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
          [[ "$(/usr/bin/git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          tree=$(/usr/bin/git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nMRK_CONSUMER_TREE=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$tree" "$root" >> "$GITHUB_ENV"
      - name: Select the one closed upstream target checkpoint without matrix output ambiguity
        id: prepared
        timeout-minutes: 4
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PRODUCER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_source || github.sha }}
          PRODUCER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run || github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          [[ "$PRODUCER_SOURCE" =~ ^[0-9a-f]{40}$ && "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          fetch() { (ulimit -f 16384; gh api "$1" > "$2"); }
          fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/jobs?filter=all&per_page=100" "$MRK_MACOS_WORK/prepared-jobs.json"
          fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/artifacts?per_page=100" "$MRK_MACOS_WORK/prepared-artifacts.json"
          fetch "repos/$GITHUB_REPOSITORY/git/commits/$PRODUCER_SOURCE" "$MRK_MACOS_WORK/prepared-commit.json"
          printf '0\n' > "$MRK_MACOS_WORK/prepared-api.status"
          unset GH_TOKEN
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py select --target "$MRK_MACOS_TARGET" \
            --producer-source "$PRODUCER_SOURCE" --producer-run "$PRODUCER_RUN" > "$MRK_MACOS_WORK/prepared-selection.txt"
          /bin/cat "$MRK_MACOS_WORK/prepared-selection.txt" >> "$GITHUB_OUTPUT"
      - name: Capture the exact selected producer attempt, not the current rerun attempt
        timeout-minutes: 2
        shell: bash
        env:
          PRODUCER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run || github.run_id }}
          PRODUCER_ATTEMPT: ${{ steps.prepared.outputs.producer-attempt }}
          PRODUCER_SOURCE: ${{ steps.prepared.outputs.producer-source }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          (ulimit -f 16384; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$PRODUCER_ATTEMPT" > "$MRK_MACOS_WORK/prepared-service/run.json")
          if [[ "$MRK_MACOS_PREPARED_RESUME" == true ]]; then
            [[ "$PRODUCER_SOURCE" =~ ^[0-9a-f]{40}$ && "$PRODUCER_SOURCE" != "$GITHUB_SHA" ]] || exit 1
            (ulimit -f 16384; gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCER_SOURCE...$GITHUB_SHA" > "$MRK_MACOS_WORK/prepared-service/compatibility.json")
          fi
          printf '0\n' > "$MRK_MACOS_WORK/prepared-service/metadata.status"
      - name: Download only the selected prepared artifact with service digest verification
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: Apdelrahman1911/mobile-release-kit
          run-id: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run || github.run_id }}
          path: ${{ steps.work.outputs.root }}/prepared-input
          merge-multiple: true
          digest-mismatch: error
          skip-decompress: 'false'
      - name: Check out the immutable producer source for its package reader and producer build
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepared.outputs.producer-source }}
          path: prepared-built-source
          persist-credentials: false
      - name: Reconstruct fresh script originals and repeat full finalized product audit
        timeout-minutes: 5
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          ulimit -c 0
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py hydrate --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" > "$MRK_MACOS_WORK/prepared-runtime.env"
          /bin/cat "$MRK_MACOS_WORK/prepared-runtime.env" >> "$GITHUB_ENV"
      - name: Install and verify only the pinned producer toolchain
        timeout-minutes: 8
        shell: bash
        run: /bin/bash desktop/tools/macos_installed_direct_rust.sh
      - name: Fetch only the exact producer source dependencies before its unchanged offline build
        timeout-minutes: 8
        shell: bash
        env:
          BUILT_SOURCE: ${{ steps.prepared.outputs.producer-source }}
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE"
          if [[ "$BUILT_SOURCE" != "$GITHUB_SHA" ]]; then checkout="$checkout/prepared-built-source"; fi
          [[ "$(/usr/bin/git -C "$checkout" rev-parse HEAD)" == "$BUILT_SOURCE" ]] || exit 1
          /usr/bin/env -i PATH="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME=/Users/runner CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            DEVELOPER_DIR="$DEVELOPER_DIR" MACOSX_DEPLOYMENT_TARGET=26.0 \
            "/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/cargo" fetch \
              --manifest-path "$checkout/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
      - name: Standard Installer only is privileged; never execute the app or Python as root
        if: success()
        id: package_install
        timeout-minutes: 18
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          set -euo pipefail
          set -o noclobber
          umask 077
          # Existing owner/deadlines cover signature, readonly mount, Installer
          # and V2 readback; earlier construction is not installation evidence.
          set +e
          MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py package-install --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" \
            > "$MRK_MACOS_WORK/package-install.stdout"
          package_status=$?
          printf '%s\n' "$package_status" > "$MRK_MACOS_WORK/package-install.status"
          package_status_saved=$?
          set -e
          if [[ "$package_status" != 0 ]]; then exit "$package_status"; fi
          [[ "$package_status_saved" == 0 ]] || exit "$package_status_saved"
          # The receipt is not its own exit proof: only this original0, the
          # saved Installer0, same-request readback and known detach permit use.
          # Unknown resources remain retained; no forced detach or root Python.
          unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
      - name: Retain bounded image signing and detach diagnostics
        if: ${{ !cancelled() && (steps.package_install.outcome == 'success' || steps.package_install.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-install-diagnostics-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.work.outputs.root }}/android-helper-distribution-sign.stderr
            ${{ steps.work.outputs.root }}/android-helper-distribution-sign.stdout
            ${{ steps.work.outputs.root }}/android-helper-distribution-sign.status
            ${{ steps.work.outputs.root }}/android-helper-observation-sign.stderr
            ${{ steps.work.outputs.root }}/android-helper-observation-sign.stdout
            ${{ steps.work.outputs.root }}/android-helper-observation-sign.status
            ${{ steps.work.outputs.root }}/android-helper-distribution-detach.stderr
            ${{ steps.work.outputs.root }}/android-helper-distribution-detach.status
          if-no-files-found: ignore
          retention-days: 14
      - name: Run only this independent Git group
        if: matrix.native_scope == 'git-native' && steps.package_install.outcome == 'success'
        timeout-minutes: 25
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          observe() { "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope "$1"; }
          case "$TEST_GROUP" in
            git-local) observe git-index-cli-native; observe git-branch-cli-native ;;
            git-fetch) observe git-fetch-native ;;
            git-push) observe git-push-native ;;
            git-create) observe git-push-create-native ;;
            git-upstream) observe git-upstream-native ;;
            *) exit 1 ;;
          esac
      - name: Request the fixed native service once and confirm its joined readiness
        id: tool_service
        if: matrix.native_scope == 'tool-setup' && steps.package_install.outcome == 'success'
        timeout-minutes: 13
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          # Register once, then Check. Exit78 is unexecuted, never a pass/retry.
          exec "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope tool-service-prerequisite
      - name: Verify the installed CLI against the joined native service
        id: installed_cli_native
        if: matrix.native_scope == 'tool-setup' && steps.tool_service.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          # Same image: one local check, seven CLI calls, eight IPC joins.
          # Separate step contains its original135s caller and cleanup; the
          # service's preceding765s caller cannot consume this outer budget.
          exec "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope installed-cli-local-check
      - name: Prepare three isolated platform-only SDK sources with shared JDK and Gradle
        id: tool_inputs
        if: matrix.native_scope == 'tool-setup' && matrix.group != 'service-cli' && steps.installed_cli_native.outcome == 'success'
        timeout-minutes: 22
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          export MRK_ANDROID_PREPARATION_WORK="$MRK_MACOS_WORK"
          # Existing bounded download/extraction originals, once per pinned
          # public archive; never supplier execution or sdkmanager. At least
          # 8GiB free, unchanged private ancestry and no prior task leaf required.
          exec "$MRK_PYTHON" -I -S -B desktop/tools/macos_android_dependency_preparation.py prepare-tool-setup-inputs
      - name: Observe public acquisition, cancellation and missing-only SDK registration reuse
        id: tool_native
        if: matrix.native_scope == 'tool-setup' && matrix.group != 'service-cli' && steps.tool_inputs.outcome == 'success'
        timeout-minutes: 122
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          if [[ '${{ matrix.group }}' == public-acquisition ]]; then
            exec "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope tool-setup --tool-cases public-acquisition
          fi
          # Fresh registration is required on each isolated runner. No saved
          # service or SDK state is accepted from another runner's test result.
          exec "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope tool-setup
      - name: Run only this key or backup group
        if: (matrix.group == 'upload-keys' || matrix.group == 'cold-restart' || matrix.group == 'backup') && steps.tool_native.outcome == 'success'
        timeout-minutes: 60
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          observe() { "$MRK_PYTHON" -I -S -B desktop/tools/macos_identity_current_runtime.py --target "$MRK_MACOS_TARGET" --scope "$1"; }
          case "$TEST_GROUP" in
            upload-keys)
              observe upload-key-roundtrip
              observe upload-key-stop-before-go
              observe upload-key-stop-after-new ;;
            cold-restart) observe upload-key-cold-restart ;;
            backup)
              observe upload-key-backup-roundtrip
              observe upload-key-backup-cli ;;
            *) exit 1 ;;
          esac

