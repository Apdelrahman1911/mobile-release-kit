name: Diagnostic-only CLT SDK inventory

on:
  push:
    branches:
      - verify/desktop-macos-github-seal

permissions:
  contents: read

concurrency:
  group: macos-github-seal-${{ github.ref }}
  cancel-in-progress: false

env:
  BASH_ENV: ''
  ENV: ''
  DEVELOPER_DIR: /Library/Developer/CommandLineTools

jobs:
  seal-build:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.ref == 'refs/heads/verify/desktop-macos-github-seal'
    name: diagnostic-only CLT SDKs (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      MRK_SEAL_TARGET: ${{ matrix.target }}
    steps:
      - name: Exact detached public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare the ordinary engineering Python interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          check-latest: false

      - name: Admit unchanged checkout
        id: sourcepre
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git symbolic-ref -q HEAD || true)" = ''
          test -z "$(git status --porcelain --untracked-files=all)"

      # Temporary read-only diagnosis. No build, test, signing, capsule, or receipt.
      - name: Observe at most 32 immediate CLT SDK siblings
        id: diagnostic
        timeout-minutes: 1
        shell: bash
        env:
          MRK_SEAL_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$MRK_SEAL_PYTHON" -I -S -B - <<'PY'
          import json, os, stat
          root = "/Library/Developer/CommandLineTools/SDKs"
          fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              rows = []
              with os.scandir(fd) as entries:
                  for entry in entries:
                      if len(rows) == 32:
                          raise SystemExit("CLT SDK diagnostic: entry bound exceeded")
                      name = entry.name
                      if not 1 <= len(name) <= 128 or not name.isascii() or any(ord(c) < 32 or ord(c) > 126 for c in name):
                          raise SystemExit("CLT SDK diagnostic: name bound refused")
                      info = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      kind = "directory" if stat.S_ISDIR(info.st_mode) else "symlink" if stat.S_ISLNK(info.st_mode) else "other"
                      row = {"name": name, "kind": kind, "mode": info.st_mode, "uid": info.st_uid, "gid": info.st_gid}
                      if kind == "symlink":
                          target = os.readlink(name, dir_fd=fd)
                          if not 1 <= len(target) <= 256 or not target.isascii() or any(ord(c) < 32 or ord(c) > 126 for c in target):
                              raise SystemExit("CLT SDK diagnostic: link bound refused")
                          row["target"] = target
                      rows.append(row)
          finally:
              os.close(fd)
          raw = json.dumps({"diagnosticOnly": True, "root": root, "entries": sorted(rows, key=lambda row: row["name"])}, separators=(",", ":"), ensure_ascii=True)
          if len(raw.encode("ascii")) + 1 > 8192:
              raise SystemExit("CLT SDK diagnostic: output bound exceeded")
          print(raw)
          PY

      - name: Verify source after the diagnostic returned
        id: sourcepost
        if: always() && steps.sourcepre.outcome == 'success' && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure')
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git symbolic-ref -q HEAD || true)" = ''
          test -z "$(git status --porcelain --untracked-files=all)"
