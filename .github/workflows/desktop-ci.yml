name: Disposable Store fixture replay

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [linux]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Store fixture tests
    if: >-
      github.ref == 'refs/heads/verify/desktop-store-fixture-replay' &&
      inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Replay the shared Store packaging fixture
        working-directory: .
        env:
          PYTHONPATH: src:tests:tests/desktop
        run: |
          python -B -m unittest -v test_macos_store_paths \
            test_runtime_preparation.RuntimePreparationTests.test_macos_trust_projection_removes_only_the_reviewed_roots \
            test_runtime_preparation.RuntimePreparationTests.test_macos_store_ruby_pin_preserves_the_locked_gems
      - name: Set up the pinned macOS DATA compiler
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Test signed Store composition with the production bytecode compiler
        working-directory: .
        env:
          PYTHONPATH: src:tests:tests/desktop
        run: python -B -m unittest -v test_macos_store_composition test_macos_store_consumer
