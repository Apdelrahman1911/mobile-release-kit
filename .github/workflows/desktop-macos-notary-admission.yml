name: Desktop Mac fixed notary tool metadata diagnostic only

on:
  push:
    branches:
      - verify/desktop-macos-notary-admission

permissions:
  contents: read

concurrency:
  group: desktop-macos-notary-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notary-admission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-notary-admission'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed source without retained credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe only fixed tool admission and close original descriptors
        id: probe
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          /usr/bin/python3 -I -S -B desktop/tools/macos_notary_admission_probe.py > notary-admission-public.json
      - name: Retain only the closed finite metadata observation
        if: steps.probe.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-admission-aarch64-apple-darwin-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: notary-admission-public.json
          if-no-files-found: error
          retention-days: 14
