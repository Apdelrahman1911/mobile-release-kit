name: Desktop notary key shape DATA diagnostic only

on:
  push:
    branches:
      - verify/desktop-macos-notary-key-shape

permissions:
  contents: read

concurrency:
  group: desktop-macos-notary-key-shape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notary-key-shape:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-notary-key-shape'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: macos-developer-id
    steps:
      - name: Check out exact reviewed source without retained credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe only the current strict key shape without authentication
        id: probe
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_NOTARY_API_KEY_BASE64
          set -euo pipefail
          set -o noclobber
          umask 077
          MRK_MACOS_NOTARY_API_KEY_BASE64="$MRK_MACOS_NOTARY_API_KEY_BASE64" /usr/bin/python3 -I -S -B desktop/tools/macos_notary_key_shape_probe.py > notary-key-shape-public.json
          unset MRK_MACOS_NOTARY_API_KEY_BASE64
      - name: Retain only the closed DATA shape observation
        if: steps.probe.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-key-shape-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: notary-key-shape-public.json
          if-no-files-found: error
          retention-days: 14
