name: Desktop macOS removal lab

# Fast removal debugging without the full signed product pipeline. On one
# disposable hosted runner: run the native crate's unit tests, then build the
# nonshipping removal lab (production removal coordinator compiled verbatim)
# and drive a real root Parent and a real console-user App peer through the
# readiness notice, OPEN, CONNECT and the peer credentials at AUTHENTICATE,
# with the census of the request directory at every checkpoint. The lab must
# stop at the identity boundary: identity, frames, the confirmation sheet, app
# exit and file removal need the signed, notarized product and stay in the
# hosted update check (desktop-macos-update-check.yml, remove mode).
# Uses no signing credentials and creates nothing outside this runner.
on:
  push:
    branches:
      - verify/desktop-macos-removal-lab
    paths:
      - .github/workflows/desktop-macos-removal-lab.yml
      - desktop/native/macos-installed-native/**
      - desktop/src-tauri/src/bin/macos_install.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-removal-lab-${{ github.ref }}${{ contains(github.event.head_commit.message, '[macos-uninstaller-result-lab]') && '-applet' || '' }}
  cancel-in-progress: true

jobs:
  removal-lab:
    name: removal lab
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit'
      && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[macos-payload-unlink-lab]') && !contains(github.event.head_commit.message, '[macos-uninstaller-completion-lab]') && !contains(github.event.head_commit.message, '[macos-uninstaller-result-lab]'))
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASH_ENV: ''
      ENV: ''
      RUSTUP_TOOLCHAIN: 1.98.1
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Admit only a fresh hosted Apple Silicon macOS 26 runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "/Library/Application Support/MobileReleaseKit-RemovalRequests" ]]

      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the fixed Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Native unit tests (window agreement, socket census decoder)
        shell: bash
        working-directory: desktop/native/macos-installed-native
        run: |
          set -euo pipefail
          cargo test --locked --jobs 3 --lib -- \
            removal_coordinator:: android_registration:: bulk_directory_records 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Build the removal lab
        shell: bash
        working-directory: desktop/native/macos-installed-native
        run: cargo build --locked --jobs 3 --example removal_lab --features removal-lab

      # Each mode: the workflow starts the console-user App first (notice
      # observer registered), then the root Parent. "sudo" runs the Parent in
      # the runner's session; "installer" runs it from the postinstall of a
      # payload-free, unsigned lab package through the real Installer, the
      # production remover's context (installd package script service).
      - name: Run the removal lab (sudo Parent, then Installer-postinstall Parent)
        shell: bash
        working-directory: desktop/native/macos-installed-native
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          lab="$PWD/target/debug/examples/removal_lab"
          logs="$RUNNER_TEMP/removal-lab"
          mkdir -p "$logs"
          status=0
          for mode in sudo installer; do
            id="$(/usr/bin/openssl rand -hex 16)"
            done_marker="$logs/$mode.done"
            app_log="$logs/$mode-app.log"
            parent_out="$logs/$mode-parent.txt"
            "$lab" app "$id" "$done_marker" >"$app_log" 2>&1 &
            app_pid=$!
            for _ in $(seq 150); do grep -q '^notice-ready' "$app_log" && break; sleep 0.2; done
            started=$(date +%s)
            case "$mode" in
              sudo)
                /usr/bin/sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
                  "$lab" parent "$id" "$USER" "$parent_out" "$done_marker" >"$logs/$mode-parent.log" 2>&1 || true
                ;;
              installer)
                scripts="$RUNNER_TEMP/removal-lab-scripts"
                rm -rf "$scripts"; mkdir -p "$scripts"
                printf '#!/bin/sh\nexport GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted\nexec "%s" parent "%s" "%s" "%s" "%s"\n' \
                  "$lab" "$id" "$USER" "$parent_out" "$done_marker" >"$scripts/postinstall"
                chmod 0755 "$scripts/postinstall"
                /usr/bin/pkgbuild --nopayload --scripts "$scripts" --identifier dev.mobile-release-kit.removal-lab \
                  --version 1 "$RUNNER_TEMP/removal-lab.pkg" >/dev/null
                /usr/bin/sudo -n /usr/sbin/installer -verbose -pkg "$RUNNER_TEMP/removal-lab.pkg" -target / \
                  >"$logs/$mode-parent.log" 2>&1 || true
                ;;
            esac
            app_rc=0; wait "$app_pid" || app_rc=$?
            echo "== $mode ($(( $(date +%s) - started )) s, app exit $app_rc)"
            cat "$parent_out" 2>/dev/null || { echo "no parent result"; tail -20 "$logs/$mode-parent.log"; }
            grep -E '^\{|REMOVAL_LAB_APP=' "$app_log" || tail -20 "$app_log"
            if grep -q '^REMOVAL_LAB_PARENT=pass' "$parent_out" 2>/dev/null && [[ $app_rc == 0 ]]; then
              echo "REMOVAL_LAB_MODE_$mode=pass"
            else
              echo "REMOVAL_LAB_MODE_$mode=fail"; status=1
            fi
          done
          [[ $status == 0 ]] && echo REMOVAL_LAB=pass || echo REMOVAL_LAB=fail
          exit "$status"

      - name: Retain lab output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-removal-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/removal-lab
            ${{ runner.temp }}/unit.log
          if-no-files-found: warn
          retention-days: 30

  payload-unlink:
    name: Verify removal authorization, archive and Installer unlink
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit'
      && github.event_name == 'push'
      && contains(github.event.head_commit.message, '[macos-payload-unlink-lab]')
    runs-on: macos-26
    timeout-minutes: 15
    env:
      BASH_ENV: ''
      ENV: ''
      RUSTUP_TOOLCHAIN: 1.98.1
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Admit a disposable Apple Silicon macOS 26 runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "/Library/Application Support/MobileReleaseKit-RemovalRequests" ]]

      - name: Check out the exact lab source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile only the remover regression binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          target=aarch64-apple-darwin
          export CARGO_TARGET_DIR="$RUNNER_TEMP/payload-unlink-cargo"
          fixtures="$GITHUB_WORKSPACE/.github/fixtures/macos-output-data"
          export MRK_MACOS_INSTALL_SOURCE_COMMIT="$GITHUB_SHA"
          export MRK_OUTPUT_DATA_CORPUS="$fixtures/corpus.json"
          export MRK_OUTPUT_DATA_INVENTORY="$fixtures/inventory.json"
          export MRK_OUTPUT_DATA_PATH_QUOTES="$fixtures/path-quotes.json"
          # Two unrelated pinned-data tests need paths at compile time. This
          # job runs only the explicitly selected removal regressions.
          export MRK_PHASE_AUDIT_INVENTORY="$fixtures/inventory.json"
          export MRK_PHASE_AUDIT_PRODUCER="$fixtures/corpus.json"
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml --locked --target "$target"
          if ! cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --offline --jobs 2 \
            --no-default-features --features macos-installed-remover --bin mrk-macos-remove \
            --target "$target" --no-run --message-format=json > "$RUNNER_TEMP/payload-unlink-compile.jsonl"; then
            /usr/bin/python3 -I -B - "$RUNNER_TEMP/payload-unlink-compile.jsonl" <<'PY'
          import json, pathlib, sys
          emitted = 0
          with pathlib.Path(sys.argv[1]).open() as log:
              for line in log:
                  row = json.loads(line)
                  message = row.get("message", {})
                  if row.get("reason") == "compiler-message" and message.get("level") == "error":
                      print((message.get("rendered") or message["message"])[:8192])
                      emitted += 1
                      if emitted == 10:
                          break
          PY
            exit 1
          fi
          binary="$(/usr/bin/python3 -I -B - "$RUNNER_TEMP/payload-unlink-compile.jsonl" "$CARGO_TARGET_DIR/$target/debug/deps" <<'PY'
          import json, pathlib, re, sys
          rows = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          paths = [pathlib.Path(r["executable"]) for r in rows if r.get("reason") == "compiler-artifact"
                   and r["target"]["name"] == "mrk-macos-remove" and r["profile"]["test"] and r.get("executable")]
          assert len(paths) == 1 and paths[0].parent == pathlib.Path(sys.argv[2])
          assert re.fullmatch(r"mrk_macos_remove-[0-9a-f]+", paths[0].name) and paths[0].is_file()
          print(paths[0])
          PY
          )"
          printf 'MRK_PAYLOAD_UNLINK_TEST=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Check the original locks, recorded sidecars and live original index
        shell: bash
        run: |
          set -euo pipefail
          locks=installer::worker::tests::launcher_removal_requires_both_original_locks
          archive=installer::maintenance::removal_archive_preserves_hidden_distribution_sidecars
          live=installer::tests::removal_live_index_keeps_original_open_and_close_finality
          repair=installer::worker::tests::macl_repair_requires_the_frozen_epoch_and_post_mismatch_failure
          packagekit=installer::worker::tests::packagekit_resume_accepts_only_the_fixed_sticky_ancestor_shape
          "$MRK_PAYLOAD_UNLINK_TEST" "$locks" "$archive" "$live" "$repair" "$packagekit" --exact --test-threads=1 |
            tee "$RUNNER_TEMP/removal-preflight-test.log"
          grep -F "test $locks ... ok" "$RUNNER_TEMP/removal-preflight-test.log"
          grep -F "test $archive ... ok" "$RUNNER_TEMP/removal-preflight-test.log"
          grep -F "test $live ... ok" "$RUNNER_TEMP/removal-preflight-test.log"
          grep -F "test $repair ... ok" "$RUNNER_TEMP/removal-preflight-test.log"
          grep -F "test $packagekit ... ok" "$RUNNER_TEMP/removal-preflight-test.log"

      - name: Verify bundle metadata conservation and original unlink inside Installer
        shell: bash
        run: |
          set -euo pipefail
          test -x "$MRK_PAYLOAD_UNLINK_TEST"
          work="$(mktemp -d "$RUNNER_TEMP/payload-unlink-proof.XXXXXXXX")"
          mkdir -m 0755 "$work/scripts" "$work/fixtures"
          chmod 0755 "$work"
          test_case=installer::worker::tests::payload_removal_settles_the_same_original_after_unlink
          metadata_case=installer::worker::tests::payload_removal_conserves_the_enrolled_app_tag
          packagekit_case=installer::worker::tests::packagekit_resume_holds_the_actual_installer_ancestors
          /bin/cp -X "$MRK_PAYLOAD_UNLINK_TEST" "$work/scripts/mrk-macos-remove"
          # The installed script resolves its own directory inside PackageKit.
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nset -eu\numask 022\nexport TMPDIR="%s"\ncd -P "$(/usr/bin/dirname "$0")"\nexec ./mrk-macos-remove "%s" "%s" "%s" --ignored --exact --nocapture --test-threads=1 >"%s" 2>&1\n' \
            "$work/fixtures" "$test_case" "$metadata_case" "$packagekit_case" "$RUNNER_TEMP/payload-unlink-test.log" \
            >"$work/scripts/postinstall"
          chmod 0555 "$work/scripts/postinstall" "$work/scripts/mrk-macos-remove"
          /usr/bin/pkgbuild --nopayload --scripts "$work/scripts" --identifier dev.mobile-release-kit.fixture.payload-unlink \
            --version 1 "$work/proof.pkg" >/dev/null
          status=0
          # Installer output belongs to the runner user.
          # shellcheck disable=SC2024
          /usr/bin/sudo -n /usr/sbin/installer -verbose -pkg "$work/proof.pkg" -target / \
            >"$RUNNER_TEMP/payload-unlink-installer.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/payload-unlink-test.log" || cat "$RUNNER_TEMP/payload-unlink-installer.log"
          [[ $status == 0 ]]
          grep -F "test $test_case ... ok" "$RUNNER_TEMP/payload-unlink-test.log"
          grep -F "test $metadata_case ... ok" "$RUNNER_TEMP/payload-unlink-test.log"
          grep -F "test $packagekit_case ... ok" "$RUNNER_TEMP/payload-unlink-test.log"

      - name: Retain bounded test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-payload-unlink-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/removal-preflight-test.log
            ${{ runner.temp }}/payload-unlink-test.log
            ${{ runner.temp }}/payload-unlink-installer.log
          if-no-files-found: warn


  uninstaller-completion:
    name: Verify the uninstaller refuses incomplete or stale removal
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit'
      && github.event_name == 'push'
      && contains(github.event.head_commit.message, '[macos-uninstaller-completion-lab]')
    runs-on: macos-26
    timeout-minutes: 8
    env:
      BASH_ENV: ''
      ENV: ''
    steps:
      - name: Check out the exact lab source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact removal completion against a disposable installation epoch
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          support='/Library/Application Support'
          managed="$support/MobileReleaseKit"
          launcher='/Applications/Mobile Release Kit.app'
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          [[ ! -e "$managed" && ! -L "$managed" && ! -e "$launcher" && ! -L "$launcher" ]]
          fixture="$(mktemp -d "$RUNNER_TEMP/uninstaller-completion.XXXXXXXX")"
          profile="$fixture/home/Library/Application Support/dev.mobile-release-kit.desktop"
          decoy="$fixture/home/Library/Application Support/dev.mobile-release-kit.desktop.decoy"
          mkdir -p "$profile" "$decoy"
          printf 'synthetic-app-profile\n' > "$profile/test-data"
          printf 'synthetic-unrelated-profile\n' > "$decoy/test-data"
          script="$GITHUB_WORKSPACE/desktop/macos-installed-inputs/uninstaller/removal-data-v1.sh"
          /usr/bin/osacompile -o "$fixture/uninstaller.scpt" \
            "$GITHUB_WORKSPACE/desktop/macos-installed-inputs/uninstaller/main.applescript"

          need_status() {
            local wanted="$1" label="$2" actual=0
            shift 2
            HOME="$fixture/home" /bin/sh "$script" "$@" > "$fixture/last-output" 2>&1 || actual=$?
            printf '%s %s\n' "$label" "$actual"
            if [[ "$actual" != "$wanted" ]]; then cat "$fixture/last-output"; return 1; fi
          }
          state="$managed/installation-v2.json"
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 -o root -g wheel "$managed"
          printf 'original protected installation epoch\n' > "$fixture/state"
          /usr/bin/sudo -n /usr/bin/install -m 0444 -o root -g wheel "$fixture/state" "$state"
          digest="$(/usr/bin/shasum -a 256 < "$state")"
          digest="${digest%% *}"
          receipt="$support/MobileReleaseKit-RemovalComplete-v1-$digest"
          [[ ! -e "$receipt" && ! -L "$receipt" ]]

          need_status 66 absent-before-program-finished --check-removal
          need_status 66 interrupted-purge-refused --delete-data
          [[ "$(cat "$profile/test-data")" == synthetic-app-profile ]]
          printf 'Mobile Release Kit removal complete v1\n%s\n' "$digest" > "$fixture/receipt"
          /usr/bin/sudo -n /bin/ln -s "$fixture/receipt" "$receipt"
          need_status 66 linked-report-refused --check-removal
          /usr/bin/sudo -n /bin/unlink "$receipt"
          /usr/bin/sudo -n /usr/bin/install -m 0644 -o root -g wheel "$fixture/receipt" "$receipt"
          need_status 66 mutable-report-refused --check-removal

          /usr/bin/sudo -n /bin/chmod 0444 "$receipt"
          need_status 0 same-epoch-completion --check-removal
          [[ "$(cat "$profile/test-data")" == synthetic-app-profile ]]
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 -o root -g wheel "$launcher"
          need_status 65 launcher-still-present --delete-data
          /usr/bin/sudo -n /bin/rmdir "$launcher"
          printf 'next protected installation epoch\n' > "$fixture/new-state"
          /usr/bin/sudo -n /usr/bin/install -m 0444 -o root -g wheel "$fixture/new-state" "$state"
          need_status 66 stale-epoch-report-refused --delete-data
          [[ "$(cat "$profile/test-data")" == synthetic-app-profile ]]
          /usr/bin/sudo -n /usr/bin/install -m 0444 -o root -g wheel "$fixture/state" "$state"
          need_status 0 confirmed-purge --delete-data
          [[ ! -e "$profile" && "$(cat "$decoy/test-data")" == synthetic-unrelated-profile ]]


  uninstaller-result:
    name: Verify the actual applet with two mounted removal images
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit'
      && github.event_name == 'push'
      && contains(github.event.head_commit.message, '[macos-uninstaller-result-lab]')
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Check out exact lab and applet source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the actual applet on a disposable image and user profile
        shell: bash
        env:
          BASH_ENV: ''
          ENV: ''
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          support='/Library/Application Support'
          managed="$support/MobileReleaseKit"
          realprofile="$HOME/Library/Application Support/dev.mobile-release-kit.desktop"
          [[ ! -e "$managed" && ! -L "$managed" && ! -e "$realprofile" && ! -L "$realprofile" ]]
          fixture="$(mktemp -d "$RUNNER_TEMP/uninstaller-result.XXXXXXXX")"
          evidence="$RUNNER_TEMP/uninstaller-result-evidence"
          mkdir -p "$fixture/image" "$fixture/older" "$fixture/scripts" "$evidence"
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 -o root -g wheel "$managed"
          printf 'synthetic protected installation state\n' > "$fixture/state"
          /usr/bin/sudo -n /usr/bin/install -m 0444 -o root -g wheel "$fixture/state" "$managed/installation-v2.json"
          hash="$(/usr/bin/shasum -a 256 < "$fixture/state")"
          hash="${hash%% *}"
          printf 'Mobile Release Kit removal complete v1\n%s\n' "$hash" > "$fixture/receipt"
          receipt="$support/MobileReleaseKit-RemovalComplete-v1-$hash"
          /usr/bin/sudo -n /usr/bin/install -m 0444 -o root -g wheel "$fixture/receipt" "$receipt"
          printf '#!/bin/sh\nexit 77\n' > "$fixture/scripts/postinstall"
          chmod 0555 "$fixture/scripts/postinstall"
          /usr/bin/pkgbuild --nopayload --scripts "$fixture/scripts" --identifier dev.mobile-release-kit.test.applet             --version 1 "$fixture/image/Remove.pkg" >/dev/null
          app="$fixture/image/Uninstall Mobile Release Kit.app"
          src="$GITHUB_WORKSPACE/desktop/macos-installed-inputs/uninstaller"
          /usr/bin/osacompile -o "$app" "$src/main.applescript"
          /usr/bin/plutil -replace CFBundleIdentifier -string dev.mobile-release-kit.desktop.uninstaller "$app/Contents/Info.plist"
          /usr/bin/install -m 0444 "$src/removal-data-v1.sh" "$app/Contents/Resources/removal-data-v1.sh"
          /usr/bin/codesign --force --sign - --identifier dev.mobile-release-kit.desktop.uninstaller "$app"
          /usr/bin/hdiutil create -srcfolder "$fixture/image" -volname MRK-Uninstaller-Lab -format UDZO -fs APFS "$fixture/app.dmg"
          old="$fixture/older/Uninstall Mobile Release Kit.app"
          /usr/bin/osacompile -o "$old" -e 'on run' -e 'return' -e 'end run'
          /usr/bin/plutil -replace CFBundleIdentifier -string dev.mobile-release-kit.desktop.uninstaller "$old/Contents/Info.plist"
          # A legacy helper ignores every argument. Only a disposable canary
          # is at risk here. The corrected applet must never execute it.
          printf '#!/bin/sh\n/bin/rm -f -- "%s"\n' "$fixture/legacy-canary" > "$old/Contents/Resources/delete-data.sh"
          /usr/bin/codesign --force --sign - --identifier dev.mobile-release-kit.desktop.uninstaller "$old"
          /bin/cp "$fixture/image/Remove.pkg" "$fixture/older/Remove.pkg"
          /usr/bin/hdiutil create -srcfolder "$fixture/older" -volname MRK-Uninstaller-Lab -format UDZO -fs APFS "$fixture/older.dmg"
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -plist "$fixture/older.dmg" > "$fixture/older-mount.plist"
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -plist "$fixture/app.dmg" > "$fixture/mount.plist"
          /usr/bin/python3 -B - "$fixture" "$evidence" "$receipt" <<'PYTEST'
          import importlib.util, json, os, plistlib, subprocess, sys
          from pathlib import Path
          fixture,evidence,receipt=map(Path,sys.argv[1:])
          spec=importlib.util.spec_from_file_location("lab",Path(os.environ["GITHUB_WORKSPACE"])/".github/fixtures/mrk-uninstaller-result-lab.py")
          check=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(check)
          mount,=[Path(x["mount-point"]) for x in plistlib.loads((fixture/"mount.plist").read_bytes())["system-entities"] if "mount-point" in x]
          old_mount,=[Path(x["mount-point"]) for x in plistlib.loads((fixture/"older-mount.plist").read_bytes())["system-entities"] if "mount-point" in x]
          assert mount != old_mount and str(mount).startswith(str(old_mount) + " ")
          subprocess.run(["/usr/bin/open","-W","-n",str(old_mount/check.UNINSTALLER)],check=True,timeout=20)
          profile=Path.home()/"Library/Application Support/dev.mobile-release-kit.desktop"
          decoy=fixture/"kept-target"
          decoy.write_bytes(b"test decoy")
          linked=Path.home()/"Library/Caches/dev.mobile-release-kit.desktop.launcher"
          assert not linked.exists() and not linked.is_symlink()
          linked.symlink_to(decoy)
          canary=fixture/"legacy-canary"
          canary.write_bytes(b"legacy cleanup was not run")
          legacy=old_mount/check.UNINSTALLER/"Contents/Resources/delete-data.sh"
          helper=mount/check.UNINSTALLER/"Contents/Resources/removal-data-v1.sh"
          assert legacy.is_file() and not (legacy.parent/helper.name).exists()
          assert not (helper.parent/legacy.name).exists()
          try:
              for label in ("keep", "confirmed", "incomplete"):
                  if not profile.exists():
                      profile.mkdir(mode=0o700)
                      (profile/"test-file").write_bytes(b"fixture data")
                  if label=="keep":
                      for argv, expected in (([],64),(["--check-removal"],0),(["--unknown"],64)):
                          completed=subprocess.run(["/bin/sh",str(helper),*argv],capture_output=True,timeout=15)
                          assert completed.returncode==expected, (argv,completed.returncode)
                          assert (profile/"test-file").read_bytes()==b"fixture data"
                  answers=([check.KEEP_LABEL,"Continue",None,"OK"] if label=="keep"
                           else [check.DELETE_LABEL,"Delete All Data","Continue",None,"OK"])
                  seen=check.uninstaller_diagnostic_run(mount,fixture,evidence,label,answers)
                  (evidence/f"{label}-dialogs.json").write_text(json.dumps(seen,indent=2))
                  assert linked.is_symlink() and decoy.read_bytes()==b"test decoy"
                  assert canary.read_bytes()==b"legacy cleanup was not run"
                  opened=json.loads((evidence/f"{label}-package-selection.json").read_bytes())
                  assert len(opened)==1 and opened[0].endswith(str(mount/"Remove.pkg")), opened
                  if label=="keep":
                      assert (profile/"test-file").read_bytes()==b"fixture data"
                      assert check.dialog_says(seen,"was removed. Your data was kept.")
                  elif label=="confirmed":
                      assert not profile.exists()
                      assert check.dialog_says(seen,"was removed, but some data was kept.")
                      assert check.dialog_says(seen,"kept (link, not followed)")
                      subprocess.run(["/usr/bin/sudo","-n","/bin/unlink",str(receipt)],check=True)
                  else:
                      assert (profile/"test-file").read_bytes()==b"fixture data"
                      assert check.dialog_says(seen,"removal could not be confirmed. Your data was kept.")
          finally:
              subprocess.run(["/usr/bin/hdiutil","detach","-force",str(mount)],capture_output=True,timeout=30)
              subprocess.run(["/usr/bin/hdiutil","detach","-force",str(old_mount)],capture_output=True,timeout=30)
          PYTEST
      - name: Retain applet result and timing evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-uninstaller-result-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uninstaller-result-evidence
          retention-days: 30
