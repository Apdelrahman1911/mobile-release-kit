name: Desktop foundation verification

on:
  push:
    branches: [feature/desktop-application]
    paths:
      - desktop/**
      - tests/desktop/**
      - tests/native_desktop_config.py
      - tests/native_desktop_config_eof.py
      - src/mobile_release/api/**
      - src/mobile_release/_desktop_engine.py
      - src/mobile_release/_desktop_edit_*.py
      - src/mobile_release/config_edit.py
      - src/mobile_release/config_payloads.py
      - src/mobile_release/workflow_payloads.py
      - src/mobile_release/cli.py
      - src/mobile_release/init_workspace_custody.py
      - src/mobile_release/cancellation.py
      - src/mobile_release/build_inputs.py
      - src/mobile_release/__init__.py
      - src/mobile_release/config.py
      - src/mobile_release/discovery.py
      - src/mobile_release/credential_requirements.py
      - src/mobile_release/errors.py
      - src/mobile_release/init_transaction.py
      - src/mobile_release/metadata.py
      - src/mobile_release/reporting.py
      - pyproject.toml
      - .github/workflows/desktop-foundation.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit on the selected ref (verification only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive-native:
    name: Desktop boundary / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MRK_DESKTOP_HOSTED_CHECKS: passive-v1
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Require disposable hosting and exact-source selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/feature/desktop-application ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          # Check out exact blob line endings even on Windows. Later source
          # checks intentionally ignore the image's system/global Git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install Linux native shell compilation prerequisites
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Prepare bounded synthetic inputs and source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only locked active-platform compiler inputs
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile headless tests and applicable native shell
        timeout-minutes: 25
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Verify genuine passive IPC and original-child settlement
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py native'
      - name: Verify configuration IPC and original-resource settlement
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner'
      - name: Verify original native cleanup after controlled management-task failure
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-task-loss'
      - name: Verify original EOF cancellation and nonrenewable lifecycle deadlines
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner-delta'
      - name: Verify real EOF before and after durable configuration commit
        if: matrix.platform != 'windows'
        timeout-minutes: 3
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-transaction-eof'
      - name: Verify core transactions before the last retained terminal-fault control
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-core'
      - name: Retain only allowlisted synthetic evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-foundation-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
            ${{ steps.prepare.outputs.root }}/native-checks.json
            ${{ steps.prepare.outputs.root }}/native/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-checks.json
            ${{ steps.prepare.outputs.root }}/config-owner/receipt.json
            ${{ steps.prepare.outputs.root }}/config-task-loss-checks.json
            ${{ steps.prepare.outputs.root }}/config-driver-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-watchdog-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-delta-checks.json
            ${{ steps.prepare.outputs.root }}/config-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-terminal-deadline/receipt.json
            ${{ steps.prepare.outputs.root }}/config-startup-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof-checks.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof/receipt.json
            ${{ steps.prepare.outputs.root }}/config-core-checks.json
            ${{ steps.prepare.outputs.root }}/config-ordinary.json
            ${{ steps.prepare.outputs.root }}/config-committed-fsync.json
            ${{ steps.prepare.outputs.root }}/config-committed-close.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Remove settled task-owned disposable outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'
