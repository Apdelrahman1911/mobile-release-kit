            & $env:MRK_PYTHON -I -S -B desktop/tools/ci_foundation.py windows-installed-runtime-data
            if ($LASTEXITCODE -ne 0) { throw 'data-validator' }
          } catch {
            [Console]::Error.WriteLine('MRK_WINDOWS_RUNTIME_DATA_REFUSED=observation')
            exit 1
