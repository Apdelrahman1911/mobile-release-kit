name: Desktop foundation verification

on:
  push:
    branches: [feature/desktop-application, verify/desktop-windows-snapshot, verify/desktop-windows-installed-native, verify/desktop-conventional-prepare, verify/desktop-conventional-smoke]
    paths:
      - desktop/**
      - tests/desktop/**
      - tests/native_desktop_config.py
      - tests/native_desktop_config_eof.py
      - tests/native_desktop_snapshot_windows.py
      - src/mobile_release/api/**
      - src/mobile_release/_desktop_engine.py
      - src/mobile_release/_desktop_edit_*.py
      - src/mobile_release/config_edit.py
      - src/mobile_release/config_payloads.py
      - src/mobile_release/workflow_payloads.py
      - src/mobile_release/cli.py
      - src/mobile_release/init_workspace_custody.py
      - src/mobile_release/cancellation.py
      - src/mobile_release/build_inputs.py
      - src/mobile_release/__init__.py
      - src/mobile_release/config.py
      - src/mobile_release/discovery.py
      - src/mobile_release/credential_requirements.py
      - src/mobile_release/credential_policy.py
      - src/mobile_release/errors.py
      - src/mobile_release/init_transaction.py
      - src/mobile_release/metadata.py
      - src/mobile_release/reporting.py
      - pyproject.toml
      - .github/workflows/desktop-foundation.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed verification scope (no release or Store operation)
        required: true
        type: choice
        default: foundation
        options: [foundation, windows-snapshot, windows-installed-native, conventional-prepare, conventional-smoke]
      expected_sha:
        description: Exact reviewed commit on the selected ref (verification only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive-native:
    name: Desktop boundary / ${{ matrix.platform }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/desktop-application') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'foundation' &&
       github.ref != 'refs/heads/verify/desktop-conventional-prepare' &&
       github.ref != 'refs/heads/verify/desktop-conventional-smoke' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-native')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MRK_DESKTOP_HOSTED_CHECKS: passive-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Require disposable hosting and exact-source selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/feature/desktop-application ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          # Check out exact blob line endings even on Windows. Later source
          # checks intentionally ignore the image's system/global Git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install Linux native shell compilation prerequisites
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Prepare bounded synthetic inputs and source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only locked active-platform compiler inputs
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile headless tests and applicable native shell
        timeout-minutes: 25
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Verify genuine passive IPC and original-child settlement
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py native'
      - name: Verify configuration IPC and original-resource settlement
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner'
      - name: Verify original native cleanup after controlled management-task failure
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-task-loss'
      - name: Verify original EOF cancellation and nonrenewable lifecycle deadlines
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner-delta'
      - name: Verify real EOF before and after durable configuration commit
        if: matrix.platform != 'windows'
        timeout-minutes: 3
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-transaction-eof'
      - name: Verify core transactions before the last retained terminal-fault control
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-core'
      - name: Retain only allowlisted synthetic evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-foundation-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
            ${{ steps.prepare.outputs.root }}/native-checks.json
            ${{ steps.prepare.outputs.root }}/native/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-checks.json
            ${{ steps.prepare.outputs.root }}/config-owner/receipt.json
            ${{ steps.prepare.outputs.root }}/config-task-loss-checks.json
            ${{ steps.prepare.outputs.root }}/config-driver-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-watchdog-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-delta-checks.json
            ${{ steps.prepare.outputs.root }}/config-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-terminal-deadline/receipt.json
            ${{ steps.prepare.outputs.root }}/config-startup-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof-checks.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof/receipt.json
            ${{ steps.prepare.outputs.root }}/config-core-checks.json
            ${{ steps.prepare.outputs.root }}/config-ordinary.json
            ${{ steps.prepare.outputs.root }}/config-committed-fsync.json
            ${{ steps.prepare.outputs.root }}/config-committed-close.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Remove settled task-owned disposable outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'

  windows-snapshot:
    name: Windows static snapshot / original native boundaries
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-windows-snapshot') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-snapshot' &&
       github.ref != 'refs/heads/verify/desktop-conventional-prepare' &&
       github.ref != 'refs/heads/verify/desktop-conventional-smoke' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-native')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: windows
      MRK_DESKTOP_HOSTED_CHECKS: windows-snapshot-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require the reviewed Windows-only source and disposable host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == X64 ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MRK_DESKTOP_DISPATCH_SCOPE" == windows-snapshot ]]
            [[ "$MRK_DESKTOP_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_DESKTOP_EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-windows-snapshot ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Prepare bounded synthetic Windows inputs and source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only locked headless Windows compiler inputs
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile only the original-owner headless tests
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Verify the fixed Windows snapshot controls with original ownership
        timeout-minutes: 6
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-snapshot'
      - name: Retain only bounded synthetic Windows evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
            ${{ steps.prepare.outputs.root }}/windows-snapshot-checks.json
            ${{ steps.prepare.outputs.root }}/windows-snapshot/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Remove only proven-settled task-owned disposable outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'

  conventional-prepare:
    name: Conventional accepted H to prepared DATA only
    if: >-
      github.ref == 'refs/heads/verify/desktop-conventional-prepare' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'conventional-prepare'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MRK_DESKTOP_HOSTED_CHECKS: conventional-runtime-data-preparation-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
    steps:
      - name: Check out reviewed preparation source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require source-literal H COPY committed review DATA and hosted TCB admissions
        id: admit
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-admit
      # These are transport outputs of the reviewed literal gate, not workflow
      # inputs or freshly observed hash authority. The token exists only here.
      - name: Download exactly the independently accepted original H artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: ${{ steps.admit.outputs.source-repository }}
          run-id: ${{ steps.admit.outputs.source-runId }}
          artifact-ids: ${{ steps.admit.outputs.source-artifactId }}
          merge-multiple: true
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ steps.admit.outputs.root }}/source-artifact
      - name: Copy and prepare once as DATA with original shell wait and writer closes
        id: prepare
        timeout-minutes: 10
        shell: bash
        env:
          CONVENTIONAL_ROOT: ${{ steps.admit.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          exec 4>"$CONVENTIONAL_ROOT/prepare.stdout"
          exec 5>"$CONVENTIONAL_ROOT/prepare.stderr"
          set +e
          /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-prepare </dev/null 1>&4 2>&5 4>&- 5>&-
          result=$?
          set -e
          exec 4>&- 5>&- || exit 125
          (( result == 0 )) || exit "$result"
          exec 3>"$CONVENTIONAL_ROOT/public/outer.json"
          printf '{"schemaVersion":1,"scope":"conventional-runtime-data-preparation-v1","repository":"%s","sourceSha":"%s","runId":"%s","attempt":%s,"originalWait":true,"exitCode":%s,"outputWritersClosed":true,"statusWriterCloseGate":"original-step-success-required"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$result" >&3 || exit 125
          exec 3>&- || exit 125
      - name: Retain closed prepared archive and approved public source and notices
        if: success() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-conventional-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.admit.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
    # NO candidate, Cargo, probe, libtest, cleanup or automatic smoke dependency.
    # Actual A artifact/tar/M/Q/source delivery needs independent acceptance and
    # a later literal-pin commit before a separate B push/dispatch is admitted.

  conventional-smoke:
    name: Conventional independently pinned W smoke only
    if: >-
      github.ref == 'refs/heads/verify/desktop-conventional-smoke' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'conventional-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      MRK_DESKTOP_HOSTED_CHECKS: conventional-runtime-bootstrap-smoke-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
    steps:
      - name: Check out reviewed consumer source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require independent prepared artifact M Q and hosted DATA TCB pins
        id: admit
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-admit
      - name: Download exactly the independently accepted preparation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: ${{ steps.admit.outputs.prepared-repository }}
          run-id: ${{ steps.admit.outputs.prepared-runId }}
          artifact-ids: ${{ steps.admit.outputs.prepared-artifactId }}
          merge-multiple: true
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ steps.admit.outputs.root }}/prepared-artifact
      - name: Authenticate unpack and compile the two fixed headless profiles
        timeout-minutes: 25
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-compile
      - name: Require closed owner refusal then run the fixed probe and two ZIP cases
        id: smoke
        timeout-minutes: 5
        shell: bash
        env:
          CONVENTIONAL_ROOT: ${{ steps.admit.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set +o posix
          unset POSIXLY_CORRECT
          set -C
          umask 077
          # Original owner byte capture is separately capped at 2 MiB. Compile
          # and archive extraction already finished; this is only the smoke.
          ulimit -S -f 2048
          exec 4>"$CONVENTIONAL_ROOT/smoke.stdout"
          exec 5>"$CONVENTIONAL_ROOT/smoke.stderr"
          set +e
          /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-smoke </dev/null 1>&4 2>&5 4>&- 5>&-
          result=$?
          set -e
          exec 4>&- 5>&- || exit 125
          (( result == 0 )) || exit "$result"
          exec 3>"$CONVENTIONAL_ROOT/public/outer.json"
          printf '{"schemaVersion":1,"scope":"conventional-runtime-bootstrap-smoke-v1","repository":"%s","sourceSha":"%s","runId":"%s","attempt":%s,"originalWait":true,"exitCode":%s,"outputWritersClosed":true,"statusWriterCloseGate":"original-step-success-required"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$result" >&3 || exit 125
          exec 3>&- || exit 125
      - name: Retain bounded original smoke receipts and approved source and notices
        if: success() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-conventional-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.admit.outputs.root }}/public
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/hosted-evidence.tar
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/retained-files.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/hosted-summary.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/components.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/notice-inventory.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/notices
            ${{ steps.admit.outputs.root }}/prepared-artifact/reviews
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
    # No retry, fresh-root reset, cleanup or wider foundation/TLS/native jobs.


  windows-installed-native:
    name: Windows MSVC standalone native facts / no runtime enablement
    if: >-
      github.ref == 'refs/heads/verify/desktop-windows-installed-native' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-installed-native'))
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      MRK_DESKTOP_PLATFORM: windows
      MRK_DESKTOP_HOSTED_CHECKS: windows-installed-native-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require the fixed disposable Windows source envelope
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == X64 ]]
          [[ "$ImageOS" == win25 && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-windows-installed-native ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MRK_DESKTOP_DISPATCH_SCOPE" == windows-installed-native && "$MRK_DESKTOP_EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == push ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Bind standalone source and one original task root
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only the locked three-package MSVC graph
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile only the original standalone native libtest
        timeout-minutes: 12
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Run nine inert controls and the fixed native facts contract
        timeout-minutes: 4
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-installed-native'
      - name: Retain only bounded original DATA without retry or cleanup
        id: retain
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py retain'
      - name: Upload bounded original verification evidence
        if: always() && steps.retain.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-installed-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.root }}/public/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
