            $revision = $null
            foreach ($attribute in $attributes) {
              if ($attribute.AttributeType.FullName -eq 'System.Reflection.AssemblyInformationalVersionAttribute') {
                if ($null -ne $informational -or $attribute.ConstructorArguments.Count -ne 1) { throw 'metadata-shape' }
                $informational = [string]$attribute.ConstructorArguments[0].Value
              } elseif ($attribute.AttributeType.FullName -eq 'System.Reflection.AssemblyMetadataAttribute' -and
                        $attribute.ConstructorArguments.Count -eq 2 -and
                        [string]$attribute.ConstructorArguments[0].Value -in @('SourceRevisionId', 'RepositoryCommit', 'CommitHash')) {
