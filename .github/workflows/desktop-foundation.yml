name: Desktop foundation verification

on:
  push:
    branches: [feature/desktop-application, verify/desktop-windows-snapshot, verify/desktop-windows-installed-native, verify/desktop-conventional-prepare, verify/desktop-conventional-smoke]
    paths:
      - desktop/**
      - tests/desktop/**
      - tests/native_desktop_config.py
      - tests/native_desktop_config_eof.py
      - tests/native_desktop_snapshot_windows.py
      - src/mobile_release/api/**
      - src/mobile_release/_desktop_engine.py
      - src/mobile_release/_desktop_edit_*.py
      - src/mobile_release/config_edit.py
      - src/mobile_release/config_payloads.py
      - src/mobile_release/workflow_payloads.py
      - src/mobile_release/cli.py
      - src/mobile_release/init_workspace_custody.py
      - src/mobile_release/cancellation.py
      - src/mobile_release/build_inputs.py
      - src/mobile_release/__init__.py
      - src/mobile_release/config.py
      - src/mobile_release/discovery.py
      - src/mobile_release/credential_requirements.py
      - src/mobile_release/credential_policy.py
      - src/mobile_release/errors.py
      - src/mobile_release/init_transaction.py
      - src/mobile_release/metadata.py
      - src/mobile_release/reporting.py
      - pyproject.toml
      - .github/workflows/desktop-foundation.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed verification scope (no release or Store operation)
        required: true
        type: choice
        default: foundation
        options: [foundation, windows-snapshot, windows-installed-native, windows-installed-fullwalk, windows-runtime-publication, windows-installed-passive, windows-normal-project-ui, conventional-prepare, conventional-smoke]
      expected_sha:
        description: Exact reviewed commit on the selected ref (verification only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive-native:
    name: Desktop boundary / ${{ matrix.platform }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/desktop-application') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'foundation' &&
       github.ref != 'refs/heads/verify/desktop-conventional-prepare' &&
       github.ref != 'refs/heads/verify/desktop-conventional-smoke' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-native' &&
       github.ref != 'refs/heads/verify/desktop-windows-runtime-publication' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-passive' &&
       github.ref != 'refs/heads/verify/desktop-windows-normal-project-ui')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MRK_DESKTOP_HOSTED_CHECKS: passive-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Require disposable hosting and exact-source selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/feature/desktop-application ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          # Check out exact blob line endings even on Windows. Later source
          # checks intentionally ignore the image's system/global Git config.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install Linux native shell compilation prerequisites
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Prepare bounded synthetic inputs and source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only locked active-platform compiler inputs
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile headless tests and applicable native shell
        timeout-minutes: 25
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Verify genuine passive IPC and original-child settlement
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py native'
      - name: Verify configuration IPC and original-resource settlement
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner'
      - name: Verify original native cleanup after controlled management-task failure
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-task-loss'
      - name: Verify original EOF cancellation and nonrenewable lifecycle deadlines
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-owner-delta'
      - name: Verify real EOF before and after durable configuration commit
        if: matrix.platform != 'windows'
        timeout-minutes: 3
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-transaction-eof'
      - name: Verify core transactions before the last retained terminal-fault control
        if: matrix.platform != 'windows'
        timeout-minutes: 5
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py config-core'
      - name: Retain only allowlisted synthetic evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-foundation-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
            ${{ steps.prepare.outputs.root }}/native-checks.json
            ${{ steps.prepare.outputs.root }}/native/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-checks.json
            ${{ steps.prepare.outputs.root }}/config-owner/receipt.json
            ${{ steps.prepare.outputs.root }}/config-task-loss-checks.json
            ${{ steps.prepare.outputs.root }}/config-driver-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-watchdog-loss/receipt.json
            ${{ steps.prepare.outputs.root }}/config-owner-delta-checks.json
            ${{ steps.prepare.outputs.root }}/config-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-terminal-deadline/receipt.json
            ${{ steps.prepare.outputs.root }}/config-startup-stop/receipt.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof-checks.json
            ${{ steps.prepare.outputs.root }}/config-transaction-eof/receipt.json
            ${{ steps.prepare.outputs.root }}/config-core-checks.json
            ${{ steps.prepare.outputs.root }}/config-ordinary.json
            ${{ steps.prepare.outputs.root }}/config-committed-fsync.json
            ${{ steps.prepare.outputs.root }}/config-committed-close.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Remove settled task-owned disposable outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'

  windows-snapshot:
    name: Windows static snapshot / original native boundaries
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-windows-snapshot') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-snapshot' &&
       github.ref != 'refs/heads/verify/desktop-conventional-prepare' &&
       github.ref != 'refs/heads/verify/desktop-conventional-smoke' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-native' &&
       github.ref != 'refs/heads/verify/desktop-windows-runtime-publication' &&
       github.ref != 'refs/heads/verify/desktop-windows-installed-passive')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: windows
      MRK_DESKTOP_HOSTED_CHECKS: windows-snapshot-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require the reviewed Windows-only source and disposable host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == X64 ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MRK_DESKTOP_DISPATCH_SCOPE" == windows-snapshot ]]
            [[ "$MRK_DESKTOP_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_DESKTOP_EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-windows-snapshot ]]
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Prepare bounded synthetic Windows inputs and source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only locked headless Windows compiler inputs
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile only the original-owner headless tests
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Verify the fixed Windows snapshot controls with original ownership
        timeout-minutes: 6
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-snapshot'
      - name: Retain only bounded synthetic Windows evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
            ${{ steps.prepare.outputs.root }}/windows-snapshot-checks.json
            ${{ steps.prepare.outputs.root }}/windows-snapshot/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Remove only proven-settled task-owned disposable outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'

  conventional-prepare:
    name: Conventional accepted H to prepared DATA only
    if: >-
      github.ref == 'refs/heads/verify/desktop-conventional-prepare' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'conventional-prepare'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MRK_DESKTOP_HOSTED_CHECKS: conventional-runtime-data-preparation-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
    steps:
      - name: Check out reviewed preparation source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require source-literal H COPY committed review DATA and hosted TCB admissions
        id: admit
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-admit
      # These are transport outputs of the reviewed literal gate, not workflow
      # inputs or freshly observed hash authority. The token exists only here.
      - name: Download exactly the independently accepted original H artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: ${{ steps.admit.outputs.source-repository }}
          run-id: ${{ steps.admit.outputs.source-runId }}
          artifact-ids: ${{ steps.admit.outputs.source-artifactId }}
          merge-multiple: true
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ steps.admit.outputs.root }}/source-artifact
      - name: Copy and prepare once as DATA with original shell wait and writer closes
        id: prepare
        timeout-minutes: 10
        shell: bash
        env:
          CONVENTIONAL_ROOT: ${{ steps.admit.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          exec 4>"$CONVENTIONAL_ROOT/prepare.stdout"
          exec 5>"$CONVENTIONAL_ROOT/prepare.stderr"
          set +e
          /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-prepare </dev/null 1>&4 2>&5 4>&- 5>&-
          result=$?
          set -e
          exec 4>&- 5>&- || exit 125
          (( result == 0 )) || exit "$result"
          exec 3>"$CONVENTIONAL_ROOT/public/outer.json"
          printf '{"schemaVersion":1,"scope":"conventional-runtime-data-preparation-v1","repository":"%s","sourceSha":"%s","runId":"%s","attempt":%s,"originalWait":true,"exitCode":%s,"outputWritersClosed":true,"statusWriterCloseGate":"original-step-success-required"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$result" >&3 || exit 125
          exec 3>&- || exit 125
      - name: Retain closed prepared archive and approved public source and notices
        if: success() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-conventional-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.admit.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
    # NO candidate, Cargo, probe, libtest, cleanup or automatic smoke dependency.
    # Actual A artifact/tar/M/Q/source delivery needs independent acceptance and
    # a later literal-pin commit before a separate B push/dispatch is admitted.

  conventional-smoke:
    name: Conventional independently pinned W smoke only
    if: >-
      github.ref == 'refs/heads/verify/desktop-conventional-smoke' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'conventional-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      MRK_DESKTOP_HOSTED_CHECKS: conventional-runtime-bootstrap-smoke-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
    steps:
      - name: Check out reviewed consumer source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require independent prepared artifact M Q and hosted DATA TCB pins
        id: admit
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-admit
      - name: Download exactly the independently accepted preparation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: ${{ steps.admit.outputs.prepared-repository }}
          run-id: ${{ steps.admit.outputs.prepared-runId }}
          artifact-ids: ${{ steps.admit.outputs.prepared-artifactId }}
          merge-multiple: true
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ steps.admit.outputs.root }}/prepared-artifact
      - name: Authenticate unpack and compile the two fixed headless profiles
        timeout-minutes: 25
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-compile
      - name: Require closed owner refusal then run the fixed probe and two ZIP cases
        id: smoke
        timeout-minutes: 5
        shell: bash
        env:
          CONVENTIONAL_ROOT: ${{ steps.admit.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set +o posix
          unset POSIXLY_CORRECT
          set -C
          umask 077
          # Original owner byte capture is separately capped at 2 MiB. Compile
          # and archive extraction already finished; this is only the smoke.
          ulimit -S -f 2048
          exec 4>"$CONVENTIONAL_ROOT/smoke.stdout"
          exec 5>"$CONVENTIONAL_ROOT/smoke.stderr"
          set +e
          /usr/bin/python3.12 -I -S -B desktop/tools/ci_foundation.py conventional-smoke </dev/null 1>&4 2>&5 4>&- 5>&-
          result=$?
          set -e
          exec 4>&- 5>&- || exit 125
          (( result == 0 )) || exit "$result"
          exec 3>"$CONVENTIONAL_ROOT/public/outer.json"
          printf '{"schemaVersion":1,"scope":"conventional-runtime-bootstrap-smoke-v1","repository":"%s","sourceSha":"%s","runId":"%s","attempt":%s,"originalWait":true,"exitCode":%s,"outputWritersClosed":true,"statusWriterCloseGate":"original-step-success-required"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$result" >&3 || exit 125
          exec 3>&- || exit 125
      - name: Retain bounded original smoke receipts and approved source and notices
        if: success() && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-conventional-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.admit.outputs.root }}/public
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/hosted-evidence.tar
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/retained-files.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/source-kit/hosted-summary.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/components.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/notice-inventory.json
            ${{ steps.admit.outputs.root }}/prepared-artifact/notices
            ${{ steps.admit.outputs.root }}/prepared-artifact/reviews
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
    # No retry, fresh-root reset, cleanup or wider foundation/TLS/native jobs.


  windows-installed-native:
    name: Windows MSVC headless reader and native facts / no runtime enablement
    if: >-
      (github.ref == 'refs/heads/verify/desktop-windows-installed-native' &&
       (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'windows-installed-native' || inputs.scope == 'windows-installed-fullwalk')))) ||
      (github.ref == 'refs/heads/verify/desktop-windows-runtime-publication' &&
       github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-runtime-publication') ||
      (github.ref == 'refs/heads/verify/desktop-windows-installed-passive' &&
       github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-installed-passive') ||
      (github.ref == 'refs/heads/verify/desktop-windows-normal-project-ui' &&
       github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-normal-project-ui')
    runs-on: windows-2025-vs2026
    timeout-minutes: ${{ inputs.scope == 'windows-normal-project-ui' && 100 || 35 }}
    env:
      MRK_DESKTOP_PLATFORM: windows
      MRK_DESKTOP_HOSTED_CHECKS: windows-installed-native-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ inputs.scope }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require the fixed disposable Windows source envelope
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "${RUNNER_OS:-}" == Windows && "${RUNNER_ARCH:-}" == X64 ]] || {
            printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=runner' >&2; exit 1;
          }
          [[ "${ImageOS:-}" == win25-vs2026 ]] || {
            printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=image' >&2; exit 1;
          }
          [[ "${GITHUB_RUN_ATTEMPT:-}" == 1 ]] || {
            printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=attempt' >&2; exit 1;
          }
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ && "${GITHUB_WORKFLOW_SHA:-}" == "${GITHUB_SHA:-}" ]] || {
            printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=source' >&2; exit 1;
          }
          if [[ "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]]; then
            [[ "${MRK_DESKTOP_EXPECTED_SHA:-}" == "${GITHUB_SHA:-}" &&
               ( ( "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-installed-native &&
                   ( "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-installed-native || "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-installed-fullwalk ) ) ||
                 ( "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-runtime-publication &&
                   "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-runtime-publication ) ||
                 ( "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-installed-passive &&
                   "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-installed-passive ) ||
                 ( "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-normal-project-ui &&
                   "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-normal-project-ui ) ) ]] || {
              printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=dispatch' >&2; exit 1;
            }
          else
            [[ "${GITHUB_EVENT_NAME:-}" == push && "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-installed-native &&
               -z "${MRK_DESKTOP_DISPATCH_SCOPE:-}" && -z "${MRK_DESKTOP_EXPECTED_SHA:-}" ]] || {
              printf '%s\n' 'MRK_WINDOWS_INSTALLED_ROUTE_REFUSED=event' >&2; exit 1;
            }
          fi
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Bind complete source and one original task root
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire only the fixed selected graphs (native-only before the UI prerequisite)
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile exact originals and run nine inert UI/native policies before the native prerequisite
        timeout-minutes: 12
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Preflight source-derived reader and producer policy selectors; do not launch ordinary work
        id: ordinary-preflight
        if: success() && inputs.scope != 'windows-normal-project-ui'
        timeout-minutes: 4
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-installed-native'
      - name: Bind the cheap same-inspector native prerequisite without a GUI or runtime
        id: ui-prerequisite-preflight
        if: success() && inputs.scope == 'windows-normal-project-ui'
        timeout-minutes: 2
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-normal-ui-prerequisite'
      - name: Observe prerequisites under the one original fresh ordinary account owner
        id: ui-prerequisite-owner
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-prerequisite-preflight.outcome == 'success'
        timeout-minutes: 4
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_WINDOWS_SOURCE_TREE: ${{ steps.ui-prerequisite-preflight.outputs.sourceTree }}
          MRK_WINDOWS_UI_APP_VERSION: ${{ steps.ui-prerequisite-preflight.outputs.appVersion }}
          MRK_WINDOWS_UI_OWNER_ARTIFACT: ${{ steps.ui-prerequisite-preflight.outputs.artifact }}
          MRK_WINDOWS_UI_OWNER_ARTIFACT_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.artifactSha256 }}
          MRK_WINDOWS_UI_REQUEST_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.requestSha256 }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $phase = 'binding'
          try {
            $expectedRoot = [System.IO.Path]::Combine($env:RUNNER_TEMP, "mrk-windows-installed-native-$($env:GITHUB_RUN_ID)-1")
            $expectedDeps = [System.IO.Path]::Combine($expectedRoot, 'target', 'x86_64-pc-windows-msvc', 'debug', 'deps')
            if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:MRK_DESKTOP_CI_ROOT -cne $expectedRoot -or
                $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:MRK_DESKTOP_DISPATCH_SCOPE -cne 'windows-normal-project-ui' -or
                $env:GITHUB_REF -cne 'refs/heads/verify/desktop-windows-normal-project-ui' -or
                $env:MRK_DESKTOP_EXPECTED_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or
                $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:MRK_WINDOWS_SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or
                [System.IO.Path]::GetDirectoryName($env:MRK_WINDOWS_UI_OWNER_ARTIFACT) -cne $expectedDeps -or
                [System.IO.Path]::GetFileName($env:MRK_WINDOWS_UI_OWNER_ARTIFACT) -cnotmatch '^mrk_windows_installed_native-[0-9a-f]{16}\.exe$' -or
                $env:MRK_WINDOWS_UI_OWNER_ARTIFACT_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:MRK_WINDOWS_UI_REQUEST_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:MRK_WINDOWS_UI_APP_VERSION -cnotmatch '^[0-9]{1,10}(\.[0-9]{1,10}){1,5}$' -or
                $env:MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME -cne 'success') { throw 'binding' }
            Set-Location -LiteralPath $expectedRoot
            $phase = 'original-owner'
            # One foreground original; no second process controller or detached timeout.
            & $env:MRK_WINDOWS_UI_OWNER_ARTIFACT ordinary_owner::hosted_normal_ui_prerequisite_original_handle_contract --exact --ignored --nocapture --test-threads=1
            $originalExitCode = $LASTEXITCODE
            if ($originalExitCode -isnot [int]) { throw 'original-exit' }
            $phase = 'exit-record'
            $receipt = [ordered]@{
              schemaVersion = 1; qualificationProfile = 'windows-normal-project-ui-v1'
              sourceSha = $env:GITHUB_SHA; sourceTree = $env:MRK_WINDOWS_SOURCE_TREE
              runId = $env:GITHUB_RUN_ID; attempt = 1; role = 'prerequisite'
              artifactSha256 = $env:MRK_WINDOWS_UI_OWNER_ARTIFACT_SHA256
              ownerArtifactSha256 = $env:MRK_WINDOWS_UI_OWNER_ARTIFACT_SHA256
              requestSha256 = $env:MRK_WINDOWS_UI_REQUEST_SHA256
              ownerTest = 'ordinary_owner::hosted_normal_ui_prerequisite_original_handle_contract'
              originalWaitReturned = $true; exitCode = $originalExitCode
              writerCloseGate = 'original-owner-step-success-required'
            }
            $raw = [System.Text.UTF8Encoding]::new($false, $true).GetBytes(($receipt | ConvertTo-Json -Depth 4 -Compress))
            if ($raw.Length -eq 0 -or $raw.Length -gt 4096) { throw 'exit-bound' }
            $path = [System.IO.Path]::Combine($expectedRoot, 'normal-ui-prerequisite-owner-exit.private.json')
            $stream = [System.IO.File]::Open($path, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try { $stream.Write($raw, 0, $raw.Length); $stream.Flush() } finally { $stream.Dispose() }
            $phase = 'expected-exit'
            if ($originalExitCode -ne 0) { throw 'expected-original-exit' }
            exit 0
          } catch {
            [Console]::Error.WriteLine("MRK_WINDOWS_NORMAL_UI_PREREQUISITE_REFUSED=phase=$phase")
            exit 1
          }
      - name: Validate independently closed prerequisite originals and preserve negative availability
        id: ui-prerequisite-finalize
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-prerequisite-owner.outcome == 'success'
        timeout-minutes: 2
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_OWNER_STEP_OUTCOME: ${{ steps.ui-prerequisite-owner.outcome }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-normal-ui-prerequisite-finalize'
      - name: Refuse GUI preparation when the genuine native prerequisite is unavailable
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable != 'true'
        shell: bash
        run: |
          printf '%s\n' 'MRK_WINDOWS_NORMAL_UI_PREREQUISITE_UNAVAILABLE=not-a-GUI-pass' >&2
          exit 1
      - name: Prepare the fixed runtime and setup graphs only after positive closed native prerequisites
        id: ui-setup-acquire
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-prerequisite-finalize.outcome == 'success' && steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable == 'true'
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_WINDOWS_UI_PREREQUISITES_AVAILABLE: ${{ steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_OWNER_STEP_OUTCOME: ${{ steps.ui-prerequisite-owner.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZE_STEP_OUTCOME: ${{ steps.ui-prerequisite-finalize.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_REQUEST_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.requestSha256 }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZER_SHA256: ${{ steps.ui-prerequisite-finalize.outputs.finalizerSha256 }}
          MRK_WINDOWS_UI_SETUP_ACQUIRE_STEP_OUTCOME: ${{ steps.ui-setup-acquire.outcome }}
          MRK_WINDOWS_UI_SETUP_COMPILE_STEP_OUTCOME: ${{ steps.ui-setup-compile.outcome }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-normal-ui-setup-acquire'
      - name: Compile distinct runtime-only setup and normal publisher; retain the original cheap UI owner
        id: ui-setup-compile
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-setup-acquire.outcome == 'success' && steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable == 'true'
        timeout-minutes: 12
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_WINDOWS_UI_PREREQUISITES_AVAILABLE: ${{ steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_OWNER_STEP_OUTCOME: ${{ steps.ui-prerequisite-owner.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZE_STEP_OUTCOME: ${{ steps.ui-prerequisite-finalize.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_REQUEST_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.requestSha256 }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZER_SHA256: ${{ steps.ui-prerequisite-finalize.outputs.finalizerSha256 }}
          MRK_WINDOWS_UI_SETUP_ACQUIRE_STEP_OUTCOME: ${{ steps.ui-setup-acquire.outcome }}
          MRK_WINDOWS_UI_SETUP_COMPILE_STEP_OUTCOME: ${{ steps.ui-setup-compile.outcome }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-normal-ui-setup-compile'
      - name: Bind the runtime-only precheck without claiming an app or GUI build
        id: ui-setup-preflight
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-setup-compile.outcome == 'success' && steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_WINDOWS_UI_PREREQUISITES_AVAILABLE: ${{ steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_OWNER_STEP_OUTCOME: ${{ steps.ui-prerequisite-owner.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZE_STEP_OUTCOME: ${{ steps.ui-prerequisite-finalize.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_REQUEST_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.requestSha256 }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZER_SHA256: ${{ steps.ui-prerequisite-finalize.outputs.finalizerSha256 }}
          MRK_WINDOWS_UI_SETUP_ACQUIRE_STEP_OUTCOME: ${{ steps.ui-setup-acquire.outcome }}
          MRK_WINDOWS_UI_SETUP_COMPILE_STEP_OUTCOME: ${{ steps.ui-setup-compile.outcome }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py windows-normal-ui-setup-preflight'
      - name: Stage the fresh UI runtime input with its distinct runtime-only original
        id: ui-setup-stage
        if: success() && inputs.scope == 'windows-normal-project-ui' && steps.ui-setup-preflight.outcome == 'success'
        timeout-minutes: 4
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          MRK_WINDOWS_UI_PREREQUISITES_AVAILABLE: ${{ steps.ui-prerequisite-finalize.outputs.prerequisitesAvailable }}
          MRK_WINDOWS_UI_PREREQUISITE_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-prerequisite-preflight.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_OWNER_STEP_OUTCOME: ${{ steps.ui-prerequisite-owner.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZE_STEP_OUTCOME: ${{ steps.ui-prerequisite-finalize.outcome }}
          MRK_WINDOWS_UI_PREREQUISITE_REQUEST_SHA256: ${{ steps.ui-prerequisite-preflight.outputs.requestSha256 }}
          MRK_WINDOWS_UI_PREREQUISITE_FINALIZER_SHA256: ${{ steps.ui-prerequisite-finalize.outputs.finalizerSha256 }}
          MRK_WINDOWS_UI_SETUP_ACQUIRE_STEP_OUTCOME: ${{ steps.ui-setup-acquire.outcome }}
          MRK_WINDOWS_UI_SETUP_COMPILE_STEP_OUTCOME: ${{ steps.ui-setup-compile.outcome }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_WINDOWS_SOURCE_TREE: ${{ steps.ui-setup-preflight.outputs.sourceTree }}
          MRK_WINDOWS_UI_SETUP_PRECHECK_SHA256: ${{ steps.ui-setup-preflight.outputs.precheckSha256 }}
          MRK_WINDOWS_UI_SETUP_PREFLIGHT_STEP_OUTCOME: ${{ steps.ui-setup-preflight.outcome }}
          MRK_WINDOWS_UI_SETUP_STAGE_STEP_OUTCOME: ${{ steps.ui-setup-stage.outcome }}
          MRK_WINDOWS_UI_SETUP_STAGE_FINALIZE_STEP_OUTCOME: ${{ steps.ui-setup-stage-finalize.outcome }}
          MRK_WINDOWS_UI_SETUP_PUBLISH_STEP_OUTCOME: ${{ steps.ui-setup-publish.outcome }}
          MRK_WINDOWS_UI_SETUP_PUBLISH_FINALIZE_STEP_OUTCOME: ${{ steps.ui-setup-publish-finalize.outcome }}
          MRK_WINDOWS_UI_SETUP_PUBLICATION_STEP_OUTCOME: ${{ steps.ui-setup-publication.outcome }}
          MRK_WINDOWS_UI_SETUP_PUBLICATION_FINALIZE_STEP_OUTCOME: ${{ steps.ui-setup-publication-finalize.outcome }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_WINDOWS_SETUP_ARTIFACT: ${{ steps.ui-setup-preflight.outputs.artifact }}
          MRK_WINDOWS_SETUP_ARTIFACT_SHA256: ${{ steps.ui-setup-preflight.outputs.artifactSha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $phase = 'binding'
          try {
            $expectedRoot = [System.IO.Path]::Combine($env:RUNNER_TEMP, "mrk-windows-installed-native-$($env:GITHUB_RUN_ID)-1")
            if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:MRK_DESKTOP_CI_ROOT -cne $expectedRoot -or
                $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:MRK_DESKTOP_DISPATCH_SCOPE -cne 'windows-normal-project-ui' -or
                $env:GITHUB_REF -cne 'refs/heads/verify/desktop-windows-normal-project-ui' -or
                $env:MRK_DESKTOP_EXPECTED_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or
                $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:MRK_WINDOWS_SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or
                $env:MRK_WINDOWS_SETUP_ARTIFACT_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:MRK_WINDOWS_UI_SETUP_PRECHECK_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:MRK_WINDOWS_UI_SETUP_PREFLIGHT_STEP_OUTCOME -cne 'success' -or
                $env:MRK_WINDOWS_UI_PREREQUISITES_AVAILABLE -cne 'true' -or
                $env:MRK_WINDOWS_UI_PREREQUISITE_FINALIZE_STEP_OUTCOME -cne 'success' -or
                $env:MRK_WINDOWS_UI_PREREQUISITE_REQUEST_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:MRK_WINDOWS_UI_PREREQUISITE_FINALIZER_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'binding' }
            $expectedDeps = [System.IO.Path]::Combine($expectedRoot, 'target', 'x86_64-pc-windows-msvc', 'debug', 'deps')
            if ([System.IO.Path]::GetDirectoryName($env:MRK_WINDOWS_SETUP_ARTIFACT) -cne $expectedDeps -or
                [System.IO.Path]::GetFileName($env:MRK_WINDOWS_SETUP_ARTIFACT) -cnotmatch '^mrk_windows_installed_native-[0-9a-f]{16}\.exe$') { throw 'artifact' }

            Set-Location -LiteralPath $expectedRoot
            $phase = 'original-invocation'
            # One fixed direct foreground original. No Process object, redirected pipe, retry or kill wrapper.
            & $env:MRK_WINDOWS_SETUP_ARTIFACT qualification_fixture::hosted_stage_normal_ui_runtime_input --exact --ignored --nocapture --test-threads=1
            $originalExitCode = $LASTEXITCODE
            $phase = 'original-return'
            if ($originalExitCode -isnot [int]) { throw 'original-exit' }
            $command = '"' + $env:MRK_WINDOWS_SETUP_ARTIFACT + '" qualification_fixture::hosted_stage_normal_ui_runtime_input --exact --ignored --nocapture --test-threads=1'
            $commandSha256 = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::Unicode.GetBytes($command))).ToLowerInvariant()
            $lines = @(
              'MRK_WINDOWS_NORMAL_UI_SETUP_EXIT_V1'
              'profile=windows-normal-project-ui-v1'
              "sourceSha=$($env:GITHUB_SHA)"
              "sourceTree=$($env:MRK_WINDOWS_SOURCE_TREE)"
              "runId=$($env:GITHUB_RUN_ID)"
              'attempt=1'
              'role=stage'
              "artifactSha256=$($env:MRK_WINDOWS_SETUP_ARTIFACT_SHA256)"
              "precheckSha256=$($env:MRK_WINDOWS_UI_SETUP_PRECHECK_SHA256)"
              "commandSha256=$commandSha256"
              'originalWaitReturned=true'
              "exitCode=$originalExitCode"
              'writerCloseGate=original-stage-step-success-required'
            )
            $raw = [System.Text.UTF8Encoding]::new($false, $true).GetBytes(($lines -join "`n") + "`n")
            if ($raw.Length -eq 0 -or $raw.Length -gt 4096) { throw 'exit-bound' }
            $phase = 'exit-record'
            $path = [System.IO.Path]::Combine($expectedRoot, 'normal-ui-setup-stage-exit.private.txt')
            $stream = [System.IO.File]::Open($path, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try { $stream.Write($raw, 0, $raw.Length); $stream.Flush() } finally { $stream.Dispose() }
