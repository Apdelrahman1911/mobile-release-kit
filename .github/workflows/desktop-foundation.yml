                $env:MRK_DESKTOP_EXPECTED_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or
                $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:MRK_WINDOWS_SOURCE_TREE -cnotmatch '^[0-9a-f]{40}$' -or
