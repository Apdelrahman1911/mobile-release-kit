          native_scopes = ("project-fields", "ios-current-synthetic", "android-inputs", "vault-helper-shipping", "installation-inspection", "project-recovery-pending", "ios-recovery-pending", "doctor-preflight2", "local-edits3")
          root = pathlib.Path(os.environ["MRK_MACOS_WORK"])
          parent = pathlib.Path(os.environ["RUNNER_TEMP"])
          if root.parent != parent or not root.name.startswith("mrk-macos-aqua."): raise ValueError("fixed work root required")
          held = root.lstat()
          if not stat.S_ISDIR(held.st_mode) or held.st_uid != os.getuid() or held.st_mode & 0o077: raise ValueError("owned private work root required")
          def sig(s):
              return (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
          def snapshot(name, limit, tail=False):
              # One finite read of an original leaf; never wait for a writer,
              # repair/truncate its output, or treat a stable snapshot as finality.
              fd = None
              try:
                  fd = os.open(root / name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid != os.getuid() or before.st_mode & 0o022: raise ValueError("original leaf refused")
                  if before.st_size > limit and not tail:
                      return None, {"state": "over-limit", "observedBytes": before.st_size, "limitBytes": limit}
