          native_scopes = ("project-fields", "ios-current-synthetic", "android-inputs", "vault-helper-shipping", "installation-inspection", "project-recovery-pending", "ios-recovery-pending", "doctor-preflight2", "local-edits3")
          root = pathlib.Path(os.environ["MRK_MACOS_WORK"])
          parent = pathlib.Path(os.environ["RUNNER_TEMP"])
