name: Desktop macOS genuine Aqua engineering verification

on:
  push:
    branches:
      - verify/desktop-macos-aqua

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-aqua-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aqua:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-aqua'
    name: aqua-${{ matrix.scope }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scope:
          - installation-inspection
    runs-on: macos-26
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      # Exact independently accepted current-payload DATA; not native qualification.
      MRK_BUNDLED_RUNTIME_MANIFEST_SHA256: eeffc3f53fce1fba444fdcf9d036207b27c4a00f58eb73cf890c7ec1b680be29
      MRK_BUNDLED_RUNTIME_SOURCE_SHA256: 6094ba0dffbc44f14017a2c992a8eac1de1bf42c102d7d25639419e07c1747bb
      MRK_BUNDLED_PROTOCOL_SHA256: 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5
      # Independent immutable publisher bindings; caller hashes come from build.rs.
      MRK_GITHUB_PREFLIGHT_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MRK_GITHUB_RELEASE_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      # Share one engineering installation; each selected journey keeps its original owner/results.
      MRK_MACOS_AQUA_SCOPE: ${{ matrix.scope }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only this exact disposable-hosted source route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$MRK_MACOS_AQUA_SCOPE" == project-fields || "$MRK_MACOS_AQUA_SCOPE" == ios-current-synthetic || "$MRK_MACOS_AQUA_SCOPE" == xcode-installed-classification || "$MRK_MACOS_AQUA_SCOPE" == android-inputs || "$MRK_MACOS_AQUA_SCOPE" == project-fields-android-inputs || "$MRK_MACOS_AQUA_SCOPE" == vault-helper-shipping || "$MRK_MACOS_AQUA_SCOPE" == installation-inspection || "$MRK_MACOS_AQUA_SCOPE" == vault-helper-shipping-installation-inspection || "$MRK_MACOS_AQUA_SCOPE" == wrapping-keychain-private ]] || exit 1
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]] || exit 1
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-macos-aqua ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-aqua.yml@$GITHUB_REF" ]] || exit 1
          [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == arm64 && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/id -u)" != 0 ]] || exit 1
          if [[ "$MRK_MACOS_AQUA_SCOPE" != xcode-installed-classification && "$MRK_MACOS_AQUA_SCOPE" != wrapping-keychain-private ]]; then
            # Supplier/CLT admission belongs only to the unchanged build routes.
            [[ "$MRK_BUNDLED_RUNTIME_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_MANIFEST_SHA256" == eeffc3f53fce1fba444fdcf9d036207b27c4a00f58eb73cf890c7ec1b680be29 ]] || exit 1
            [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == 6094ba0dffbc44f14017a2c992a8eac1de1bf42c102d7d25639419e07c1747bb ]] || exit 1
            [[ -d "$DEVELOPER_DIR" ]] || exit 1
          fi
      - name: Check out exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the pinned Apple Instant clock toolchain
        if: success() && (env.MRK_MACOS_AQUA_SCOPE == 'project-fields' || env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic' || env.MRK_MACOS_AQUA_SCOPE == 'android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'project-fields-android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping' || env.MRK_MACOS_AQUA_SCOPE == 'installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping-installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'wrapping-keychain-private')
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin --no-self-update
          rustc --version --verbose
      - name: Select DATA stager Python, not the packaged interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Reserve fresh private work before every candidate and toolchain query
        id: work
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ ! -e desktop/node_modules && ! -L desktop/node_modules && ! -e desktop/dist && ! -L desktop/dist ]] || exit 1
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-aqua.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$root" >> "$GITHUB_ENV"
      - name: Bind the complete reviewed first-party checkout before compilation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$MRK_MACOS_WORK/source-inventory.json" <<'PY_SOURCE'
          import hashlib, json, os, stat, subprocess, sys
          def git(*args):
              return subprocess.run(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null", *args], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15).stdout
          rows = git("ls-tree", "-r", "-z", "--full-tree", "HEAD").split(b"\0")
          if rows[-1] or len(rows) > 4096: raise ValueError("tracked inventory bound")
          files = []
          for row in rows[:-1]:
              header, raw_name = row.split(b"\t", 1)
              mode, kind, blob = header.split(b" ")
              name = raw_name.decode("utf-8", "strict")
              if kind != b"blob" or mode not in (b"100644", b"100755") or any(p in ("", ".", "..") for p in name.split("/")): raise ValueError("tracked inventory path/type")
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 32 * 1024 * 1024: raise ValueError("tracked input refused")
                  digest = hashlib.sha256()
                  size = 0
                  while block := os.read(fd, 65536):
                      size += len(block)
                      if size > before.st_size: raise ValueError("tracked input grew")
                      digest.update(block)
                  after = os.fstat(fd)
                  sig = lambda s: (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  if size != before.st_size or sig(before) != sig(after) or sig(after) != sig(os.stat(name, follow_symlinks=False)): raise ValueError("tracked input changed")
              finally:
                  os.close(fd)
              files.append({"path": name, "gitMode": mode.decode(), "blob": blob.decode(), "size": size, "sha256": digest.hexdigest()})
          value = {"source": os.environ["GITHUB_SHA"], "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 2 * 1024 * 1024: raise ValueError("source inventory output bound")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
              stream.flush()
              os.fsync(stream.fileno())
          PY_SOURCE
      - name: Classify installed Xcode originals without preparing or selecting a toolchain
        if: success() && env.MRK_MACOS_AQUA_SCOPE == 'xcode-installed-classification'
        timeout-minutes: 2
        # Empty environment before even this noninteractive shell starts. The
        # second env -i carries only provider-owned, fixed-route inputs into
        # the nonroot DATA Python; no loader/shell/tool override survives.
        shell: /usr/bin/env -i /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd /Users/runner/work/mobile-release-kit/mobile-release-kit
          # Match the real-UID CF default before Python/native imports; never
          # inherit an ambient encoding or consult the runner's preferences.
          printf -v mrk_cf_encoding '0x%X:0:0' "$UID"
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            HOME='${{ steps.work.outputs.root }}' LANG=C LC_ALL=C TZ=UTC \
            __CF_USER_TEXT_ENCODING="$mrk_cf_encoding" \
            RUNNER_ENVIRONMENT='${{ runner.environment }}' \
            RUNNER_OS='${{ runner.os }}' RUNNER_ARCH='${{ runner.arch }}' \
            RUNNER_TEMP='${{ runner.temp }}' \
            GITHUB_REPOSITORY='${{ github.repository }}' \
            GITHUB_EVENT_NAME='${{ github.event_name }}' GITHUB_REF='${{ github.ref }}' \
            GITHUB_SHA='${{ github.sha }}' GITHUB_WORKFLOW_SHA='${{ github.workflow_sha }}' \
            GITHUB_WORKFLOW_REF='${{ github.workflow_ref }}' \
            GITHUB_RUN_ID='${{ github.run_id }}' GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' \
            GITHUB_JOB='${{ github.job }}' GITHUB_WORKSPACE='${{ github.workspace }}' \
            MRK_EXPECTED_SHA='${{ github.sha }}' \
            MRK_MACOS_INSTALL_SOURCE_COMMIT='${{ github.sha }}' \
            MRK_MACOS_WORK='${{ steps.work.outputs.root }}' \
            '${{ steps.python.outputs.python-path }}' -I -S -B \
            /Users/runner/work/mobile-release-kit/mobile-release-kit/desktop/tools/macos_xcode_host_preparation.py --classify-installed
          # The genuine step exit is the final-close result. The immutable
          # classification JSON is provisional and never preparation/iOS authority.
      - name: Prepare only the fixed disposable Xcode ancestor before any worker
        if: success() && env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic'
        timeout-minutes: 2
        # Empty environment before even this noninteractive shell starts. The
        # second env -i carries only provider-owned, fixed-route inputs into
        # the nonroot DATA Python; no loader/shell/tool override survives.
        shell: /usr/bin/env -i /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd /Users/runner/work/mobile-release-kit/mobile-release-kit
          # Match the real-UID CF default before Python/native imports; never
          # inherit an ambient encoding or consult the runner's preferences.
          printf -v mrk_cf_encoding '0x%X:0:0' "$UID"
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            HOME='${{ steps.work.outputs.root }}' LANG=C LC_ALL=C TZ=UTC \
            __CF_USER_TEXT_ENCODING="$mrk_cf_encoding" \
            RUNNER_ENVIRONMENT='${{ runner.environment }}' \
            RUNNER_OS='${{ runner.os }}' RUNNER_ARCH='${{ runner.arch }}' \
            RUNNER_TEMP='${{ runner.temp }}' \
            GITHUB_REPOSITORY='${{ github.repository }}' \
            GITHUB_EVENT_NAME='${{ github.event_name }}' GITHUB_REF='${{ github.ref }}' \
            GITHUB_SHA='${{ github.sha }}' GITHUB_WORKFLOW_SHA='${{ github.workflow_sha }}' \
            GITHUB_WORKFLOW_REF='${{ github.workflow_ref }}' \
            GITHUB_RUN_ID='${{ github.run_id }}' GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' \
            GITHUB_JOB='${{ github.job }}' GITHUB_WORKSPACE='${{ github.workspace }}' \
            MRK_EXPECTED_SHA='${{ github.sha }}' \
            MRK_MACOS_INSTALL_SOURCE_COMMIT='${{ github.sha }}' \
            MRK_MACOS_WORK='${{ steps.work.outputs.root }}' \
            '${{ steps.python.outputs.python-path }}' -I -S -B \
            /Users/runner/work/mobile-release-kit/mobile-release-kit/desktop/tools/macos_xcode_host_preparation.py
          # Only this original helper's exit0 after every final close admits
          # later steps. Its immutable JSON is explicitly provisional, not a
          # substitute for workflow status. Never restore0775 before VM disposal.
      - name: Select fixed frontend compiler
        if: success() && (env.MRK_MACOS_AQUA_SCOPE == 'project-fields' || env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic' || env.MRK_MACOS_AQUA_SCOPE == 'android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'project-fields-android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping' || env.MRK_MACOS_AQUA_SCOPE == 'installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping-installation-inspection')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Record exact source and actual tool bindings only after route admission
        if: success() && (env.MRK_MACOS_AQUA_SCOPE == 'project-fields' || env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic' || env.MRK_MACOS_AQUA_SCOPE == 'android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'project-fields-android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping' || env.MRK_MACOS_AQUA_SCOPE == 'installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping-installation-inspection')
        shell: bash
        run: |
          set -euo pipefail
          "$MRK_PYTHON" -I -S -B - "$MRK_MACOS_WORK/source-binding.json" <<'PY'
          import json, os, subprocess, sys
          aqua_scope = os.environ["MRK_MACOS_AQUA_SCOPE"]
          scope_cases = {"project-fields": ("one-project-fields-Aqua-engineering-case", ["project-fields"]),
                         "android-inputs": ("one-android-inputs-Aqua-engineering-case", ["android-inputs"]),
                         "vault-helper-shipping": ("three-shipping-helper-original-Aqua-engineering-cases", ["vault-helper-roundtrip", "vault-helper-stop-before-go", "vault-helper-stop-after-add"]),
                         "installation-inspection": ("one-installation-inspection-Aqua-engineering-case", ["installation-inspection"]),
                         "vault-helper-shipping-installation-inspection": ("four-shipping-helper-and-installation-Aqua-engineering-cases", ["vault-helper-roundtrip", "vault-helper-stop-before-go", "vault-helper-stop-after-add", "installation-inspection"]),
                         "project-fields-android-inputs": ("two-project-fields-and-android-inputs-Aqua-engineering-cases", ["project-fields", "android-inputs"]),
                         "ios-current-synthetic": ("nine-current-ios-Aqua-engineering-cases", ["ios-toolchain-prerequisite", "ios-version-stale", "ios-unsigned-archive", "ios-cancel", "ios-finality", "ios-signing-inputs", "ios-signed-refusal", "ios-signed-cancel", "ios-recovery-empty"])}
          if aqua_scope not in scope_cases: raise ValueError("Aqua scope refused")
          scope_label, case_names = scope_cases[aqua_scope]
          selected_scopes = ["project-fields", "android-inputs"] if aqua_scope == "project-fields-android-inputs" else ["vault-helper-shipping", "installation-inspection"] if aqua_scope == "vault-helper-shipping-installation-inspection" else [aqua_scope]
          native_scopes = ("project-fields", "ios-current-synthetic", "android-inputs", "vault-helper-shipping", "installation-inspection")
          tools = {}
          for name, command in (
              ("rustc", ["rustc", "--version", "--verbose"]),
              ("cargo", ["cargo", "--version", "--verbose"]),
              ("cltSdkPath", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-path"]),
              ("cltSdkVersion", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-version"]),
              ("cltSdkBuild", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-build-version"]),
              ("cltCompiler", ["/usr/bin/xcrun", "--sdk", "macosx", "clang", "--version"]),
              ("node", ["node", "--version"]),
              ("python", [sys.executable, "-I", "-S", "-B", "--version"]),
          ):
              result = subprocess.run(command, cwd="desktop" if name in ("rustc", "cargo") else None,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True, timeout=15)
              if not result.stdout or len(result.stdout) > 4096: raise ValueError("tool version output refused")
              tools[name] = {"command": command, "output": result.stdout.decode("utf-8", "strict").strip()}
          value = {"schemaVersion": 1, "source": os.environ["GITHUB_SHA"], "workflowSource": os.environ["GITHUB_WORKFLOW_SHA"],
                   "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "runtimeManifestSha256": os.environ["MRK_BUNDLED_RUNTIME_MANIFEST_SHA256"],
                    "runtimeSourceInputsSha256": os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"],
                    "githubPreflightToolingSha": os.environ["MRK_GITHUB_PREFLIGHT_TOOLING_SHA"],
                    "githubReleaseToolingSha": os.environ["MRK_GITHUB_RELEASE_TOOLING_SHA"],
                    "reusedRun": "35602474108/1", "reusedArtifactId": "10639324707",
                    "reusedSupplierOnly": True,
                   "scope": scope_label, "instrumentedEngineeringApp": True,
                   "scopes": selected_scopes, "caseNames": case_names,
                   "unselectedScopes": [scope for scope in native_scopes if scope not in selected_scopes],
                   "developerDir": os.environ["DEVELOPER_DIR"], "tools": tools,
                   "actualAquaSaveGate": "not-yet-executed", "shippingBinaryQualified": False, "distributionQualified": False}
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 65536: raise ValueError("source/tool binding size refused")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          try:
              while data:
                  n = os.write(fd, data)
                  if not n: raise RuntimeError("write refused")
                  data = data[n:]
              os.fsync(fd)
          finally: os.close(fd)
          PY
      - name: Check current owner pins before native preparation
        if: success() && (env.MRK_MACOS_AQUA_SCOPE == 'project-fields' || env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic' || env.MRK_MACOS_AQUA_SCOPE == 'android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'project-fields-android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping' || env.MRK_MACOS_AQUA_SCOPE == 'installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping-installation-inspection')
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          "$MRK_PYTHON" -I -S -B - <<'PY_OWNER_PINS'
          import importlib.util, pathlib, sys, unittest
          path = pathlib.Path("tests/desktop/test_macos_aqua_qualification.py").absolute()
          spec = importlib.util.spec_from_file_location("_mrk_macos_owner_pin_preflight", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          roster_path = pathlib.Path("tests/desktop/test_installed_shell_ci.py").absolute()
          roster_spec = importlib.util.spec_from_file_location("_mrk_macos_observer_roster_preflight", roster_path)
          roster_module = importlib.util.module_from_spec(roster_spec)
          sys.modules[roster_spec.name] = roster_module
          roster_spec.loader.exec_module(roster_module)
          suite = unittest.TestSuite([
              module.AquaDataTests("test_current_owner_pins_match_checkout_and_refuse_stale_before_import"),
              module.IOSAquaDataTests("test_normal_macos_selection_is_original_bound_without_observer_grants"),
              module.CurrentIOSAquaDataTests("test_current_reports_are_closed_bounded_and_do_not_claim_successful_signing"),
              module.CurrentIOSAquaDataTests("test_file_originals_and_retained_signing_records_cannot_be_substituted"),
              module.ProjectFieldsAquaDataTests("test_complete_project_fields_report_is_bounded_and_fail_closed"),
              module.ProjectFieldsAquaDataTests("test_original_fixture_restoration_has_only_two_ctime_exceptions"),
              roster_module.InstalledShellCompilerContracts("test_observer_module_roster_matches_production_supported_platforms"),
          ])
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          if (result.testsRun != 7 or not result.wasSuccessful()
                  or any((result.failures, result.errors, result.skipped, result.expectedFailures, result.unexpectedSuccesses))):
              raise SystemExit(1)
          PY_OWNER_PINS
      - name: Compile headless Mac libraries and run twenty-seven exact DATA regressions first
        if: success() && (env.MRK_MACOS_AQUA_SCOPE == 'project-fields' || env.MRK_MACOS_AQUA_SCOPE == 'ios-current-synthetic' || env.MRK_MACOS_AQUA_SCOPE == 'android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'project-fields-android-inputs' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping' || env.MRK_MACOS_AQUA_SCOPE == 'installation-inspection' || env.MRK_MACOS_AQUA_SCOPE == 'vault-helper-shipping-installation-inspection')
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          # Cargo must see desktop/rust-toolchain.toml, not the host default.
          cd desktop/src-tauri
          set +e
          # The same locked graph builds both existing native DATA regressions.
          cargo test --locked --no-default-features --jobs 2 --target aarch64-apple-darwin \
            --package mobile-release-kit-desktop --package mrk-macos-installed-native \
            --lib --no-run --message-format=json \
