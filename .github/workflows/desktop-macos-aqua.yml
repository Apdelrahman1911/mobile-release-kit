      - name: Preserve bounded classification DATA and original workflow exit evidence
        if: always() && env.MRK_MACOS_AQUA_SCOPE == 'xcode-installed-classification' && steps.source.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-aqua-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-xcode-installed-classification
          path: |
            ${{ steps.work.outputs.root }}/source-inventory.json
            ${{ steps.work.outputs.root }}/xcode-installed-classification-result.json
          if-no-files-found: error
          retention-days: 7
