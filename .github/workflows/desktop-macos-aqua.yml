              ("headless-build.stderr", "headless-build.status", 64 * 1024, "headless-build.stderr.tail.txt", True),
              ("observer-build.jsonl", "observer-build.status", 4 * 1024 * 1024, "observer-build.admitted.jsonl", False),
              ("observer-build.stderr", "observer-build.status", 64 * 1024, "observer-build.stderr.tail.txt", True),
