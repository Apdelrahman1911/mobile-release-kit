          admitted_scopes = ("project-fields", "ios-current-synthetic", "android-inputs", "project-fields-android-inputs", "vault-helper-shipping", "installation-inspection", "vault-helper-shipping-installation-inspection", "android-registration-lifecycle", "project-recovery-pending", "ios-recovery-pending", "doctor-preflight2", "local-edits3")
