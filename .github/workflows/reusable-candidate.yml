name: Reusable internal mobile candidate

on:
  workflow_call:
    inputs:
      tooling_sha:
        description: Immutable mobile-release-kit commit used by this caller.
        required: true
        type: string
      source_sha:
        description: Exact application commit to build once.
        required: true
        type: string
      platform:
        description: android, ios, or both.
        required: true
        type: string
      confirmation:
        description: candidate:<platform>:<version>:<build>; use platform both when selecting both.
        required: true
        type: string
permissions: {}

env:
  FASTLANE_HIDE_CHANGELOG: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  PYTHONPATH: ${{ github.workspace }}/tooling/src
  PYTHONSAFEPATH: '1'

concurrency:
  group: mobile-release-store-mutations
  cancel-in-progress: false

jobs:
  validate-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject unsupported platform input
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]

  android_online:
    needs: validate-platform
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-candidate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate immutable workflow authority
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Check out application source without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify exact source and tooling checkouts
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned Ruby dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: tooling
      - name: Authenticate to Google Play for non-publishing online gate
        id: google_online_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MOBILE_RELEASE_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.MOBILE_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Restrict online-gate Google credential file
        env:
          MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_online_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
            *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
          esac
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          chmod 600 -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
          [[ "$(stat -c '%a' -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH")" == '600' ]]
      - name: Check Android Store state without running application commands
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
          MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
          MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
          MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_PREFLIGHT_READBACK_PATH: .mobile-release/store/preflight-android.json
        run: |
          set -euo pipefail
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          python -P -m mobile_release preflight \
            --config release/mobile-release.json \
            --online \
            --platform android \
            --credentials-from-env \
            --format json \
            --output .mobile-release/reports/online-android.json
      - name: Remove online-gate Google Play credentials
        if: ${{ always() && steps.google_online_auth.outcome == 'success' }}
        env:
          MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_online_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
            *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
          esac
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          rm -f -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
          [[ ! -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]

  android_build:
    needs: android_online
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mobile-candidate
    permissions:
      contents: read
    outputs:
      handoff_digest: ${{ steps.upload_handoff.outputs['artifact-digest'] }}
    steps:
      - name: Validate immutable workflow authority
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify exact source and tooling trees
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          git -C app rev-parse 'HEAD^{tree}'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Diagnose Android configuration
        working-directory: app
        run: >-
          python -P -m mobile_release doctor
          --config release/mobile-release.json
          --platform android
          --format json
          --output .mobile-release/reports/doctor-android.json
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle without cross-run caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true
      - name: Install pinned bundletool
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --status
          echo "MOBILE_RELEASE_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - name: Build, sign, and validate Android candidate without Store authority
        working-directory: app
        env:
          MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD }}
          MOBILE_RELEASE_ANDROID_KEY_ALIAS: ${{ vars.MOBILE_RELEASE_ANDROID_KEY_ALIAS }}
          MOBILE_RELEASE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEY_PASSWORD }}
          MOBILE_RELEASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_RELEASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          MOBILE_RELEASE_PROJECT_READ_TOKEN: ${{ secrets.MOBILE_RELEASE_PROJECT_READ_TOKEN }}
        run: >-
          python -P -m mobile_release preflight
          --config release/mobile-release.json
          --signing
          --run-builds
          --platform android
          --credentials-from-env
          --format json
          --output .mobile-release/reports/signing-android.json
      - name: Normalize and checksum the signed Android handoff
        working-directory: app
        run: |
          set -euo pipefail
          source_dir=.mobile-release/build/android
          target_dir=.mobile-release/handoff/android
          [[ -f "$source_dir/app-release.aab" && ! -L "$source_dir/app-release.aab" ]]
          output_root="$(cd .mobile-release && pwd -P)"
          [[ ! -e .mobile-release/handoff && ! -L .mobile-release/handoff ]]
          mkdir .mobile-release/handoff "$target_dir"
          [[ ! -L "$target_dir" && "$(cd "$target_dir" && pwd -P)" == "$output_root/handoff/android" ]]
          cp "$source_dir/app-release.aab" "$target_dir/app-release.aab"
          files=(app-release.aab validation-report.json)
          if [[ -f "$source_dir/mapping.txt" && ! -L "$source_dir/mapping.txt" ]]; then
            cp "$source_dir/mapping.txt" "$target_dir/mapping.txt"
            files+=(mapping.txt)
          fi
          if [[ -f "$source_dir/native-symbols.zip" && ! -L "$source_dir/native-symbols.zip" ]]; then
            cp "$source_dir/native-symbols.zip" "$target_dir/native-symbols.zip"
            files+=(native-symbols.zip)
          fi
          cp .mobile-release/reports/signing-android.json "$target_dir/validation-report.json"
          (cd "$target_dir" && sha256sum "${files[@]}") > "$target_dir/SHA256SUMS"
          (cd "$target_dir" && sha256sum --check --strict --status SHA256SUMS)
          [[ -z "$(find "$target_dir" -mindepth 1 ! -type f -print -quit)" ]]
      - name: Upload immutable same-run Android handoff
        id: upload_handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-handoff-android
          path: app/.mobile-release/handoff/android
          if-no-files-found: error
          retention-days: 1

  android_store:
    needs: android_build
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mobile-candidate
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Validate immutable workflow and handoff authority
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
          MOBILE_RELEASE_HANDOFF_DIGEST: ${{ needs.android_build.outputs.handoff_digest }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_HANDOFF_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out application source without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify same-run Android handoff artifact receipt
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RELEASE_HANDOFF_DIGEST: ${{ needs.android_build.outputs.handoff_digest }}
          MOBILE_RELEASE_HANDOFF_NAME: mobile-release-candidate-handoff-android
        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$MOBILE_RELEASE_HANDOFF_NAME&per_page=100")"
          jq -e \
            --arg name "$MOBILE_RELEASE_HANDOFF_NAME" \
            --arg digest "sha256:$MOBILE_RELEASE_HANDOFF_DIGEST" \
            '.total_count == 1 and (.artifacts | length) == 1 and
             .artifacts[0].name == $name and .artifacts[0].digest == $digest and
             (.artifacts[0].expired == false)' \
            <<<"$response" >/dev/null
      - name: Download fixed same-run Android handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-release-candidate-handoff-android
          path: app/.mobile-release/artifacts/android
      - name: Verify exact handoff bytes and safe layout
        working-directory: app
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          handoff=.mobile-release/artifacts/android
          [[ -d "$handoff" && ! -L "$handoff" ]]
          [[ -f "$handoff/app-release.aab" && ! -L "$handoff/app-release.aab" ]]
          [[ -f "$handoff/validation-report.json" && ! -L "$handoff/validation-report.json" ]]
          [[ -f "$handoff/SHA256SUMS" && ! -L "$handoff/SHA256SUMS" ]]
          [[ -z "$(find "$handoff" -mindepth 1 ! -type f -print -quit)" ]]
          [[ -z "$(find "$handoff" -mindepth 1 -maxdepth 1 -type f \
            ! -name app-release.aab ! -name mapping.txt ! -name native-symbols.zip \
            ! -name validation-report.json ! -name SHA256SUMS -print -quit)" ]]
          (cd "$handoff" && sha256sum --check --strict --status SHA256SUMS)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up Java for independent AAB signature inspection
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned bundletool for independent AAB inspection
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --status
          echo "MOBILE_RELEASE_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - name: Set up pinned Ruby dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: tooling
      - name: Authenticate to Google Play for candidate upload only
        id: google_upload_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.MOBILE_RELEASE_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.MOBILE_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Restrict candidate-upload Google credential file
        env:
          MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_upload_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
            *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
          esac
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          chmod 600 -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
          [[ "$(stat -c '%a' -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH")" == '600' ]]
      - name: Revalidate, upload once, and read back the Android candidate
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
          MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
          MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
          MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_STORE_RECEIPT_PATH: .mobile-release/store/android-internal.json
          MOBILE_RELEASE_ANDROID_AAB_PATH: .mobile-release/artifacts/android/app-release.aab
          MOBILE_RELEASE_CI_MUTATIONS_ALLOWED: 'true'
          MOBILE_RELEASE_ENVIRONMENT: mobile-candidate
          MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          confirmation="$MOBILE_RELEASE_CONFIRMATION"
          if [[ "$MOBILE_RELEASE_SELECTED_PLATFORM" == "both" ]]; then
            confirmation="${confirmation/:both:/:android:}"
          fi
          args=(
            --config release/mobile-release.json
            --platform android
            --output-dir .mobile-release/staging/candidate/android
            --confirm "$confirmation"
            --artifact android-aab=.mobile-release/artifacts/android/app-release.aab
            --artifact validation-report=.mobile-release/artifacts/android/validation-report.json
            --execute-store
          )
          if [[ -f .mobile-release/artifacts/android/mapping.txt ]]; then
            export MOBILE_RELEASE_ANDROID_MAPPING_PATH=.mobile-release/artifacts/android/mapping.txt
            args+=(--artifact android-mapping=.mobile-release/artifacts/android/mapping.txt)
          fi
          if [[ -f .mobile-release/artifacts/android/native-symbols.zip ]]; then
            args+=(--artifact android-native-symbols=.mobile-release/artifacts/android/native-symbols.zip)
          fi
          python -P -m mobile_release ci candidate "${args[@]}"
      - name: Remove candidate-upload Google Play credentials
        if: ${{ always() && steps.google_upload_auth.outcome == 'success' }}
        env:
          MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_upload_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
            *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
          esac
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          rm -f -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
          [[ ! -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          {
            echo 'GOOGLE_APPLICATION_CREDENTIALS='
            echo 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='
            echo 'GOOGLE_GHA_CREDS_PATH='
          } >> "$GITHUB_ENV"
      - name: Validate and package Android candidate evidence
        working-directory: app
        run: |
          set -euo pipefail
          python -P -m mobile_release status \
            --config release/mobile-release.json \
            --candidate-manifest .mobile-release/staging/candidate/android/candidate-manifest.json \
            --receipt .mobile-release/staging/candidate/android/candidate-receipt.json \
            --format json > .mobile-release/reports/status-android.json
          mkdir -p .mobile-release/manifests/candidate .mobile-release/receipts/candidate .mobile-release/package/evidence/android
          cp .mobile-release/staging/candidate/android/candidate-manifest.json .mobile-release/manifests/candidate/android.json
          cp .mobile-release/staging/candidate/android/candidate-receipt.json .mobile-release/receipts/candidate/android.json
          cp .mobile-release/staging/candidate/android/candidate-manifest.json .mobile-release/package/evidence/android/candidate-manifest.json
          cp .mobile-release/staging/candidate/android/candidate-receipt.json .mobile-release/package/evidence/android/candidate-receipt.json
          cp .mobile-release/store/android-internal.json .mobile-release/package/evidence/android/store-receipt.json
          cp .mobile-release/reports/status-android.json .mobile-release/package/evidence/android/status.json
          metadata_sha256="$(jq -er '.artifacts[] | select(.logicalName == "store-metadata") | .sha256' .mobile-release/staging/candidate/android/candidate-manifest.json)"
          echo "$metadata_sha256  .mobile-release/staging/candidate/android/store-metadata.zip" | sha256sum --check --status
          cp .mobile-release/staging/candidate/android/store-metadata.zip .mobile-release/artifacts/android/store-metadata.zip
          echo "$metadata_sha256  .mobile-release/artifacts/android/store-metadata.zip" | sha256sum --check --status
      - name: Attest Android candidate manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/package/evidence/android/candidate-manifest.json
      - name: Attest Android candidate receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/package/evidence/android/candidate-receipt.json
      - name: Upload Android candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-evidence-android
          path: app/.mobile-release/package/evidence/android
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Attest exact signed Android candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/artifacts/android/app-release.aab
      - name: Retain signed Android candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-binaries-android
          path: app/.mobile-release/artifacts/android
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  ios_online:
    needs: validate-platform
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 15
    environment: mobile-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: read
    steps:
      - name: Validate immutable workflow authority
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Verify pinned Apple toolchain
        run: |
          set -euo pipefail
          [[ -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]]
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.3" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version 17C529" ]]
      - name: Check out application source without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify exact source and tooling checkouts
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned Ruby dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: tooling
      - name: Check iOS Store state without running application commands
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
          MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
          MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
          MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_PREFLIGHT_READBACK_PATH: .mobile-release/store/preflight-ios.json
          MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64 }}
          MOBILE_RELEASE_ASC_KEY_ID: ${{ vars.MOBILE_RELEASE_ASC_KEY_ID }}
          MOBILE_RELEASE_ASC_ISSUER_ID: ${{ vars.MOBILE_RELEASE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          python -P -m mobile_release preflight \
            --config release/mobile-release.json \
            --online \
            --platform ios \
            --credentials-from-env \
            --format json \
            --output .mobile-release/reports/online-ios.json

  ios_build:
    needs: ios_online
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 120
    environment: mobile-candidate
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: read
    outputs:
      handoff_digest: ${{ steps.upload_handoff.outputs['artifact-digest'] }}
    steps:
      - name: Validate immutable workflow authority
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Verify pinned Apple toolchain
        run: |
          set -euo pipefail
          [[ -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]]
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.3" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version 17C529" ]]
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify exact source and tooling trees
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          git -C app rev-parse 'HEAD^{tree}'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Diagnose iOS configuration
        working-directory: app
        run: >-
          python -P -m mobile_release doctor
          --config release/mobile-release.json
          --platform ios
          --format json
          --output .mobile-release/reports/doctor-ios.json
      - name: Set up Java for KMP Xcode build phases
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check --status
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          [[ "$("$install_root/xcodegen/bin/xcodegen" --version)" == "Version: $XCODEGEN_VERSION" ]]
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build, sign, and validate iOS candidate without Store authority
        working-directory: app
        env:
          MOBILE_RELEASE_APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.MOBILE_RELEASE_APPLE_DISTRIBUTION_P12_BASE64 }}
          MOBILE_RELEASE_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MOBILE_RELEASE_APPLE_DISTRIBUTION_P12_PASSWORD }}
          MOBILE_RELEASE_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MOBILE_RELEASE_APPLE_PROVISIONING_PROFILE_BASE64 }}
          MOBILE_RELEASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.MOBILE_RELEASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          MOBILE_RELEASE_PROJECT_READ_TOKEN: ${{ secrets.MOBILE_RELEASE_PROJECT_READ_TOKEN }}
        run: >-
          python -P -m mobile_release preflight
          --config release/mobile-release.json
          --signing
          --run-builds
          --platform ios
          --credentials-from-env
          --format json
          --output .mobile-release/reports/signing-ios.json
      - name: Normalize and checksum the signed iOS handoff
        working-directory: app
        run: |
          set -euo pipefail
          source_dir=.mobile-release/build/ios
          target_dir=.mobile-release/handoff/ios
          [[ -f "$source_dir/app.ipa" && ! -L "$source_dir/app.ipa" ]]
          [[ -d "$source_dir/archive.xcarchive" && ! -L "$source_dir/archive.xcarchive" ]]
          output_root="$(cd .mobile-release && pwd -P)"
          [[ ! -e .mobile-release/handoff && ! -L .mobile-release/handoff ]]
          mkdir .mobile-release/handoff "$target_dir"
          [[ ! -L "$target_dir" && "$(cd "$target_dir" && pwd -P)" == "$output_root/handoff/ios" ]]
          cp "$source_dir/app.ipa" "$target_dir/app.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$source_dir/archive.xcarchive" "$target_dir/archive.zip"
          files=(app.ipa archive.zip validation-report.json)
          if [[ -d "$source_dir/dsyms" && ! -L "$source_dir/dsyms" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$source_dir/dsyms" "$target_dir/dsyms.zip"
            files+=(dsyms.zip)
          fi
          cp .mobile-release/reports/signing-ios.json "$target_dir/validation-report.json"
          (cd "$target_dir" && shasum -a 256 "${files[@]}") > "$target_dir/SHA256SUMS"
          (cd "$target_dir" && shasum -a 256 --check --status SHA256SUMS)
          [[ -z "$(find "$target_dir" -mindepth 1 ! -type f -print -quit)" ]]
      - name: Upload immutable same-run iOS handoff
        id: upload_handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-handoff-ios
          path: app/.mobile-release/handoff/ios
          if-no-files-found: error
          retention-days: 1

