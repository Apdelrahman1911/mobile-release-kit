        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$MOBILE_RELEASE_HANDOFF_NAME&per_page=100")"
          jq -e \
            --arg name "$MOBILE_RELEASE_HANDOFF_NAME" \
            --arg digest "sha256:$MOBILE_RELEASE_HANDOFF_DIGEST" \
            '.total_count == 1 and (.artifacts | length) == 1 and
             .artifacts[0].name == $name and .artifacts[0].digest == $digest and
             (.artifacts[0].expired == false)' \
            <<<"$response" >/dev/null
      - name: Download fixed same-run iOS handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-release-candidate-handoff-ios
          path: app/.mobile-release/artifacts/ios
      - name: Verify exact handoff bytes and safe layout
        working-directory: app
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          handoff=.mobile-release/artifacts/ios
          [[ -d "$handoff" && ! -L "$handoff" ]]
          [[ -f "$handoff/app.ipa" && ! -L "$handoff/app.ipa" ]]
          [[ -f "$handoff/archive.zip" && ! -L "$handoff/archive.zip" ]]
          [[ -f "$handoff/validation-report.json" && ! -L "$handoff/validation-report.json" ]]
          [[ -f "$handoff/SHA256SUMS" && ! -L "$handoff/SHA256SUMS" ]]
          [[ -z "$(find "$handoff" -mindepth 1 ! -type f -print -quit)" ]]
          [[ -z "$(find "$handoff" -mindepth 1 -maxdepth 1 -type f \
            ! -name app.ipa ! -name archive.zip ! -name dsyms.zip \
            ! -name validation-report.json ! -name SHA256SUMS -print -quit)" ]]
          (cd "$handoff" && shasum -a 256 --check --status SHA256SUMS)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned Ruby dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: tooling
      - name: Revalidate, upload once, and read back the iOS candidate
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
          MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
          MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
          MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_STORE_RECEIPT_PATH: .mobile-release/store/ios-testflight-internal.json
          MOBILE_RELEASE_IOS_IPA_PATH: .mobile-release/artifacts/ios/app.ipa
          MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64 }}
          MOBILE_RELEASE_ASC_KEY_ID: ${{ vars.MOBILE_RELEASE_ASC_KEY_ID }}
          MOBILE_RELEASE_ASC_ISSUER_ID: ${{ vars.MOBILE_RELEASE_ASC_ISSUER_ID }}
          MOBILE_RELEASE_CI_MUTATIONS_ALLOWED: 'true'
          MOBILE_RELEASE_ENVIRONMENT: mobile-candidate
          MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          confirmation="$MOBILE_RELEASE_CONFIRMATION"
          if [[ "$MOBILE_RELEASE_SELECTED_PLATFORM" == "both" ]]; then
            confirmation="${confirmation/:both:/:ios:}"
          fi
          args=(
            --config release/mobile-release.json
            --platform ios
            --output-dir .mobile-release/staging/candidate/ios
            --confirm "$confirmation"
            --artifact ios-ipa=.mobile-release/artifacts/ios/app.ipa
            --artifact ios-archive=.mobile-release/artifacts/ios/archive.zip
            --artifact validation-report=.mobile-release/artifacts/ios/validation-report.json
            --execute-store
          )
          if [[ -f .mobile-release/artifacts/ios/dsyms.zip ]]; then
            args+=(--artifact ios-dsyms=.mobile-release/artifacts/ios/dsyms.zip)
          fi
          python -P -m mobile_release ci candidate "${args[@]}"
      - name: Validate and package iOS candidate evidence
        working-directory: app
        run: |
          set -euo pipefail
          python -P -m mobile_release status \
            --config release/mobile-release.json \
            --candidate-manifest .mobile-release/staging/candidate/ios/candidate-manifest.json \
            --receipt .mobile-release/staging/candidate/ios/candidate-receipt.json \
            --format json > .mobile-release/reports/status-ios.json
          mkdir -p .mobile-release/manifests/candidate .mobile-release/receipts/candidate .mobile-release/package/evidence/ios
          cp .mobile-release/staging/candidate/ios/candidate-manifest.json .mobile-release/manifests/candidate/ios.json
          cp .mobile-release/staging/candidate/ios/candidate-receipt.json .mobile-release/receipts/candidate/ios.json
          cp .mobile-release/staging/candidate/ios/candidate-manifest.json .mobile-release/package/evidence/ios/candidate-manifest.json
          cp .mobile-release/staging/candidate/ios/candidate-receipt.json .mobile-release/package/evidence/ios/candidate-receipt.json
          cp .mobile-release/store/ios-testflight-internal.json .mobile-release/package/evidence/ios/store-receipt.json
          cp .mobile-release/reports/status-ios.json .mobile-release/package/evidence/ios/status.json
          metadata_sha256="$(jq -er '.artifacts[] | select(.logicalName == "store-metadata") | .sha256' .mobile-release/staging/candidate/ios/candidate-manifest.json)"
          echo "$metadata_sha256  .mobile-release/staging/candidate/ios/store-metadata.zip" | shasum -a 256 --check --status
          cp .mobile-release/staging/candidate/ios/store-metadata.zip .mobile-release/artifacts/ios/store-metadata.zip
          echo "$metadata_sha256  .mobile-release/artifacts/ios/store-metadata.zip" | shasum -a 256 --check --status
      - name: Attest iOS candidate manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/package/evidence/ios/candidate-manifest.json
      - name: Attest iOS candidate receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/package/evidence/ios/candidate-receipt.json
      - name: Upload iOS candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-evidence-ios
          path: app/.mobile-release/package/evidence/ios
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Attest exact signed iOS candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/.mobile-release/artifacts/ios/app.ipa
      - name: Retain signed iOS candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-candidate-binaries-ios
          path: app/.mobile-release/artifacts/ios
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
