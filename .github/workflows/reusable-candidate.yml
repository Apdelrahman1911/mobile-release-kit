        MOBILE_RELEASE_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MOBILE_RELEASE_APPLE_PROVISIONING_PROFILE_BASE64 }}
        MOBILE_RELEASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.MOBILE_RELEASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
