name: Reusable internal mobile candidate
on:
  workflow_call:
    inputs:
      tooling_sha:
        description: Immutable mobile-release-kit commit used by this caller.
        required: true
        type: string
      source_sha:
        description: Exact application commit to build once.
        required: true
        type: string
      platform:
        description: android, ios, or both.
        required: true
        type: string
      confirmation:
        description: candidate:<platform>:<version>:<build>; use platform both when selecting both.
        required: true
        type: string
      recovery_run_id:
        description: Run holding the original intent or selected complete final; never replaces authorization.
        required: false
        default: ''
        type: string
      recovery_confirmation:
        description: Exact additional iOS recovery confirmation, only when requested by reconciliation.
        required: false
        default: ''
        type: string
    outputs:
      android_evidence_run_id:
        description: Authenticated android evidence run_id; may point to the unchanged original run.
        value: ${{ jobs.android_store.outputs.evidence_run_id }}
      android_evidence_artifact_id:
        description: Authenticated android evidence artifact_id; may point to the unchanged original run.
        value: ${{ jobs.android_store.outputs.evidence_artifact_id }}
      ios_evidence_run_id:
        description: Authenticated ios evidence run_id; may point to the unchanged original run.
        value: ${{ jobs.ios_store.outputs.evidence_run_id }}
      ios_evidence_artifact_id:
        description: Authenticated ios evidence artifact_id; may point to the unchanged original run.
        value: ${{ jobs.ios_store.outputs.evidence_artifact_id }}
permissions: {}
env:
  FASTLANE_HIDE_CHANGELOG: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  PYTHONPATH: ${{ github.workspace }}/tooling/src
  PYTHONSAFEPATH: '1'
concurrency:
  group: mobile-release-store-mutations
  cancel-in-progress: false
jobs:
  validate-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Reject unsupported platform input
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
  android_resolve:
    needs: validate-platform
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      authorization_run_id: ${{ steps.resolve.outputs.authorization_run_id }}
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id }}
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id }}
    steps:
    - name: Validate immutable workflow authority
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
        MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
        {
          printf 'MOBILE_RELEASE_CALLER_WORKFLOW_PATH=%s\n' '.github/workflows/mobile-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_PATH=%s\n' '.github/workflows/reusable-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_REPOSITORY=%s\n' "$MOBILE_RELEASE_WORKFLOW_REPOSITORY"
          printf 'MOBILE_RELEASE_TOOLING_SHA=%s\n' "$MOBILE_RELEASE_TOOLING_SHA"
        } >> "$GITHUB_ENV"
    - name: Check out pinned release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: tooling
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Resolve authenticated immutable evidence or original operation
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        MOBILE_RELEASE_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        args=(resolve --stage candidate --platform android --destination "$RUNNER_TEMP/mobile-release-resolution")
        if [[ -n "$MOBILE_RELEASE_RECOVERY_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_RECOVERY_RUN_ID")
        fi
        python -P -m mobile_release.workflow "${args[@]}"
  android_online:
    needs: android_resolve
    if: needs.android_resolve.outputs.mode == 'fresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-candidate
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Validate immutable workflow authority
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
        MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
        {
          printf 'MOBILE_RELEASE_CALLER_WORKFLOW_PATH=%s\n' '.github/workflows/mobile-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_PATH=%s\n' '.github/workflows/reusable-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_REPOSITORY=%s\n' "$MOBILE_RELEASE_WORKFLOW_REPOSITORY"
          printf 'MOBILE_RELEASE_TOOLING_SHA=%s\n' "$MOBILE_RELEASE_TOOLING_SHA"
        } >> "$GITHUB_ENV"
    - name: Check out application source without executing it
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        path: app
        persist-credentials: false
    - name: Establish safe private workflow output directory
      run: |
        set -euo pipefail
        workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        app_root="$(cd app && pwd -P)"
        [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
        output=app/.mobile-release
        if [[ -e "$output" || -L "$output" ]]; then
          [[ -d "$output" && ! -L "$output" ]]
          [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
        fi
        mkdir -p -- "$output"
        [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
    - name: Check out pinned release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: tooling
        persist-credentials: false
    - name: Verify exact source and tooling checkouts
      env:
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
      run: |
        set -euo pipefail
        [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Set up pinned Ruby dependencies
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.3.12
        bundler-cache: true
        working-directory: tooling
    - name: Authenticate to Google Play for non-publishing online gate
      id: google_online_auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.MOBILE_RELEASE_GOOGLE_WIF_PROVIDER }}
        service_account: ${{ vars.MOBILE_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: true
    - name: Restrict online-gate Google credential file
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_online_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
        esac
        [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        chmod 600 -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        [[ "$(stat -c '%a' -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH")" == '600' ]]
    - name: Check Android Store state without running application commands
      working-directory: app
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
        MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
        MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
        MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_PREFLIGHT_READBACK_PATH: ".mobile-release/store/preflight-android.json"
      run: |
        set -euo pipefail
        [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        python -P -m mobile_release preflight \
          --config release/mobile-release.json \
          --online \
          --platform android \
          --credentials-from-env \
          --format json \
          --output .mobile-release/reports/online-android.json
    - name: Remove online-gate Google Play credentials
      if: ${{ always() && steps.google_online_auth.outcome == 'success' }}
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_online_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside the runner's scoped directories" >&2; exit 1 ;;
        esac
        [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        rm -f -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        [[ ! -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
  android_build:
    needs:
    - android_resolve
    - android_online
    if: needs.android_resolve.outputs.mode == 'fresh' && needs.android_online.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mobile-candidate
    permissions:
      contents: read
    outputs:
      handoff_digest: ${{ steps.upload_handoff.outputs['artifact-digest'] }}
    steps:
    - name: Validate immutable workflow authority
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
        MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
        {
          printf 'MOBILE_RELEASE_CALLER_WORKFLOW_PATH=%s\n' '.github/workflows/mobile-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_PATH=%s\n' '.github/workflows/reusable-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_REPOSITORY=%s\n' "$MOBILE_RELEASE_WORKFLOW_REPOSITORY"
          printf 'MOBILE_RELEASE_TOOLING_SHA=%s\n' "$MOBILE_RELEASE_TOOLING_SHA"
        } >> "$GITHUB_ENV"
    - name: Refuse rebuilding on a workflow rerun
      run: |
        set -euo pipefail
        if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
          echo 'Do not rebuild on a rerun. Recover the authenticated original intent, or use a new dispatch if no Store mutation was possible.' >&2
          exit 1
        fi
    - name: Check out application source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        path: app
        persist-credentials: false
    - name: Establish safe private workflow output directory
      run: |
        set -euo pipefail
        workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        app_root="$(cd app && pwd -P)"
        [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
        output=app/.mobile-release
        if [[ -e "$output" || -L "$output" ]]; then
          [[ -d "$output" && ! -L "$output" ]]
          [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
        fi
        mkdir -p -- "$output"
        [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
    - name: Check out pinned release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: tooling
        persist-credentials: false
    - name: Verify exact source and tooling trees
      env:
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
      run: |
        set -euo pipefail
        [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        git -C app rev-parse 'HEAD^{tree}'
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Diagnose Android configuration
      working-directory: app
      run: python -P -m mobile_release doctor --config release/mobile-release.json --platform android --format json --output .mobile-release/reports/doctor-android.json
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle without cross-run caching
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-disabled: true
    - name: Install pinned bundletool
      env:
        BUNDLETOOL_VERSION: 1.18.3
        BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      run: |
        set -euo pipefail
        jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
        curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
          "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
          --output "$jar"
        echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --status
        echo "MOBILE_RELEASE_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
    - name: Build, sign, and validate Android candidate without Store authority
      working-directory: app
      env:
        MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_BASE64 }}
        MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEYSTORE_PASSWORD }}
        MOBILE_RELEASE_ANDROID_KEY_ALIAS: ${{ vars.MOBILE_RELEASE_ANDROID_KEY_ALIAS }}
        MOBILE_RELEASE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_RELEASE_ANDROID_KEY_PASSWORD }}
        MOBILE_RELEASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MOBILE_RELEASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        MOBILE_RELEASE_PROJECT_READ_TOKEN: ${{ secrets.MOBILE_RELEASE_PROJECT_READ_TOKEN }}
      run: python -P -m mobile_release preflight --config release/mobile-release.json --signing --run-builds --platform android --credentials-from-env --format json --output .mobile-release/reports/signing-android.json
    - name: Normalize and checksum the signed Android handoff
      working-directory: app
      run: |
        set -euo pipefail
        source_dir=.mobile-release/build/android
        target_dir=.mobile-release/handoff/android
        [[ -f "$source_dir/app-release.aab" && ! -L "$source_dir/app-release.aab" ]]
        output_root="$(cd .mobile-release && pwd -P)"
        [[ ! -e .mobile-release/handoff && ! -L .mobile-release/handoff ]]
        mkdir .mobile-release/handoff "$target_dir"
        [[ ! -L "$target_dir" && "$(cd "$target_dir" && pwd -P)" == "$output_root/handoff/android" ]]
        cp "$source_dir/app-release.aab" "$target_dir/app-release.aab"
        files=(app-release.aab validation-report.json)
        if [[ -f "$source_dir/mapping.txt" && ! -L "$source_dir/mapping.txt" ]]; then
          cp "$source_dir/mapping.txt" "$target_dir/mapping.txt"
          files+=(mapping.txt)
        fi
        if [[ -f "$source_dir/native-symbols.zip" && ! -L "$source_dir/native-symbols.zip" ]]; then
          cp "$source_dir/native-symbols.zip" "$target_dir/native-symbols.zip"
          files+=(native-symbols.zip)
        fi
        cp .mobile-release/reports/signing-android.json "$target_dir/validation-report.json"
        (cd "$target_dir" && sha256sum "${files[@]}") > "$target_dir/SHA256SUMS"
        (cd "$target_dir" && sha256sum --check --strict --status SHA256SUMS)
        [[ -z "$(find "$target_dir" -mindepth 1 ! -type f -print -quit)" ]]
    - name: Upload immutable same-run Android handoff
      id: upload_handoff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-candidate-handoff-android
        path: app/.mobile-release/handoff/android
        if-no-files-found: error
        retention-days: 90
  android_store:
    needs:
    - android_resolve
    - android_build
    if: ${{ always() && !cancelled() && needs.android_resolve.result == 'success' && ((needs.android_resolve.outputs.mode == 'fresh' && needs.android_build.result == 'success') || needs.android_resolve.outputs.mode == 'resume' || needs.android_resolve.outputs.mode == 'complete') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mobile-candidate
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: Validate immutable workflow authority
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
        MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
        {
          printf 'MOBILE_RELEASE_CALLER_WORKFLOW_PATH=%s\n' '.github/workflows/mobile-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_PATH=%s\n' '.github/workflows/reusable-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_REPOSITORY=%s\n' "$MOBILE_RELEASE_WORKFLOW_REPOSITORY"
          printf 'MOBILE_RELEASE_TOOLING_SHA=%s\n' "$MOBILE_RELEASE_TOOLING_SHA"
        } >> "$GITHUB_ENV"
    - name: Check out pinned release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: tooling
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Resolve authenticated immutable evidence or original operation
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        MOBILE_RELEASE_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
        MOBILE_RELEASE_HANDOFF_DIGEST: ${{ needs.android_build.outputs.handoff_digest }}
      run: |
        set -euo pipefail
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        args=(resolve --stage candidate --platform android --destination "$RUNNER_TEMP/mobile-release-resolution")
        if [[ -n "$MOBILE_RELEASE_RECOVERY_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_RECOVERY_RUN_ID")
        fi
        if [[ -n "$MOBILE_RELEASE_HANDOFF_DIGEST" ]]; then
          [[ "$MOBILE_RELEASE_HANDOFF_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          args+=(--handoff-digest "$MOBILE_RELEASE_HANDOFF_DIGEST")
        fi
        python -P -m mobile_release.workflow "${args[@]}"
    - name: Check out original operation source without executing it
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.resolve.outputs.source_sha }}
        fetch-depth: 0
        path: app
        persist-credentials: false
    - name: Establish safe private workflow output directory
      run: |
        set -euo pipefail
        workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        app_root="$(cd app && pwd -P)"
        [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
        output=app/.mobile-release
        if [[ -e "$output" || -L "$output" ]]; then
          [[ -d "$output" && ! -L "$output" ]]
          [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
        fi
        mkdir -p -- "$output"
        [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
    - name: Verify original source tree and stage authenticated inputs
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      env:
        MOBILE_RELEASE_SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        MOBILE_RELEASE_SOURCE_TREE: ${{ steps.resolve.outputs.source_tree }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
        [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
        [[ "$(git -C app rev-parse 'HEAD^{tree}')" == "$MOBILE_RELEASE_SOURCE_TREE" ]]
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        python -P -m mobile_release.workflow stage   --resolution "$RUNNER_TEMP/mobile-release-resolution" --app-root app
    - name: Set up Java for independent AAB signature inspection
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: '21'
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
    - name: Install pinned bundletool for independent AAB inspection
      env:
        BUNDLETOOL_VERSION: 1.18.3
        BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      run: |
        set -euo pipefail
        jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
        curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
          "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
          --output "$jar"
        echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --status
        echo "MOBILE_RELEASE_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
    - name: Set up pinned Ruby dependencies
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.3.12
        bundler-cache: true
        working-directory: tooling
    - name: Authenticate to Google Play for prepare
      id: google_prepare_auth
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.MOBILE_RELEASE_GOOGLE_WIF_PROVIDER }}
        service_account: ${{ vars.MOBILE_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: true
    - name: Restrict prepare Google credential file
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_prepare_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside runner-scoped directories" >&2; exit 1 ;;
        esac
        [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        chmod 600 -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        [[ "$(stat -c '%a' -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH")" == '600' ]]
    - name: Prepare immutable Store operation without mutation
      id: prepare
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      working-directory: app
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
        MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
        MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
        MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
        MOBILE_RELEASE_CI_MUTATIONS_ALLOWED: 'true'
        MOBILE_RELEASE_ENVIRONMENT: mobile-candidate
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_AUTHORIZATION_RUN_ID: ${{ steps.resolve.outputs.authorization_run_id }}
        MOBILE_RELEASE_RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        confirmation="$MOBILE_RELEASE_CONFIRMATION"
        if [[ "$MOBILE_RELEASE_SELECTED_PLATFORM" == "both" ]]; then
          confirmation="${confirmation/:both:/:android:}"
        fi
        args=(
          --config release/mobile-release.json
          --platform android
          --output-dir .mobile-release/staging/candidate/android
          --confirm "$confirmation"
          --operation-intent .mobile-release/operation/candidate-operation-intent.json
          --store-receipt .mobile-release/store/android-internal.json
          --prepare-operation
          --artifact android-aab=.mobile-release/artifacts/android/app-release.aab
          --artifact validation-report=.mobile-release/artifacts/android/validation-report.json
        )
        if [[ -f .mobile-release/artifacts/android/mapping.txt ]]; then args+=(--artifact android-mapping=.mobile-release/artifacts/android/mapping.txt); fi
        if [[ -f .mobile-release/artifacts/android/native-symbols.zip ]]; then args+=(--artifact android-native-symbols=.mobile-release/artifacts/android/native-symbols.zip); fi
        if [[ -n "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" && "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID")
        fi
        if [[ -n "$MOBILE_RELEASE_RECOVERY_CONFIRMATION" ]]; then
          args+=(--recovery-confirmation "$MOBILE_RELEASE_RECOVERY_CONFIRMATION")
        fi
        python -P -m mobile_release ci candidate "${args[@]}"
    - name: Remove preparation Google Play credentials before attestation
      id: google_prepare_cleanup
      if: ${{ always() && steps.google_prepare_auth.outputs.credentials_file_path != '' }}
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_prepare_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside runner-scoped directories" >&2; exit 1 ;;
        esac
        [[ ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        if [[ -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]; then
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          rm -f -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        fi
        [[ ! -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
    - name: Bind durable intent to its actual workflow attempt and job
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python -P -m mobile_release.workflow seal-intent --stage candidate --platform android --app-root app

        '
    - name: Attest exact signed candidate before any Store mutation
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: app/.mobile-release/artifacts/android/app-release.aab
    - name: Attest original Store intent and producer proof
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          app/.mobile-release/operation/candidate-operation-intent.json
          app/.mobile-release/operation/intent-provenance.json
    - name: Persist immutable authorization before any Store mutation
      id: upload_intent
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-candidate-intent-android
        path: app/.mobile-release/operation
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: Authenticate to Google Play for execute
      id: google_execute_auth
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.MOBILE_RELEASE_GOOGLE_WIF_PROVIDER }}
        service_account: ${{ vars.MOBILE_RELEASE_GOOGLE_SERVICE_ACCOUNT }}
        create_credentials_file: true
        export_environment_variables: true
    - name: Restrict execute Google credential file
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_execute_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside runner-scoped directories" >&2; exit 1 ;;
        esac
        [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        chmod 600 -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        [[ "$(stat -c '%a' -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH")" == '600' ]]
    - name: Execute or reconcile the exact authorized Store operation
      id: execute
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      working-directory: app
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
        MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
        MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
        MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
        MOBILE_RELEASE_CI_MUTATIONS_ALLOWED: 'true'
        MOBILE_RELEASE_ENVIRONMENT: mobile-candidate
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_AUTHORIZATION_RUN_ID: ${{ steps.resolve.outputs.authorization_run_id }}
        MOBILE_RELEASE_RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        confirmation="$MOBILE_RELEASE_CONFIRMATION"
        if [[ "$MOBILE_RELEASE_SELECTED_PLATFORM" == "both" ]]; then
          confirmation="${confirmation/:both:/:android:}"
        fi
        args=(
          --config release/mobile-release.json
          --platform android
          --output-dir .mobile-release/staging/candidate/android
          --confirm "$confirmation"
          --operation-intent .mobile-release/operation/candidate-operation-intent.json
          --store-receipt .mobile-release/store/android-internal.json
          --execute-store
          --artifact android-aab=.mobile-release/artifacts/android/app-release.aab
          --artifact validation-report=.mobile-release/artifacts/android/validation-report.json
        )
        if [[ -f .mobile-release/artifacts/android/mapping.txt ]]; then args+=(--artifact android-mapping=.mobile-release/artifacts/android/mapping.txt); fi
        if [[ -f .mobile-release/artifacts/android/native-symbols.zip ]]; then args+=(--artifact android-native-symbols=.mobile-release/artifacts/android/native-symbols.zip); fi
        if [[ -n "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" && "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID")
        fi
        if [[ -n "$MOBILE_RELEASE_RECOVERY_CONFIRMATION" ]]; then
          args+=(--recovery-confirmation "$MOBILE_RELEASE_RECOVERY_CONFIRMATION")
        fi
        python -P -m mobile_release ci candidate "${args[@]}"
    - name: Remove candidate-upload Google Play credentials
      id: google_execute_cleanup
      if: ${{ always() && steps.google_execute_auth.outputs.credentials_file_path != '' }}
      env:
        MOBILE_RELEASE_GOOGLE_ADC_PATH: ${{ steps.google_execute_auth.outputs.credentials_file_path }}
      run: |
        set -euo pipefail
        [[ -n "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        case "$MOBILE_RELEASE_GOOGLE_ADC_PATH" in
          "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*) ;;
          *) echo "Google credential path is outside runner-scoped directories" >&2; exit 1 ;;
        esac
        [[ ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
        if [[ -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]; then
          [[ -f "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
          rm -f -- "$MOBILE_RELEASE_GOOGLE_ADC_PATH"
        fi
        [[ ! -e "$MOBILE_RELEASE_GOOGLE_ADC_PATH" && ! -L "$MOBILE_RELEASE_GOOGLE_ADC_PATH" ]]
    - name: Retain android candidate operation diagnostic journal after credential cleanup
      if: ${{ always() && steps.execute.outcome != 'skipped' && hashFiles('app/.mobile-release/store/android-internal-play-state.json') != '' && (steps.google_prepare_auth.outcome == 'skipped' || steps.google_prepare_cleanup.outcome == 'success') && steps.google_execute_cleanup.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-android-candidate-diagnostic-${{ github.run_attempt }}
        path: app/.mobile-release/store/android-internal-play-state.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 90
    - name: Validate complete readback chain and package immutable evidence
      id: package
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python -P -m mobile_release.workflow package-final   --stage candidate --platform android --app-root app   --evidence-dir app/.mobile-release/staging/candidate/android   --raw-receipt app/.mobile-release/store/android-internal.json   --destination app/.mobile-release/package/candidate/android

        '
    - name: Attest complete final evidence and authenticated inventory
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          app/.mobile-release/package/candidate/android/workflow-provenance.json
          app/.mobile-release/package/candidate/android/candidate-receipt.json
          app/.mobile-release/package/candidate/android/store-receipt.json
          app/.mobile-release/package/candidate/android/candidate-manifest.json
    - name: Upload immutable final evidence last; never overwrite an existing artifact
      id: upload_final
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-candidate-evidence-android
        path: app/.mobile-release/package/candidate/android
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    outputs:
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id || (steps.upload_final.outputs['artifact-id'] != '' && github.run_id) || '' }}
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id || steps.upload_final.outputs['artifact-id'] }}
  ios_resolve:
    needs: validate-platform
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      authorization_run_id: ${{ steps.resolve.outputs.authorization_run_id }}
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id }}
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id }}
    steps:
    - name: Validate immutable workflow authority
      env:
        MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
        MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
        MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
        [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-candidate.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
        {
          printf 'MOBILE_RELEASE_CALLER_WORKFLOW_PATH=%s\n' '.github/workflows/mobile-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_PATH=%s\n' '.github/workflows/reusable-candidate.yml'
          printf 'MOBILE_RELEASE_REUSABLE_WORKFLOW_REPOSITORY=%s\n' "$MOBILE_RELEASE_WORKFLOW_REPOSITORY"
          printf 'MOBILE_RELEASE_TOOLING_SHA=%s\n' "$MOBILE_RELEASE_TOOLING_SHA"
        } >> "$GITHUB_ENV"
    - name: Check out pinned release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: tooling
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Resolve authenticated immutable evidence or original operation
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        MOBILE_RELEASE_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        args=(resolve --stage candidate --platform ios --destination "$RUNNER_TEMP/mobile-release-resolution")
        if [[ -n "$MOBILE_RELEASE_RECOVERY_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_RECOVERY_RUN_ID")
        fi
        python -P -m mobile_release.workflow "${args[@]}"
  ios_online:
    needs: ios_resolve
    if: needs.ios_resolve.outputs.mode == 'fresh'
    runs-on: macos-26
    timeout-minutes: 15
    environment: mobile-candidate
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.3.app/Contents/Developer"
    permissions:
      contents: read
    steps:
