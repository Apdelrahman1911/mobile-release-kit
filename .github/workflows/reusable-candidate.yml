        if [[ -n "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" && "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID")
        fi
        if [[ -n "$MOBILE_RELEASE_RECOVERY_CONFIRMATION" ]]; then
          args+=(--recovery-confirmation "$MOBILE_RELEASE_RECOVERY_CONFIRMATION")
        fi
        python -P -m mobile_release ci candidate "${args[@]}"
    - name: Bind durable intent to its actual workflow attempt and job
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python -P -m mobile_release.workflow seal-intent --stage candidate --platform ios --app-root app

        '
    - name: Attest exact signed candidate before any Store mutation
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: app/.mobile-release/artifacts/ios/app.ipa
    - name: Attest original Store intent and producer proof
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          app/.mobile-release/operation/candidate-operation-intent.json
          app/.mobile-release/operation/intent-provenance.json
    - name: Persist immutable authorization before any Store mutation
      id: upload_intent
      if: success() && (steps.resolve.outputs.mode == 'prepare')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-candidate-intent-ios
        path: app/.mobile-release/operation
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: Execute or reconcile the exact authorized Store operation
      id: execute
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      working-directory: app
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/Gemfile
        MOBILE_RELEASE_APP_ROOT: ${{ github.workspace }}/app
        MOBILE_RELEASE_CONFIG_PATH: release/mobile-release.json
        MOBILE_RELEASE_TOOLING_ROOT: ${{ github.workspace }}/tooling
        MOBILE_RELEASE_CI_MUTATIONS_ALLOWED: 'true'
        MOBILE_RELEASE_ENVIRONMENT: mobile-candidate
        MOBILE_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        MOBILE_RELEASE_SELECTED_PLATFORM: ${{ inputs.platform }}
        MOBILE_RELEASE_AUTHORIZATION_RUN_ID: ${{ steps.resolve.outputs.authorization_run_id }}
        MOBILE_RELEASE_RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        MOBILE_RELEASE_DISPATCH_SHA: ${{ github.sha }}
        MOBILE_RELEASE_DISPATCH_REF: ${{ github.ref }}
        GH_TOKEN: ${{ github.token }}
        MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.MOBILE_RELEASE_ASC_PRIVATE_KEY_P8_BASE64 }}
        MOBILE_RELEASE_ASC_KEY_ID: ${{ vars.MOBILE_RELEASE_ASC_KEY_ID }}
        MOBILE_RELEASE_ASC_ISSUER_ID: ${{ vars.MOBILE_RELEASE_ASC_ISSUER_ID }}
      run: |
        set -euo pipefail
        [[ "$(git -C ../tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
        confirmation="$MOBILE_RELEASE_CONFIRMATION"
        if [[ "$MOBILE_RELEASE_SELECTED_PLATFORM" == "both" ]]; then
          confirmation="${confirmation/:both:/:ios:}"
        fi
        args=(
          --config release/mobile-release.json
          --platform ios
          --output-dir .mobile-release/staging/candidate/ios
          --confirm "$confirmation"
          --operation-intent .mobile-release/operation/candidate-operation-intent.json
          --store-receipt .mobile-release/store/ios-testflight-internal.json
          --execute-store
          --artifact ios-ipa=.mobile-release/artifacts/ios/app.ipa
          --artifact ios-archive=.mobile-release/artifacts/ios/archive.zip
          --artifact validation-report=.mobile-release/artifacts/ios/validation-report.json
        )
        if [[ -f .mobile-release/artifacts/ios/dsyms.zip ]]; then args+=(--artifact ios-dsyms=.mobile-release/artifacts/ios/dsyms.zip); fi
        if [[ -n "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" && "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
          [[ "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          args+=(--recovery-run-id "$MOBILE_RELEASE_AUTHORIZATION_RUN_ID")
        fi
        if [[ -n "$MOBILE_RELEASE_RECOVERY_CONFIRMATION" ]]; then
          args+=(--recovery-confirmation "$MOBILE_RELEASE_RECOVERY_CONFIRMATION")
        fi
        python -P -m mobile_release ci candidate "${args[@]}"
    - name: Retain ios candidate operation diagnostic journal after credential cleanup
      if: ${{ always() && steps.execute.outcome != 'skipped' && hashFiles('app/.mobile-release/store/ios-testflight-internal-apple-state.json') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-ios-candidate-diagnostic-${{ github.run_attempt }}
        path: app/.mobile-release/store/ios-testflight-internal-apple-state.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 90
    - name: Validate complete readback chain and package immutable evidence
      id: package
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python -P -m mobile_release.workflow package-final   --stage candidate --platform ios --app-root app   --evidence-dir app/.mobile-release/staging/candidate/ios   --raw-receipt app/.mobile-release/store/ios-testflight-internal.json   --destination app/.mobile-release/package/candidate/ios

        '
    - name: Attest complete final evidence and authenticated inventory
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          app/.mobile-release/package/candidate/ios/workflow-provenance.json
          app/.mobile-release/package/candidate/ios/candidate-receipt.json
          app/.mobile-release/package/candidate/ios/store-receipt.json
          app/.mobile-release/package/candidate/ios/candidate-manifest.json
    - name: Upload immutable final evidence last; never overwrite an existing artifact
      id: upload_final
      if: success() && (steps.resolve.outputs.mode == 'prepare' || steps.resolve.outputs.mode == 'resume')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mobile-release-candidate-evidence-ios
        path: app/.mobile-release/package/candidate/ios
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    outputs:
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id || (steps.upload_final.outputs['artifact-id'] != '' && github.run_id) || '' }}
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id || steps.upload_final.outputs['artifact-id'] }}
