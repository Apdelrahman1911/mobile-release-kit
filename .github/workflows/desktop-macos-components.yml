name: Mac native components

on:
  push:
    branches: [verify/desktop-macos-components]
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/src/macos_noop_recovery_native.rs
      - desktop/src-tauri/src/macos_restore_recovery_native.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  pull_request:
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/src/macos_noop_recovery_native.rs
      - desktop/src-tauri/src/macos_restore_recovery_native.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  workflow_dispatch:
    inputs:
      component:
        description: Check only the selected native component
        type: choice
        default: all
        options: [all, integration, launcher, resident-compile, xcode-setup-compile, xcode-setup-files, installer, installer-tests, installer-recovery, installer-frames, installer-removal-fixtures, installer-restore-fixtures, installer-restore-chain, app, app-typecheck, app-native-tests, app-contracts, local-keychain, local-keychain-contracts, store-runtime, store-local-altool, ios-tools-layout, ios-tools, xcode-package-probe, xcode-product-metadata]
      architecture:
        description: Architecture for app-typecheck/app-native-tests (arm64 only), Store, iOS tools, package probe and Xcode files; other components use both
        type: choice
        default: both
        options: [both, arm64, x86_64]

permissions:
  contents: read

concurrency:
  group: mac-native-component-${{ github.ref }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false

jobs:
  resident-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'resident-compile'
    name: Measure the Intel resident release build without signing
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14.7'
      - name: Prepare the same hosted compiler paths as packaging
        id: work
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root=$(mktemp -d "$RUNNER_TEMP/mrk-resident-compile.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          export CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          toolchain="$RUSTUP_HOME/toolchains/1.98.0-x86_64-apple-darwin/bin"
          "$toolchain/cargo" --version
          "$toolchain/rustc" -vV
          mkdir -p "$root/android-helper-target/tmp"
      - name: Measure the actual compiler owner and Command Line Tools SDK
        id: compile
        timeout-minutes: 25
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          "$MRK_PYTHON" -I -S -B - <<'PY_RESIDENT'
          import json, os, sys, time
          from pathlib import Path
          root, work = Path.cwd(), Path(os.environ["WORK_ROOT"])
          assert sys.version_info[:3] == (3, 14, 7) and sys.flags.isolated and sys.flags.no_site
          sys.path.insert(0, str(root / "desktop/tools"))
          import macos_android_helper_package as package
          loader = package.load_data(root, "macos_aqua_qualification.py", "_resident_diagnostic_loader")
          owner = loader.load_owner(root)
          target = package.INTEL_TARGET
          stager = package.load_data(root, "stage_macos_installed.py", "_resident_diagnostic_stager")
          selection = stager.build_release_data((root / "desktop/macos-installed-inputs/build-release-intel.json").read_bytes(), target=target)
          release = selection["release"]
          environment = package.build_environment({"HOME": "/Users/runner",
              "DEVELOPER_DIR": "/Library/Developer/CommandLineTools", "MACOSX_DEPLOYMENT_TARGET": "26.0",
              "GITHUB_SHA": os.environ["GITHUB_SHA"]}, work, release, target=target)
          cargo = package.direct_rust_tools(target)[0]
          manifest = str(root / package.WORKSPACE / "Cargo.toml")
          commands = (("fetch", 120, [cargo, "fetch", "--manifest-path", manifest, "--locked", "--target", target]),
              ("build", 1200, [cargo, "build", "--manifest-path", manifest, "--locked", "--offline", "--release",
               "--config", package.RESIDENT_CARGO_OVERRIDE, "--jobs", "1", "--target", target,
               "--lib", "--message-format=json-render-diagnostics"]))
          # Same owner, SDK, compiler paths, graph, profile and capture bound as
          # prepare(). Only this diagnostic's build allowance differs (1200s).
          for role, seconds, argv in commands:
              started = time.monotonic()
              try:
                  result = owner.run_owned(argv, environ=environment, cwd=root / package.WORKSPACE,
                      timeout=seconds, capture=True, text=False, output_limit=4 * 1024 * 1024)
              except BaseException as error:
                  detail = package.original_failure(error, owner, root, seconds, 4 * 1024 * 1024)
                  print(json.dumps({"role": role, "elapsedSeconds": round(time.monotonic() - started, 3),
                      "returned": False, "diagnostic": detail}), flush=True)
                  raise SystemExit(1) from None
              print(json.dumps({"role": role, "returncode": result.returncode,
                  "elapsedSeconds": round(time.monotonic() - started, 3),
                  "stdoutBytes": len(result.stdout), "stderrBytes": len(result.stderr)}), flush=True)
              if role == "build" or result.returncode != 0:
                  # A real returned result, not a caught timeout, permits this
                  # disposable task's cleanup. Shared toolchains are not removed.
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("returned=true\n")
              sys.stderr.buffer.write(result.stderr)
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
              if role == "build":
                  package.artifact(result.stdout, root, work / "android-helper-target",
                      package_version=selection["packageVersion"], build_target=target)
          PY_RESIDENT
      - name: Retire only this returned build's compiler and outputs
        if: always() && steps.compile.outputs.returned == 'true'
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$WORK_ROOT" == "$RUNNER_TEMP"/mrk-resident-compile.* && -d "$WORK_ROOT" && ! -L "$WORK_ROOT" ]]
          # Cargo has synchronously returned. Timeout/no-return uses hosted VM
          # disposal instead; no guessed process kill or shared cache deletion.
          rm -rf -- "$WORK_ROOT"

  launcher:
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'launcher'
    name: Compile launcher (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned component directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-launcher-ci.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Build only the unsigned launcher component with the native SDK
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          bash desktop/native/macos-applications-launcher/build.sh \
            "$WORK_ROOT/Mobile Release Kit.app" "$TARGET_ARCH"
          plutil -lint "$WORK_ROOT/Mobile Release Kit.app/Contents/Info.plist"
          lipo "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" \
            -verify_arch "$TARGET_ARCH"
          # Public component linkage only: integration must use the actual
          # Swift SDK's library/rpath behavior, not guessed Mach-O policy.
          otool -L "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher"
          otool -l "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" |
            sed -n '/cmd LC_RPATH/,+3p'
      - name: Remove only this job's disposable component
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: rm -rf -- "$WORK_ROOT"

  installer-check:
    name: ${{ inputs.component == 'xcode-setup-files' && 'Test native Xcode copy and retirement on private files' || inputs.component == 'xcode-setup-compile' && 'Typecheck inert Xcode setup and Installer diagnostic' || inputs.component == 'installer-restore-chain' && 'Test Restore chain observer' || inputs.component == 'installer-removal-fixtures' && 'Check removal fixture roles' || inputs.component == 'installer-restore-fixtures' && 'Check Restore fixtures' || inputs.component == 'installer-tests' && 'Test installer contracts' || inputs.component == 'installer-frames' && 'Test installer frames' || inputs.component == 'installer-recovery' && 'Test installer recovery' || 'Check installer and remover' }} (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'integration' || inputs.component == 'installer' || inputs.component == 'installer-tests' || inputs.component == 'installer-recovery' || inputs.component == 'installer-frames' || inputs.component == 'installer-removal-fixtures' || inputs.component == 'installer-restore-fixtures' || inputs.component == 'installer-restore-chain' || inputs.component == 'xcode-setup-compile' || (github.event_name == 'workflow_dispatch' && inputs.component == 'xcode-setup-files')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.component == 'xcode-setup-files' && inputs.architecture == 'arm64' && '[{"runner":"macos-26","arch":"arm64"}]' || github.event_name == 'workflow_dispatch' && inputs.component == 'xcode-setup-files' && inputs.architecture == 'x86_64' && '[{"runner":"macos-26-intel","arch":"x86_64"}]' || '[{"runner":"macos-26","arch":"arm64"},{"runner":"macos-26-intel","arch":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned compiler directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-installer-check.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Check exclusive native roles and test pure launcher logic
        id: native_checks
        shell: bash
        working-directory: desktop/src-tauri
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
          INSTALLER_CHECKS: ${{ inputs.component }}
          COMPONENT_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          export CARGO_HOME="$WORK_ROOT/cargo" RUSTUP_HOME="$WORK_ROOT/rustup"
          export CARGO_TARGET_DIR="$WORK_ROOT/target" CARGO_INCREMENTAL=0
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          # This is the existing reviewed native clock tuple on both Macs.
          # 1.98.0 is supported only on Intel, not Apple Silicon.
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          if [[ "$INSTALLER_CHECKS" == xcode-setup-files ]]; then
            [[ "$COMPONENT_EVENT" == workflow_dispatch ]] || exit 1
            # Normal runner compiles ONLY the native libtest. No root Cargo,
            # setup binary, Installer, Apple verifier or signing invocation.
            [[ ! -e "$CARGO_TARGET_DIR" && ! -L "$CARGO_TARGET_DIR" ]] || exit 1
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --manifest-path "$GITHUB_WORKSPACE/desktop/native/macos-installed-native/Cargo.toml" \
              --features xcode-setup --lib --no-run --message-format=json-render-diagnostics |
              /usr/bin/python3 -I -S -c '
          import os, pathlib, re, stat, sys
          checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(checkout / "desktop/tools"))
          import stage_macos_installed as stage
          limit = 8 * 1024 * 1024
          data = sys.stdin.buffer.read(limit + 1)
          if len(data) > limit:
              # Drain only, with fixed memory, so the original Cargo process
              # still returns before the failed pipeline permits any cleanup.
              while sys.stdin.buffer.read(65536):
                  pass
              raise SystemExit("native libtest compiler metadata exceeded limit")
          rows = stage.cargo_records(data)
          selected = [row for row in rows if row.get("executable") is not None]
          assert len(selected) == 1, "expected one native libtest executable"
          row = selected[0]
          directory = checkout / "desktop/native/macos-installed-native"
          target = row["target"]
          assert row.get("manifest_path") == str(directory / "Cargo.toml")
          assert target.get("name") == "mrk_macos_installed_native"
          assert target.get("kind") == ["lib"] and target.get("crate_types") == ["lib"]
          assert target.get("src_path") == str(directory / "src/lib.rs")
          stage.cargo_profile(row, test=True)
          stage.cargo_features(row, ["xcode-setup"])
          executable = pathlib.Path(row["executable"])
          assert executable.is_absolute() and executable.parent == pathlib.Path(os.environ["CARGO_TARGET_DIR"]) / "debug/deps"
          assert re.fullmatch(r"mrk_macos_installed_native-[0-9a-f]+", executable.name)
          assert row.get("filenames") == [str(executable)] and executable.resolve(strict=True) == executable
          identity = executable.lstat()
          assert stat.S_ISREG(identity.st_mode) and identity.st_uid == os.geteuid() and identity.st_mode & 0o111
          print(executable)
          ' > "$WORK_ROOT/xcode-files-executable.txt"
            IFS= read -r native_test < "$WORK_ROOT/xcode-files-executable.txt"
            # Reuse this same actual native libtest for the five focused pure
            # entry/cleanup contracts, as the ordinary runner (never root).
            "$native_test" \
              macos_xcode_parent::tests::xcode_child_tail_is_one_use_and_lost_wait_never_reauthorizes_signals \
              macos_xcode_parent::tests::xcode_parent_failure_cutoff_never_renews_original_work \
              macos_xcode_entry::tests::fixed_entry_routing_never_accepts_paths_clocks_or_noncanonical_fds \
              macos_xcode_entry::tests::public_exit_requires_original_finality_and_distinguishes_cleanup \
              macos_xcode_setup::tests::fixed_names_and_relative_link_shape_do_not_pretend_to_resolve_links \
              --exact --test-threads=1 | tee "$WORK_ROOT/xcode-entry-tail-tests.log"
            grep -Eq '^test result: ok\. 5 passed; 0 failed; 0 ignored;' "$WORK_ROOT/xcode-entry-tail-tests.log"
            # Private mutations stay in this test-only temp parent. The extra
            # selected-Xcode census is read-only and reports its first refusal;
            # it neither copies Xcode nor runs signing or Installer.
            /bin/mkdir -m 700 "$WORK_ROOT/xcode-files-fixtures"
            /usr/bin/sudo /usr/bin/env -i \
              PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              HOME="$WORK_ROOT/xcode-files-fixtures" TMPDIR="$WORK_ROOT/xcode-files-fixtures" \
              "$native_test" \
              macos_xcode_tree_tests::copier_copies_real_bytes_links_attributes_and_retires_only_its_stage \
              macos_xcode_tree_tests::retirement_checks_recorded_identity_and_never_follows_partial_or_sealed_aliases \
              macos_xcode_parent::native::namespace_tests::namespace_creation_seals_umask077_and_preserves_existing_objects \
              macos_xcode_parent::native::namespace_tests::selected_system_xcode_initial_census_is_read_only_and_reports_first_failure \
              --exact --ignored --test-threads=1 | tee "$WORK_ROOT/xcode-files-tests.log"
            grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$WORK_ROOT/xcode-files-tests.log"
            # The tests consume originals and remove only their own fixtures;
            # this succeeds only when that parent is actually empty afterward.
            /bin/rmdir "$WORK_ROOT/xcode-files-fixtures"
            exit 0
          fi
          if [[ "$INSTALLER_CHECKS" == xcode-setup-compile ]]; then
            # Passive compile only: provisional helper main always refuses.
            # No signing credentials, privileged invocation or Xcode copying.
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-xcode-setup --bin mrk-macos-xcode-setup
            # Same native dependency build also validates the joined-worker
            # diagnostic at its existing DATA-only test entry, not Installer main.
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --features macos-installed-installer --bin mrk-macos-install -- \
              installer::tests::original_final_deadline_vetoes_late_known_closes_without_erasing_first_error \
              --exact --test-threads=1 | tee "$WORK_ROOT/installer-diagnostic-tests.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$WORK_ROOT/installer-diagnostic-tests.log"
            # New managed-selection checks: private temporary file originals
            # and DATA only. No privileged namespace, Xcode or Store operation.
            rustup run 1.98.1 cargo test --locked --no-default-features --lib -- \
              installed_runtime::ios_validation_tools_data_tests::ios_managed_absence_is_enoent_only_and_rechecked_on_the_original_directory \
              installed_runtime::ios_validation_tools_data_tests::ios_managed_presence_never_mints_missing_original_or_renews_cleanup \
              ios_toolchain::tests::managed_developer_is_exact_without_relaxing_legacy_selection \
              --exact --test-threads=1 | tee "$WORK_ROOT/managed-selection-tests.log"
            grep -Eq '^test result: ok\. 3 passed; 0 failed; 0 ignored;' "$WORK_ROOT/managed-selection-tests.log"
            exit 0
          fi
          if [[ "$INSTALLER_CHECKS" == installer-removal-fixtures ]]; then
            # Distinct nonshipping graphs; never execute either privileged entry.
            # One task-owned target reuses unchanged dependencies across checks.
            for role in abrupt-fixture observer; do
              rustup run 1.98.1 cargo check --locked --no-default-features \
                --features "macos-installed-removal-$role" --bin mrk-macos-remove
            done
            exit 0
          fi
          if [[ "$INSTALLER_CHECKS" == installer-restore-chain ]]; then
            # Fixed observer DATA only. Previously checked writer-cut graphs
            # and ordinary installer contracts are unchanged and not repeated.
            export MRK_APP_ABSENCE_FIXTURE_SOURCE_COMMIT="$GITHUB_SHA"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ID="$GITHUB_RUN_ID"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --features macos-installed-restore-chain-observer --bin mrk-macos-app-absence-fixture -- \
              installer::worker::app_absence_fixture::tests:: --test-threads=1 \
              | tee "$WORK_ROOT/restore-chain-observer-tests.log"
            grep -Eq '^test result: ok\. 6 passed; 0 failed; 0 ignored;' "$WORK_ROOT/restore-chain-observer-tests.log"
            exit 0
          fi
          if [[ "$INSTALLER_CHECKS" == installer-restore-fixtures ]]; then
            # Compile only: these fixed fault-injection programs never execute.
            # Reuse one dependency/target directory for their exclusive graphs.
            for cut in app-write own-attempt stage-move; do
              rustup run 1.98.1 cargo check --locked --no-default-features \
                --features "macos-installed-restore-$cut-fixture" --bin mrk-macos-install
            done
            # Test the observer's DATA contract, not its privileged entrypoint.
            export MRK_APP_ABSENCE_FIXTURE_SOURCE_COMMIT="$GITHUB_SHA"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ID="$GITHUB_RUN_ID"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --features macos-installed-app-absence-fixture --bin mrk-macos-app-absence-fixture -- \
              installer::worker::app_absence_fixture::tests::actual_restore_requires_new_app_and_exact_initial_history \
              --exact --test-threads=1 | tee "$WORK_ROOT/restore-fixture-contract-tests.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$WORK_ROOT/restore-fixture-contract-tests.log"
            exit 0
          fi
          # Separate invocations keep the two mutually exclusive roles distinct;
          # dependencies are compiled once in this job's shared target directory.
          # Fixture-only fixes reuse passed normal-role compilation. Still run
          # every installer contract and Restore transaction test below.
          if [[ "$INSTALLER_CHECKS" != installer-tests && "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-installer --bin mrk-macos-install
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-remover --bin mrk-macos-remove
          fi
          # Named launcher/path/recovery DATA tests and one original-reader
          # test on exclusive user-owned temporary files. No Installer main,
          # root destination, signing or remover execution.
          tests=(installer::worker::tests::private_frames_require_fixed_binding_shapes_bounds_and_no_future_finality
                 installer::maintenance::noop_recovery::tests::preserved_prefix_transport_is_closed_without_relaxing_ordinary_controls
                 installer::maintenance::noop_recovery::tests::completed_recovery_snapshot_rehome_requires_receipt_bound_originals_and_prefixes)
          # Use only for a recovery-test-only correction after both native roles
          # and launcher tests already passed; normal runs keep their full scope.
          expected_tests=3
          if [[ "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            tests+=(installer::applications::tests::
                    installer::maintenance::store_path_tests::contextual_store_paths_keep_copy_recovery_and_removal_scoped
                    installer::maintenance::restore_recovery::
                    installer::tests::collected_inventory_uses_original_reader_with_exact_bound_and_post)
            expected_tests=17
          fi
          if [[ "$INSTALLER_CHECKS" == installer-frames ]]; then
            tests=(installer::worker::tests::private_frames_require_fixed_binding_shapes_bounds_and_no_future_finality)
            expected_tests=1
          fi
          rustup run 1.98.1 cargo test --locked --no-default-features \
            --features macos-installed-installer --bin mrk-macos-install -- \
            "${tests[@]}" --test-threads=1 | tee "$WORK_ROOT/installer-contract-tests.log"
          grep -Eq "^test result: ok\. $expected_tests passed; 0 failed; 0 ignored;" "$WORK_ROOT/installer-contract-tests.log"
          if [[ "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            # Same dependency/target owner, separate pure transaction DATA target.
            # Neither this test filter nor the bin tests execute Installer main.
            rustup run 1.98.1 cargo test --locked --no-default-features --lib -- \
              macos_install_transaction::tests::restore_ \
              macos_install_transaction::tests::retained_storage_and_original_budget_arithmetic_refuse_before_effects \
              --test-threads=1 | tee "$WORK_ROOT/installer-restore-transaction-tests.log"
            grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$WORK_ROOT/installer-restore-transaction-tests.log"
          fi
      - name: Remove only this job's disposable compiler and dependencies
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          INSTALLER_CHECKS: ${{ inputs.component }}
          NATIVE_OUTCOME: ${{ steps.native_checks.outcome }}
        run: |
          set -euo pipefail
          if [[ "$INSTALLER_CHECKS" == xcode-setup-files && "$NATIVE_OUTCOME" != success ]]; then
            printf 'Native filesystem test incomplete; retain its task root for disposable-host teardown.\n'
            exit 0
