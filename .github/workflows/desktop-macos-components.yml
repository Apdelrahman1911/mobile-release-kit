      - name: Bound successful compiler cache publication
        id: cache-size
        if: success() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Bound logical file bytes (including sparse files), with per-entry
          # archive overhead. Oversized output does not seed a cache; it does
          # not undo successful compiler/tests. No source/artifact qualification.
          python3 - <<'PY'
          import os, stat
          from pathlib import Path
          root = Path("desktop/.ci-component-cargo")
          size = 0
          def unreadable(error):
              raise error
          for name in ("registry", "git", "target"):
              for parent, dirs, files in os.walk(root / name, followlinks=False, onerror=unreadable):
                  for leaf in dirs + files:
                      value = (Path(parent) / leaf).lstat()
                      assert stat.S_ISREG(value.st_mode) or stat.S_ISDIR(value.st_mode) or stat.S_ISLNK(value.st_mode)
                      size += value.st_size + 1024
                      if size > 4 * 1024**3:
                          raise SystemExit(0)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("save=true\n")
          PY
      - name: Save only successful bounded compiler outputs
        if: success() && steps.cache-size.outputs.save == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            desktop/.ci-component-cargo/registry
            desktop/.ci-component-cargo/git
            desktop/.ci-component-cargo/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Remove only this job's app compiler and frontend outputs
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          CARGO_CACHE_OWNED: ${{ steps.work.outputs.cache_owned }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          assert work.parent == Path(os.environ["RUNNER_TEMP"])
          assert work.name.startswith("mrk-app-check.") and not work.is_symlink()
          cache = (Path("desktop/.ci-component-cargo"),) if os.environ["CARGO_CACHE_OWNED"] == "true" else ()
          for path in (work, *cache, Path("desktop/node_modules"), Path("desktop/dist")):
              if path.exists():
                  assert path.is_dir() and not path.is_symlink()
                  shutil.rmtree(path)
          PY

  ios-tools-layout:
    # Read-only host facts, not tool admission or a replacement for native tests.
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'ios-tools-layout'
    name: Observe selected Xcode layout (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - name: Read fixed public filesystem metadata without changing the host
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import json
          import os
          import re
          import stat

          def emit(role, **facts):
              print(json.dumps({"role": role, **facts}, sort_keys=True, separators=(",", ":")))

          def observe(role, path):
              try:
                  row = os.lstat(path)
              except OSError:
                  emit(role, state="unavailable")
                  return None
              kind = ("directory" if stat.S_ISDIR(row.st_mode) else
                      "symlink" if stat.S_ISLNK(row.st_mode) else
                      "regular" if stat.S_ISREG(row.st_mode) else "other")
              emit(role, state="observed", kind=kind, uid=row.st_uid, gid=row.st_gid,
                   mode=format(row.st_mode, "#07o"), flags=getattr(row, "st_flags", 0),
                   nlink=row.st_nlink, rootOwned=row.st_uid == 0,
                   protectedMode=(row.st_mode & 0o7022) == 0)
              return row

          def altool_layout(app_path):
              # Metadata only: the fixed nomination is never executed or read.
              # A diagnostic observation does not admit an executable or its owner.
              opened = []
              links = 0
              def identity(row):
                  return (row.st_dev, row.st_ino, row.st_mode, row.st_uid, row.st_gid,
                          row.st_nlink, row.st_size, row.st_mtime_ns, row.st_ctime_ns,
                          getattr(row, "st_flags", 0))
              def need(condition):
                  if not condition:
                      raise ValueError("unsupported-layout")
              def directory(name, parent=None):
                  need(len(opened) < 32)
                  before = os.stat(name, dir_fd=parent, follow_symlinks=False)
                  need(stat.S_ISDIR(before.st_mode))
                  fd = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC,
                               dir_fd=parent)
                  opened.append(fd)
                  need(identity(before) == identity(os.fstat(fd)) ==
                       identity(os.stat(name, dir_fd=parent, follow_symlinks=False)))
                  return fd
              try:
                  root = directory(b"/")
                  for name in app_path.split(b"/")[1:] + [b"Contents"]:
                      root = directory(name, root)
                  # Two fixed public Apple aliases refused the actual source census.
                  # Snapshot only: never execute or admit a target, and do not
                  # print any regular-file contents, selected host path or xattrs.
                  for alias_role, parent_parts, alias_name in (
                      ("instruments-xccontentsdir", (b"Applications", b"Instruments.app", b"Contents"), b"XCContentsDir"),
                      ("appletvos-swift-soundanalysis", (b"Developer", b"Platforms", b"AppleTVOS.platform",
                       b"Developer", b"SDKs", b"AppleTVOS.sdk", b"usr", b"lib", b"swift"), b"libswiftSoundAnalysis.tbd"),
                  ):
                      try:
                          alias_parent = root
                          for part in parent_parts:
                              alias_parent = directory(part, alias_parent)
                          row = os.stat(alias_name, dir_fd=alias_parent, follow_symlinks=False)
                          need(stat.S_ISLNK(row.st_mode) and row.st_nlink == 1 and 1 <= row.st_size <= 1024)
                          target = os.readlink(alias_name, dir_fd=alias_parent)
                          need(len(target) <= 1024)
                          after = os.stat(alias_name, dir_fd=alias_parent, follow_symlinks=False)
                          emit(alias_role, state="observed", qualification=False,
                               target=target.decode("ascii", "backslashreplace"), targetBytes=len(target),
                               metadataBytes=row.st_size, metadataStable=identity(row) == identity(after),
                               uid=row.st_uid, gid=row.st_gid, mode=format(row.st_mode, "#07o"),
                               flags=getattr(row, "st_flags", 0),
                               relative=not target.startswith(b"/"), trailingSlash=target.endswith(b"/"),
                               emptyComponent=any(not part for part in target.split(b"/")))
                      except (OSError, ValueError):
                          emit(alias_role, state="unavailable-or-unsupported", qualification=False)
                  boundary = app_path + b"/Contents/"
                  device = os.fstat(root).st_dev
                  stack, names = [root], []
                  pending = [b"Developer", b"usr", b"bin", b"altool"]
                  seen = set()
                  for _ in range(128):
                      need(pending and len(pending) <= 128 and
                           sum(len(v) + 1 for v in names + pending) <= 4096)
                      name = pending.pop(0)
                      if name in (b"", b"."):
                          continue
                      if name == b"..":
                          need(len(stack) > 1)
                          stack.pop(); names.pop()
                          continue
                      need(len(name) <= 255 and re.fullmatch(rb"[A-Za-z0-9._+@ -]+", name) is not None)
                      row = os.stat(name, dir_fd=stack[-1], follow_symlinks=False)
                      need(row.st_dev == device)
                      if stat.S_ISLNK(row.st_mode):
                          need(links < 8 and row.st_nlink == 1 and 1 <= row.st_size <= 1024)
                          key = (row.st_dev, row.st_ino)
                          need(key not in seen)
                          target = os.readlink(name, dir_fd=stack[-1])
                          need(identity(row) == identity(os.stat(name, dir_fd=stack[-1], follow_symlinks=False))
                               and len(target) == row.st_size and re.fullmatch(rb"[A-Za-z0-9._+@ /-]+", target) is not None)
                          seen.add(key); links += 1
                          if target.startswith(b"/"):
                              need(target.startswith(boundary))
                              target = target[len(boundary):]
                              stack, names = [root], []
                          pending = target.split(b"/") + pending
                          emit("altool-alias", index=links, uid=row.st_uid, gid=row.st_gid,
                               mode=format(row.st_mode, "#07o"), nlink=row.st_nlink, targetBytes=row.st_size)
                      elif pending:
                          stack.append(directory(name, stack[-1])); names.append(name)
                      else:
                          need(stat.S_ISREG(row.st_mode) and len(name) <= 128 and
                               re.fullmatch(rb"[A-Za-z0-9][A-Za-z0-9._+-]*", name) is not None)
                          emit("altool-physical", state="observed", basename=name.decode("ascii"),
                               aliases=links, uid=row.st_uid, gid=row.st_gid, mode=format(row.st_mode, "#07o"),
                               flags=getattr(row, "st_flags", 0), nlink=row.st_nlink, size=row.st_size,
                               executable=bool(row.st_mode & 0o111), qualification=False)
                          return
                  raise ValueError("unsupported-layout")
              except (OSError, ValueError):
                  emit("altool-physical", state="unavailable-or-unsupported", aliases=links, qualification=False)
              finally:
                  closed = True
                  for fd in reversed(opened):
                      try:
                          os.close(fd)
                      except OSError:
                          closed = False
                  emit("altool-observation-closes", known=closed, qualification=False)
                  if not closed:
                      raise SystemExit(1)

          def main():
              # Fixed public tool metadata only, not tool admission or execution.
              for name in ("pkgbuild", "lsbom", "tar", "bsdtar", "xar", "productbuild"):
                  path = "/usr/bin/" + name
                  row = observe("package-tool-" + name, path)
                  if row is not None and stat.S_ISLNK(row.st_mode):
                      try:
                          target = os.readlink(path)
                      except OSError:
                          emit("package-tool-alias-" + name, state="unavailable")
                      else:
                          emit("package-tool-alias-" + name, state="observed",
                               target=target if target in ("bsdtar", "/usr/bin/bsdtar") else "other",
                               qualification=False)
              # No contents, directory census, credentials, selected-path echo,
              # subprocesses, writes, or ACL/finality claims from these snapshots.
              observe("root", b"/")
              applications = observe("applications", b"/Applications")
              if applications is None or not stat.S_ISDIR(applications.st_mode):
                  return
              alias_path = b"/Applications/Xcode.app"
              alias = observe("selection", alias_path)
              if alias is None:
                  return
              app_path = alias_path
              if stat.S_ISLNK(alias.st_mode):
                  owner_ok = os.getuid() != 0 and alias.st_uid in (0, os.getuid())
                  size_ok = alias.st_nlink == 1 and 1 <= alias.st_size <= 1024
                  if not size_ok:
                      emit("selection-rule", ownerAccepted=owner_ok, shapeAccepted=False)
                      return
                  try:
                      target = os.readlink(alias_path)
                  except OSError:
                      emit("selection-rule", state="unavailable")
                      return
                  name = target.removeprefix(b"/Applications/")
                  shape_ok = (len(target) <= 1024 and len(name) <= 255 and name != b"Xcode.app"
                              and re.fullmatch(rb"Xcode[A-Za-z0-9._+-]*\.app", name) is not None)
                  emit("selection-rule", ownerAccepted=owner_ok, shapeAccepted=shape_ok)
                  if not shape_ok:
                      return
                  app_path = b"/Applications/" + name
              elif not stat.S_ISDIR(alias.st_mode):
                  return
              app = observe("selected-app", app_path)
              if app is None or not stat.S_ISDIR(app.st_mode):
                  return
              contents = observe("contents", app_path + b"/Contents")
              if contents is None or not stat.S_ISDIR(contents.st_mode):
                  return
              observe("developer", app_path + b"/Contents/Developer")
              altool_layout(app_path)

          main()
          PY

  store-runtime:
    # Explicit reuse only: no gem/Ruby/app rebuild, signing or automatic rerun.
    if: github.event_name == 'workflow_dispatch' && (inputs.component == 'store-runtime' || inputs.component == 'store-local-altool')
    name: Smoke signed Store runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-26","arch":"arm64","target":"aarch64-apple-darwin"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-26-intel","arch":"x86_64","target":"x86_64-apple-darwin"}]' || '[{"runner":"macos-26","arch":"arm64","target":"aarch64-apple-darwin"},{"runner":"macos-26-intel","arch":"x86_64","target":"x86_64-apple-darwin"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14.7'
      - name: Allocate one task-owned offline smoke directory
        id: work
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]] || exit 1
          [[ "$RUNNER_OS" == macOS && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == "$COMPONENT_ARCH" && "$(/usr/bin/id -u)" != 0 ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-store-smoke.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Restore only the SOURCE-selected successful signed Store component
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
          COMPONENT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077
          "$OWNER_PYTHON" -I -S -B desktop/tools/macos_store_component.py restore-selected \
            "$WORK_ROOT/component" --target "$COMPONENT_TARGET"
      - name: Verify signed runtime and focused offline Store regressions
        timeout-minutes: 10
        shell: bash
        env:
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
          COMPONENT_TARGET: ${{ matrix.target }}
          COMPONENT_ARCH: ${{ matrix.arch }}
          STORE_TEST_SCOPE: ${{ inputs.component }}
        run: |
          set -euo pipefail
          umask 077
          "$OWNER_PYTHON" -I -S -B - <<'PY'
          import importlib.util, json, os, re, resource, subprocess, sys, time, unicodedata
          from pathlib import Path
          checkout, work = Path.cwd(), Path(os.environ["WORK_ROOT"])
          target, arch = os.environ["COMPONENT_TARGET"], os.environ["COMPONENT_ARCH"]
          def load(name):
              spec = importlib.util.spec_from_file_location("_store_smoke_" + name, checkout / "desktop/tools" / (name + ".py"))
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              return module
          stager, prep, helper, signing = [load(name) for name in
              ("stage_macos_installed", "prepare_runtime", "macos_android_helper_package", "macos_store_signing")]
          capsule = work / "component"
          runtime = prep._root(capsule / "extracted/runtime")
          original = stager.store_component_inputs(capsule, target)
          expected = original[1]
          def snapshot():
              rows, directories = [], {}
              for path in prep.store_component_files(runtime, directories=directories):
                  with stager.parent(path) as (parent, leaf):
                      body, info = stager.read_at(parent, leaf, signing.FILE_LIMIT)
                  rows.append((path.relative_to(runtime).as_posix(), stager.digest(body), len(body)))
              stager.need(tuple(rows) == expected, "store-smoke-complete-extracted-bytes")
              return directories
          original_directories = snapshot()
          producer_path = checkout / helper.PRODUCER_PROFILE
          service_path = checkout / helper.PROFILE
          producer, service = stager.read(producer_path, 1024), stager.read(service_path, 1024)
          stager.packaging_signing_data(producer, service)
          identity = stager.service_signing_data(service)
          receipt = stager.decode(stager.read(capsule / "store-signed-receipt.json", 256 * 1024))
          native = receipt["nativeMembers"]
          stager.need(len(native) == signing.NATIVE_COUNT, "store-smoke-native-count")
          home = work / "home"
          home.mkdir(mode=0o700)
          clean = {"PATH": str(runtime / "bin") + ":/usr/bin:/bin", "HOME": str(home), "TMPDIR": str(home),
              "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC", "CI": "true",
              "FASTLANE_SKIP_UPDATE_CHECK": "1", "FASTLANE_OPT_OUT_USAGE": "1", "FASTLANE_HIDE_CHANGELOG": "1"}
          # One finite capture for the whole batch, not unbounded communicate().
          # subprocess.run kills and waits for its original child on timeout.
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          resource.setrlimit(resource.RLIMIT_FSIZE, (256 * 1024, 256 * 1024))
          phase, index = "signature", 0
          capture_path = work / "native-output.log"
          test_results = {}
          try:
              with capture_path.open("xb") as capture:
                  deadline = time.monotonic() + 180
                  for index, row in enumerate(native, 1):
                      name = row["path"]
                      stager.need(name.startswith("runtime/") and row["identifier"] == signing.identifier(name), "store-smoke-native-path")
                      requirement = helper.signing_requirement(identity, signing.identifier(name))
                      remaining = deadline - time.monotonic()
                      stager.need(remaining > 0, "store-smoke-signature-deadline")
                      subprocess.run(["/usr/bin/codesign", "--verify", "--strict", "--all-architectures",
                          "--test-requirement", "=" + requirement, str(capsule / "extracted" / name)],
                          stdin=subprocess.DEVNULL, stdout=capture, stderr=subprocess.STDOUT, env=clean,
                          cwd=home, check=True, timeout=min(30, remaining))
                  phase = "ruby"
                  # This is a loader smoke, not proof of general sandbox/API support.
                  profile = '(version 1) (allow default) (deny network*) (deny file-write* (subpath (param "RUNTIME")))'
                  subprocess.run(["/usr/bin/sandbox-exec", "-D", "RUNTIME=" + str(runtime), "-p", profile,
                      str(runtime / "bin/bundle"), "exec", "ruby", str(checkout / "desktop/tools/verify_macos_store_runtime.rb"),
                      str(runtime), arch, "projected-smoke"], stdin=subprocess.DEVNULL, stdout=capture,
                      stderr=subprocess.STDOUT, env=clean, cwd=home, check=True, timeout=90)
              # Same signed Ruby/locked gems, current project code, synthetic
              # providers only. Each original child is killed+joined on timeout.
              # Six finite256KiB captures avoid verbose fixtures exhausting a
              # shared stream; successes need only their Minitest counts.
              clean["MT_CPU"] = "1"
              suites = (
                  ("apple-lanes", "test_apple_lanes.rb", 40),
                  ("play-lanes", "test_play_lanes.rb", 60),
                  ("local-runtime", "test_local_store_execution_runtime.rb", 21),
                  ("apple-production", "test_apple_production.rb", 49),
                  ("lane-resources", "test_store_lane_resources.rb", 13),
                  ("lane-lifetime", "test_store_lane_lifetime.rb", 21),
              )
              selected = os.environ["STORE_TEST_SCOPE"]
              stager.need(selected in ("store-runtime", "store-local-altool"), "store-test-scope")
              test_filter = []
              if selected == "store-local-altool":
                  suites = (("local-altool-bridge", "test_apple_lanes.rb", 2),)
                  test_filter = ["-n", "/^test_local_ios_(original_pinned_bridge_constructor_key_parser_and_direct_send|lost_return_after_original_send_only_reads_back_without_resend)$/"]
              for phase, filename, expected_count in suites:
                  capture_path = work / (phase + ".log")
                  with capture_path.open("xb") as capture:
                      subprocess.run(["/usr/bin/sandbox-exec", "-D", "RUNTIME=" + str(runtime), "-p", profile,
                          str(runtime / "bin/bundle"), "exec", "ruby",
                          str(checkout / "tests/workflow" / filename), "--verbose", *test_filter],
                          stdin=subprocess.DEVNULL, stdout=capture, stderr=subprocess.STDOUT,
                          # The production suite exercises49 screenshot/recovery cases;
                          # its45s blanket budget timed out on Intel, not a case assertion.
                          # Keep a finite suite budget and print the exact slow/failing case.
                          env=clean, cwd=checkout, check=True, timeout=180 if phase == "apple-production" else 45)
                  output = stager.read(capture_path, 256 * 1024)
                  stager.need(re.search(rb"^" + str(expected_count).encode("ascii") +
                      rb" runs, [0-9]+ assertions, 0 failures, 0 errors, 0 skips$", output, re.MULTILINE) is not None,
                      "store-tests-" + phase + "-count")
                  test_results[phase] = expected_count
                  capture_path.unlink()  # Only this joined test's disposable output.
              phase = "post"
              stager.need(snapshot() == original_directories, "store-smoke-directory-original-post")
              stager.need(stager.store_component_inputs(capsule, target) == original
                  and stager.read(producer_path, 1024) == producer and stager.read(service_path, 1024) == service,
                  "store-smoke-source-input-post")
          except Exception as error:
              def diagnostic(value, maximum):
                  value = value.replace(str(work), "<work>").replace(str(checkout), "<checkout>")
                  value = "".join(char for char in value if not unicodedata.category(char).startswith("C"))
                  return value.encode("utf-8")[:maximum].decode("utf-8", "ignore")
              try:
                  tail = stager.read(capture_path, 256 * 1024)[-4096:].decode("utf-8", "replace")
                  tail = diagnostic(tail, 4096)
              except Exception as capture_error:
                  tail = "capture-unavailable:" + type(capture_error).__name__
              reason = diagnostic(str(error), 256) if isinstance(error, (stager.Refused, helper.Refused, signing.Refused)) else None
              print(json.dumps({"phase": phase, "nativeIndex": index, "errorType": type(error).__name__,
                  "returncode": getattr(error, "returncode", None), "reason": reason, "diagnosticTail": tail}), flush=True)
              raise SystemExit(1)
          print(json.dumps({"nativeVerified": len(native), "filesPostChecked": len(expected),
              "projectedCrc32FastlaneSmoke": "passed", "appleP256PemDerSigning": "passed",
              "networkDenied": True, "syntheticStoreTests": test_results, "liveStoreRun": False}))
          PY
      - name: Remove only this job's restored component and smoke scratch
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          "$OWNER_PYTHON" -I -S -B - <<'PY'
          import os, shutil, stat
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          info = work.lstat()
          assert work.parent == Path(os.environ["RUNNER_TEMP"]) and work.name.startswith("mrk-store-smoke.")
          assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o700
          shutil.rmtree(work)
          PY

  ios-tools:
    # Manual tool qualification only; no signed runtime/dependency/app rebuild.
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'ios-tools'
    name: Qualify iOS resolver and documented tool (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 42
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-26","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-26-intel","arch":"x86_64"}]' || '[{"runner":"macos-26","arch":"arm64"},{"runner":"macos-26-intel","arch":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned iOS tools directory
        id: work
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]] || exit 1
          [[ "$RUNNER_OS" == macOS && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == "$COMPONENT_ARCH" && "$(/usr/bin/id -u)" != 0 ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-ios-tools.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - *protected-xcode
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14.7'
      - name: Qualify selected Xcrun resolution and credential-free tool help
        timeout-minutes: 2
        shell: bash
        env:
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          "$OWNER_PYTHON" -I -S -B - <<'PY'
          import json, os, re, resource, sys, time, unicodedata
          from pathlib import Path
          checkout, work = Path.cwd(), Path(os.environ["WORK_ROOT"])
          sys.path.insert(0, str(checkout / "desktop/tools"))
          from ci_bounded_output import run_bounded
          home = work / "resolver-home"
          home.mkdir(mode=0o700)
          capture_path = None
          limit = 256 * 1024
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          resource.setrlimit(resource.RLIMIT_NOFILE, (256, 256))
          clean = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": str(home), "TMPDIR": str(home),
              "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC", "PYTHONDONTWRITEBYTECODE": "1",
              "PYTHONPATH": os.pathsep.join(str(checkout / path) for path in ("src", "tests", "tests/desktop"))}
          cases = (
              ("offline-resolver", "test_original_xcrun_resolution_post_and_close_before_pending_or_asc", True),
              ("online-help", "test_documented_xcrun_altool_help_returns_and_settles", False),
          )
          deadline = time.monotonic() + 90
          phase = "not-started"
          def output():
              with capture_path.open("rb") as capture:
                  raw = capture.read(limit + 1)
              if len(raw) > limit:
                  raise ValueError("resolver-capture-bound")
              return raw
          try:
              for phase, method, offline in cases:
                  # Apple's shim may fetch public Transporter defaults even for
                  # --help. This credential-free startup check is explicitly online;
                  # the resolver and synthetic Store tests remain network-denied.
                  profile = '(version 1) (allow default) ' + ('(deny network*) ' if offline else '')
                  profile += '(deny file-write* (subpath (param "CHECKOUT")))'
                  capture_path = work / (phase + "-output.log")
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError("resolver-and-help-aggregate-deadline")
                  run_bounded(["/usr/bin/sandbox-exec", "-D", "CHECKOUT=" + str(checkout), "-p", profile,
                      os.environ["OWNER_PYTHON"], "-B", "-m", "unittest", "-v",
                      "test_local_ios_store_execute_macos.IOSStoreResolverMacTests." + method],
                      capture_path=capture_path, env=clean, cwd=checkout, timeout=remaining, limit=limit)
                  if time.monotonic() >= deadline:
                      raise TimeoutError("resolver-and-help-aggregate-deadline")
                  if re.search(rb"\nRan 1 test in [0-9]+(?:\.[0-9]+)?s\n\nOK\n\Z", output()) is None:
                      raise ValueError("each-original-test-must-pass-without-skips")
          except Exception as error:
              try:
                  tail = output()[-4096:].decode("utf-8", "replace")
                  tail = tail.replace(str(work), "<work>").replace(str(checkout), "<checkout>")
                  tail = "".join(char for char in tail if not unicodedata.category(char).startswith("C"))
                  tail = tail.encode("utf-8")[:4096].decode("utf-8", "ignore")
              except Exception as capture_error:
                  tail = "capture-unavailable:" + type(capture_error).__name__
              print(json.dumps({"phase": phase, "errorType": type(error).__name__,
                  "returncode": getattr(error, "returncode", None), "diagnosticTail": tail}), flush=True)
              raise SystemExit(1)
          print(json.dumps({"originalXcrunResolver": "passed", "documentedAltoolHelp": "passed", "tests": 2, "skips": 0,
              "offlineResolverNetworkDenied": True, "helpNetworkDenied": False, "liveStoreRun": False}))
          PY
      - name: Remove only this job's iOS tools scratch
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import os, shutil, stat
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          info = work.lstat()
          assert work.parent == Path(os.environ["RUNNER_TEMP"]) and work.name.startswith("mrk-ios-tools.")
          assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o700
          shutil.rmtree(work)
          PY

  xcode-package-probe:
    # Explicit synthetic PackageKit or unsigned metadata only; no A/Xcode/signing.
    if: github.event_name == 'workflow_dispatch' && (inputs.component == 'xcode-package-probe' || inputs.component == 'xcode-product-metadata')
    name: Probe fixed Xcode package metadata (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-26","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-26-intel","arch":"x86_64"}]' || '[{"runner":"macos-26","arch":"arm64"},{"runner":"macos-26-intel","arch":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run only the selected fixed package probe
        timeout-minutes: 6
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
          PACKAGE_PROBE: ${{ inputs.component }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          ulimit -f 2048
          [[ "$RUNNER_OS" == macOS && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == "$COMPONENT_ARCH" && "$(/usr/bin/id -u)" != 0 ]] || exit 1
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp ]] || exit 1
          case "$PACKAGE_PROBE" in
            xcode-package-probe)
              marker=MRK_XCODE_SETUP_PACKAGE_PROBE=1
              method=XcodeSetupPackageNative.test_component_callback_once_reinstall_and_documented_timeout
              ;;
            xcode-product-metadata)
              marker=MRK_XCODE_PRODUCT_METADATA_PROBE=1
              method=XcodeSetupProductMetadataNative.test_unsigned_product_original_metadata_matches_production_parsers
              ;;
            *) exit 1 ;;
          esac
          log="$RUNNER_TEMP/mrk-xcode-package-probe-tests.log"
          set +e
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner LANG=C LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            "$marker" \
            /usr/bin/python3 -I -B tests/desktop/test_macos_xcode_setup_package.py -v \
              "$method" \
              > "$log" 2>&1
          status=$?
          set -e
          /usr/bin/tail -c 16384 "$log"
          [[ "$status" == 0 ]] || exit "$status"
          grep -Eq '^Ran 1 test in [0-9]+([.][0-9]+)?s$' "$log"
          grep -qx 'OK' "$log"
      - name: Retain only bounded public synthetic package observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-package-probe-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mrk-xcode-package-probe-tests.log
            ${{ runner.temp }}/mrk-xcode-package-probe/PackageInfo.xml
            ${{ runner.temp }}/mrk-xcode-package-probe/ProductTOC.xml
            ${{ runner.temp }}/mrk-xcode-package-probe/BOM.txt
            ${{ runner.temp }}/mrk-xcode-package-probe/Original.bom
            ${{ runner.temp }}/mrk-xcode-package-probe/Receipt-*.plist.raw
            ${{ runner.temp }}/mrk-xcode-package-probe/Receipt-*.plist.xml
            ${{ runner.temp }}/mrk-xcode-package-probe/Receipt-*.facts.json
            ${{ runner.temp }}/mrk-xcode-package-probe/Receipt-*.bom
            ${{ runner.temp }}/mrk-xcode-package-probe/RESULT.json
            ${{ runner.temp }}/mrk-xcode-package-probe/Failure.json
            ${{ runner.temp }}/mrk-xcode-product-metadata/PackageInfo.xml
            ${{ runner.temp }}/mrk-xcode-product-metadata/Distribution.xml
            ${{ runner.temp }}/mrk-xcode-product-metadata/ComponentTOC.xml
            ${{ runner.temp }}/mrk-xcode-product-metadata/ProductTOC.xml
            ${{ runner.temp }}/mrk-xcode-product-metadata/BOM.txt
            ${{ runner.temp }}/mrk-xcode-product-metadata/RESULT.json
            ${{ runner.temp }}/mrk-xcode-product-metadata/Failure.json
          if-no-files-found: error
          retention-days: 7
    # Only the test's positively observed same-attempt fixture is cleaned. On
    # timeout/failure preserve root state for disposable-host teardown; killing
    # an Installer client does not prove PackageKit service finality.

# No production Installer/Remover main, app launch, distribution signing or
# notarization runs. The explicit package probe alone installs/removes its fixed
# inert synthetic carrier; it does not execute the Xcode setup helper. The explicit Store job only verifies already-signed code
# and executes the network-denied CRC32/Fastlane loader smoke, never a Store lane.
# Installation/update/removal behavior still requires native integration tests.
