name: Mac native components

on:
  push:
    branches: [verify/desktop-macos-components]
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  pull_request:
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  workflow_dispatch:
    inputs:
      component:
        description: Compile only the changed native component
        type: choice
        default: all
        options: [all, launcher, installer, installer-recovery, app]

permissions:
  contents: read

concurrency:
  group: mac-native-component-${{ github.ref }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false

jobs:
  launcher:
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'launcher'
    name: Compile launcher (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned component directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-launcher-ci.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Build only the unsigned launcher component with the native SDK
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          bash desktop/native/macos-applications-launcher/build.sh \
            "$WORK_ROOT/Mobile Release Kit.app" "$TARGET_ARCH"
          plutil -lint "$WORK_ROOT/Mobile Release Kit.app/Contents/Info.plist"
          lipo "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" \
            -verify_arch "$TARGET_ARCH"
          # Public component linkage only: integration must use the actual
          # Swift SDK's library/rpath behavior, not guessed Mach-O policy.
          otool -L "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher"
          otool -l "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" |
            sed -n '/cmd LC_RPATH/,+3p'
      - name: Remove only this job's disposable component
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: rm -rf -- "$WORK_ROOT"

  installer-check:
    name: Check installer and remover (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'installer' || inputs.component == 'installer-recovery'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned compiler directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-installer-check.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Check exclusive native roles and test pure launcher logic
        shell: bash
        working-directory: desktop/src-tauri
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
          INSTALLER_CHECKS: ${{ inputs.component }}
        run: |
          set -euo pipefail
          export CARGO_HOME="$WORK_ROOT/cargo" RUSTUP_HOME="$WORK_ROOT/rustup"
          export CARGO_TARGET_DIR="$WORK_ROOT/target" CARGO_INCREMENTAL=0
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0
          # This is the existing reviewed native clock tuple on both Macs.
          # 1.98.0 is supported only on Intel, not Apple Silicon.
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          # Separate invocations keep the two mutually exclusive roles distinct;
          # dependencies are compiled once in this job's shared target directory.
          if [[ "$INSTALLER_CHECKS" != installer-recovery ]]; then
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-installer --bin mrk-macos-install
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-remover --bin mrk-macos-remove
          fi
          # Only launcher and existing recovery-contract byte/data tests run. The Installer main, live
          # filesystem adapter and removal entry point are not invoked.
          tests=(installer::worker::tests::private_frames_require_fixed_binding_shapes_bounds_and_no_future_finality)
          # Use only for a recovery-test-only correction after both native roles
          # and launcher tests already passed; normal runs keep their full scope.
          if [[ "$INSTALLER_CHECKS" != installer-recovery ]]; then
            tests+=(installer::applications::tests::)
          fi
          rustup run 1.98.1 cargo test --locked --no-default-features \
            --features macos-installed-installer --bin mrk-macos-install -- \
            "${tests[@]}" --test-threads=1
      - name: Remove only this job's disposable compiler and dependencies
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: rm -rf -- "$WORK_ROOT"

  app-check:
    # This targeted path checks the real packaged Tauri graph without producing
    # another signed/notarized package or rebuilding unrelated native helpers.
    if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'app')
    name: Compile packaged app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            release: macos26-arm64-desktop-02
          - runner: macos-26-intel
            arch: x86_64
            release: macos26-x86_64-desktop-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
      - name: Allocate task-owned app compiler directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-app-check.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Compile frontend and actual packaged desktop image
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
          MRK_IMAGE_RELEASE_ID: ${{ matrix.release }}
          MACOSX_DEPLOYMENT_TARGET: '26.0'
        run: |
          set -euo pipefail
          export CARGO_HOME="$WORK_ROOT/cargo" RUSTUP_HOME="$WORK_ROOT/rustup"
          export CARGO_TARGET_DIR="$WORK_ROOT/target" CARGO_INCREMENTAL=0
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0
          export npm_config_cache="$WORK_ROOT/npm-cache"
          npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
          npm --prefix desktop run build
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          # Includes actual Tauri command/ACL generation, Mac-only modules and
          # linker/framework resolution; no live app, Store or signing action.
          rustup run 1.98.1 cargo build --locked --lib \
            --manifest-path desktop/helpers/macos-desktop-image/Cargo.toml
      - name: Remove only this job's app compiler and frontend outputs
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          assert work.parent == Path(os.environ["RUNNER_TEMP"])
          assert work.name.startswith("mrk-app-check.") and not work.is_symlink()
          for path in (work, Path("desktop/node_modules"), Path("desktop/dist")):
              if path.exists():
                  assert path.is_dir() and not path.is_symlink()
                  shutil.rmtree(path)
          PY

# No Installer/Remover main runs. Only named inert byte/data unit tests execute.
# Standard compiler/build scripts execute,
# but no application launch, private runtime, privileged installation, signing
# or notarization is involved. Runtime and
# installation/update/removal behavior still require native integration tests.
