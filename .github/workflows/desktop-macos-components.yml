name: Mac native components

on:
  push:
    branches: [verify/desktop-macos-components]
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/src/macos_noop_recovery_native.rs
      - desktop/src-tauri/src/macos_restore_recovery_native.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  pull_request:
    paths:
      - desktop/native/macos-applications-launcher/**
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/icons/icon.png
      - desktop/src-tauri/src/macos_applications*.rs
      - desktop/src-tauri/src/bin/macos_install.rs
      - desktop/src-tauri/src/macos_install*.rs
      - desktop/src-tauri/src/macos_noop_recovery_native.rs
      - desktop/src-tauri/src/macos_restore_recovery_native.rs
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/Cargo.lock
      - desktop/src-tauri/build.rs
      - desktop/native/macos-installed-native/**
      - .github/workflows/desktop-macos-components.yml
  workflow_dispatch:
    inputs:
      component:
        description: Check only the selected native component
        type: choice
        default: all
        options: [all, integration, launcher, installer, installer-tests, installer-recovery, installer-frames, installer-restore-fixtures, installer-restore-chain, app, app-contracts, local-keychain, ui-build, store-runtime]

permissions:
  contents: read

concurrency:
  group: mac-native-component-${{ github.ref }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false

jobs:
  launcher:
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'launcher'
    name: Compile launcher (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned component directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-launcher-ci.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Build only the unsigned launcher component with the native SDK
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          bash desktop/native/macos-applications-launcher/build.sh \
            "$WORK_ROOT/Mobile Release Kit.app" "$TARGET_ARCH"
          plutil -lint "$WORK_ROOT/Mobile Release Kit.app/Contents/Info.plist"
          lipo "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" \
            -verify_arch "$TARGET_ARCH"
          # Public component linkage only: integration must use the actual
          # Swift SDK's library/rpath behavior, not guessed Mach-O policy.
          otool -L "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher"
          otool -l "$WORK_ROOT/Mobile Release Kit.app/Contents/MacOS/mrk-macos-launcher" |
            sed -n '/cmd LC_RPATH/,+3p'
      - name: Remove only this job's disposable component
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: rm -rf -- "$WORK_ROOT"

  installer-check:
    name: ${{ inputs.component == 'installer-restore-chain' && 'Test Restore chain observer' || inputs.component == 'installer-restore-fixtures' && 'Check Restore fixtures' || inputs.component == 'installer-tests' && 'Test installer contracts' || inputs.component == 'installer-frames' && 'Test installer frames' || inputs.component == 'installer-recovery' && 'Test installer recovery' || 'Check installer and remover' }} (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'integration' || inputs.component == 'installer' || inputs.component == 'installer-tests' || inputs.component == 'installer-recovery' || inputs.component == 'installer-frames' || inputs.component == 'installer-restore-fixtures' || inputs.component == 'installer-restore-chain'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned compiler directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-installer-check.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Check exclusive native roles and test pure launcher logic
        shell: bash
        working-directory: desktop/src-tauri
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
          INSTALLER_CHECKS: ${{ inputs.component }}
        run: |
          set -euo pipefail
          export CARGO_HOME="$WORK_ROOT/cargo" RUSTUP_HOME="$WORK_ROOT/rustup"
          export CARGO_TARGET_DIR="$WORK_ROOT/target" CARGO_INCREMENTAL=0
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0
          # This is the existing reviewed native clock tuple on both Macs.
          # 1.98.0 is supported only on Intel, not Apple Silicon.
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          if [[ "$INSTALLER_CHECKS" == installer-restore-chain ]]; then
            # Fixed observer DATA only. Previously checked writer-cut graphs
            # and ordinary installer contracts are unchanged and not repeated.
            export MRK_APP_ABSENCE_FIXTURE_SOURCE_COMMIT="$GITHUB_SHA"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ID="$GITHUB_RUN_ID"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --features macos-installed-restore-chain-observer --bin mrk-macos-app-absence-fixture -- \
              installer::worker::app_absence_fixture::tests:: --test-threads=1 \
              | tee "$WORK_ROOT/restore-chain-observer-tests.log"
            grep -Eq '^test result: ok\. 6 passed; 0 failed; 0 ignored;' "$WORK_ROOT/restore-chain-observer-tests.log"
            exit 0
          fi
          if [[ "$INSTALLER_CHECKS" == installer-restore-fixtures ]]; then
            # Compile only: these fixed fault-injection programs never execute.
            # Reuse one dependency/target directory for their exclusive graphs.
            for cut in app-write own-attempt stage-move; do
              rustup run 1.98.1 cargo check --locked --no-default-features \
                --features "macos-installed-restore-$cut-fixture" --bin mrk-macos-install
            done
            # Test the observer's DATA contract, not its privileged entrypoint.
            export MRK_APP_ABSENCE_FIXTURE_SOURCE_COMMIT="$GITHUB_SHA"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ID="$GITHUB_RUN_ID"
            export MRK_APP_ABSENCE_FIXTURE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --features macos-installed-app-absence-fixture --bin mrk-macos-app-absence-fixture -- \
              installer::worker::app_absence_fixture::tests::actual_restore_requires_new_app_and_exact_initial_history \
              --exact --test-threads=1 | tee "$WORK_ROOT/restore-fixture-contract-tests.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$WORK_ROOT/restore-fixture-contract-tests.log"
            exit 0
          fi
          # Separate invocations keep the two mutually exclusive roles distinct;
          # dependencies are compiled once in this job's shared target directory.
          # Fixture-only fixes reuse passed normal-role compilation. Still run
          # every installer contract and Restore transaction test below.
          if [[ "$INSTALLER_CHECKS" != installer-tests && "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-installer --bin mrk-macos-install
            rustup run 1.98.1 cargo check --locked --no-default-features \
              --features macos-installed-remover --bin mrk-macos-remove
          fi
          # Named launcher/path/recovery DATA tests and one original-reader
          # test on exclusive user-owned temporary files. No Installer main,
          # root destination, signing or remover execution.
          tests=(installer::worker::tests::private_frames_require_fixed_binding_shapes_bounds_and_no_future_finality
                 installer::maintenance::noop_recovery::tests::preserved_prefix_transport_is_closed_without_relaxing_ordinary_controls
                 installer::maintenance::noop_recovery::tests::completed_recovery_snapshot_rehome_requires_receipt_bound_originals_and_prefixes)
          # Use only for a recovery-test-only correction after both native roles
          # and launcher tests already passed; normal runs keep their full scope.
          expected_tests=3
          if [[ "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            tests+=(installer::applications::tests::
                    installer::maintenance::store_path_tests::contextual_store_paths_keep_copy_recovery_and_removal_scoped
                    installer::maintenance::restore_recovery::
                    installer::tests::collected_inventory_uses_original_reader_with_exact_bound_and_post)
            expected_tests=17
          fi
          if [[ "$INSTALLER_CHECKS" == installer-frames ]]; then
            tests=(installer::worker::tests::private_frames_require_fixed_binding_shapes_bounds_and_no_future_finality)
            expected_tests=1
          fi
          rustup run 1.98.1 cargo test --locked --no-default-features \
            --features macos-installed-installer --bin mrk-macos-install -- \
            "${tests[@]}" --test-threads=1 | tee "$WORK_ROOT/installer-contract-tests.log"
          grep -Eq "^test result: ok\. $expected_tests passed; 0 failed; 0 ignored;" "$WORK_ROOT/installer-contract-tests.log"
          if [[ "$INSTALLER_CHECKS" != installer-recovery && "$INSTALLER_CHECKS" != installer-frames ]]; then
            # Same dependency/target owner, separate pure transaction DATA target.
            # Neither this test filter nor the bin tests execute Installer main.
            rustup run 1.98.1 cargo test --locked --no-default-features --lib -- \
              macos_install_transaction::tests::restore_ \
              macos_install_transaction::tests::retained_storage_and_original_budget_arithmetic_refuse_before_effects \
              --test-threads=1 | tee "$WORK_ROOT/installer-restore-transaction-tests.log"
            grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$WORK_ROOT/installer-restore-transaction-tests.log"
          fi
      - name: Remove only this job's disposable compiler and dependencies
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: rm -rf -- "$WORK_ROOT"

  app-check:
    # This targeted path checks the real packaged Tauri graph without producing
    # another signed/notarized package or rebuilding unrelated native helpers.
    if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'integration' || inputs.component == 'app' || inputs.component == 'app-contracts' || inputs.component == 'local-keychain')
    name: ${{ inputs.component == 'local-keychain' && 'Check local Keychain integration' || inputs.component == 'app-contracts' && 'Test Mac Store contracts' || 'Compile packaged app' }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            release: macos26-arm64-desktop-02
          - runner: macos-26-intel
            arch: x86_64
            release: macos26-x86_64-desktop-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.component != 'app-contracts'
        with:
          node-version: '24.20.0'
      - name: Allocate task-owned app compiler directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/mrk-app-check.XXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: ${{ inputs.component == 'local-keychain' && 'Check app and isolated Keychain helper graphs with focused contracts' || inputs.component == 'app-contracts' && 'Test two Mac Store contracts only' || 'Compile packaged app and test Mac Store contracts' }}
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
          MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
          MRK_IMAGE_RELEASE_ID: ${{ matrix.release }}
          MACOSX_DEPLOYMENT_TARGET: '26.0'
          APP_CHECKS: ${{ inputs.component }}
        run: |
          set -euo pipefail
          export CARGO_HOME="$WORK_ROOT/cargo" RUSTUP_HOME="$WORK_ROOT/rustup"
          export CARGO_TARGET_DIR="$WORK_ROOT/target" CARGO_INCREMENTAL=0
          export CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0
          export npm_config_cache="$WORK_ROOT/npm-cache"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          if [[ "$APP_CHECKS" != app-contracts ]]; then
            npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
            npm --prefix desktop run build
            # Actual packaged graph including command/ACL generation and native
            # linking. Never enable the test harness in this shipping image role.
            if [[ "$APP_CHECKS" == local-keychain ]]; then
              # Real Rust/Objective-C compilation, without linking another app.
              rustup run 1.98.1 cargo check --locked --lib \
                --manifest-path desktop/helpers/macos-desktop-image/Cargo.toml
            else
              rustup run 1.98.1 cargo build --locked --lib \
                --manifest-path desktop/helpers/macos-desktop-image/Cargo.toml
            fi
          fi
          if [[ "$APP_CHECKS" == local-keychain ]]; then
            # Separate Cargo invocation preserves helper-only native policy.
            # Closed DATA/DocumentState/driver contracts plus an owned temporary
            # directory and fixed child processes for real Darwin lease tests.
            # No Keychain credentials, Document admission or Installer work.
            export CARGO_PROFILE_TEST_DEBUG=0
            # The role symbol is deliberately defined by the real helper main,
            # not by its dependency's standalone libtest executable. Link the
            # actual helper; run portable wire tests in the ordinary native graph.
            # Never add a permissive role stub or unresolved-symbol linker flag.
            rustup run 1.98.1 cargo build --locked \
              --manifest-path desktop/helpers/macos-vault-helper/Cargo.toml
            rustup run 1.98.1 cargo test --locked \
              --manifest-path desktop/native/macos-installed-native/Cargo.toml --lib -- \
              local_keychain_wire::tests::local_exact_context_and_legacy_discriminator \
              local_keychain_wire::tests::lookup_never_transports_a_proposal_and_bounds_are_original \
              local_keychain_wire::tests::syntax_cannot_create_absence_or_value_and_context_cannot_alias \
              local_keychain_wire::tests::positive_absence_is_local_probe_only_and_never_a_key \
              local_keychain_wire::tests::local_lease_root_bounds_and_legacy_exact_request_length \
              local_project_lease::tests::kernel_same_ofd_survives_participant_exit \
              local_project_lease::tests::kernel_inherited_root_and_cloexec_refuse \
              --exact --test-threads=1 | tee "$WORK_ROOT/local-keychain-wire-tests.log"
            grep -Eq '^test result: ok\. 7 passed; 0 failed; 0 ignored;' "$WORK_ROOT/local-keychain-wire-tests.log"
            rustup run 1.98.1 cargo test --locked --no-default-features \
              --manifest-path desktop/src-tauri/Cargo.toml --lib -- \
              vault_keyring_macos::tests::local_failure_and_wrong_domain_never_mint_absence_or_vault_key \
              vault_keyring_macos::tests::local_unknown_close_and_late_join_cannot_publish_or_refund \
              asset_session::local_history::tests::local_release_history_needs_registered_project_not_credential_context \
              local_release_history_protocol::tests::local_release_history_real_decoder_requires_complete_closed_phase_sequence \
              local_release_history_protocol::tests::local_release_history_original_nonce_replay_and_truncated_terminal_refuse \
              local_release_history_protocol::tests::local_release_history_public_summary_cannot_hide_recovery_or_exceed_journal_bound \
              local_release_history_protocol::tests::local_release_history_candidate_context_and_consent_are_action_specific \
              local_release_history_protocol::tests::local_release_history_candidate_summary_cannot_create_old_finality_or_change_roster \
              local_release_history_protocol::tests::local_release_history_candidate_phases_bind_successor_and_terminal_head \
              android_build_protocol::tests::candidate_create_exact_consent_uuid_and_old_signed_domain \
              android_build_protocol::tests::candidate_create_four_phases_fourteen_frames_match_original_selection \
              android_build_protocol::tests::candidate_create_rejects_early_build_replayed_context_and_unfinished_success \
              android_build_protocol::tests::candidate_create_source_only_failure_and_stop_before_ready_keep_real_ledger \
              saved_command_owner::local_history::native::tests::local_release_history_candidate_helper_rosters_never_enroll \
              saved_command_owner::local_history::native::tests::local_candidate_create_helpers_cannot_enroll_or_skip_checkpoint \
              saved_command_owner::local_history::candidate_route_tests::local_candidate_create_phase_events_are_not_acknowledged_native_completion \
              asset_session::android_signing::candidate_material_tests::local_candidate_create_comparison_material_cannot_mint_document_grant \
              local_release_history_protocol::local_release_history_cleanup_tests::local_release_history_healthy_cleanup_does_not_manufacture_failure \
              saved_command_owner::local_history::native::tests::local_release_history_pre_admission_refusal_has_no_worker_to_join \
              installed_runtime::local_history_runtime_audit_requires_original_claim_and_cleanup_clock \
              --exact --test-threads=1 | tee "$WORK_ROOT/local-keychain-owner-tests.log"
            grep -Eq '^test result: ok\. 20 passed; 0 failed; 0 ignored;' "$WORK_ROOT/local-keychain-owner-tests.log"
            exit 0
          fi
          # The same Mac Store implementation is in the headless library graph.
          # Run only these two memory-only contracts, not the shipping image ABI.
          # Neither test inspects files, allocates native frames or starts work.
          rustup run 1.98.1 cargo test --locked --no-default-features \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --lib -- \
            installed_runtime::store_runtime::tests::store_cleanup_points_ignore_work_stop_but_keep_original_expiry_and_failures \
            installed_runtime::store_runtime::tests::store_slots_do_not_lend_uninspected_or_settled_sources \
            --exact --test-threads=1 | tee "$WORK_ROOT/store-contract-tests.log"
          grep -Eq '^test result: ok\. 2 passed; 0 failed; 0 ignored;' "$WORK_ROOT/store-contract-tests.log"
      - name: Remove only this job's app compiler and frontend outputs
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          assert work.parent == Path(os.environ["RUNNER_TEMP"])
          assert work.name.startswith("mrk-app-check.") and not work.is_symlink()
          for path in (work, Path("desktop/node_modules"), Path("desktop/dist")):
              if path.exists():
                  assert path.is_dir() and not path.is_symlink()
                  shutil.rmtree(path)
          PY

  store-runtime:
    # Explicit reuse only: no gem/Ruby/app rebuild, signing or automatic rerun.
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'store-runtime'
    name: Smoke signed Store runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14.7'
      - name: Allocate one task-owned offline smoke directory
        id: work
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]] || exit 1
          [[ "$RUNNER_OS" == macOS && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == "$COMPONENT_ARCH" && "$(/usr/bin/id -u)" != 0 ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-store-smoke.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Restore only the SOURCE-selected successful signed Store component
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
          COMPONENT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077
          "$OWNER_PYTHON" -I -S -B desktop/tools/macos_store_component.py restore-selected \
            "$WORK_ROOT/component" --target "$COMPONENT_TARGET"
      - name: Verify every Developer ID image before one offline Ruby smoke
        timeout-minutes: 6
        shell: bash
        env:
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
          COMPONENT_TARGET: ${{ matrix.target }}
          COMPONENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          "$OWNER_PYTHON" -I -S -B - <<'PY'
          import importlib.util, json, os, resource, subprocess, sys, time, unicodedata
          from pathlib import Path
          checkout, work = Path.cwd(), Path(os.environ["WORK_ROOT"])
          target, arch = os.environ["COMPONENT_TARGET"], os.environ["COMPONENT_ARCH"]
          def load(name):
              spec = importlib.util.spec_from_file_location("_store_smoke_" + name, checkout / "desktop/tools" / (name + ".py"))
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              return module
          stager, prep, helper, signing = [load(name) for name in
              ("stage_macos_installed", "prepare_runtime", "macos_android_helper_package", "macos_store_signing")]
          capsule = work / "component"
          runtime = prep._root(capsule / "extracted/runtime")
          original = stager.store_component_inputs(capsule, target)
          expected = original[1]
          def snapshot():
              rows, directories = [], {}
              for path in prep.store_component_files(runtime, directories=directories):
                  with stager.parent(path) as (parent, leaf):
                      body, info = stager.read_at(parent, leaf, signing.FILE_LIMIT)
                  rows.append((path.relative_to(runtime).as_posix(), stager.digest(body), len(body)))
              stager.need(tuple(rows) == expected, "store-smoke-complete-extracted-bytes")
              return directories
          original_directories = snapshot()
          producer_path = checkout / helper.PRODUCER_PROFILE
          service_path = checkout / helper.PROFILE
          producer, service = stager.read(producer_path, 1024), stager.read(service_path, 1024)
          stager.packaging_signing_data(producer, service)
          identity = stager.service_signing_data(service)
          receipt = stager.decode(stager.read(capsule / "store-signed-receipt.json", 256 * 1024))
          native = receipt["nativeMembers"]
          stager.need(len(native) == signing.NATIVE_COUNT, "store-smoke-native-count")
          home = work / "home"
          home.mkdir(mode=0o700)
          clean = {"PATH": str(runtime / "bin") + ":/usr/bin:/bin", "HOME": str(home), "TMPDIR": str(home),
              "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC", "CI": "true",
              "FASTLANE_SKIP_UPDATE_CHECK": "1", "FASTLANE_OPT_OUT_USAGE": "1", "FASTLANE_HIDE_CHANGELOG": "1"}
          # One finite capture for the whole batch, not unbounded communicate().
          # subprocess.run kills and waits for its original child on timeout.
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          resource.setrlimit(resource.RLIMIT_FSIZE, (256 * 1024, 256 * 1024))
          phase, index = "signature", 0
          try:
              with (work / "native-output.log").open("xb") as capture:
                  deadline = time.monotonic() + 180
                  for index, row in enumerate(native, 1):
                      name = row["path"]
                      stager.need(name.startswith("runtime/") and row["identifier"] == signing.identifier(name), "store-smoke-native-path")
                      requirement = helper.signing_requirement(identity, signing.identifier(name))
                      remaining = deadline - time.monotonic()
                      stager.need(remaining > 0, "store-smoke-signature-deadline")
                      subprocess.run(["/usr/bin/codesign", "--verify", "--strict", "--all-architectures",
                          "--test-requirement", "=" + requirement, str(capsule / "extracted" / name)],
                          stdin=subprocess.DEVNULL, stdout=capture, stderr=subprocess.STDOUT, env=clean,
                          cwd=home, check=True, timeout=min(30, remaining))
                  phase = "ruby"
                  # This is a loader smoke, not proof of general sandbox/API support.
                  profile = '(version 1) (allow default) (deny network*) (deny file-write* (subpath (param "RUNTIME")))'
                  subprocess.run(["/usr/bin/sandbox-exec", "-D", "RUNTIME=" + str(runtime), "-p", profile,
                      str(runtime / "bin/bundle"), "exec", "ruby", str(checkout / "desktop/tools/verify_macos_store_runtime.rb"),
                      str(runtime), arch, "projected-smoke"], stdin=subprocess.DEVNULL, stdout=capture,
                      stderr=subprocess.STDOUT, env=clean, cwd=home, check=True, timeout=90)
              phase = "post"
              stager.need(snapshot() == original_directories, "store-smoke-directory-original-post")
              stager.need(stager.store_component_inputs(capsule, target) == original
                  and stager.read(producer_path, 1024) == producer and stager.read(service_path, 1024) == service,
                  "store-smoke-source-input-post")
          except Exception as error:
              def diagnostic(value, maximum):
                  value = value.replace(str(work), "<work>").replace(str(checkout), "<checkout>")
                  value = "".join(char for char in value if not unicodedata.category(char).startswith("C"))
                  return value.encode("utf-8")[:maximum].decode("utf-8", "ignore")
              try:
                  tail = stager.read(work / "native-output.log", 256 * 1024)[-4096:].decode("utf-8", "replace")
                  tail = diagnostic(tail, 4096)
              except Exception as capture_error:
                  tail = "capture-unavailable:" + type(capture_error).__name__
              reason = diagnostic(str(error), 256) if isinstance(error, (stager.Refused, helper.Refused, signing.Refused)) else None
              print(json.dumps({"phase": phase, "nativeIndex": index, "errorType": type(error).__name__,
                  "returncode": getattr(error, "returncode", None), "reason": reason, "diagnosticTail": tail}), flush=True)
              raise SystemExit(1)
          print(json.dumps({"nativeVerified": len(native), "filesPostChecked": len(expected),
              "projectedCrc32FastlaneSmoke": "passed", "networkDenied": True, "storeLaneRun": False}))
          PY
      - name: Remove only this job's restored component and smoke scratch
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          OWNER_PYTHON: ${{ steps.python.outputs.python-path }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          "$OWNER_PYTHON" -I -S -B - <<'PY'
          import os, shutil, stat
          from pathlib import Path
          work = Path(os.environ["WORK_ROOT"])
          info = work.lstat()
          assert work.parent == Path(os.environ["RUNNER_TEMP"]) and work.name.startswith("mrk-store-smoke.")
          assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o700
          shutil.rmtree(work)
          PY

  ui-build:
    # Compile the existing external XCTest target, never run it or build its app.
    if: github.event_name == 'workflow_dispatch' && inputs.component == 'ui-build'
    name: Compile external UI tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate one task-owned XCTest compiler directory
        id: work
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_OS" == macOS && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == "$COMPONENT_ARCH" && "$(/usr/bin/id -u)" != 0 ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-ui-build.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          /bin/mkdir -m 700 "$root/tmp"
      - name: Build only the existing XCTest runner with the native Xcode SDK
        timeout-minutes: 6
        shell: bash
        env:
          COMPONENT_ARCH: ${{ matrix.arch }}
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          destination=platform=macOS
          build_settings=(COMPILER_INDEX_STORE_ENABLE=NO)
          case "$COMPONENT_ARCH" in
            arm64) destination=platform=macOS,arch=arm64 ;;
            x86_64) build_settings+=(ARCHS=x86_64) ;;
            *) exit 1 ;;
          esac
          # Existing project ad-hoc signing settings stay unchanged; no identity
          # import, app-under-test dependency, package/install action or test run.
          TMPDIR="$WORK_ROOT/tmp/" /usr/bin/xcodebuild build-for-testing \
            -project desktop/native/macos-normal-ui/MRKNormalAppUI.xcodeproj -scheme MRKNormalAppUI \
            -configuration Debug -destination "$destination" -destination-timeout 15 \
            -derivedDataPath "$WORK_ROOT/DerivedData" -jobs 2 -disableAutomaticPackageResolution \
            "${build_settings[@]}"
      - name: Remove only this job's XCTest compiler outputs
        if: always() && steps.work.outputs.root != ''
        shell: bash
        env:
          WORK_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          [[ "$WORK_ROOT" == "$RUNNER_TEMP"/mrk-ui-build.???????? && -d "$WORK_ROOT" && ! -L "$WORK_ROOT" ]] || exit 1
          [[ "$(/usr/bin/stat -f '%u:%Lp' "$WORK_ROOT")" == "$(/usr/bin/id -u):700" ]] || exit 1
          /bin/rm -rf -- "$WORK_ROOT"

# No Installer/Remover main, app launch, privileged installation, distribution
# signing or notarization runs. XCTest uses its existing ad-hoc project signing. The explicit Store job only verifies already-signed code
# and executes the network-denied CRC32/Fastlane loader smoke, never a Store lane.
# Installation/update/removal behavior still requires native integration tests.
