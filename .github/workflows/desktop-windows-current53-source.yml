name: Windows current12/53 selected SOURCE verification

on:
  push:
    branches: [verify/desktop-windows-current53-source-20261002]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit on the fixed verification branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-current53-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-current53-source:
    name: Windows MSVC / two compile-only originals and selected DATA contracts
    if: >-
      github.ref == 'refs/heads/verify/desktop-windows-current53-source-20261002' &&
      github.workflow_sha == github.sha &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha))
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: windows
      MRK_DESKTOP_HOSTED_CHECKS: windows-current53-source-v1
      MRK_DESKTOP_DISPATCH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'windows-current53-source' || '' }}
      MRK_DESKTOP_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require first-push or explicit-SHA dispatch from this exact workflow commit
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          refuse() { printf '%s\n' "MRK_WINDOWS_CURRENT53_ROUTE_REFUSED=$1" >&2; exit 1; }
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted &&
             "${RUNNER_OS:-}" == Windows && "${RUNNER_ARCH:-}" == X64 &&
             "${ImageOS:-}" == win25-vs2026 ]] || refuse runner
          [[ "${GITHUB_JOB:-}" == windows-current53-source &&
             "${GITHUB_RUN_ATTEMPT:-}" == 1 ]] || refuse original
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ &&
             "${GITHUB_SHA:-}" != 0000000000000000000000000000000000000000 &&
             "${GITHUB_WORKFLOW_SHA:-}" == "${GITHUB_SHA:-}" ]] || refuse source
          [[ "${GITHUB_REF:-}" == refs/heads/verify/desktop-windows-current53-source-20261002 &&
             "${GITHUB_WORKFLOW_REF:-}" == "${GITHUB_REPOSITORY:-}/.github/workflows/desktop-windows-current53-source.yml@${GITHUB_REF:-}" ]] || refuse workflow
          if [[ "${GITHUB_EVENT_NAME:-}" == push ]]; then
            [[ -z "${MRK_DESKTOP_DISPATCH_SCOPE:-}" &&
               -z "${MRK_DESKTOP_EXPECTED_SHA:-}" ]] || refuse push
          else
            [[ "${GITHUB_EVENT_NAME:-}" == workflow_dispatch &&
               "${MRK_DESKTOP_DISPATCH_SCOPE:-}" == windows-current53-source &&
               "${MRK_DESKTOP_EXPECTED_SHA:-}" == "${GITHUB_SHA:-}" ]] || refuse dispatch
          fi
      - name: Check out the same workflow and candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Bind source selectors and one private original root
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_windows_current53_source.py prepare'
      - name: Acquire only the locked native/app current-feature Windows graphs
        timeout-minutes: 16
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_windows_current53_source.py acquire'
      - name: Compile native and app originals without running libtests
        timeout-minutes: 20
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_windows_current53_source.py compile'
      - name: Run exactly 2 native and 8 app current-feature DATA contracts
        if: success()
        timeout-minutes: 4
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_windows_current53_source.py windows-current53-contracts'
      - name: Retain bounded original DATA only, even on failure
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 2
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_windows_current53_source.py retain'
      - name: Upload only whitelisted DATA, never binaries or private runtime roots
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-current53-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.root }}/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
