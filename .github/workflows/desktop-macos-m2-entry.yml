name: Desktop macOS synthetic entry startup diagnostic

on:
  push:
    branches: [verify/desktop-macos-m2-entry]

permissions:
  contents: read

concurrency:
  group: desktop-macos-m2-entry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entry-feasibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-m2-entry'
    runs-on: macos-26
    timeout-minutes: 7
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit the single credential-free synthetic route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]] || exit 1
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-macos-m2-entry ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_SHA" == '${{ github.event.after }}' ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-m2-entry.yml@$GITHUB_REF" ]] || exit 1
          machine="$(/usr/bin/uname -m)" || exit $?
          version="$(/usr/bin/sw_vers -productVersion)" || exit $?
          account="$(/usr/bin/id -u)" || exit $?
          [[ "$machine" == arm64 && "$version" == 26.* && "$account" != 0 ]] || exit 1
      - name: Check out exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the DATA adapter interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Observe one original LaunchServices entry with payload absent
        id: observation
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          root="/private/tmp/mrk-macos-m2-entry-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$root" && ! -L "$root" ]] || exit 1
          printf 'evidence=%s/evidence\n' "$root" >> "$GITHUB_OUTPUT" || exit $?
          head="$(git -c core.fsmonitor=false rev-parse HEAD)" || exit $?
          status="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignored)" || exit $?
          [[ "$head" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$status" ]] || exit 1
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_m2_entry_feasibility.py
      - name: Confirm the original source stayed unchanged
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          head="$(git -c core.fsmonitor=false rev-parse HEAD)" || exit $?
          status="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignored)" || exit $?
          [[ "$head" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$status" ]] || exit 1
      - name: Retain only the normalized synthetic observation
        if: always() && steps.observation.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-m2-entry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.observation.outputs.evidence }}/result.json
          if-no-files-found: error
          retention-days: 14
