name: Disposable macOS 26 issuer comparison with TLS server policy

on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

jobs:
  compare-issuer-clients:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-native-issuer-system' &&
      inputs.verification_target == 'macos'
    runs-on: macos-26
    timeout-minutes: 6
    env:
      REVIEWED_SOURCE: c47ac447531bbc8426ec766907263e17f330e907
      REVIEWED_TREE: 202803431c745eacd7476c240f999c17734f99bf
    steps:
      - name: Admit a disposable macOS 26 ARM64 runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(id -u)" != 0 ]]
          [[ "$(sw_vers -productVersion)" == 26.* ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Observe issuer behavior on exactly the reviewed source
        env:
          MRK_REVIEWED_SOURCE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$REVIEWED_TREE" ]]
          python -I -B - <<'PY'
          """Compare bounded synthetic Basic X.509 and TLS server AIA on a hosted Mac."""
          import hashlib
          import importlib.util
          import inspect
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import tempfile
          import textwrap
          import time

          source = Path(os.environ['MRK_REVIEWED_SOURCE']).resolve(strict=True)
          helper = source / '.github/scripts/ci_native_authority.py'
          spec = importlib.util.spec_from_file_location('original_native_aia', helper)
          authority = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(authority)
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          version = subprocess.check_output(['/usr/bin/sw_vers', '-productVersion'], text=True, timeout=3).strip()
          if os.getuid() == 0 or os.uname().machine != 'arm64' or not version.startswith('26.'):
              raise RuntimeError('disposable ARM64 macOS 26 runner required')


          def scratch(work):
              node = work.lstat()
              if (work.parent != base or work.resolve(strict=True) != work or not work.name.startswith('mrk-aia-server-')
                      or node.st_uid != os.getuid() or not stat.S_ISDIR(node.st_mode) or stat.S_IMODE(node.st_mode) != 0o700):
                  raise RuntimeError('diagnostic scratch custody differs')
              return work


          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('reviewed probe input differs')
              return text.replace(old, new, 1)


          def tls_fixture():
              original = inspect.getsource(authority.prepare_aia)
              updated = replace_once(original, 'f"authorityInfoAccess=caIssuers;URI:{url}',
                                     'f"extendedKeyUsage=serverAuth\\nsubjectAltName=DNS:localhost,IP:127.0.0.1\\n'
                                     'authorityInfoAccess=caIssuers;URI:{url}')
              namespace = dict(vars(authority))
              exec(compile(updated, str(helper), 'exec'), namespace)
              return namespace['prepare_aia']


          def tls_constructor():
              original = textwrap.dedent(inspect.getsource(authority._Trust.__init__))
              changed = replace_once(original, 'policy_create = bind(security, "SecPolicyCreateBasicX509", P, [])',
                                     'policy_create = bind(security, "SecPolicyCreateSSL", P, [C.c_ubyte, P])\n'
                                     '    create_host = bind(foundation, "CFStringCreateWithCString", P, [P, C.c_char_p, C.c_uint32])')
              changed = replace_once(changed, 'policy = self._own(policy_create())',
                                     'host = self._own(create_host(None, b"localhost", 0x08000100))\n'
                                     '        policy = self._own(policy_create(1, host))')
              namespace = dict(vars(authority))
              exec(compile(changed, str(helper), 'exec'), namespace)
              return namespace['__init__']


          def exercise(prepare, constructor):
              basic_constructor = authority._Trust.__init__
              observations = []
              with tempfile.TemporaryDirectory(dir=base, prefix='mrk-aia-server-') as directory:
                  work = scratch(Path(directory))
                  os.chdir(work)
                  deadline = time.monotonic() + 65
                  responder = authority._Responder(deadline)
                  try:
                      prepare(responder.port, deadline)
                      fixtures = authority._fixtures(work, responder.port, deadline)
                      responder.start({row['route']: row['issuer'] for row in fixtures})
                      authority._Trust.__init__ = constructor
                      rows = [authority._evaluate_case(fixture, deadline, observations) for fixture in fixtures]
                      baseline, _ = authority._evaluate_offline_contrast(fixtures[0], deadline)
                  finally:
                      authority._Trust.__init__ = basic_constructor
                      responder.close()
                      os.chdir(source)
              expected_requests = [(row['route'], hashlib.sha256(row['issuer']).hexdigest())
                                   for row in fixtures if row['case'] in ('online','mutant')]
              return {
                  'fullChainOffline': {key: baseline[key] for key in ('accepted','network','keychains','result')},
                  'requestsMatch': responder.requests == expected_requests,
                  'cases': [{**{key: row[key] for key in ('case','network','keychains','accepted','result')},
                             'chainCount': len(row['chain']), 'trustError': {key: error[key] for key in ('status','code')},
                             'requestCount': sum(route == fixture['route'] for route, _ in responder.requests)}
                            for row, fixture, error in zip(rows, fixtures, observations)],
              }


          authority._scratch = scratch
          prepare_tls = tls_fixture()
          constructor_tls = tls_constructor()
          results = {'basic': exercise(authority.prepare_aia, authority._Trust.__init__),
                     'tlsServer': exercise(prepare_tls, constructor_tls)}
          print(json.dumps({'scope': 'synthetic issuer observation only', 'os': version, 'results': results}, sort_keys=True))
          PY
