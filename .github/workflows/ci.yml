name: Release kit CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONSAFEPATH: '1'

concurrency:
  group: release-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the local package
        run: python -m pip install '.[test]'
      - name: Set up pinned Ruby dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Run Python and workflow contract tests
        env:
          MOBILE_RELEASE_REQUIRE_RUBY_CONTRACTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/mobile-release-wheel"
          venv_dir="$RUNNER_TEMP/mobile-release-wheel-venv"
          smoke_dir="$RUNNER_TEMP/mobile-release-wheel-smoke"
          mkdir -p "$wheel_dir" "$smoke_dir"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --no-deps "$wheel_dir"/mobile_release_kit-*.whl
          mkdir -p "$smoke_dir/app"
          printf '%s\n' \
            'plugins { id("com.android.application") }' \
            'android { namespace = "com.example.wheelsmoke"; defaultConfig { applicationId = "com.example.wheelsmoke" } }' \
            > "$smoke_dir/app/build.gradle.kts"
          cd "$smoke_dir"
          "$venv_dir/bin/mobile-release" --version
          "$venv_dir/bin/mobile-release" init > init-preview.txt
          "$venv_dir/bin/mobile-release" init --apply \
            --tooling-repository example/mobile-release-kit \
            --tooling-sha 1111111111111111111111111111111111111111 \
            > init-apply.txt
          "$venv_dir/bin/mobile-release" init --recover > init-recover.txt
          "$venv_dir/bin/python" -c 'import json; assert json.load(open("init-recover.txt"))["recovery"] == "no-op"'
          for name in .mobile-release-init-prepare .mobile-release-init .mobile-release-init-cleanup; do
            test ! -e "$name"
            grep -Fx "$name/" .gitignore
          done
          test -f release/mobile-release.json
          test -f .github/workflows/mobile-preflight.yml
          test -f .github/workflows/mobile-candidate.yml
          test -f .github/workflows/mobile-external-testing.yml
          test -f .github/workflows/mobile-production-submit.yml
          grep -Fx '.mobile-release/' .gitignore
          grep -F 'example/mobile-release-kit/.github/workflows/reusable-candidate.yml@1111111111111111111111111111111111111111' .github/workflows/mobile-candidate.yml
          "$venv_dir/bin/python" -c 'from mobile_release.tooling import resolve_tooling_root, REQUIRED_TOOLING_FILES; root = resolve_tooling_root(environ={}); assert root is not None; required = ("Gemfile", "Gemfile.lock", "fastlane/Fastfile", "fastlane/play_store.rb", "fastlane/apple_store.rb", "fastlane/apple_production.rb", "fastlane/apple_asset_upload.rb", "fastlane/apple_create_retry.rb", "fastlane/ios_upload_validation.rb", "fastlane/android_upload_validation.rb", "fastlane/native_upload_validation.rb", "fastlane/release_support.rb", "fastlane/run_lane.rb", "schemas/project.schema.json", "schemas/candidate.schema.json", "schemas/receipt.schema.json", "schemas/store-operation-intent.schema.json", "templates/mobile-release.json", "templates/workflows/mobile-preflight.yml", "templates/workflows/mobile-candidate.yml", "templates/workflows/mobile-external-testing.yml", "templates/workflows/mobile-production-submit.yml"); assert set(required) <= set(REQUIRED_TOOLING_FILES); assert all((root / path).is_file() for path in REQUIRED_TOOLING_FILES)'
          "$venv_dir/bin/python" -m mobile_release.workflow --help
          "$venv_dir/bin/python" -m mobile_release.ios_upload_validation --help
          "$venv_dir/bin/python" -m mobile_release.android_upload_validation --help
          "$venv_dir/bin/python" -c 'from importlib.metadata import requires; assert all("extra ==" in item for item in (requires("mobile-release-kit") or []))'
          "$venv_dir/bin/python" -I -c 'from mobile_release.ios_profile_trust import apple_roots; assert len(apple_roots()) == 3'
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint-$ACTIONLINT_VERSION.tar.gz"
          install_root="$RUNNER_TEMP/actionlint-$ACTIONLINT_VERSION"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" actionlint
          echo "$install_root" >> "$GITHUB_PATH"
      - name: Lint workflow syntax and expressions
        run: >-
          actionlint -no-color
          -ignore 'property "workflow_(repository|sha|ref)" is not defined in object type'
          .github/workflows/*.yml templates/workflows/*.yml
      - name: Run credential-free Fastlane support tests
        run: |
          ruby -I. tests/workflow/test_fastlane_support.rb
          bundle exec ruby tests/workflow/test_play_store.rb
          bundle exec ruby tests/workflow/test_play_lanes.rb
          bundle exec ruby tests/workflow/test_apple_store.rb
          bundle exec ruby tests/workflow/test_apple_lanes.rb
          bundle exec ruby tests/workflow/test_apple_production.rb
          bundle exec ruby tests/workflow/test_apple_production_lane.rb
          bundle exec ruby tests/workflow/test_apple_asset_upload.rb
          bundle exec ruby tests/workflow/test_ios_upload_validation.rb
          bundle exec ruby tests/workflow/test_android_upload_validation.rb
          ruby tests/workflow/test_native_upload_validation.rb
          ruby tests/workflow/test_workflow_yaml.rb
          bundle exec ruby tests/workflow/test_supply_wif.rb
      - name: Parse the shared Fastfile without credentials
        env:
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: bundle exec ruby fastlane/run_lane.rb --validate
  test-native-profiles:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the local package
        run: python -m pip install '.[test]'
      - name: Require native profile authority and containment tests without skips
        run: python -I tests/workflow/run_native_profile_checks.py
      - name: Verify isolated installed-wheel Apple policy and worker resources
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/profile-wheel"
          venv_dir="$RUNNER_TEMP/profile-wheel-venv"
          trap 'rm -rf -- "$wheel_dir" "$venv_dir"' EXIT
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --no-deps "$wheel_dir"/mobile_release_kit-*.whl
          cd "$RUNNER_TEMP"
          "$venv_dir/bin/python" -I "$GITHUB_WORKSPACE/tests/workflow/run_native_profile_checks.py" --installed-wheel
  # Preserve the protected status name. Linux-only success cannot bypass a
  # failed, skipped, cancelled or unavailable native authority check.
  test:
    needs: [test-linux, test-native-profiles]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verification job to succeed
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          NATIVE_RESULT: ${{ needs.test-native-profiles.result }}
        run: |
          set -euo pipefail
          [[ "$LINUX_RESULT" == success && "$NATIVE_RESULT" == success ]]
