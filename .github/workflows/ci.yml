name: Intel desktop native failure isolation

on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

jobs:
  intel-native-fixtures:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-intel-native-ci' &&
      inputs.verification_target == 'macos'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      BASIS_COMMIT: 91f468e033e1e6309ef3b1a265a2b6be90450a9c
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/.ci-target
    steps:
      - name: Admit the disposable native Intel runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == X64 && "$(id -u)" != 0 ]]
          [[ "$(uname -m)" == x86_64 && "$(sw_vers -productVersion)" == 26.* ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASIS_COMMIT }}
          persist-credentials: false
      - name: Observe only the fixed Xcode and system-tool originals
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BASIS_COMMIT" && -z "$(git status --porcelain)" ]]
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat

          def metadata(path):
              try:
                  item = path.lstat()
              except OSError as error:
                  return {"errno": error.errno}
              return {
                  "directory": stat.S_ISDIR(item.st_mode),
                  "regular": stat.S_ISREG(item.st_mode),
                  "symlink": stat.S_ISLNK(item.st_mode),
                  "rootOwner": item.st_uid == 0,
                  "rootOrRunnerAliasOwner": item.st_uid in (0, os.getuid()),
                  "unsafeModeBits": bool(item.st_mode & 0o7022),
                  "links": item.st_nlink,
              }

          paths = {
              "root": Path("/"), "usr": Path("/usr"), "bin": Path("/usr/bin"),
              "library": Path("/Library"), "applications": Path("/Applications"),
              "managedNamespace": Path("/Library/MobileReleaseKitDeveloper"),
              "standardApp": Path("/Applications/Xcode.app"),
          }
          for name in ("security", "codesign", "openssl", "xcrun"):
              paths[name] = Path("/usr/bin") / name
          selected = paths["standardApp"]
          shape = metadata(selected)
          if shape.get("symlink"):
              name = os.readlink(selected).removeprefix("/Applications/")
              allowed = bool(re.fullmatch(r"Xcode[A-Za-z0-9._+-]*\.app", name)) and name != "Xcode.app"
              print("MRK_INTEL_XCODE_ALIAS=" + json.dumps({"directXcodeSibling": allowed}))
              selected = Path("/Applications") / name if allowed else None
          if selected is not None:
              paths["selectedApp"] = selected
              paths["contents"] = selected / "Contents"
              paths["developer"] = selected / "Contents/Developer"
          print("MRK_INTEL_XCODE_METADATA=" + json.dumps({role: metadata(path) for role, path in paths.items()}, sort_keys=True))
          PY
      - name: Compile the exact native library tests once
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          cargo test --locked --lib --no-default-features --no-run
      - name: Run the two regressions independently
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          result=0
          for exact_case in \
            installed_runtime::ios_upload_tools_tests::ios_upload_actual_selected_tools_pre_post_and_positive_consume \
            saved_command_owner::android_registration::catalogue_budget_tests::genuine_catalogue_fits_fresh_inspect_retained_review_and_register; do
            cargo test --locked --lib --no-default-features "$exact_case" -- --exact --list | grep -Fx "$exact_case: test"
            cargo test --locked --lib --no-default-features "$exact_case" -- --exact --nocapture || result=1
          done
          exit "$result"
