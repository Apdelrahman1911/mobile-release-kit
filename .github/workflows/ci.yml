name: Disposable macOS native verification with pinned Xcode 27.1

on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

env:
  PYTHONSAFEPATH: '1'

jobs:
  native-profiles-comparison:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-native-issuer-system' &&
      inputs.verification_target == 'macos'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MRK_DIAGNOSTIC_BASIS_COMMIT: 4f4b59555edd6758438246245147a0c5ba00ffa0
      MRK_DIAGNOSTIC_BASIS_TREE: e4f810f5c9cb1d3b5a1408d5d3d4315e8ebf0d5d
    steps:
      - name: Require a disposable GitHub-hosted runner
        env:
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(id -u)" != 0 ]]
          [[ "$(sw_vers -productVersion)" == 27.* ]]
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.MRK_DIAGNOSTIC_BASIS_COMMIT }}
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up the fixed Python 3.12 compatibility runtime
        id: python312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up the fixed Python 3.13 compatibility runtime
        id: python313
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up the fixed Python 3.14 compatibility runtime
        id: python314
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up pinned Ruby without project installation
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler: none
          bundler-cache: false
      - name: Require isolated macOS source and installed-wheel verification
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          MRK_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          MRK_PYTHON_314: ${{ steps.python314.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$MRK_DIAGNOSTIC_BASIS_COMMIT" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$MRK_DIAGNOSTIC_BASIS_TREE" ]]
          xcode_version="$(DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer /usr/bin/xcodebuild -version)"
          [[ "$xcode_version" == $'Xcode 27.1\nBuild version 27A9275' ]]
          ruby_executable="$(command -v ruby)"
          [[ "$MRK_PYTHON" == /* && "$ruby_executable" == /* ]] || exit 1
          [[ "$MRK_PYTHON_312" == /* && "$MRK_PYTHON_313" == /* && "$MRK_PYTHON_314" == /* ]] || exit 1
          sudo -n env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin PYTHONSAFEPATH=1 \
            "$MRK_PYTHON" -I -B .github/scripts/verify_ci.py \
            --platform macos --source "$GITHUB_WORKSPACE" \
            --python "$MRK_PYTHON" --ruby "$ruby_executable" \
            --python-312 "$MRK_PYTHON_312" --python-313 "$MRK_PYTHON_313" --python-314 "$MRK_PYTHON_314" \
            --runner-home "$HOME" --runner-temp "$RUNNER_TEMP" \
            --commit "$MRK_DIAGNOSTIC_BASIS_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --image "$ImageOS/$ImageVersion" \
            --scope native-python --summary "$GITHUB_STEP_SUMMARY"
