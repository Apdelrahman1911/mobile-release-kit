name: Compare a reserved test hostname on macOS 26 loopback

on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

jobs:
  issuer-alias:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-native-issuer-trustd' &&
      inputs.verification_target == 'macos'
    runs-on: macos-26
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Measure issuer fetch with a test hostname on the original loopback listener
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(id -u)" != 0 ]]
          [[ "$(sw_vers -productVersion)" == 26.* && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "$(git hash-object .github/scripts/ci_native_authority.py)" == cdec3376c8afef2306af1b0bcde78153973c5252 ]]
          printf 'OS=%s build=%s image=%s\n' "$(sw_vers -productVersion)" "$(sw_vers -buildVersion)" "$ImageVersion"
          umask 077
          host_file=/private/etc/hosts
          original_hosts="$(mktemp "$RUNNER_TEMP/mrk-hosts-before.XXXXXX")"
          expected_hosts="$(mktemp "$RUNNER_TEMP/mrk-hosts-during.XXXXXX")"
          cp "$host_file" "$original_hosts"
          if grep -Fiq 'issuer.mrk.test' "$original_hosts"; then
            exit 1
          fi
          cat "$original_hosts" > "$expected_hosts"
          printf '\n127.0.0.1 issuer.mrk.test # mrk-aia-diagnostic\n' >> "$expected_hosts"
          restore_hosts() {
            if cmp -s "$host_file" "$original_hosts"; then
              return
            fi
            cmp -s "$host_file" "$expected_hosts" || return 1
            sudo -n /bin/cp "$original_hosts" "$host_file"
            cmp -s "$host_file" "$original_hosts"
            printf '%s\n' 'MRK_HOSTS_RESTORED=1'
          }
          trap restore_hosts EXIT
          sudo -n /bin/cp "$expected_hosts" "$host_file"
          cmp -s "$host_file" "$expected_hosts"
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LC_ALL=C \
            python -I -B .github/scripts/aia-correlated-probe.py
