name: Disposable native Git fixture finality comparison
on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

jobs:
  native-git-fixture:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-native-issuer-system' &&
      inputs.verification_target == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os: '26'
          - runner: xcode-27
            os: '27'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    env:
      BASIS_COMMIT: 84fb76e16cfbd13d7a21530487268582e5933c8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASIS_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.11'
      - name: Run the exact original Git descendant fixture
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_OS: ${{ matrix.os }}
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(id -u)" != 0 ]]
          [[ "$(sw_vers -productVersion)" == "$EXPECTED_OS".* ]]
          [[ "$(git rev-parse HEAD)" == "$BASIS_COMMIT" && -z "$(git status --porcelain)" ]]
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/mrk-git-probe.XXXXXXXX")"
          mkdir "$scratch/home" "$scratch/tmp"
          printf 'os=%s source=%s tree=%s\n' "$(sw_vers -productVersion)" "$BASIS_COMMIT" "$(git rev-parse 'HEAD^{tree}')"
          env -i HOME="$scratch/home" TMPDIR="$scratch/tmp" PATH=/usr/bin:/bin:/usr/sbin:/sbin LC_ALL=C \
            /usr/bin/git --version
          env -i HOME="$scratch/home" TMPDIR="$scratch/tmp" PATH=/usr/bin:/bin:/usr/sbin:/sbin LC_ALL=C \
            "$MRK_PYTHON" -I -B - <<'PY'
          from contextlib import contextmanager
          import json
          from pathlib import Path
          import sys
          import unittest
          from unittest.mock import patch

          checkout = Path.cwd().resolve()
          sys.path[:0] = [str(checkout / part) for part in ("src", "tests")]
          from unit import test_owned_process_callers as original

          fixture = original.BuildDiscoveryCallerTests(
              "test_real_git_discovery_suppresses_hooks_and_explicit_commands_reap_descendants"
          )
          bound = original.bounded_commands
          final = original.all_original_commands_final
          active_mode = None
          published_modes = set()

          @contextmanager
          def observe_mode(mode, heartbeat):
              global active_mode
              active_mode = mode
              with bound(mode, heartbeat) as outcomes:
                  yield outcomes

          def observe_finality(outcomes):
              result = final(outcomes)
              if active_mode not in published_modes:
                  published_modes.add(active_mode)
                  print("MRK_GIT_FIXTURE=" + json.dumps({
                      "mode": active_mode, "final": result,
                      "outcomes": [None if row is None else {
                          "final": row.original_finality is not None,
                          "termination": row.termination,
                          "returncode": row.returncode,
                          "integrity": row.result_integrity,
                          "tool_attempted": row.run_tool.attempted,
                          "tool_retired": row.run_tool.retired,
                      } for row in outcomes],
                  }, sort_keys=True), flush=True)
              return result

          with patch.object(original, "bounded_commands", observe_mode), \
                  patch.object(original, "all_original_commands_final", observe_finality):
              result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([fixture]))
          raise SystemExit(int(not result.wasSuccessful() or len(published_modes) != 4))
          PY
          [[ -z "$(git status --porcelain)" ]]
