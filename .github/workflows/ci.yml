name: Disposable macOS 26 issuer comparison with Apple Security CLI

on:
  workflow_dispatch:
    inputs:
      verification_target:
        type: choice
        required: true
        options: [macos]

permissions:
  contents: read

jobs:
  compare-issuer-clients:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.ref == 'refs/heads/verify/macos-native-issuer-system' &&
      inputs.verification_target == 'macos'
    runs-on: macos-26
    timeout-minutes: 6
    env:
      REVIEWED_SOURCE: cc84a42062e1c005cb9d499dff583675639a633e
      REVIEWED_TREE: 03987b67ffc9182cca34673bfdd091b807337a01
    steps:
      - name: Admit a disposable macOS 26 ARM64 runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(id -u)" != 0 ]]
          [[ "$(sw_vers -productVersion)" == 26.* ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Observe issuer behavior on exactly the reviewed source
        env:
          MRK_REVIEWED_SOURCE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SOURCE" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$REVIEWED_TREE" ]]
          python -I -B - <<'PY'
          """Disposable hosted diagnostic using the original synthetic issuer fixtures."""
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import tempfile
          import time

          source = Path(os.environ['MRK_REVIEWED_SOURCE']).resolve(strict=True)
          helper = source / '.github/scripts/ci_native_authority.py'
          spec = importlib.util.spec_from_file_location('original_native_aia', helper)
          authority = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(authority)
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          version = subprocess.check_output(['/usr/bin/sw_vers', '-productVersion'], text=True, timeout=3).strip()
          if os.getuid() == 0 or os.uname().machine != 'arm64' or not version.startswith('26.'):
              raise RuntimeError('disposable ARM64 macOS 26 runner required')


          def scratch(work):
              node = work.lstat()
              if (work.parent != base or work.resolve(strict=True) != work or not work.name.startswith('mrk-aia-cli-')
                      or node.st_uid != os.getuid() or not stat.S_ISDIR(node.st_mode) or stat.S_IMODE(node.st_mode) != 0o700):
                  raise RuntimeError('diagnostic scratch custody differs')
              return work


          def security(work, name, *, offline=False, full_chain=False):
              command = ['/usr/bin/security', 'verify-cert', '-q', '-p', 'basic', '-c', f'{name}-leaf.der']
              if full_chain:
                  command.extend(('-c', f'{name}-issuer.der'))
              command.extend(('-r', f'{name}-root.der'))
              if offline:
                  command.append('-L')
              try:
                  result = subprocess.run(command, cwd=work, env={'PATH': '/usr/bin:/bin', 'HOME': str(work), 'LC_ALL': 'C'},
                                          timeout=10, capture_output=True, check=False)
                  return {'returncode': result.returncode, 'timedOut': False}
              except subprocess.TimeoutExpired:
                  return {'returncode': None, 'timedOut': True}


          with tempfile.TemporaryDirectory(dir=base, prefix='mrk-aia-cli-') as directory:
              work = scratch(Path(directory))
              authority._scratch = scratch
              os.chdir(work)
              deadline = time.monotonic() + 65
              responder = authority._Responder(deadline)
              try:
                  authority.prepare_aia(responder.port, deadline)
                  fixtures = {row['case']: row for row in authority._fixtures(work, responder.port, deadline)}
                  responder.start({row['route']: row['issuer'] for row in fixtures.values()})
                  report = {'securityOnline': security(work, 'online'), 'securityOffline': security(work, 'offline', offline=True),
                            'securityFullChainOffline': security(work, 'product-offline', offline=True, full_chain=True)}
                  observations = []
                  row = authority._evaluate_case(fixtures['mutant'], deadline, observations)
                  report['frameworkOnline'] = {key: row[key] for key in ('accepted', 'network', 'keychains', 'result')}
                  report['frameworkOnline']['trustError'] = {key: observations[0][key] for key in ('status', 'code')}
              finally:
                  responder.close()
                  os.chdir(source)
              route_names = {row['route']: name for name, row in fixtures.items()}
              report['requests'] = [{'case': route_names[route], 'issuerMatches': digest == hashlib.sha256(fixtures[route_names[route]]['issuer']).hexdigest()}
                                    for route, digest in responder.requests]
              print(json.dumps({'scope': 'synthetic issuer observation only', 'os': version, 'results': report}, sort_keys=True))
          PY
