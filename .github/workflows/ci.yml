name: Release kit CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONSAFEPATH: '1'

concurrency:
  group: release-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require a disposable GitHub-hosted runner
        env:
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == github-hosted ]]
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned Ruby without project installation
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler: none
          bundler-cache: false
      - name: Install the distribution-signed Linux isolation tool if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/bwrap ]]; then
            sudo -n env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get update
            sudo -n env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get install \
              --yes --no-install-recommends bubblewrap
          fi
          [[ -x /usr/bin/bwrap && -x /usr/bin/setpriv ]]
      - name: Require isolated Linux source and installed-wheel verification
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          ruby_executable="$(command -v ruby)"
          [[ "$MRK_PYTHON" == /* && "$ruby_executable" == /* ]]
          sudo -n env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin PYTHONSAFEPATH=1 \
            "$MRK_PYTHON" -I -B .github/scripts/verify_ci.py \
            --platform linux --source "$GITHUB_WORKSPACE" \
            --python "$MRK_PYTHON" --ruby "$ruby_executable" \
            --runner-home "$HOME" --runner-temp "$RUNNER_TEMP" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --image "$ImageOS/$ImageVersion" \
            --java-home "$JAVA_HOME_21_X64" --summary "$GITHUB_STEP_SUMMARY"
  test-native-profiles:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require a disposable GitHub-hosted runner
        env:
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == github-hosted ]]
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up pinned Ruby without project installation
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3.12'
          bundler: none
          bundler-cache: false
      - name: Require isolated macOS source and installed-wheel verification
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          ruby_executable="$(command -v ruby)"
          [[ "$MRK_PYTHON" == /* && "$ruby_executable" == /* ]]
          sudo -n env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin PYTHONSAFEPATH=1 \
            "$MRK_PYTHON" -I -B .github/scripts/verify_ci.py \
            --platform macos --source "$GITHUB_WORKSPACE" \
            --python "$MRK_PYTHON" --ruby "$ruby_executable" \
            --runner-home "$HOME" --runner-temp "$RUNNER_TEMP" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --image "$ImageOS/$ImageVersion" \
            --summary "$GITHUB_STEP_SUMMARY"
  # Preserve the protected status name. Linux-only success cannot bypass a
  # failed, skipped, cancelled or unavailable native authority check.
  test:
    needs: [test-linux, test-native-profiles]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verification job to succeed
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          NATIVE_RESULT: ${{ needs.test-native-profiles.result }}
        run: |
          set -euo pipefail
          [[ "$LINUX_RESULT" == success && "$NATIVE_RESULT" == success ]]
