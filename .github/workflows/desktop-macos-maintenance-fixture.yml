name: Desktop macOS native maintenance diagnostic fixture
on:
  push:
    branches: [verify/desktop-macos-maintenance-fixture]
permissions:
  contents: read
concurrency:
  group: desktop-macos-maintenance-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2_fixture:
    runs-on: xcode-27
    timeout-minutes: 100
    env:
      BASH_ENV: ''
      ENV: ''
    steps:
      - name: Admit the exact disposable native route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-macos-maintenance-fixture && "$GITHUB_JOB" == e2_fixture ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-maintenance-fixture.yml@$GITHUB_REF" ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit && "$RUNNER_TEMP" == /Users/runner/work/_temp ]]
          /usr/bin/sw_vers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.14.7'
      - name: Acquire the exact already-reviewed fixture compiler without moving stable
        timeout-minutes: 8
        env:
          MRK_MACOS_TARGET: aarch64-apple-darwin
          RUSTUP_TOOLCHAIN: 1.98.1
        run: /bin/bash desktop/tools/macos_maintenance_fixture_toolchain.sh
      - name: Prepare only exact fixture source and locked graphs
        id: prepare
        timeout-minutes: 18
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: builtin source ./desktop/tools/macos_maintenance_fixture_prepare.sh
      - name: Enter genuine client and resident transport without SM approval
        id: native
        timeout-minutes: 75
        shell: /usr/bin/env -i /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          umask 077
          ulimit -n 4096
          cd /Users/runner/work/mobile-release-kit/mobile-release-kit
          # Fixed fixture-only launchd transport; no ordinary SM registration/unregister.
          exec /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner LANG=C LC_ALL=C TZ=UTC \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT='${{ runner.environment }}' RUNNER_OS='${{ runner.os }}' RUNNER_ARCH='${{ runner.arch }}' \
            GITHUB_REPOSITORY='${{ github.repository }}' GITHUB_EVENT_NAME='${{ github.event_name }}' GITHUB_REF='${{ github.ref }}' \
            GITHUB_SHA='${{ github.sha }}' GITHUB_WORKFLOW_SHA='${{ github.workflow_sha }}' GITHUB_WORKFLOW_REF='${{ github.workflow_ref }}' \
            GITHUB_WORKSPACE='${{ github.workspace }}' RUNNER_TEMP='${{ runner.temp }}' GITHUB_JOB=e2_fixture \
            GITHUB_RUN_ID='${{ github.run_id }}' GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' \
            MRK_EXPECTED_SHA='${{ github.sha }}' MRK_MACOS_INSTALL_SOURCE_COMMIT='${{ github.sha }}' \
            MRK_MACOS_WORK='${{ steps.prepare.outputs.root }}' RUSTUP_TOOLCHAIN=1.98.1 \
            RUSTUP_HOME=/Users/runner/.rustup CARGO_HOME=/Users/runner/.cargo \
            DEVELOPER_DIR=/Library/Developer/CommandLineTools MACOSX_DEPLOYMENT_TARGET=26.0 \
            '${{ steps.python.outputs.python-path }}' -I -S -B desktop/tools/macos_e2_native_fixture.py --diagnose-maintenance-transport
      - name: Project only bounded fixture diagnostic DATA
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        env:
          MRK_MACOS_WORK: ${{ steps.prepare.outputs.root }}
          MRK_NATIVE_STEP_OUTCOME: ${{ steps.native.outcome }}
        run: '"${{ steps.python.outputs.python-path }}" -I -S -B desktop/tools/macos_maintenance_live_publish.py'
      - name: Preserve bounded fixture evidence even on native failure
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-native-maintenance-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/e2-native-live-summary.json
            ${{ steps.prepare.outputs.root }}/e2-native-result.json
            ${{ steps.prepare.outputs.root }}/e2-native-maintenance-diagnostics.json
            ${{ steps.prepare.outputs.root }}/e2-native-*.stdout
            ${{ steps.prepare.outputs.root }}/e2-native-*.stderr
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
