name: Signed macOS release UI journeys

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main source commit
        required: true
        type: string
      build_run:
        description: Original signed main package run
        required: true
        type: string
      carrier_run:
        description: Original attested main carrier run
        required: true
        type: string
      carrier_attempt:
        description: Original successful carrier attempt
        required: true
        type: string
      qualification_run:
        description: Successful main release qualification run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: macos-release-ui-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  signed-ui:
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.event_name == 'workflow_dispatch' &&
      ((github.ref == 'refs/heads/main' && github.ref_protected && inputs.expected_sha == github.sha) ||
       (github.ref == 'refs/heads/verify/macos-0213-recovery-project' &&
        inputs.expected_sha == '8dead1a987215fe7c5fe7bec4a08ec5e449b8aea' &&
        inputs.build_run == '45866692352' && inputs.carrier_run == '45878823446' &&
        inputs.carrier_attempt == '1' && inputs.qualification_run == '45882652228'))
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Admit a fresh hosted Apple Silicon console and completed qualification
        id: admit
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RELEASE_SOURCE: ${{ inputs.expected_sha }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 26.* && "$(id -u)" != 0 && "$QUALIFICATION_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "$HOME/Library/Application Support/dev.mobile-release-kit.desktop" ]]
          expected_conclusion=success
          if [[ "$GITHUB_REF" == refs/heads/verify/macos-0213-recovery-project ]]; then
            expected_conclusion=failure
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/45884436881" |
              jq -e '
                .head_sha == "20be92e8f414b0b88142cbd132dd8bb5d5e3171f" and
                .head_branch == "verify/macos-0213-recovery-project" and
                .path == ".github/workflows/desktop-macos-update-check.yml" and
                .event == "workflow_dispatch" and .run_attempt == 1 and
                .status == "completed" and .conclusion == "success"
              ' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/jobs?per_page=100" |
              jq -e '
                [.jobs[] | select(.name | startswith("Qualify frozen media ("))] |
                length == 10 and
                all(.[]; if .name == "Qualify frozen media (recovery-xctest)"
                         then .conclusion == "failure" else .conclusion == "success" end)
              ' >/dev/null
          fi
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" |
            jq -e -r --arg source "$RELEASE_SOURCE" --arg conclusion "$expected_conclusion" '
              select(.head_sha == $source and .event == "workflow_dispatch" and .head_branch == "main" and
                .path == ".github/workflows/desktop-macos-update-check.yml" and .status == "completed" and
                .conclusion == $conclusion) | .run_attempt
            ')"
          [[ "$attempt" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$expected_conclusion" == success || "$attempt" == 1 ]]
          printf 'qualification-attempt=%s\n' "$attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ui-test-actions/ui-test-actions
          ref: 0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1
          path: ui-action-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.carrier_run }}
          github-token: ${{ github.token }}
          name: macos-release-frozen-${{ inputs.expected_sha }}-${{ inputs.carrier_run }}-${{ inputs.carrier_attempt }}
          path: ${{ runner.temp }}/signed-ui-media
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: github.ref == 'refs/heads/main'
        with:
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
          name: macos-release-qualified-${{ github.sha }}-${{ inputs.qualification_run }}-${{ steps.admit.outputs.qualification-attempt }}
          path: ${{ runner.temp }}/signed-ui-qualification
      - name: Download the original main qualification results
        if: github.ref == 'refs/heads/verify/macos-0213-recovery-project'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
          pattern: macos-release-qualification-*-${{ inputs.expected_sha }}-${{ inputs.qualification_run }}-1
          path: ${{ runner.temp }}/signed-ui-original-results
      - name: Download the exact signed recovery replay result
        if: github.ref == 'refs/heads/verify/macos-0213-recovery-project'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: '45884436881'
          github-token: ${{ github.token }}
          name: macos-release-qualification-recovery-xctest-20be92e8f414b0b88142cbd132dd8bb5d5e3171f-45884436881-1
          path: ${{ runner.temp }}/signed-ui-replayed-recovery
      - name: Bind assets and attestations and install the exact signed DMG
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          RELEASE_SOURCE: ${{ inputs.expected_sha }}
          CARRIER_RUN: ${{ inputs.carrier_run }}
          CARRIER_ATTEMPT: ${{ inputs.carrier_attempt }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ steps.admit.outputs.qualification-attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/mrk-signed-ui.XXXXXXXX")"
          media="$RUNNER_TEMP/signed-ui-media"
          printf 'MRK_UI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          mkdir "$work/evidence"
          release_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$GITHUB_REF" == refs/heads/verify/macos-0213-recovery-project ]]; then
            release_tree=e76ca3400eb87d42fcaab0b0a65e88bb419a6f8e
          fi
          python -I -B desktop/tools/macos_release_media.py verify "$media" \
            --source "$RELEASE_SOURCE" --tree "$release_tree" \
            --build-run "$BUILD_RUN" --carrier-run "$CARRIER_RUN"
          manifest_hash="$(shasum -a 256 "$media/RELEASE-MANIFEST.json" | cut -d ' ' -f 1)"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            jq -e --arg qualification "$QUALIFICATION_RUN" --arg qualificationAttempt "$QUALIFICATION_ATTEMPT" \
              --arg attempt "$CARRIER_ATTEMPT" --arg hash "$manifest_hash" '
              .qualificationRun == $qualification and .qualificationAttempt == $qualificationAttempt and
              .frozenRelease.carrierAttempt == $attempt and .frozenRelease.manifestSha256 == $hash
              ' "$RUNNER_TEMP/signed-ui-qualification/QUALIFIED.json" > /dev/null
          else
            original=("$RUNNER_TEMP/signed-ui-original-results"/*/RESULT.json)
            [[ "${#original[@]}" == 10 ]]
            jq -e -s --slurpfile manifest "$media/RELEASE-MANIFEST.json" --arg hash "$manifest_hash" \
              --arg qualification "$QUALIFICATION_RUN" '
              ($manifest[0] | {sourceCommit, sourceTree, buildRun, carrierRun, carrierAttempt,
                 manifestSha256: $hash, installSha256: .packages["Install.pkg"].sha256,
                 removeSha256: .packages["Remove.pkg"].sha256}) as $frozen |
              .[:10] as $original | .[10] as $replay |
              select(($original | map(.mode) | sort) == ["archived-upgrade", "core-recovery", "delete-data",
                "fresh", "performance-long", "post-reinstall-prepare", "recovery-xctest", "uninstaller",
                "update-credentials", "workspace-xctest"] and all(.[]; .frozenRelease == $frozen) and
                all($original[]; if .mode == "recovery-xctest" then
                   .passed == false and .failure == "xctest-original-result" and
                   .xctestStages[-1] == ["project-open","failed"]
                 else .passed == true end) and
                ($replay | .mode == "recovery-xctest" and .passed == true and .xctestReturn == 0 and
                 .xctestCasePassed == true and .guiRecoveryObserved == true and
                 .recoveryProjectMatchesOriginals == true and .newCrashReports == [])) |
              {frozenRelease: $frozen, qualificationRun: $qualification, original: ($original |
                map({mode, passed, failure})), recoveryReplayRun: "45884436881", recoveryReplayPassed: true}
              ' "${original[@]}" "$RUNNER_TEMP/signed-ui-replayed-recovery/RESULT.json" \
              > "$work/evidence/QUALIFICATION-REPLAY.json"
          fi
          for asset in "$media"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
              --source-digest "$RELEASE_SOURCE" --deny-self-hosted-runners \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml"
          done
          unset GH_TOKEN
          if [[ "$GITHUB_REF" == refs/heads/verify/macos-0213-recovery-project ]]; then
            python -I -B - "$media" "$work" <<'PY'
          import json
          from pathlib import Path
          import runpy
          import shutil
          import sys

          media, work = map(Path, sys.argv[1:])
          release_media = runpy.run_path('desktop/tools/macos_release_media.py')
          require_quarantine = runpy.run_path('desktop/tools/macos_update_check.py')['require_quarantine']
          manifest = json.loads((media / 'RELEASE-MANIFEST.json').read_bytes())
          report = {}
          inspected = []
          copies = work / 'quarantine'
          copies.mkdir()
          for role, name in zip(('Install', 'Remove'), release_media['image_names'](manifest['version']), strict=True):
              image = copies / name
              shutil.copyfile(media / name, image)
              require_quarantine(image)
              observation = release_media['inspect_image'](image, role)
              outer, package, _ = observation
              if outer != manifest['images'][name] or package != manifest['packages'][role + '.pkg']:
                  raise RuntimeError('quarantined-media-identity-' + role)
              inspected.append(observation)
              report[role] = dict(quarantineVerified=True, strictSignature=True, stapleValidated=True,
                                  gatekeeperAccepted=True, readonlyPackageVerified=True,
                                  imageSha256=outer['sha256'], packageSha256=package['sha256'])
          release_media['package_identities'](*inspected, source=manifest['sourceCommit'],
                                              release=manifest['release'], version=manifest['version'])
          (work / 'evidence' / 'QUARANTINE.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          fi
          python -I -B desktop/tools/macos_release_ui.py install "$media" "$work"
      - name: Start the same-runner observer with a one-time bearer
        id: observer
        run: |
          set -euo pipefail
          umask 077
          python -I -B - <<'PY'
          import hashlib, json, os, secrets
          from pathlib import Path
          work = Path(os.environ['MRK_UI_WORK'])
          token = secrets.token_hex(32)
          (work / 'token').write_text(token + '\n')
          previous = sorted(map(str, Path(os.environ['RUNNER_TEMP']).glob('ui-session-*/connection.json')))
          (work / 'previous-sessions.json').write_text(json.dumps(previous))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('token-digest=' + hashlib.sha256(token.encode('ascii')).hexdigest() + '\n')
          PY
          (
            set +e
            python -I -B desktop/tools/macos_release_ui.py observe "$RUNNER_TEMP/signed-ui-media" "$MRK_UI_WORK" \
              --action "$GITHUB_WORKSPACE/ui-action-source"
            printf '%s\n' "$?" > "$MRK_UI_WORK/observer-status"
          ) > "$MRK_UI_WORK/evidence/observer.log" 2>&1 &
      - uses: ui-test-actions/ui-test-actions@0c818c5d72e8c30c59bd1287c330a40392bf8e89 # v3.0.1
        with:
          target: macos
          transport: local
          token-sha256: ${{ steps.observer.outputs.token-digest }}
          duration-minutes: '15'
          startup-timeout-seconds: '180'
          launch: /usr/bin/open -a "/Applications/Mobile Release Kit.app"
      - name: Require the original UI observer result
        if: ${{ !cancelled() && steps.observer.outcome == 'success' }}
        run: |
          set -euo pipefail
          for ((waited=0; waited<10; waited++)); do
            [[ ! -f "$MRK_UI_WORK/observer-status" ]] || break
            sleep 1
          done
          [[ -f "$MRK_UI_WORK/observer-status" ]]
          [[ "$(cat "$MRK_UI_WORK/observer-status")" == 0 ]]
          jq -e '.scenarios | length > 0 and all(.[]; .status == "Passed")' "$MRK_UI_WORK/evidence/RESULT.json"
      - name: Retain UI evidence from synthetic sessions only
        if: ${{ !cancelled() && env.MRK_UI_WORK != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-ui-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_UI_WORK }}/evidence
          if-no-files-found: error
          retention-days: 30
