name: Mac candidate recovery and removal package

on:
  push:
    branches: [verify/desktop-macos-candidate-consume]
  workflow_dispatch:
    inputs:
      operation:
        description: Reuse a fixed signed app for recovery or remaining functional checks; no app rebuild
        type: choice
        options: [remove-delivery, inspect-predecessor, install-predecessor, install-retained-observer, install-retained-git-observer]
        default: remove-delivery
      architecture:
        description: Package only the selected architecture
        type: choice
        options: [both, arm64, x86_64]
        default: both
      bundled_core_diagnostic:
        description: Diagnose only bundled Python startup on the retained Git ARM build; do not launch or qualify the app
        type: boolean
        default: false
      native_startup_sample:
        description: Observe only the first retained Git startup with Apple sample; not a qualification run
        type: boolean
        default: false
      tool_resume_from:
        description: Start independent Tool checks at service; skipped identity edits remain unverified
        type: choice
        options: [identity, service]
        default: identity

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-candidate-consume-${{ github.sha }}
  cancel-in-progress: false

jobs:
  install-retained-observer:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'workflow_dispatch' && (inputs.operation == 'install-retained-observer' || inputs.operation == 'install-retained-git-observer') && inputs.architecture == 'arm64' && github.ref == 'refs/heads/verify/desktop-macos-observer-reuse'
    name: ${{ inputs.bundled_core_diagnostic && 'Diagnose bundled Mac core startup (no rebuild)' || inputs.native_startup_sample && 'Observe native Mac startup (no rebuild)' || 'Reuse signed Mac build and complete core functional checks' }}
    runs-on: ${{ inputs.operation == 'install-retained-git-observer' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 260
    env:
      MRK_CANDIDATE_MODE: ${{ inputs.operation }}
      MRK_CANDIDATE_SOURCE: ${{ inputs.operation == 'install-retained-git-observer' && 'ed91b0dd582ca35a6dc57556aa73d60f1fc852a2' || 'b81e16b842bbe8d79e8d240b18ae2246ea272399' }}
      MRK_MACOS_TARGET: aarch64-apple-darwin
      MRK_MACOS_RUNNER: ${{ inputs.operation == 'install-retained-git-observer' && 'xcode-27' || 'macos-26' }}
      MRK_MACOS_MACHINE: arm64
      MRK_MACOS_HOSTED_JOB: ${{ inputs.operation == 'install-retained-git-observer' && 'github-hosted-xcode27-arm64' || 'github-hosted-macos26-arm64' }}
      MRK_MACOS_NATIVE_SCOPE: ${{ inputs.operation == 'install-retained-git-observer' && 'git-native' || 'tool-setup' }}
      MRK_MACOS_PACKAGE_ROLE: installed-shell-observation
      MRK_MACOS_STORE_RUNTIME: signed-component
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ inputs.operation == 'install-retained-git-observer' && 'ed91b0dd582ca35a6dc57556aa73d60f1fc852a2' || 'b81e16b842bbe8d79e8d240b18ae2246ea272399' }}
      DEVELOPER_DIR: ${{ inputs.operation == 'install-retained-git-observer' && '/Library/Developer/CommandLineTools' || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - name: Require the isolated disposable ARM host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_CORE_DIAGNOSTIC_REQUESTED: ${{ inputs.bundled_core_diagnostic }}
          MRK_NATIVE_SAMPLE_REQUESTED: ${{ inputs.native_startup_sample }}
          MRK_TOOL_RESUME_FROM: ${{ inputs.tool_resume_from }}
        run: |
          set +x
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-observer-reuse ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/uname -m)" == arm64 ]]
          if [[ "$MRK_CORE_DIAGNOSTIC_REQUESTED" == true ]]; then
            [[ "$MRK_CANDIDATE_MODE" == install-retained-git-observer ]]
          fi
          if [[ "$MRK_NATIVE_SAMPLE_REQUESTED" == true ]]; then
            [[ "$MRK_CANDIDATE_MODE" == install-retained-git-observer && "$MRK_CORE_DIAGNOSTIC_REQUESTED" != true ]]
          fi
          [[ "$MRK_TOOL_RESUME_FROM" == identity || "$MRK_TOOL_RESUME_FROM" == service ]]
          if [[ "$MRK_TOOL_RESUME_FROM" == service ]]; then
            [[ "$MRK_CANDIDATE_MODE" == install-retained-observer ]]
            printf '%s\n' 'Identity checks are skipped, not passed; testing independent service and Tool operations.'
          fi
      - name: Check out the unchanged signed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MRK_CANDIDATE_SOURCE }}
          persist-credentials: false
      - name: Keep current helpers separate from the original application
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.candidate-consumer-helper"
          test ! -L "$GITHUB_WORKSPACE/.candidate-consumer-helper"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate-consumer-helper
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: arm64
      - name: Prepare the existing private host interpreter
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          export MRK_MACOS_WORK="$work"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s/host-python/bin/python3\n' "$work" "$work" >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"
          export MRK_HOST_BASE_CONTEXT
          MRK_HOST_BASE_CONTEXT=$(python3 -I -S -B "$helper" host-base)
          python3 -I -S -B -m venv --copies --without-pip --without-scm-ignore-files "$work/host-python"
          "$work/host-python/bin/python3" -I -S -B "$helper" bind-host
          unset MRK_HOST_BASE_CONTEXT
      - name: Reuse the retained signed image for a fresh install and file verification
        id: retained_install
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          # Same signed package; no build, signing credentials or notarization.
          # The consumer removes its acquisition token before native install.
          set +e
          "$MRK_PYTHON" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" \
            > "$MRK_MACOS_WORK/retained-observer-install.json"
          phase_status=$?
          printf '%s\n' "$phase_status" > "$MRK_MACOS_WORK/retained-observer-install.status"
          saved_status=$?
          unset GITHUB_TOKEN
          set -e
          if [[ "$phase_status" != 0 ]]; then exit "$phase_status"; fi
          [[ "$saved_status" == 0 ]] || exit "$saved_status"
          # Only a real return0, fresh Installer/readback and unforced detach0
          # allow later cases. The JSON cannot certify its own future exit.
      - name: Diagnose the unchanged bundled core without launching the application
        if: inputs.bundled_core_diagnostic && env.MRK_CANDIDATE_MODE == 'install-retained-git-observer'
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_BUNDLED_CORE_DIAGNOSTIC: 'true'
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          # Diagnostic only: no app launch, project, credential, or provider input.
          # Do not run later native app cases against this prewarmed runtime.
          exec "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_bundled_core_probe.py"
      - name: Verify four supported project identity edits
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer' && inputs.tool_resume_from != 'service'
        timeout-minutes: 15
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          exec "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py" \
            --retained-observer --target "$MRK_MACOS_TARGET"
      - name: Start the fixed native service and verify readiness
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer'
        timeout-minutes: 13
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          exec "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py" \
            --retained-observer --target "$MRK_MACOS_TARGET" --scope tool-service-prerequisite
      - name: Verify the installed CLI with the native service
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer'
        timeout-minutes: 3
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          exec "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py" \
            --retained-observer --target "$MRK_MACOS_TARGET" --scope installed-cli-local-check
      - name: Prepare only the required isolated Android tool inputs
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer'
        timeout-minutes: 22
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          export MRK_ANDROID_PREPARATION_WORK="$MRK_MACOS_WORK"
          exec "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_android_dependency_preparation.py" prepare-tool-setup-inputs
      - name: Verify tool acquisition, cancellation and missing-only reuse
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer'
        timeout-minutes: 122
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          driver="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py"
          # Preserve existing case order and clocks; no retry or ignored78.
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope tool-setup --tool-cases public-acquisition
          exec "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope tool-setup
      - name: Verify signing-key reuse, cancellation, restart and encrypted backup
        if: env.MRK_CANDIDATE_MODE == 'install-retained-observer'
        timeout-minutes: 60
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          driver="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py"
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-roundtrip
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-stop-before-go
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-stop-after-new
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-cold-restart
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-backup-roundtrip
          exec "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope upload-key-backup-cli

      - name: Observe native startup beside the unchanged first Git case
        if: env.MRK_CANDIDATE_MODE == 'install-retained-git-observer' && inputs.native_startup_sample && !inputs.bundled_core_diagnostic
        timeout-minutes: 5
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools"
          # Name-selected stack observation only. No app control, prewarming,
          # raw report upload, later cases, or feature-qualification claim.
          MRK_MACOS_NATIVE_STARTUP_SAMPLE=true "$MRK_PYTHON" -I -S -B "$helper/macos_native_startup_sample.py" &
          sampler=$!
          set +e
          "$MRK_PYTHON" -I -S -B "$helper/macos_identity_current_runtime.py" \
            --retained-observer --target "$MRK_MACOS_TARGET" --scope git-index-cli-native
          case_status=$?
          wait "$sampler"
          sampler_status=$?
          set -e
          printf 'Original case exit: %s; diagnostic sampler exit: %s\n' "$case_status" "$sampler_status"
          if [[ "$case_status" != 0 ]]; then exit "$case_status"; fi
          exit "$sampler_status"

      - name: Verify fifteen existing Git cases on the freshly installed signed Git observer
        if: env.MRK_CANDIDATE_MODE == 'install-retained-git-observer' && !inputs.bundled_core_diagnostic && !inputs.native_startup_sample
        timeout-minutes: 25
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          driver="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_identity_current_runtime.py"
          # Original Index1 -> Branch1 -> Fetch4 -> Push3 -> create-only Push5 -> Upstream1.
          # Same nominated signed Git image, fresh Installer/readback/unforced detach first.
          # Existing600s suite/120s case,135s app and45/55s Git clocks unchanged;
          # the unchanged25min outer cap does not promise worst-case completion.
          # First nonzero/unknown/78 stops; no retry, live remote write or nomination.
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-index-cli-native
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-branch-cli-native
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-fetch-native
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-push-native
          "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-push-create-native
          exec "$MRK_PYTHON" -I -S -B "$driver" --retained-observer --target "$MRK_MACOS_TARGET" --scope git-upstream-native

  install-predecessor:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'workflow_dispatch' && inputs.operation == 'install-predecessor' && inputs.architecture == 'arm64' && github.ref == 'refs/heads/verify/desktop-macos-predecessor-install'
    name: Install the existing signed ARM app and observe its first detach
    runs-on: macos-26
    timeout-minutes: 18
    env:
      MRK_CANDIDATE_MODE: install-predecessor
      MRK_CANDIDATE_SOURCE: 'bf9d397bde641aae4b4cd205f3c962e899557650'
      MRK_MACOS_TARGET: aarch64-apple-darwin
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require the isolated disposable ARM host
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-predecessor-install ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/uname -m)" == arm64 ]]
      - name: Check out the unchanged delivered application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MRK_CANDIDATE_SOURCE }}
          persist-credentials: false
      - name: Keep the current diagnostic helper separate from the original source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.candidate-consumer-helper"
          test ! -L "$GITHUB_WORKSPACE/.candidate-consumer-helper"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate-consumer-helper
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: arm64
      - name: Prepare the existing private host interpreter
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          export MRK_MACOS_WORK="$work"
          printf 'MRK_MACOS_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"
          export MRK_HOST_BASE_CONTEXT
          MRK_HOST_BASE_CONTEXT=$(python3 -I -S -B "$helper" host-base)
          python3 -I -S -B -m venv --copies --without-pip --without-scm-ignore-files "$work/host-python"
          "$work/host-python/bin/python3" -I -S -B "$helper" bind-host
          unset MRK_HOST_BASE_CONTEXT
      - name: Reuse the signed app for one actual install, full readback and first unforced detach
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          # No compiler, signing credentials, notarization, Restore or UI journey.
          # The existing owner prints only its bounded public result/diagnostic.
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"

  inspect-predecessor:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-predecessor' && inputs.architecture == 'arm64' && github.ref == 'refs/heads/verify/desktop-macos-predecessor-inspection'
    name: Read-only delivered ARM predecessor controls
    # The fixed artifact target remains ARM64; this Intel host only inspects
    # DATA with native host tools and never executes a target binary.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Require the isolated dispatch, never the Restore push route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-predecessor-inspection ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/uname -m)" == x86_64 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Acquire only artifact 12157830080, with its original transport pin
        timeout-minutes: 6
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-predecessor.XXXXXXXX")
          export MRK_PREDECESSOR_WORK="$work"
          printf 'MRK_PREDECESSOR_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          python3 -I -S -B desktop/tools/macos_predecessor_inspection.py acquire
      - name: Read-only mount, parse package DATA, retain public controls, detach original
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          python3 -I -S -B desktop/tools/macos_predecessor_inspection.py inspect
      - name: Retain only producer, signature, inventory and the DATA-only inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivered-predecessor-controls-arm64-12157830080-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MRK_PREDECESSOR_WORK }}/output/producer.json
            ${{ env.MRK_PREDECESSOR_WORK }}/output/producer.sig
            ${{ env.MRK_PREDECESSOR_WORK }}/output/install-inventory.json
            ${{ env.MRK_PREDECESSOR_WORK }}/output/inspection.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Clean only this completed, detached original; retain every unknown
        if: always() && env.MRK_PREDECESSOR_WORK != ''
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          python3 -I -S -B desktop/tools/macos_predecessor_inspection.py cleanup

  consume:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-candidate-consume'
    name: candidate-consume-${{ matrix.target }}-${{ matrix.mode }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            mode: restore
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Functional Restore only. Detailed UI journeys are owner-tested manually.
      MRK_CANDIDATE_MODE: ${{ matrix.mode }}
      # All routes stay inactive until this and candidate-carrier-selection.json
      # name the same genuine retained candidate. No guessed/latest artifact.
      # This is checkout routing, not artifact/source admission authority.
      MRK_CANDIDATE_SOURCE: 'fcb1aa46fb95e601479078fdc98ba05acb701c05'
      MRK_MACOS_TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require the disposable hosted target and a selected candidate
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$MRK_CANDIDATE_MODE" = restore
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_WORKSPACE" = /Users/runner/work/mobile-release-kit/mobile-release-kit
          test "$RUNNER_TEMP" = /Users/runner/work/_temp
          test "$MRK_CANDIDATE_SOURCE" != 0000000000000000000000000000000000000000
          test "$(/usr/bin/id -u)" != 0
          # Read-only facts for the removal ancestor-policy failure. Fixed public
          # system directories only; this neither changes nor qualifies them.
          /usr/bin/stat -f 'MRK_REMOVAL_SYSTEM_DIRECTORY=role:root;mode:%p;uid:%u;gid:%g;flags:%f' /
          /usr/bin/stat -f 'MRK_REMOVAL_SYSTEM_DIRECTORY=role:volumes;mode:%p;uid:%u;gid:%g;flags:%f' /Volumes
          /usr/bin/stat -f 'MRK_REMOVAL_SYSTEM_DIRECTORY=role:library;mode:%p;uid:%u;gid:%g;flags:%f' /Library
          /usr/bin/stat -f 'MRK_REMOVAL_SYSTEM_DIRECTORY=role:application-support;mode:%p;uid:%u;gid:%g;flags:%f' '/Library/Application Support'
      - name: Check out the actual candidate at the canonical application source root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MRK_CANDIDATE_SOURCE }}
          persist-credentials: false
      - name: Require the separate helper checkout path to be absent
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.candidate-consumer-helper"
          test ! -L "$GITHUB_WORKSPACE/.candidate-consumer-helper"
      - name: Check out the current consumer without changing candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate-consumer-helper
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.python-architecture }}
      - name: Prepare only the ordinary private copied host interpreter
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          export MRK_MACOS_WORK="$work"
          printf 'MRK_MACOS_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"
          # Private shell capture only; no base paths/rosters enter Actions outputs.
          export MRK_HOST_BASE_CONTEXT
          MRK_HOST_BASE_CONTEXT=$(python3 -I -S -B "$helper" host-base)
          python3 -I -S -B -m venv --copies --without-pip --without-scm-ignore-files "$work/host-python"
          "$work/host-python/bin/python3" -I -S -B "$helper" bind-host
          unset MRK_HOST_BASE_CONTEXT
      - name: Prepare only the fixed source compiler and locked fixture dependencies
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 10
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
          EXPECTED_RUST_COMMIT: ${{ matrix.rust-commit }}
        run: |
          set -euo pipefail
          umask 077
          unset GITHUB_TOKEN GH_TOKEN
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            /Users/runner/.cargo/bin/rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          toolbin="/Users/runner/.rustup/toolchains/$RUSTUP_TOOLCHAIN-$MRK_MACOS_TARGET/bin"
          /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
            "$toolbin/rustc" -vV > "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "release: $RUSTUP_TOOLCHAIN" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "commit-hash: $EXPECTED_RUST_COMMIT" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "host: $MRK_MACOS_TARGET" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup RUSTC="$toolbin/rustc" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            "$toolbin/cargo" fetch --manifest-path "$GITHUB_WORKSPACE/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
          if [[ "$GITHUB_SHA" != "$MRK_CANDIDATE_SOURCE" ]]; then
            /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
              CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup RUSTC="$toolbin/rustc" \
              RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
              "$toolbin/cargo" fetch --manifest-path "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
          fi
      - name: Acquire once and materialize only verified full P and nonshipping thin inputs
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" acquire-restore \
            > "$MRK_MACOS_WORK/candidate-acquisition.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-acquisition.status"
          test "$status" = 0 || exit "$status"
      - name: Build and audit same-source nonshipping observer and three cut packages
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 56
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" prepare-restore \
            > "$MRK_MACOS_WORK/android-helper-prepare-app-absence.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/app-absence-preparation.status"
          test "$status" = 0 || exit "$status"
      - name: Observe original absence before any candidate Installer
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 14
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-baseline \
            > "$MRK_MACOS_WORK/resume-carrier/candidate-baseline.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/resume-carrier/candidate-baseline.status"
          test "$status" = 0 || exit "$status"
      - name: Reuse exact acquired candidate for fresh joined Installer and full runtime readback
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-install \
            > "$MRK_MACOS_WORK/candidate-install.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-install.status"
          test "$status" = 0 || exit "$status"
      - name: Withdraw app and observe three actual interruption cuts followed by ordinary Restore
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 14
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-chain \
            > "$MRK_MACOS_WORK/candidate-restore.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-restore.status"
          test "$status" = 0 || exit "$status"
          # Private baseline/installed controls and carriers remain on this
          # disposable runner. Never delete an unknown or active fixture.
      - name: Retain only the finite joined Restore observation, never carrier or private controls
        if: env.MRK_CANDIDATE_MODE == 'restore'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-restore-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_MACOS_WORK }}/candidate-restore.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  remove-delivery:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'workflow_dispatch' && inputs.operation == 'remove-delivery' && github.ref == 'refs/heads/task/ci-simplification-20261015'
    name: Matching removal package (${{ matrix.target }})
    environment: macos-developer-id
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 125
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"target":"aarch64-apple-darwin","runner":"macos-26","python":"arm64","rust":"1.98.1"}]' || inputs.architecture == 'x86_64' && '[{"target":"x86_64-apple-darwin","runner":"macos-26-intel","python":"x64","rust":"1.98.0"}]' || '[{"target":"aarch64-apple-darwin","runner":"macos-26","python":"arm64","rust":"1.98.1"},{"target":"x86_64-apple-darwin","runner":"macos-26-intel","python":"x64","rust":"1.98.0"}]') }}
    env:
      MRK_CANDIDATE_MODE: remove-delivery
      # Removal-only donor routing; Restore/UI keeps its independent nomination.
      MRK_CANDIDATE_SOURCE: ${{ fromJSON('{"aarch64-apple-darwin":"bf9d397bde641aae4b4cd205f3c962e899557650","x86_64-apple-darwin":"fcb1aa46fb95e601479078fdc98ba05acb701c05"}')[matrix.target] }}
      MRK_MACOS_TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require the disposable native Mac and fixed non-publishing delivery route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]]
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp ]]
          [[ "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]]
          case "$MRK_MACOS_TARGET/$RUNNER_ARCH/$(/usr/bin/uname -m)" in
            aarch64-apple-darwin/ARM64/arm64|x86_64-apple-darwin/X64/x86_64) ;;
            *) exit 1 ;;
          esac
      - name: Check out the unchanged signed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MRK_CANDIDATE_SOURCE }}
          persist-credentials: false
      - name: Preserve candidate source while reserving the delivery helper path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.candidate-consumer-helper"
          test ! -L "$GITHUB_WORKSPACE/.candidate-consumer-helper"
      - name: Check out only the current delivery helper separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate-consumer-helper
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.python }}
      - name: Prepare one private host interpreter for the existing delivery owner
        id: work
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          export MRK_MACOS_WORK="$work"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s/host-python/bin/python3\n' "$work" "$work" >> "$GITHUB_ENV"
          printf 'root=%s\n' "$work" >> "$GITHUB_OUTPUT"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"
          export MRK_HOST_BASE_CONTEXT
          MRK_HOST_BASE_CONTEXT=$(python3 -I -S -B "$helper" host-base)
          python3 -I -S -B -m venv --copies --without-pip --without-scm-ignore-files "$work/host-python"
          "$work/host-python/bin/python3" -I -S -B "$helper" bind-host
          unset MRK_HOST_BASE_CONTEXT
      - name: Prepare only the locked small removal-producer compiler inputs
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          unset GITHUB_TOKEN GH_TOKEN
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            /Users/runner/.cargo/bin/rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          toolbin="/Users/runner/.rustup/toolchains/$RUSTUP_TOOLCHAIN-$MRK_MACOS_TARGET/bin"
          /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup RUSTC="$toolbin/rustc" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            "$toolbin/cargo" fetch --manifest-path "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
      - name: Reuse and authenticate the signed candidate without installing it
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          set +e
          "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" acquire-removal \
            > "$MRK_MACOS_WORK/candidate-acquisition.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-acquisition.status"
          test "$status" = 0 || exit "$status"
      - name: Read the authenticated donor's selected package values
        shell: bash
        run: |
          set -euo pipefail
          "$MRK_PYTHON" -I -S -B - <<'PY_DONOR'
          import json, os, re
          from pathlib import Path
          work = Path(os.environ["MRK_MACOS_WORK"])
          assert (work / "candidate-acquisition.status").read_bytes() == b"0\n"
          # These values configure the ordinary packaging CLI. Each native phase
          # independently reauthenticates the donor; environment is not authority.
          body = (work / "candidate-acquisition.json").read_bytes()
          assert 0 < len(body) <= 65536
          value = json.loads(body)
          # Public count only, useful for diagnosing supported inventory limits.
          # Never print donor contents, local paths or credential data.
          inventory_bytes = value["inventory"]["bytes"]
          assert type(inventory_bytes) is int and 0 < inventory_bytes <= 12 * 1024 * 1024
          print(f"MRK_REMOVAL_INVENTORY_BYTES={inventory_bytes}")
          donor = value["removalDonor"]
          version = donor["sourcePackageVersion"]
          assert isinstance(version, str) and re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          values = {"MRK_MACOS_SOURCE_PACKAGE_VERSION": version,
              "MRK_MACOS_REMOVER_SHA256": donor["removerSha256"],
              "MRK_MACOS_INSTALL_INVENTORY_SHA256": value["inventory"]["sha256"],
              "MRK_BUNDLED_RUNTIME_MANIFEST_SHA256": value["runtimeManifestSha256"]}
          for key, value in values.items():
              if key != "MRK_MACOS_SOURCE_PACKAGE_VERSION":
                  assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY_DONOR
      - name: Prepare the fixed two-file removal package without executing it
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/desktop/tools/stage_macos_installed.py" remove-scripts --target "$MRK_MACOS_TARGET" \
            --remover "$MRK_MACOS_WORK/resume-carrier/mrk-macos-remove" \
            --expected-remover "$MRK_MACOS_REMOVER_SHA256" --output "$MRK_MACOS_WORK/remove-scripts" \
            > "$MRK_MACOS_WORK/remove-scripts-result.json"
          [[ ! -e "$MRK_MACOS_WORK/Remove-original.pkg" && ! -L "$MRK_MACOS_WORK/Remove-original.pkg" ]] || exit 1
          /usr/bin/pkgbuild --nopayload --scripts "$MRK_MACOS_WORK/remove-scripts" \
            --identifier dev.mobile-release-kit.desktop.remove --version "$MRK_MACOS_SOURCE_PACKAGE_VERSION" \
            --install-location / --ownership recommended "$MRK_MACOS_WORK/Remove-original.pkg"
          "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/desktop/tools/stage_macos_installed.py" prepare-remove-package --target "$MRK_MACOS_TARGET" --expected-remover "$MRK_MACOS_REMOVER_SHA256" \
            --scripts "$MRK_MACOS_WORK/remove-scripts" --package "$MRK_MACOS_WORK/Remove-original.pkg" \
            --output "$MRK_MACOS_WORK/remove-package-parts" > "$MRK_MACOS_WORK/remove-package-prepare.json"
          # Native tools only write fresh outputs as this nonroot account.
          # Preparation is not final0:0 acceptance; preserve the original pkg.
          # BSD tar pads stdout even when compressed; use the fresh private file.
          [[ ! -e "$MRK_MACOS_WORK/remove-package-parts/Scripts" && ! -L "$MRK_MACOS_WORK/remove-package-parts/Scripts" ]] || exit 1
          set +e
          (
            cd "$MRK_MACOS_WORK/remove-scripts" || exit
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
              /usr/bin/tar -c -z -f "$MRK_MACOS_WORK/remove-package-parts/Scripts" --format=odc --uid=0 --gid=0 \
              --no-acls --no-xattrs --no-fflags --no-mac-metadata .
          )
          tar_status=$?
          set -e
          printf '%s\n' "$tar_status" > "$MRK_MACOS_WORK/remove-package-tar.status"
          [[ $tar_status == 0 ]] || exit "$tar_status"
          # xar is not a streaming/O_EXCL tool: reserve its private output parent.
          /bin/mkdir -m 700 "$MRK_MACOS_WORK/remove-package-unsigned"
          [[ ! -e "$MRK_MACOS_WORK/remove-package-unsigned/Remove.pkg" && ! -L "$MRK_MACOS_WORK/remove-package-unsigned/Remove.pkg" ]] || exit 1
          set +e
          (
            cd "$MRK_MACOS_WORK/remove-package-parts" || exit
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
              /usr/bin/xar -c -f "$MRK_MACOS_WORK/remove-package-unsigned/Remove.pkg" \
              --compression=none PackageInfo Scripts
          )
          xar_status=$?
          set -e
          printf '%s\n' "$xar_status" > "$MRK_MACOS_WORK/remove-package-xar.status"
          [[ $xar_status == 0 ]] || exit "$xar_status"
          # This completed unsigned XAR is not final P; the next fixed phase signs and notarizes it.
      - name: Sign and notarize the completed removal package without executing it
        timeout-minutes: 32
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_INSTALLER_P12_BASE64: ${{ secrets.MRK_MACOS_INSTALLER_P12_BASE64 }}
          MRK_MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MRK_MACOS_INSTALLER_P12_PASSWORD }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_INSTALLER_P12_BASE64 MRK_MACOS_INSTALLER_P12_PASSWORD MRK_MACOS_NOTARY_API_KEY_BASE64
          set -euo pipefail
          set -o noclobber
          umask 077
          # A separate Installer identity signs the completed Scripts XAR.
          # Its private keychain closes before the bounded P8 notary wait;
          # Accepted, append-prefix POST, native validation and full audit all
          # precede final444 publication, P, the producer signature and Installer.
          set +e
          MRK_MACOS_INSTALLER_P12_BASE64="$MRK_MACOS_INSTALLER_P12_BASE64" \
          MRK_MACOS_INSTALLER_P12_PASSWORD="$MRK_MACOS_INSTALLER_P12_PASSWORD" \
          MRK_MACOS_NOTARY_API_KEY_BASE64="$MRK_MACOS_NOTARY_API_KEY_BASE64" \
            "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" finalize-remove-package \
            > "$MRK_MACOS_WORK/remove-package-finalization.stdout"
          finalization_status=$?
          printf '%s\n' "$finalization_status" > "$MRK_MACOS_WORK/remove-package-finalization.status"
          finalization_status_saved=$?
          unset MRK_MACOS_INSTALLER_P12_BASE64 MRK_MACOS_INSTALLER_P12_PASSWORD MRK_MACOS_NOTARY_API_KEY_BASE64
          set -e
          if [[ "$finalization_status" != 0 ]]; then exit "$finalization_status"; fi
          [[ "$finalization_status_saved" == 0 ]] || exit "$finalization_status_saved"
          # The separate package-remove owner requires this original0/status
          # plus the retained purpose-specific receipt; no removal is executed.

      - name: Emit the genuine removal descriptor and readonly carrier without Installer
        id: removal_package
        timeout-minutes: 18
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          set -euo pipefail
          set -o noclobber
          umask 077
          # The same bounded owner compiles only the fixed nonshipping signer,
          # emits genuine Remove-domain sidecars and creates one signed image.
          # No Installer, application launch or payload removal occurs.
          set +e
          MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" package-remove \
            > "$MRK_MACOS_WORK/package-remove.stdout"
          package_status=$?
          printf '%s\n' "$package_status" > "$MRK_MACOS_WORK/package-remove.status"
          package_status_saved=$?
          set -e
          if [[ "$package_status" != 0 ]]; then exit "$package_status"; fi
          [[ "$package_status_saved" == 0 ]] || exit "$package_status_saved"
          # Actual original0 and the exact Remove-purpose receipt are both
          # required by finalization. Unknown resources remain retained.
          unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
      - name: Notarize staple and verify the separate readonly removal carrier
        timeout-minutes: 32
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_NOTARY_API_KEY_BASE64
          set -euo pipefail
          set -o noclobber
          umask 077
          # The old signed image and package receipt remain immutable. The
          # fixed phase finalizes only its own copy; the final readonly mount
          # must contain exactly the already-bound P and two producer files.
          set +e
          MRK_MACOS_NOTARY_API_KEY_BASE64="$MRK_MACOS_NOTARY_API_KEY_BASE64" \
            "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" finalize-remove-image \
            > "$MRK_MACOS_WORK/remove-image-finalization.stdout"
          image_status=$?
          printf '%s\n' "$image_status" > "$MRK_MACOS_WORK/remove-image-finalization.status"
          image_status_saved=$?
          unset MRK_MACOS_NOTARY_API_KEY_BASE64
          set -e
          if [[ "$image_status" != 0 ]]; then exit "$image_status"; fi
          [[ "$image_status_saved" == 0 ]] || exit "$image_status_saved"
          # Neither a provisional file nor its receipt substitutes for this
          # actual original0. Preview has no fallback to the old image.
      - name: Export only the matching verified removal image and instructions
        id: removal_preview
        timeout-minutes: 3
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          "$MRK_PYTHON" -I -S -B "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" remove-preview \
            > "$MRK_MACOS_WORK/remove-preview-result.json"
      - name: Deliver the removal image without repackaging the unchanged application
        id: removal_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-kit-macos26-${{ matrix.target }}-remove-for-${{ env.MRK_CANDIDATE_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.work.outputs.root }}/remove-preview/MobileReleaseKit-Remove.dmg
            ${{ steps.work.outputs.root }}/remove-preview/REMOVE.md
            ${{ steps.work.outputs.root }}/remove-preview/REMOVAL.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove only this completed delivery's private temporary outputs
        if: always() && steps.removal_preview.outcome == 'success' && steps.removal_upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MRK_MACOS_WORK" == "$RUNNER_TEMP"/mrk-macos-installed.* && -d "$MRK_MACOS_WORK" && ! -L "$MRK_MACOS_WORK" ]]
          # The existing phase owners returned with their children joined,
          # keychains retired and mounts detached. Failed/unknown phases instead
          # rely on disposal of this hosted VM; never guess a kill or deletion.
          # Staging seals owned directories read-only. Restore only directory
          # owner-write permission, without following links or changing files.
          /usr/bin/find -P "$MRK_MACOS_WORK" -type d -exec /bin/chmod u+w {} +
          /bin/rm -rf -- "$MRK_MACOS_WORK"
