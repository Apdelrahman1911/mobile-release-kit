name: Same-candidate independent installed-app checks

on:
  push:
    branches: [verify/desktop-macos-candidate-consume]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-candidate-consume
  cancel-in-progress: false

jobs:
  consume:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-candidate-consume'
    name: candidate-consume-${{ matrix.target }}-${{ matrix.mode }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: aarch64-apple-darwin
            mode: ordinary-ui
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: ordinary-ui
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
          - target: aarch64-apple-darwin
            mode: ordinary-ios-ui
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: ordinary-ios-ui
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
          - target: aarch64-apple-darwin
            mode: ordinary-saved-ui
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: ordinary-saved-ui
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
          - target: aarch64-apple-darwin
            mode: ordinary-saved-version-ui
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: ordinary-saved-version-ui
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
          - target: aarch64-apple-darwin
            mode: ordinary-ios-pending-ui
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: ordinary-ios-pending-ui
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
          - target: aarch64-apple-darwin
            mode: restore
            runner: macos-26
            python-architecture: arm64
            rust-version: 1.98.1
            rust-commit: 48a229ceaefd4985c50990b14116b6d856af0985
          - target: x86_64-apple-darwin
            mode: restore
            runner: macos-26-intel
            python-architecture: x64
            rust-version: 1.98.0
            rust-commit: 88d9e12ae178fab0fb5cc050a94da85685d449ea
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Independent SOURCE-selected cohorts, each on its own fresh Mac.
      # For focused reruns, retain only the required explicit include rows.
      MRK_CANDIDATE_MODE: ${{ matrix.mode }}
      # All routes stay inactive until this and candidate-carrier-selection.json
      # name the same genuine retained candidate. No guessed/latest artifact.
      # This is checkout routing, not artifact/source admission authority.
      MRK_CANDIDATE_SOURCE: 'cafb4f9887938cbe21df698dc79abdcd87c72a96'
      MRK_MACOS_TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require the disposable hosted target and a selected candidate
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          case "$MRK_CANDIDATE_MODE" in restore|ordinary-ui|ordinary-entry-ui|ordinary-ios-ui|ordinary-saved-ui|ordinary-saved-version-ui|ordinary-android-ui|ordinary-ios-pending-ui) ;; *) exit 1 ;; esac
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_WORKSPACE" = /Users/runner/work/mobile-release-kit/mobile-release-kit
          test "$RUNNER_TEMP" = /Users/runner/work/_temp
          test "$MRK_CANDIDATE_SOURCE" != 0000000000000000000000000000000000000000
          test "$(/usr/bin/id -u)" != 0
      - name: Check out the actual candidate at the canonical application source root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MRK_CANDIDATE_SOURCE }}
          persist-credentials: false
      - name: Require the separate helper checkout path to be absent
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.candidate-consumer-helper"
          test ! -L "$GITHUB_WORKSPACE/.candidate-consumer-helper"
      - name: Check out the current consumer without changing candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .candidate-consumer-helper
          persist-credentials: false
      - name: Prepare only the selected Xcode for this disposable unsigned-iOS cohort
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ios-ui'
        timeout-minutes: 36
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate-consume ]]
          [[ "$GITHUB_WORKFLOW_REF" == Apdelrahman1911/mobile-release-kit/.github/workflows/desktop-macos-candidate-consume.yml@refs/heads/verify/desktop-macos-candidate-consume ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$(/usr/bin/id -u)" != 0 ]]
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper"
          [[ "$(/usr/bin/git -C "$helper" rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
          /usr/bin/git -C "$helper" diff --quiet HEAD -- desktop/tools/prepare_ci_xcode.py
          # Existing bounded Apple-signed fixture setup, before artifact access
          # or install. This does not qualify ordinary writable Mac layouts.
          # Candidate source/harness remain separate from actual helper source.
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_WORKFLOW_SHA,MRK_CANDIDATE_MODE \
            /usr/bin/python3 -I -B "$helper/desktop/tools/prepare_ci_xcode.py" --candidate-consume
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.python-architecture }}
      - name: Prepare only the ordinary private copied host interpreter
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          work=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          export MRK_MACOS_WORK="$work"
          printf 'MRK_MACOS_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py"
          # Private shell capture only; no base paths/rosters enter Actions outputs.
          export MRK_HOST_BASE_CONTEXT
          MRK_HOST_BASE_CONTEXT=$(python3 -I -S -B "$helper" host-base)
          python3 -I -S -B -m venv --copies --without-pip --without-scm-ignore-files "$work/host-python"
          "$work/host-python/bin/python3" -I -S -B "$helper" bind-host
          unset MRK_HOST_BASE_CONTEXT
      - name: Prepare only the fixed source compiler and locked fixture dependencies
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 10
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
          EXPECTED_RUST_COMMIT: ${{ matrix.rust-commit }}
        run: |
          set -euo pipefail
          umask 077
          unset GITHUB_TOKEN GH_TOKEN
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            /Users/runner/.cargo/bin/rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          toolbin="/Users/runner/.rustup/toolchains/$RUSTUP_TOOLCHAIN-$MRK_MACOS_TARGET/bin"
          /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
            "$toolbin/rustc" -vV > "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "release: $RUSTUP_TOOLCHAIN" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "commit-hash: $EXPECTED_RUST_COMMIT" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/grep -Fx "host: $MRK_MACOS_TARGET" "$MRK_MACOS_WORK/fixture-rust-version.txt"
          /usr/bin/env -i PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin" HOME=/Users/runner \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup RUSTC="$toolbin/rustc" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            "$toolbin/cargo" fetch --manifest-path "$GITHUB_WORKSPACE/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
      - name: Acquire once and materialize only verified full P and nonshipping thin inputs
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" acquire-restore \
            > "$MRK_MACOS_WORK/candidate-acquisition.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-acquisition.status"
          test "$status" = 0 || exit "$status"
      - name: Build and audit same-source nonshipping observer and three cut packages
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 56
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" prepare-restore \
            > "$MRK_MACOS_WORK/android-helper-prepare-app-absence.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/app-absence-preparation.status"
          test "$status" = 0 || exit "$status"
      - name: Observe original absence before any candidate Installer
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 14
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-baseline \
            > "$MRK_MACOS_WORK/resume-carrier/candidate-baseline.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/resume-carrier/candidate-baseline.status"
          test "$status" = 0 || exit "$status"
      - name: Reuse exact acquired candidate for fresh joined Installer and full runtime readback
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-install \
            > "$MRK_MACOS_WORK/candidate-install.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-install.status"
          test "$status" = 0 || exit "$status"
      - name: Withdraw app and observe three actual interruption cuts followed by ordinary Restore
        if: env.MRK_CANDIDATE_MODE == 'restore'
        timeout-minutes: 14
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" restore-chain \
            > "$MRK_MACOS_WORK/candidate-restore.json"
          status=$?
          set -e
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/candidate-restore.status"
          test "$status" = 0 || exit "$status"
          # Private baseline/installed controls and carriers remain on this
          # disposable runner. Never delete an unknown or active fixture.
      - name: Retain only the finite joined Restore observation, never carrier or private controls
        if: env.MRK_CANDIDATE_MODE == 'restore'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-restore-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_MACOS_WORK }}/candidate-restore.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Show only public system-tool metadata before candidate admission
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-entry-ui'
        timeout-minutes: 1
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY_SYSTEM_TOOLS'
          import json, os, stat
          tools = (('git', '/usr/bin/git'), ('hdiutil', '/usr/bin/hdiutil'),
                   ('vm_stat', '/usr/bin/vm_stat'), ('openssl', '/usr/bin/openssl'),
                   ('codesign', '/usr/bin/codesign'), ('installer', '/usr/sbin/installer'))
          for role, path in tools:
              try:
                  info = os.lstat(path)
                  value = dict(role=role, kind=stat.S_IFMT(info.st_mode), mode=stat.S_IMODE(info.st_mode),
                               uid=info.st_uid, gid=info.st_gid, links=info.st_nlink, bytes=info.st_size,
                               flags=getattr(info, 'st_flags', 0))
              except OSError as error:
                  value = dict(role=role, errno=error.errno)
              print(json.dumps(dict(scope='public-system-tool-metadata-only', admissionChanged=False, **value)))
          PY_SYSTEM_TOOLS
          # Diagnostic only: no source, private files, token, or tool execution.
          # Actual original-file admission below remains unchanged and required.

      - name: Install the exact final candidate once without rebuilding or signing it
        id: ordinary_install
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-entry-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-ios-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-saved-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-saved-version-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui'
        timeout-minutes: 12
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          # The existing ordinary consumer acquires the nominated final DMG,
          # authenticates its producer, installs and fully reads back the same
          # request, then positively detaches/closes/retires its originals.
          # No app, Rust observer, package producer or image is rebuilt here.
          set +e
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
            "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_consumer.py" \
            > "$MRK_MACOS_WORK/consumer-result.json"
          status=$?
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/consumer-install.status"
          saved=$?
          set -e
          unset GITHUB_TOKEN GH_TOKEN
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          [[ "$saved" == 0 ]] || exit "$saved"
          # The receipt is not its own exit proof. Only this step's original0
          # permits the next existing UI helper to admit its same-job handoff.
      - name: Observe existing ordinary UI journeys on that same installed candidate
        id: ordinary_ui
        if: (env.MRK_CANDIDATE_MODE == 'ordinary-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-entry-ui') && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 100
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          # Each existing helper keeps its original inner and outer deadlines;
          # this containing step/job does not grant a new native clock. Only the
          # nonshipping XCTest harness builds, once, from the actual candidate
          # checkout. Application/harness source are never relabeled as helper.
          case "$MRK_CANDIDATE_MODE" in
            ordinary-ui) cohort=() ;;
            ordinary-entry-ui) cohort=(--entry) ;;
            *) exit 1 ;;
          esac
          ui() {
            local phase=$1 status saved status_path
            case "$phase" in
              build|test|summary|applications-test|applications-summary|project-test|project-summary|persistence-test|persistence-summary|saved-checks-test|saved-checks-summary)
                status_path="$MRK_MACOS_WORK/normal-ui/$phase.status" ;;
              result|cleanup) status_path="$MRK_MACOS_WORK/candidate-ui-$phase.status" ;;
              *) return 1 ;;
            esac
            set +e
            "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
              "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_ui.py" "${cohort[@]}" "$phase" \
              > "$MRK_MACOS_WORK/candidate-ui-$phase.json"
            status=$?
            printf '%s\n' "$status" > "$status_path"
            saved=$?
            set -e
            printf 'MRK_CANDIDATE_UI_PHASE=%s;originalReturncode=%s;observationOnly=true\n' "$phase" "$status"
            if [[ "$status" != 0 ]]; then return "$status"; fi
            [[ "$saved" == 0 ]] || return "$saved"
          }
          # Fixed order, never a retry or a roster supplied by a downloaded file.
          # read_phase admits each prior actual0 + its original captures/receipt.
          ui build
          if [[ "$MRK_CANDIDATE_MODE" == ordinary-entry-ui ]]; then
            # Existing one-method native picker/quit smoke, not ordinary6/P0.
            ui test
            ui summary
          else
            ui applications-test
            ui applications-summary
            ui project-test
            ui project-summary
            ui persistence-test
            ui persistence-summary
            ui saved-checks-test
            ui saved-checks-summary
          fi
          ui result
          ui cleanup
          # Cleanup runs only after every original succeeded. It retires known
          # build/test outputs, not the installed app, finite phase controls or
          # private synthetic fixtures.
          # Unknown owners stop the sequence and remain for hosted VM disposal.
      - name: Observe unsigned iOS archive and limited Android diagnostics on the same candidate
        id: ordinary_ios_ui
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ios-ui' && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 70
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          # Each existing helper keeps its original inner and outer deadlines;
          # this containing step/job does not grant a new native clock. Only the
          # nonshipping XCTest harness builds once from the current helper when
          # its source differs; otherwise it uses the candidate checkout. The
          # installed app keeps its genuine candidate source in both routes.
          ui() {
            local phase=$1 status saved status_path
            case "$phase" in
              build|diagnostics-test|diagnostics-summary|ios-unsigned-archive-test|ios-unsigned-archive-summary)
                status_path="$MRK_MACOS_WORK/normal-ui/$phase.status" ;;
              result|cleanup) status_path="$MRK_MACOS_WORK/candidate-ui-$phase.status" ;;
              *) return 1 ;;
            esac
            set +e
            "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
              "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_ui.py" --ios-tools "$phase" \
              > "$MRK_MACOS_WORK/candidate-ui-$phase.json"
            status=$?
            printf '%s\n' "$status" > "$status_path"
            saved=$?
            set -e
            printf 'MRK_CANDIDATE_UI_PHASE=%s;originalReturncode=%s;observationOnly=true\n' "$phase" "$status"
            if [[ "$status" != 0 ]]; then return "$status"; fi
            [[ "$saved" == 0 ]] || return "$saved"
          }
          # Two existing methods only: Android four-card Environment observation
          # (NOT full/iOS doctor), then unsigned archive (NO signing/IPA/Store).
          # Fixed order, never a retry or a roster supplied by a downloaded file.
          # read_phase admits each prior actual0 + its original captures/receipt.
          ui build
          ui diagnostics-test
          ui diagnostics-summary
          ui ios-unsigned-archive-test
          ui ios-unsigned-archive-summary
          ui result
          ui cleanup
          # Cleanup runs only after every original succeeded. It retires known
          # build/test outputs, not the installed app, finite phase controls or
          # private synthetic fixtures.
          # Unknown owners stop the sequence and remain for hosted VM disposal.
      - name: Observe saved release documents and managed-workflow refusal on the same candidate
        id: ordinary_saved_ui
        if: env.MRK_CANDIDATE_MODE == 'ordinary-saved-ui' && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 50
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          # Each existing helper keeps its original inner and outer deadlines;
          # this containing step/job does not grant a new native clock. Only the
          # nonshipping XCTest harness builds, once, from the actual candidate
          # checkout. Application/harness source are never relabeled as helper.
          ui() {
            local phase=$1 status saved status_path
            case "$phase" in
              build|release-evidence-test|release-evidence-summary|workflow-refusal-test|workflow-refusal-summary)
                status_path="$MRK_MACOS_WORK/normal-ui/$phase.status" ;;
              result|cleanup) status_path="$MRK_MACOS_WORK/candidate-ui-$phase.status" ;;
              *) return 1 ;;
            esac
            set +e
            "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
              "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_ui.py" --saved-files "$phase" \
              > "$MRK_MACOS_WORK/candidate-ui-$phase.json"
            status=$?
            printf '%s\n' "$status" > "$status_path"
            saved=$?
            set -e
            printf 'MRK_CANDIDATE_UI_PHASE=%s;originalReturncode=%s;observationOnly=true\n' "$phase" "$status"
            if [[ "$status" != 0 ]]; then return "$status"; fi
            [[ "$saved" == 0 ]] || return "$saved"
          }
          # Two existing methods only: saved document picker/navigation and a
          # customized-workflow refusal. No remote release or saved-version recovery.
          # Fixed order, never a retry or a roster supplied by a downloaded file.
          # read_phase admits each prior actual0 + its original captures/receipt.
          ui build
          ui release-evidence-test
          ui release-evidence-summary
          ui workflow-refusal-test
          ui workflow-refusal-summary
          ui result
          ui cleanup
          # Cleanup runs only after every original succeeded. It retires known
          # build/test outputs, not the installed app, finite phase controls or
          # private synthetic fixtures.
          # Unknown owners stop the sequence and remain for hosted VM disposal.
      - name: Observe one current-candidate saved-version rollback with the newer helper harness
        id: ordinary_saved_version_ui
        if: env.MRK_CANDIDATE_MODE == 'ordinary-saved-version-ui' && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          unset GITHUB_TOKEN GH_TOKEN
          # Each existing helper keeps its original inner and outer deadlines;
          # this containing step/job does not grant a new native clock. Only the
          # nonshipping XCTest harness builds once from this helper checkout.
          # Installed app and core retain their actual candidate source; the
          # runner executes at the helper root with an explicit separate source.
          ui() {
            local phase=$1 status saved status_path
            case "$phase" in
              build|saved-version-recovery-test|saved-version-recovery-summary)
                status_path="$MRK_MACOS_WORK/normal-ui/$phase.status" ;;
              result|cleanup) status_path="$MRK_MACOS_WORK/candidate-ui-$phase.status" ;;
              *) return 1 ;;
            esac
            set +e
            "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B \
              "$GITHUB_WORKSPACE/.candidate-consumer-helper/desktop/tools/macos_candidate_ui.py" --saved-version "$phase" \
              > "$MRK_MACOS_WORK/candidate-ui-$phase.json"
            status=$?
            printf '%s\n' "$status" > "$status_path"
            saved=$?
            set -e
            printf 'MRK_CANDIDATE_UI_PHASE=%s;originalReturncode=%s;observationOnly=true\n' "$phase" "$status"
            if [[ "$status" != 0 ]]; then return "$status"; fi
            [[ "$saved" == 0 ]] || return "$saved"
          }
          # One existing rollback method only. Genuine candidate core interrupt86
          # precedes fresh UI recovery; this is not an interrupted GUI save.
          # Fixed order, never a retry or a roster supplied by a downloaded file.
          # read_phase admits each prior actual0 + its original captures/receipt.
          ui build
          ui saved-version-recovery-test
          ui saved-version-recovery-summary
          ui result
          ui cleanup
          # Cleanup runs only after every original succeeded. It retires known
          # build/test outputs, not the installed app, finite phase controls or
          # private synthetic fixtures.
          # Unknown owners stop the sequence and remain for hosted VM disposal.
      - name: Build only the current Android test harness after the original candidate installation
        id: ordinary_android_build
        if: env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 11
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_ANDROID_CONSUMER_PHASE: build
        run: &mrk_android_consumer_phase |
          set +x
          set +a
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          normal="$MRK_MACOS_WORK/normal-ui"
          helper="$GITHUB_WORKSPACE/.candidate-consumer-helper"
          case "$MRK_MACOS_TARGET" in
            aarch64-apple-darwin) hosted=github-hosted-macos26-arm64 ;;
            x86_64-apple-darwin) hosted=github-hosted-macos26-x86_64 ;;
            *) exit 1 ;;
          esac
          case "$MRK_CANDIDATE_MODE" in
            ordinary-android-ui)
              stem=android-candidate-inputs
              test_prior="$normal/android-inputs.status"
              profile_environment=(
                "MRK_ANDROID_PREPARATION_WORK=$MRK_MACOS_WORK"
                TEST_RUNNER_MRK_NORMAL_UI_CURRENT_ANDROID_CANDIDATE=current-candidate-android-candidate-only-v1
                "TEST_RUNNER_MRK_NORMAL_UI_ANDROID_INPUT_FIXTURE=$normal/android-input-fixture.json"
                "TEST_RUNNER_MRK_NORMAL_UI_ANDROID_RUN_ID=$GITHUB_RUN_ID"
                "TEST_RUNNER_MRK_NORMAL_UI_ANDROID_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT") ;;
            ordinary-ios-pending-ui)
              stem=ios-pending-recovery
              test_prior="$normal/build.status"
              profile_environment=(TEST_RUNNER_MRK_NORMAL_UI_CURRENT_IOS_PENDING=current-candidate-ios-pending-only-v1) ;;
            *) exit 1 ;;
          esac
          case "$MRK_ANDROID_CONSUMER_PHASE" in
            build) prior="$MRK_MACOS_WORK/consumer-install.status" ;;
            inputs)
              [[ "$MRK_CANDIDATE_MODE" == ordinary-android-ui ]]
              prior="$normal/build.status" ;;
            test) prior="$test_prior" ;;
            *) exit 1 ;;
          esac
          # This status supplements the preceding real step success; it never
          # substitutes for the original install/build/supplier invocation.
          [[ -f "$prior" && ! -L "$prior" && "$(< "$prior")" == 0 ]]
          cd "$helper"
          run_original() {
            local label=$1 module=$2 status saved
            shift 2
            set +e
            /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner USER=runner LOGNAME=runner \
              "TMPDIR=$normal/tmp/" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 TZ=UTC \
              DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
              "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME" \
              "GITHUB_REF=$GITHUB_REF" "GITHUB_SHA=$GITHUB_SHA" "GITHUB_WORKFLOW_SHA=$GITHUB_WORKFLOW_SHA" \
              "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
              "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
              "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "RUNNER_OS=$RUNNER_OS" "RUNNER_ARCH=$RUNNER_ARCH" \
              "MRK_MACOS_TARGET=$MRK_MACOS_TARGET" \
              "MRK_CANDIDATE_MODE=$MRK_CANDIDATE_MODE" "MRK_CANDIDATE_SOURCE=$MRK_CANDIDATE_SOURCE" \
              "TEST_RUNNER_MRK_NORMAL_UI_HOSTED_JOB=$hosted" \
              "TEST_RUNNER_MRK_NORMAL_UI_APPLICATION_SOURCE=$MRK_CANDIDATE_SOURCE" \
              "TEST_RUNNER_MRK_NORMAL_UI_HARNESS_SOURCE=$GITHUB_SHA" \
              "${profile_environment[@]}" \
              "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B "$helper/desktop/tools/$module" "$@" \
              > "$normal/$label.caller.stdout" 2> "$normal/$label.caller.stderr"
            status=$?
            printf '%s\n' "$status" > "$normal/$label.status"
            saved=$?
            set -e
            printf 'MRK_CANDIDATE_NATIVE_PHASE=%s;originalReturncode=%s;observationOnly=true\n' "$label" "$status" || :
            if [[ "$status" != 0 ]]; then return "$status"; fi
            [[ "$saved" == 0 ]] || return "$saved"
          }
          case "$MRK_ANDROID_CONSUMER_PHASE" in
            build)
              # Exclusive fresh directories; --normal-build does not create them.
              /bin/mkdir -m 700 "$normal"
              /bin/mkdir -m 700 "$normal/tmp"
              ulimit -f 33554432
              run_original build macos_normal_ui_runner.py --target "$MRK_MACOS_TARGET" --normal-build
              ;;
            inputs)
              run_original android-inputs macos_android_dependency_preparation.py prepare-consumer-ui-inputs
              ;;
            test)
              ulimit -f 1048576
              run_original "$stem-test" macos_normal_ui_runner.py --target "$MRK_MACOS_TARGET" "--normal-$stem-test"
              run_original "$stem-summary" macos_normal_ui_runner.py --target "$MRK_MACOS_TARGET" "--normal-$stem-summary"
              ;;
          esac
      - name: Prepare disposable Android tools and signing inputs without rebuilding the application
        id: ordinary_android_inputs
        if: env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' && steps.ordinary_android_build.outcome == 'success'
        timeout-minutes: 22
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_ANDROID_CONSUMER_PHASE: inputs
        run: *mrk_android_consumer_phase
      - name: Build and sign an Android candidate through the installed application
        id: ordinary_android_ui
        if: env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' && steps.ordinary_android_inputs.outcome == 'success'
        timeout-minutes: 23
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_ANDROID_CONSUMER_PHASE: test
        run: *mrk_android_consumer_phase
      - name: Build only the current pending-iOS test harness after the original candidate installation
        id: ordinary_ios_pending_build
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui' && steps.ordinary_install.outcome == 'success'
        timeout-minutes: 11
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_ANDROID_CONSUMER_PHASE: build
        run: *mrk_android_consumer_phase
      - name: Recover an interrupted iOS account operation through the installed application
        id: ordinary_ios_pending_ui
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui' && steps.ordinary_ios_pending_build.outcome == 'success'
        timeout-minutes: 22
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_ANDROID_CONSUMER_PHASE: test
        run: *mrk_android_consumer_phase
      - name: Retire only joined native test build and result directories
        id: ordinary_android_cleanup
        if: (env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' && steps.ordinary_android_ui.outcome == 'success') || (env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui' && steps.ordinary_ios_pending_ui.outcome == 'success')
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          case "$MRK_CANDIDATE_MODE" in
            ordinary-android-ui) result=android-candidate-inputs-test.xcresult ;;
            ordinary-ios-pending-ui) result=ios-pending-recovery-test.xcresult ;;
            *) exit 1 ;;
          esac
          "$MRK_MACOS_WORK/host-python/bin/python3" -I -S -B - "$MRK_MACOS_WORK/normal-ui" "$result" <<'PY_ANDROID_CLEAN'
          import os, shutil, stat, sys
          from pathlib import Path
          normal = Path(sys.argv[1]); parent = normal.lstat()
          assert normal.name == 'normal-ui' and normal.parent.parent == Path('/Users/runner/work/_temp')
          assert stat.S_ISDIR(parent.st_mode) and parent.st_uid == os.getuid() != 0
          assert stat.S_IMODE(parent.st_mode) == 0o700 and shutil.rmtree.avoids_symlink_attacks
          assert sys.argv[2] in ('android-candidate-inputs-test.xcresult', 'ios-pending-recovery-test.xcresult')
          for name in ('DerivedData', sys.argv[2]):
              path = normal / name; before = path.lstat()
              assert stat.S_ISDIR(before.st_mode) and before.st_uid == parent.st_uid and before.st_dev == parent.st_dev
              shutil.rmtree(path)
          PY_ANDROID_CLEAN
          # Keep finite evidence and the installed app. Private synthetic inputs
          # and any uncertain resources are never uploaded; hosted disposal follows.
      - name: Retain only successful Android observations and original caller statuses
        if: env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' && steps.ordinary_android_cleanup.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-ordinary-android-ui-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MRK_MACOS_WORK }}/consumer-result.json
            ${{ env.MRK_MACOS_WORK }}/consumer-install.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.command-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-inputs.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs-test.runner-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs-test.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs-summary.runner-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs-summary.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs.facts.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # No raw XCTest captures, private inputs, keystore, scalars or xcresult.

      - name: Retain only successful pending-iOS observations and original caller statuses
        if: env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui' && steps.ordinary_android_cleanup.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-ordinary-ios-pending-ui-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MRK_MACOS_WORK }}/consumer-result.json
            ${{ env.MRK_MACOS_WORK }}/consumer-install.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.command-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-test.runner-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-test.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-summary.command-admission.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-summary.status
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery.facts.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # No account baseline/control, Keychain data, raw captures or xcresult.

      - name: Retain only existing sanitized native failure diagnostics
        if: failure() && (env.MRK_CANDIDATE_MODE == 'ordinary-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-entry-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-android-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-ios-pending-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-ios-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-saved-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-saved-version-ui')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-native-failure-${{ matrix.target }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MRK_MACOS_WORK }}/normal-ui/toolchain.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/build.settings-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/applications-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/applications-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/project-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/project-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/persistence-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/persistence-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/saved-checks-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/saved-checks-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/diagnostics-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/diagnostics-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-unsigned-archive-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-unsigned-archive-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/release-evidence-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/release-evidence-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/workflow-refusal-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/workflow-refusal-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/saved-version-recovery-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/saved-version-recovery-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/android-candidate-inputs.failure.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-test.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/normal-ui/ios-pending-recovery-summary.failure-diagnostics.json
            ${{ env.MRK_MACOS_WORK }}/prepare-ui-inputs-failure.json
            ${{ env.MRK_MACOS_WORK }}/acquire-ui-inputs-failure.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          # Missing diagnostics never imply success. No raw logs/private inputs.

      - name: Retain only the bounded ordinary UI observation and positive cleanup
        if: ((env.MRK_CANDIDATE_MODE == 'ordinary-ui' || env.MRK_CANDIDATE_MODE == 'ordinary-entry-ui') && steps.ordinary_ui.outcome == 'success') || (env.MRK_CANDIDATE_MODE == 'ordinary-ios-ui' && steps.ordinary_ios_ui.outcome == 'success') || (env.MRK_CANDIDATE_MODE == 'ordinary-saved-ui' && steps.ordinary_saved_ui.outcome == 'success') || (env.MRK_CANDIDATE_MODE == 'ordinary-saved-version-ui' && steps.ordinary_saved_version_ui.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ env.MRK_CANDIDATE_MODE }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MRK_MACOS_WORK }}/candidate-ui-result.json
            ${{ env.MRK_MACOS_WORK }}/candidate-ui-cleanup.json
            ${{ env.MRK_MACOS_WORK }}/consumer-result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # Selected cohort only: entry1, ordinary6, unsigned-iOS/Android-diagnostics2 saved-documents2 or current saved-version1. No raw captures, xcresult,
          # credential fixtures, signed carrier or full-feature readiness claim.
