                  label=type(error).__name__;state['exceptionClass']=label if label in EARLY_CLASSES else 'other'
          
          def _admit_host():
              if _failed('versionExpected',lambda:sys.version_info[:3]!=(3,14,7)) or _failed('isolatedFlag',lambda:not sys.flags.isolated) or _failed('noSiteFlag',lambda:not sys.flags.no_site) or _failed('dontWriteBytecode',lambda:not sys.dont_write_bytecode):raise SystemExit(1)
