              work=pathlib.Path(os.environ['MRK_MACOS_WORK']);normal=work/'normal-ui'
              identity=lambda v:(v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid)
              binding={'schemaVersion':1,'source':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                       'workIdentity':list(identity(_observed('workStatRead',lambda:os.stat(work,follow_symlinks=False)))),'normalIdentity':list(identity(_observed('normalStatRead',lambda:os.stat(normal,follow_symlinks=False))))}
              body=json.dumps(binding,sort_keys=True,separators=(',',':')).encode()+b'\n'
              _stage('work-binding-open')
              outfd=_observed('workBindingOpened',lambda:os.open(normal/'consumer-work-binding.json',os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600))
              try:
