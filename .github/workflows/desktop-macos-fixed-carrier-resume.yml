name: Fixed ARM finalized-carrier resume (fresh Installer and one unsigned iOS case only)
on:
  push:
    branches: [verify/desktop-macos-installed]
    paths:
      - .github/workflows/desktop-macos-fixed-carrier-resume.yml
      - desktop/tools/macos_fixed_carrier_resume.py
      - desktop/tools/macos_normal_ui_runner.py
      - desktop/native/macos-normal-ui/**
      - desktop/macos-installed-inputs/fixed-arm-carrier-origin-public.json
permissions:
  contents: read
  actions: read
concurrency:
  group: mrk-fixed-arm-carrier-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-arm-consumer:
    if: github.event_name == 'push' && github.repository == 'Apdelrahman1911/mobile-release-kit' && github.ref == 'refs/heads/verify/desktop-macos-installed'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MRK_MACOS_TARGET: aarch64-apple-darwin
      MRK_MACOS_HOSTED_JOB: github-hosted-macos26-arm64
      MRK_FIXED_RESUME_BYTES: "90436"
      MRK_FIXED_RESUME_SHA256: "f7a735cbd2d391fe88e78795356dc180b6cd9bb8e976cad74953c4eb512b646f"
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: arm64
      - name: Admit the actual host interpreter and create one private consumer work root
        id: work
        timeout-minutes: 1
        shell: bash
        run: |
          set +x
          set +a
          set -euo pipefail
          set -o noclobber
          umask 077
          early_phase=shell-context
          early_python_started=0
          early_failure_report() {
              python3 -I -S -B - "$early_phase" <<'PY_RESUME_EARLY_SHELL'
          import hashlib,json,os,pathlib,stat,sys
          EARLY_PHASES=('shell-context','shell-work-create','shell-work-directories','shell-work-export','shell-unknown','version-flags','python-path','python-open','python-metadata','python-read','python-post','python-close','work-state','work-binding-open','work-binding-write','work-binding-sync','work-binding-readback','work-binding-close','publish-environment','publish-root','complete')
          EARLY_CLASSES=('SystemExit','ValueError','TypeError','AttributeError','KeyError','OSError','FileNotFoundError','PermissionError','AssertionError','RuntimeError','KeyboardInterrupt','shell-failure','other')
          EARLY_KEYS=('versionExpected','isolatedFlag','noSiteFlag','dontWriteBytecode','fileRegular','fileOwnerTrusted','fileSingleLink','fileWriteBitsClear','fileSizeBound','readLengthMatched','logicalEofEmpty','heldPostMatched','namedPostMatched','pythonCloseCompleted','workStatRead','normalStatRead','workBindingOpened','workBindingWriteMatched','workBindingSynced','workBindingReadbackMatched','workBindingCloseCompleted','environmentPublished','rootPublished','runnerTempFixed','workflowSourceJoined','fixedInstalledRef')
          
          def _publish_early(value):
              # One fixed ordinary receipt; never a mutable work/root path or raw payload.
              slots={'parent':None,'report':None};primary=None
              def need(ok):
                  if not ok:raise ValueError('resume-early-finite-publication')
              def ident(v):return(v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid,v.st_nlink,v.st_size,v.st_mtime_ns,v.st_ctime_ns)
              def directory(v):return(v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid)
              def consume(name):
                  fd=slots[name];slots[name]=None
                  if fd is not None:os.close(fd)
              try:
                  need(type(value)is dict and set(value)=={'schemaVersion','kind','admissionPassed','failurePhase','failureCondition','exceptionClass','predicates','diagnosticOnly','nativeSuccessInferred','rawTextExported','envValuesExported','binaryContentsExported','productReady'})
                  need(type(value['schemaVersion'])is int and value['schemaVersion']==1 and value['kind']=='mrk-fixed-resume-early-admission-v1'
                       and type(value['admissionPassed'])is bool and value['failurePhase']in (None,*EARLY_PHASES)
                       and value['failureCondition']in (None,*EARLY_KEYS) and value['exceptionClass']in (None,*EARLY_CLASSES)
                       and value['diagnosticOnly']is True and all(value[k]is False for k in ('nativeSuccessInferred','rawTextExported','envValuesExported','binaryContentsExported','productReady')))
                  need(type(value['predicates'])is dict and set(value['predicates'])==set(EARLY_KEYS)
                       and all(v is None or type(v)is bool for v in value['predicates'].values()))
                  body=json.dumps(value,sort_keys=True,separators=(',',':')).encode('ascii')+b'\n';need(0<len(body)<=4096)
                  parent='/Users/runner/work/_temp';name='fixed-carrier-early-admission.json'
                  slots['parent']=os.open(parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC)
                  before=directory(os.fstat(slots['parent']));need(before==directory(os.stat(parent,follow_symlinks=False)) and before[3]in (0,os.getuid()))
                  slots['report']=os.open(name,os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=slots['parent'])
                  opened=ident(os.fstat(slots['report']));need(stat.S_ISREG(opened[2]) and stat.S_IMODE(opened[2])==0o600 and opened[3:7]==(os.getuid(),os.getgid(),1,0)
                       and opened==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False)))
                  need(os.write(slots['report'],body)==len(body));os.fsync(slots['report'])
                  after=ident(os.fstat(slots['report']));need(after[:6]==opened[:6] and after[6]==len(body)
                       and after==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False))
                       and os.pread(slots['report'],len(body)+1,0)==body and not os.pread(slots['report'],1,len(body)))
                  need(ident(os.fstat(slots['report']))==after==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False))
                       and directory(os.fstat(slots['parent']))==before==directory(os.stat(parent,follow_symlinks=False)))
                  consume('report');consume('parent')
                  # Mint only after the receipt's consuming closes. Never upload an unknown
                  # preexisting/colliding file merely because its fixed pathname exists.
                  with open(os.environ['GITHUB_OUTPUT'],'a')as out:
                      if out.write('early_report_ready=true\n')!=24:raise ValueError('resume-early-output-marker')
              except BaseException as error:primary=error;raise
              finally:
                  failures=[]
                  for name in ('report','parent'):
                      try:consume(name)
                      except BaseException:failures.append(name)
                  if failures:
                      if primary is None:raise ValueError('resume-early-publication-close')from None
                      BaseException.add_note(primary,'resume-early-publication-close')
          
          try:
              label=sys.argv[1] if len(sys.argv)==2 and sys.argv[1]in EARLY_PHASES else 'shell-unknown'
              value={'schemaVersion':1,'kind':'mrk-fixed-resume-early-admission-v1','admissionPassed':False,'failurePhase':label,'failureCondition':None,'exceptionClass':'shell-failure','predicates':dict.fromkeys(EARLY_KEYS),'diagnosticOnly':True,'nativeSuccessInferred':False,'rawTextExported':False,'envValuesExported':False,'binaryContentsExported':False,'productReady':False}
              value['predicates']['runnerTempFixed']=os.environ.get('RUNNER_TEMP')=='/Users/runner/work/_temp'
              source=os.environ.get('GITHUB_SHA');workflow=os.environ.get('GITHUB_WORKFLOW_SHA')
              if type(source)is str and type(workflow)is str:
                  joined=source==workflow;value['predicates']['workflowSourceJoined']=joined
                  # Respect the original source-join AND fixed-ref short-circuit.
                  if joined:
                      ref=os.environ.get('GITHUB_REF')
                      if type(ref)is str:value['predicates']['fixedInstalledRef']=ref=='refs/heads/verify/desktop-macos-installed'
              if label=='shell-context':
                  for key in ('workflowSourceJoined','fixedInstalledRef'):
                      if value['predicates'][key]is False:value['failureCondition']=key;break
              _publish_early(value)
          except BaseException:
              print('::error::MRK_RESUME_EARLY_DIAGNOSTIC_UNAVAILABLE')
              raise SystemExit(1)from None
          PY_RESUME_EARLY_SHELL
          }
          early_exit() {
              early_status=$?
              trap - EXIT
              if (( early_status != 0 && early_python_started == 0 )); then early_failure_report || true; fi
              exit "$early_status"
          }
          trap early_exit EXIT
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed ]] || exit 1
          early_phase=shell-work-create
          work=$(mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          early_phase=shell-work-directories
          mkdir -m 700 "$work/normal-ui" "$work/normal-ui/tmp"
          early_phase=shell-work-export
          export MRK_MACOS_WORK="$work"
          early_python_started=1
          python3 -I -S -B - <<'PY_RESUME_PYTHON'
          import hashlib,json,os,pathlib,stat,sys
          EARLY_PHASES=('shell-context','shell-work-create','shell-work-directories','shell-work-export','shell-unknown','version-flags','python-path','python-open','python-metadata','python-read','python-post','python-close','work-state','work-binding-open','work-binding-write','work-binding-sync','work-binding-readback','work-binding-close','publish-environment','publish-root','complete')
          EARLY_CLASSES=('SystemExit','ValueError','TypeError','AttributeError','KeyError','OSError','FileNotFoundError','PermissionError','AssertionError','RuntimeError','KeyboardInterrupt','shell-failure','other')
          EARLY_KEYS=('versionExpected','isolatedFlag','noSiteFlag','dontWriteBytecode','fileRegular','fileOwnerTrusted','fileSingleLink','fileWriteBitsClear','fileSizeBound','readLengthMatched','logicalEofEmpty','heldPostMatched','namedPostMatched','pythonCloseCompleted','workStatRead','normalStatRead','workBindingOpened','workBindingWriteMatched','workBindingSynced','workBindingReadbackMatched','workBindingCloseCompleted','environmentPublished','rootPublished','runnerTempFixed','workflowSourceJoined','fixedInstalledRef')
          
          def _publish_early(value):
              # One fixed ordinary receipt; never a mutable work/root path or raw payload.
              slots={'parent':None,'report':None};primary=None
              def need(ok):
                  if not ok:raise ValueError('resume-early-finite-publication')
              def ident(v):return(v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid,v.st_nlink,v.st_size,v.st_mtime_ns,v.st_ctime_ns)
              def directory(v):return(v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid)
              def consume(name):
                  fd=slots[name];slots[name]=None
                  if fd is not None:os.close(fd)
              try:
                  need(type(value)is dict and set(value)=={'schemaVersion','kind','admissionPassed','failurePhase','failureCondition','exceptionClass','predicates','diagnosticOnly','nativeSuccessInferred','rawTextExported','envValuesExported','binaryContentsExported','productReady'})
                  need(type(value['schemaVersion'])is int and value['schemaVersion']==1 and value['kind']=='mrk-fixed-resume-early-admission-v1'
                       and type(value['admissionPassed'])is bool and value['failurePhase']in (None,*EARLY_PHASES)
                       and value['failureCondition']in (None,*EARLY_KEYS) and value['exceptionClass']in (None,*EARLY_CLASSES)
                       and value['diagnosticOnly']is True and all(value[k]is False for k in ('nativeSuccessInferred','rawTextExported','envValuesExported','binaryContentsExported','productReady')))
                  need(type(value['predicates'])is dict and set(value['predicates'])==set(EARLY_KEYS)
                       and all(v is None or type(v)is bool for v in value['predicates'].values()))
                  body=json.dumps(value,sort_keys=True,separators=(',',':')).encode('ascii')+b'\n';need(0<len(body)<=4096)
                  parent='/Users/runner/work/_temp';name='fixed-carrier-early-admission.json'
                  slots['parent']=os.open(parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC)
                  before=directory(os.fstat(slots['parent']));need(before==directory(os.stat(parent,follow_symlinks=False)) and before[3]in (0,os.getuid()))
                  slots['report']=os.open(name,os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=slots['parent'])
                  opened=ident(os.fstat(slots['report']));need(stat.S_ISREG(opened[2]) and stat.S_IMODE(opened[2])==0o600 and opened[3:7]==(os.getuid(),os.getgid(),1,0)
                       and opened==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False)))
                  need(os.write(slots['report'],body)==len(body));os.fsync(slots['report'])
                  after=ident(os.fstat(slots['report']));need(after[:6]==opened[:6] and after[6]==len(body)
                       and after==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False))
                       and os.pread(slots['report'],len(body)+1,0)==body and not os.pread(slots['report'],1,len(body)))
                  need(ident(os.fstat(slots['report']))==after==ident(os.stat(name,dir_fd=slots['parent'],follow_symlinks=False))
                       and directory(os.fstat(slots['parent']))==before==directory(os.stat(parent,follow_symlinks=False)))
                  consume('report');consume('parent')
                  # Mint only after the receipt's consuming closes. Never upload an unknown
                  # preexisting/colliding file merely because its fixed pathname exists.
                  with open(os.environ['GITHUB_OUTPUT'],'a')as out:
                      if out.write('early_report_ready=true\n')!=24:raise ValueError('resume-early-output-marker')
              except BaseException as error:primary=error;raise
              finally:
                  failures=[]
                  for name in ('report','parent'):
                      try:consume(name)
                      except BaseException:failures.append(name)
                  if failures:
                      if primary is None:raise ValueError('resume-early-publication-close')from None
                      BaseException.add_note(primary,'resume-early-publication-close')
          
          state={'schemaVersion':1,'kind':'mrk-fixed-resume-early-admission-v1','admissionPassed':False,'failurePhase':None,'failureCondition':None,'exceptionClass':None,'predicates':dict.fromkeys(EARLY_KEYS),'diagnosticOnly':True,'nativeSuccessInferred':False,'rawTextExported':False,'envValuesExported':False,'binaryContentsExported':False,'productReady':False}
          phase='version-flags';condition=None
          state['predicates']['runnerTempFixed']=os.environ.get('RUNNER_TEMP')=='/Users/runner/work/_temp'
          # The unchanged shell AND guard admitted both before this original invocation.
          state['predicates']['workflowSourceJoined']=True
          state['predicates']['fixedInstalledRef']=True
          def _stage(value):
              global phase,condition
              phase=value;condition=None
          def _failed(key,read):
              global condition
              condition=key;value=read();state['predicates'][key]=not bool(value);return value
          def _observed(key,read):
              global condition
              condition=key
              try:value=read()
              except BaseException:state['predicates'][key]=False;raise
              state['predicates'][key]=True;return value
          def _observed_close(key,fd):
