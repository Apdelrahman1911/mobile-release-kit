name: Reusable mobile release preflight

on:
  workflow_call:
    inputs:
      tooling_sha:
        description: Immutable mobile-release-kit commit used by this caller.
        required: true
        type: string
      source_sha:
        description: Exact application commit to validate.
        required: true
        type: string
      platform:
        description: android, ios, or both.
        required: false
        default: both
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/tooling/src
  PYTHONSAFEPATH: '1'

jobs:
  validate-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject unsupported platform input
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]

  android:
    needs: validate-platform
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate immutable inputs
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-preflight.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify source and tooling checkouts
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          git -C app rev-parse 'HEAD^{tree}'
          [[ -n "$MOBILE_RELEASE_EXPECTED_REPOSITORY" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Diagnose Android release configuration
        working-directory: app
        run: >-
          python -P -m mobile_release doctor
          --config release/mobile-release.json
          --platform android
          --format json
          --output .mobile-release/reports/doctor-android.json
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install pinned bundletool
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$jar"
          echo "$BUNDLETOOL_SHA256  $jar" | sha256sum --check --status
          echo "MOBILE_RELEASE_BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"
      - name: Run credential-free Android preflight
        working-directory: app
        run: |
          set -euo pipefail
          build_flag=--run-builds
          if jq -e '.source.projectReadTokenRequired == true' release/mobile-release.json >/dev/null; then
            build_flag=--skip-builds
            mkdir -p .mobile-release/reports
            jq -n --arg platform android '{
              schemaVersion: 1,
              platform: $platform,
              status: "deferred",
              reason: "source.projectReadTokenRequired is true",
              nextValidation: "Protected candidate preflight or a local preflight with credentials"
            }' > .mobile-release/reports/build-validation-deferred-android.json
            echo "::notice title=Android build validation deferred::Private dependency access is required; credentialed build validation will run in the protected candidate workflow or can run locally with credentials."
          fi
          python -P -m mobile_release preflight \
            --config release/mobile-release.json \
            --offline \
            "$build_flag" \
            --platform android \
            --format json \
            --output .mobile-release/reports/preflight-android.json
      - name: Upload Android preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-preflight-android
          path: app/.mobile-release/reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  ios:
    needs: validate-platform
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Validate immutable inputs
        env:
          MOBILE_RELEASE_PLATFORM: ${{ inputs.platform }}
          MOBILE_RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_CALLER_SHA: ${{ github.sha }}
          MOBILE_RELEASE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MOBILE_RELEASE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MOBILE_RELEASE_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$MOBILE_RELEASE_PLATFORM" =~ ^(android|ios|both)$ ]]
          [[ "$MOBILE_RELEASE_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_TOOLING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MOBILE_RELEASE_SOURCE_SHA" == "$MOBILE_RELEASE_CALLER_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_SHA" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          [[ "$MOBILE_RELEASE_WORKFLOW_REF" == "$MOBILE_RELEASE_WORKFLOW_REPOSITORY/.github/workflows/reusable-preflight.yml@$MOBILE_RELEASE_TOOLING_SHA" ]]
      - name: Verify pinned Apple toolchain
        run: |
          set -euo pipefail
          [[ -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]]
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.3" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version 17C529" ]]
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Establish safe private workflow output directory
        run: |
          set -euo pipefail
          workspace_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          app_root="$(cd app && pwd -P)"
          [[ ! -L app && "$app_root" == "$workspace_root/app" ]]
          output=app/.mobile-release
          if [[ -e "$output" || -L "$output" ]]; then
            [[ -d "$output" && ! -L "$output" ]]
            [[ -z "$(find "$output" -mindepth 1 -print -quit)" ]]
          fi
          mkdir -p -- "$output"
          [[ ! -L "$output" && "$(cd "$output" && pwd -P)" == "$app_root/.mobile-release" ]]
      - name: Check out pinned release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Verify source and tooling checkouts
        env:
          MOBILE_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          MOBILE_RELEASE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          MOBILE_RELEASE_EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git -C app rev-parse HEAD)" == "$MOBILE_RELEASE_SOURCE_SHA" ]]
          [[ "$(git -C tooling rev-parse HEAD)" == "$MOBILE_RELEASE_TOOLING_SHA" ]]
          git -C app rev-parse 'HEAD^{tree}'
          [[ -n "$MOBILE_RELEASE_EXPECTED_REPOSITORY" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Diagnose iOS release configuration
        working-directory: app
        run: >-
          python -P -m mobile_release doctor
          --config release/mobile-release.json
          --platform ios
          --format json
          --output .mobile-release/reports/doctor-ios.json
      - name: Set up Java for KMP Xcode build phases
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          install_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --proto '=https' --retry 3 --silent --show-error --tlsv1.2 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check --status
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          [[ "$("$install_root/xcodegen/bin/xcodegen" --version)" == "Version: $XCODEGEN_VERSION" ]]
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Run credential-free iOS preflight
        working-directory: app
        run: |
          set -euo pipefail
          build_flag=--run-builds
          if jq -e '.source.projectReadTokenRequired == true' release/mobile-release.json >/dev/null; then
            build_flag=--skip-builds
            mkdir -p .mobile-release/reports
            jq -n --arg platform ios '{
              schemaVersion: 1,
              platform: $platform,
              status: "deferred",
              reason: "source.projectReadTokenRequired is true",
              nextValidation: "Protected candidate preflight or a local preflight with credentials"
            }' > .mobile-release/reports/build-validation-deferred-ios.json
            echo "::notice title=iOS build validation deferred::Private dependency access is required; credentialed build validation will run in the protected candidate workflow or can run locally with credentials."
          fi
          python -P -m mobile_release preflight \
            --config release/mobile-release.json \
            --offline \
            "$build_flag" \
            --platform ios \
            --format json \
            --output .mobile-release/reports/preflight-ios.json
      - name: Upload iOS preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-preflight-ios
          path: app/.mobile-release/reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
