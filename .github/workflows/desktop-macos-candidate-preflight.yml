name: macOS candidate input preflight

on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      preflight_run:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  source-bound-inputs:
    name: Check source-bound macOS inputs
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: "Check out exact reviewed source without retained credentials"
        timeout-minutes: 3
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: "Select DATA stager Python, not the packaged interpreter"
        timeout-minutes: 3
        id: python
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: "3.14.7"
      - name: Require the earlier successful preflight for this exact protected main SHA
        if: github.ref == 'refs/heads/main' && inputs.operation == 'main-release-build'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.preflight_run }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RUN" =~ ^[1-9][0-9]{0,19}$ && "$PREFLIGHT_RUN" != "$GITHUB_RUN_ID" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
              .repository.full_name == $repo and .head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and .path == ".github/workflows/desktop-macos-installed.yml" and
              .conclusion == "success"
            ' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/jobs?per_page=100" |
            jq -e '[.jobs[] | select(.name == "Check Mac part retry and transport DATA / Check source-bound macOS inputs" and .conclusion == "success") |
              .steps[] | select(.name == "Verify retained ARM64 release inputs without signing" and .conclusion == "success")] | length == 1' > /dev/null
      - name: Verify retained ARM64 release inputs without signing
        if: github.ref == 'refs/heads/main' && inputs.operation == 'main-release-preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_REF_PROTECTED" == true ]]
          "$PYTHON" -I -B desktop/tools/macos_release_media.py preflight
      - name: "Check closed part provenance, retry, archive and signing diagnostics"
        env:
          MRK_PART_TEST_ROOT: "${{ runner.temp }}"
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" -B -m unittest tests.desktop.test_macos_candidate_parts tests.desktop.test_macos_candidate_part_transport tests.desktop.test_macos_candidate_parts_workflow tests.desktop.test_macos_desktop_update tests.desktop.test_macos_candidate_stages tests.desktop.test_macos_optional_arrays tests.desktop.test_runtime_preparation.MacCoreBytecodeDataTests
