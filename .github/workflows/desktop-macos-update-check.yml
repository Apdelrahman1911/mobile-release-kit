name: Desktop macOS in-place update check

# Disposable hosted checks, each mode on its own fresh runner. update (#49):
# install the previous signed package, seed per-user data, install the next
# signed package over it with the standard Installer, verify the update and data
# preservation, refuse the previous package as a downgrade, then launch the app.
# fresh: install only the next package, launch it for the first time, reinstall
# the same package (no-op) and reopen it. remove: install the next package,
# seed per-user data, open the app, run the matching notarized Remove.pkg with
# the standard Installer (confirming only the exact quit sheet), require the
# app, launcher and process gone and the seeded data unchanged, then reinstall
# and relaunch. Uses no signing credentials.
# The remaining acceptance matrix reuses the exact pair from the signed removal qualification.
# Path filters: push a follow-up commit after creating the branch (new-branch
# diffs against main exceed the 300-file path-filter window).
on:
  push:
    branches:
      - verify/desktop-macos-update-check
    paths:
      - .github/workflows/desktop-macos-update-check.yml
      - desktop/macos-installed-inputs/update-check-selection.json
      - desktop/tools/macos_update_check.py
      - desktop/native/macos-normal-ui/MRKNormalAppUITests/NormalAppUITests.swift

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-update-check-${{ github.ref }}${{ contains(github.event.head_commit.message, '[macos-quarantined-remove-media]') && '-final-media-upgrade' || contains(github.event.head_commit.message, '[macos-release-data-comparison]') && '-release-data' || contains(github.event.head_commit.message, '[macos-focus-recovery-panel]') && '-final-recovery-panel' || contains(github.event.head_commit.message, '[macos-final-release-followup]') && '-final-diagnostics' || contains(github.event.head_commit.message, '[macos-archived-upgrade-only]') && '-archived-upgrade-only' || contains(github.event.head_commit.message, '[macos-recovered-upgrade-diagnostic]') && '-recovered-upgrade-diagnostic' || contains(github.event.head_commit.message, '[macos-full-fresh-only]') && '-full-fresh' || contains(github.event.head_commit.message, '[macos-cold-runtime-durable]') && '-durable-fresh' || contains(github.event.head_commit.message, '[macos-post-recovery-acceptance]') && '-signed-acceptance' || contains(github.event.head_commit.message, '[macos-live-removal-diag]') && '-live-removal-diag' || contains(github.event.head_commit.message, '[macos-live-shared-parent]') && '-live-shared-parent' || contains(github.event.head_commit.message, '[macos-hourly-performance]') && '-hourly-performance' || contains(github.event.head_commit.message, '[macos-prepare-state-check]') && '-prepare' || contains(github.event.head_commit.message, '[macos-retained-prepare-only]') && '-retained-prepare' || contains(github.event.head_commit.message, '[macos-physical-cli-only]') && '-physical-cli' || contains(github.event.head_commit.message, '[macos-refreshed-acceptance]') && '-refreshed-acceptance' || contains(github.event.head_commit.message, '[macos-removal-archive-check]') && '-removal-archive' || contains(github.event.head_commit.message, '[macos-signed-gui-recovery]') && '-gui-recovery' || contains(github.event.head_commit.message, '[macos-archive-recovery-diagnostics]') && '-archive-recovery' || contains(github.event.head_commit.message, '[macos-repeat-cli-diagnostics]') && '-repeat-cli' || contains(github.event.head_commit.message, '[macos-cold-runtime-contention]') && '-cold-contention' || '' }}
  cancel-in-progress: false

jobs:
  update-check:
    name: update-check (${{ matrix.mode }}${{ matrix.sample != 'default' && format(' / {0}', matrix.sample) || '' }})
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ contains(github.event.head_commit.message, '[macos-cold-runtime-contention]') && fromJSON('["contention"]') || contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]') && fromJSON('["trace","profile"]') || fromJSON('["default"]') }}
        include: ${{ contains(github.event.head_commit.message, '[macos-final-release-followup]') && fromJSON('[{"mode":"fresh","sample":"contention-a"},{"mode":"fresh","sample":"contention-b"}]') || contains(github.event.head_commit.message, '[macos-final-release-qualification]') && fromJSON('[{"mode":"fresh","sample":"contention"}]') || contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]') && fromJSON('[{"mode":"workspace-xctest","sample":"default"}]') || fromJSON('[]') }}
        mode: >-
          ${{ contains(github.event.head_commit.message, '[macos-focus-recovery-panel]') && fromJSON('["recovery-xctest"]')
          || contains(github.event.head_commit.message, '[macos-final-release-followup]') && fromJSON('["recovery-xctest","post-reinstall-prepare"]')
          || contains(github.event.head_commit.message, '[macos-final-release-qualification]') && fromJSON('["fresh","post-reinstall-prepare","workspace-xctest","delete-data","recovery-xctest","core-recovery","performance-long"]')
          || contains(github.event.head_commit.message, '[macos-cold-runtime-durable]') && fromJSON('["fresh"]')
          || contains(github.event.head_commit.message, '[macos-full-fresh-only]') && fromJSON('["fresh"]')
          || contains(github.event.head_commit.message, '[macos-archived-upgrade-only]') && fromJSON('["archived-upgrade"]')
          || contains(github.event.head_commit.message, '[macos-recovered-upgrade-diagnostic]') && fromJSON('["post-reinstall-prepare","macl-journal-recovery"]')
          || contains(github.event.head_commit.message, '[macos-prepare-recovery-upgrade]') && fromJSON('["post-reinstall-prepare","macl-journal-recovery","release-asset","fresh"]')
          || contains(github.event.head_commit.message, '[macos-post-reinstall-prepare]') && fromJSON('["post-reinstall-prepare"]')
          || contains(github.event.head_commit.message, '[macos-retained-maintenance]') && fromJSON('["release-asset","retained-transition","retained-prepare","workspace-xctest","performance-long","fresh","update-credentials","delete-data","uninstaller","recovery-xctest","core-recovery"]')
          || contains(github.event.head_commit.message, '[macos-retained-removal-scale]') && fromJSON('["retained-transition","release-asset","retained-prepare","fresh","workspace-xctest","update-credentials","delete-data","uninstaller","recovery-xctest"]')
          || contains(github.event.head_commit.message, '[macos-applet-carrier-revision]') && fromJSON('["delete-data","macl-journal-recovery","uninstaller","release-asset","remove"]')
          || (contains(github.event.head_commit.message, '[macos-live-removal-diag]') || contains(github.event.head_commit.message, '[macos-live-shared-parent]')) && fromJSON('["delete-data"]')
          || contains(github.event.head_commit.message, '[macos-delete-dialog-diagnostic]') && fromJSON('["delete-data"]')
          || contains(github.event.head_commit.message, '[macos-completion-report]') && fromJSON('["macl-journal-recovery","remove","delete-data","uninstaller","fresh","update-credentials","retained-prepare","release-asset"]')
          || contains(github.event.head_commit.message, '[macos-post-recovery-acceptance]') && fromJSON('["fresh","update-credentials","retained-prepare","uninstaller","release-asset"]')
          || contains(github.event.head_commit.message, '[macos-removal-qualification]') && fromJSON('["macl-journal-recovery","remove","delete-data"]')
          || contains(github.event.head_commit.message, '[macos-cli-grant-diagnostic]') && fromJSON('["workspace-xctest"]')
          || (contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]') || contains(github.event.head_commit.message, '[macos-cold-runtime-contention]')) && fromJSON('["fresh"]')
          || contains(github.event.head_commit.message, '[macos-macl-fixture-only]') && fromJSON('["macl-journal-recovery"]')
          || contains(github.event.head_commit.message, '[macos-macl-recovery-only]') && fromJSON('["macl-journal-recovery","remove"]')
          || contains(github.event.head_commit.message, '[macos-retained-remove-only]') && fromJSON('["retained-transition"]')
          || contains(github.event.head_commit.message, '[macos-retained-prepare-only]') && fromJSON('["retained-prepare"]')
          || contains(github.event.head_commit.message, '[macos-retained-transition-only]') && fromJSON('["retained-transition","retained-prepare"]')
          || contains(github.event.head_commit.message, '[macos-retained-transition]') && fromJSON('["retained-transition","retained-prepare","fresh","update-credentials","delete-data","release-asset"]')
          || contains(github.event.head_commit.message, '[macos-remove-diagnostic]') && fromJSON('["remove"]')
          || contains(github.event.head_commit.message, '[macos-fresh-upgrade-check]') && fromJSON('["update","fresh"]')
          || contains(github.event.head_commit.message, '[macos-delete-data-check]') && fromJSON('["delete-data"]')
          || contains(github.event.head_commit.message, '[macos-archive-recovery-diagnostics]') && fromJSON('["removal-archive","recovery-xctest"]')
          || contains(github.event.head_commit.message, '[macos-removal-archive-check]') && fromJSON('["removal-archive"]')
          || contains(github.event.head_commit.message, '[macos-repeat-cli-diagnostics]') && fromJSON('["repeat","workspace-xctest"]')
          || contains(github.event.head_commit.message, '[macos-repeat-removal-check]') && fromJSON('["repeat","repeat-after-dialogs"]')
          || contains(github.event.head_commit.message, '[macos-repeat-crash-diagnostics]') && fromJSON('["repeat-after-dialogs"]')
          || contains(github.event.head_commit.message, '[macos-independent-acceptance]') && fromJSON('["prepare-quit","performance","update-credentials"]')
          || contains(github.event.head_commit.message, '[macos-package-and-maintenance]') && fromJSON('["release-asset","prepare-quit"]')
          || contains(github.event.head_commit.message, '[macos-workspace-cli]') && fromJSON('["workspace-cli"]')
          || contains(github.event.head_commit.message, '[macos-physical-cli-only]') && fromJSON('["workspace-xctest"]')
          || contains(github.event.head_commit.message, '[macos-workspace-performance]') && fromJSON('["workspace-xctest"]')
          || contains(github.event.head_commit.message, '[macos-workspace-xctest]') && fromJSON('["workspace-xctest","prepare-xctest"]')
          || contains(github.event.head_commit.message, '[macos-prepare-state-check]') && fromJSON('["prepare-xctest"]')
          || contains(github.event.head_commit.message, '[macos-refreshed-acceptance]') && fromJSON('["fresh","update-credentials","performance-long","release-asset","prepare-xctest","workspace-xctest","recovery-xctest","core-recovery","delete-data"]')
          || contains(github.event.head_commit.message, '[macos-quarantined-remove-media]') && fromJSON('["uninstaller","update-credentials"]')
          || contains(github.event.head_commit.message, '[macos-hourly-performance]') && fromJSON('["performance-long"]')
          || contains(github.event.head_commit.message, '[macos-signed-core-recovery]') && fromJSON('["core-recovery"]')
          || contains(github.event.head_commit.message, '[macos-signed-gui-recovery]') && fromJSON('["recovery-xctest"]')
          || fromJSON('["update","fresh","remove","uninstaller"]') }}
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.ref == 'refs/heads/verify/desktop-macos-update-check' && !contains(github.event.head_commit.message, '[macos-release-data-comparison]')
    runs-on: macos-26
    timeout-minutes: ${{ matrix.mode == 'performance-long' && 85 || 45 }}
    env:
      BASH_ENV: ''
      ENV: ''
    steps:
      - name: Admit only a fresh hosted Apple Silicon macOS 26 runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "$HOME/Library/Application Support/dev.mobile-release-kit.desktop" ]]

      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run the update check
        timeout-minutes: ${{ contains(github.event.head_commit.message, '[macos-cold-runtime-durable]') && 38 || (matrix.mode == 'performance-long' && 85 || 45) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MRK_RELEASE_QUALIFICATION: ${{ contains(github.event.head_commit.message, '[macos-final-release-qualification]') || contains(github.event.head_commit.message, '[macos-final-release-followup]') }}
          MRK_RECOVERY_UPGRADE_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[macos-recovered-upgrade-diagnostic]') && matrix.mode == 'macl-journal-recovery' }}
          MRK_CHECK_FULL_FRESH_AFTER_TRACE: ${{ contains(github.event.head_commit.message, '[macos-prepare-recovery-upgrade]') && matrix.mode == 'fresh' }}
          MRK_CHECK_REFRESHED_RUNTIME: ${{ (contains(github.event.head_commit.message, '[macos-final-release-qualification]') || contains(github.event.head_commit.message, '[macos-prepare-recovery-upgrade]') || contains(github.event.head_commit.message, '[macos-full-fresh-only]') || contains(github.event.head_commit.message, '[macos-refreshed-acceptance]') || contains(github.event.head_commit.message, '[macos-retained-transition]') || contains(github.event.head_commit.message, '[macos-retained-maintenance]') || contains(github.event.head_commit.message, '[macos-retained-removal-scale]') || (contains(github.event.head_commit.message, '[macos-completion-report]') || contains(github.event.head_commit.message, '[macos-post-recovery-acceptance]') || contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]'))) && matrix.mode == 'fresh' }}
          MRK_COLD_RUNTIME_DIAGNOSTIC: ${{ (contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]') || contains(github.event.head_commit.message, '[macos-cold-runtime-contention]')) && matrix.mode == 'fresh' }}
          MRK_COLD_RUNTIME_SAMPLE: ${{ matrix.sample }}
          MRK_COLD_RUNTIME_DURABLE: ${{ (contains(github.event.head_commit.message, '[macos-final-release-followup]') || contains(github.event.head_commit.message, '[macos-final-release-qualification]') || contains(github.event.head_commit.message, '[macos-cold-runtime-durable]') || contains(github.event.head_commit.message, '[macos-prepare-recovery-upgrade]')) && matrix.mode == 'fresh' }}
          MRK_LIVE_REMOVAL_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[macos-live-removal-diag]') || contains(github.event.head_commit.message, '[macos-live-shared-parent]') || (contains(github.event.head_commit.message, '[macos-removal-qualification]') && matrix.mode == 'delete-data') }}
          MRK_LIVE_SHARED_PARENT_FIXTURE: ${{ (contains(github.event.head_commit.message, '[macos-live-shared-parent]') || contains(github.event.head_commit.message, '[macos-removal-qualification]')) && matrix.mode == 'delete-data' }}
          MRK_CHECK_DURABLE_CLI_STATE: ${{ (contains(github.event.head_commit.message, '[macos-final-release-qualification]') || contains(github.event.head_commit.message, '[macos-retained-maintenance]') || contains(github.event.head_commit.message, '[macos-retained-removal-scale]') || contains(github.event.head_commit.message, '[macos-physical-cli-only]') || contains(github.event.head_commit.message, '[macos-cold-runtime-diagnostic]') || contains(github.event.head_commit.message, '[macos-cli-grant-diagnostic]')) && matrix.mode == 'workspace-xctest' }}
          # Test downloaded distribution media and every cancel and consent branch.
          MRK_CHECK_QUARANTINED_REMOVE_MEDIA: ${{ contains(github.event.head_commit.message, '[macos-quarantined-remove-media]') && matrix.mode == 'uninstaller' }}
          MRK_CHECK_REMOVE_INACTIVE: ${{ (contains(github.event.head_commit.message, '[macos-macl-recovery-only]') || contains(github.event.head_commit.message, '[macos-completion-report]') || contains(github.event.head_commit.message, '[macos-applet-carrier-revision]') || contains(github.event.head_commit.message, '[macos-removal-qualification]')) && matrix.mode == 'remove' }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/mrk-update-check.XXXXXXXX")"
          echo "MRK_UPDATE_WORK=$work" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -B desktop/tools/macos_update_check.py \
            --selection desktop/macos-installed-inputs/update-check-selection.json --work "$work" \
            --mode "${{ matrix.mode }}"

      - name: Retain the source-bound ARM64 release package with its manifest
        if: ${{ matrix.mode == 'release-asset' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MobileReleaseKit-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_UPDATE_WORK }}/release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain bounded update evidence
        if: ${{ always() && env.MRK_UPDATE_WORK != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-update-check-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}${{ matrix.sample != 'default' && format('-{0}', matrix.sample) || '' }}
          path: ${{ env.MRK_UPDATE_WORK }}/evidence
          if-no-files-found: warn
          retention-days: 30

  release-data-comparison:
    if: ${{ github.repository == 'Apdelrahman1911/mobile-release-kit' && contains(github.event.head_commit.message, '[macos-release-data-comparison]') }}
    strategy:
      fail-fast: false
      matrix:
        source: ['6bde41073ab878ab83f1e70ac46bfac7d0b7c185', 'ce9380df50c0a6bc6a51f6e23eba1e0ac7ccf89a']
    name: Release packaging data controls, ${{ matrix.source }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MRK_DATA_CANDIDATE: ${{ matrix.source }}
    steps:
      - name: Check out the exact retained source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false

      - name: Select the already pinned Mac packaging test interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'

      - name: Compare the exact packaging and maintenance fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$MRK_DATA_CANDIDATE"
          tmp="$(mktemp -d "$RUNNER_TEMP/mrk-data-controls.XXXXXXXX")"
          out="$RUNNER_TEMP/mrk-data-evidence"
          mkdir "$out"
          chgrp "$(id -gn)" "$tmp"
          export TMPDIR="$tmp"
          export PYTHONDONTWRITEBYTECODE=1
          printf 'source=%s\n' "$MRK_DATA_CANDIDATE" > "$out/identity.txt"
          sw_vers >> "$out/identity.txt"
          python3 --version >> "$out/identity.txt"
          set +e
          python3 -B -m unittest tests.desktop.test_macos_install_maintenance tests.desktop.test_macos_installed_staging tests.desktop.test_macos_desktop_update > "$out/tests.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/exit.txt"
          sed -n '/^FAIL:/p; /^ERROR:/p; /^Ran /p; /^FAILED /p; /^OK/p' "$out/tests.log"
          exit "$code"

      - name: Retain disposable test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-data-controls-${{ matrix.source }}
          path: ${{ runner.temp }}/mrk-data-evidence
          retention-days: 14
          if-no-files-found: error
