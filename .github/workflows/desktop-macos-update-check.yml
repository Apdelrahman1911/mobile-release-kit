name: Desktop macOS in-place update check

# Disposable hosted checks, each mode on its own fresh runner. update (#49):
# install the previous signed package, seed per-user data, install the next
# signed package over it with the standard Installer, verify the update and data
# preservation, refuse the previous package as a downgrade, then launch the app.
# fresh: install only the next package, launch it for the first time, reinstall
# the same package (no-op) and reopen it. remove: install the next package,
# seed per-user data, open the app, run the matching notarized Remove.pkg with
# the standard Installer (confirming only the exact quit sheet), require the
# app, launcher and process gone and the seeded data unchanged, then reinstall
# and relaunch. Uses no signing credentials.
# Path filters: push a follow-up commit after creating the branch (new-branch
# diffs against main exceed the 300-file path-filter window).
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main source commit
        type: string
        required: true
      build_run:
        description: Original signed main package run
        type: string
        required: true
      carrier_run:
        description: Original main carrier and build attestation run
        type: string
        required: true
      carrier_attempt:
        description: Original successful main carrier attempt
        type: string
        required: true
  push:
    branches:
      - verify/desktop-macos-update-check
    paths:
      - .github/workflows/desktop-macos-update-check.yml
      - desktop/macos-installed-inputs/update-check-selection.json
      - desktop/tools/macos_update_check.py

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: desktop-macos-update-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-frozen:
    name: Qualify frozen media (${{ matrix.mode }})
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.ref_protected && inputs.expected_sha == github.sha
    runs-on: macos-26
    timeout-minutes: ${{ matrix.mode == 'performance-long' && 85 || 55 }}
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, update-credentials, archived-upgrade, post-reinstall-prepare,
               uninstaller, delete-data, workspace-xctest, recovery-xctest, core-recovery, performance-long]
    env:
      BASH_ENV: ''
      ENV: ''
    steps:
      - name: Require a disposable Apple Silicon GUI host
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(sw_vers -productVersion)" == 26.* && "$(uname -m)" == arm64 && "$(id -u)" != 0 ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "$HOME/Library/Application Support/dev.mobile-release-kit.desktop" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.carrier_run }}
          name: macos-release-frozen-${{ github.sha }}-${{ inputs.carrier_run }}-${{ inputs.carrier_attempt }}
          path: ${{ runner.temp }}/qualified-media
      - name: Require exactly the attested files from the approved build and carrier
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          CARRIER_RUN: ${{ inputs.carrier_run }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/mrk-release-qualify.XXXXXXXX")"
          printf 'MRK_UPDATE_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          export MRK_FROZEN_RELEASE_MEDIA="$RUNNER_TEMP/qualified-media"
          printf 'MRK_FROZEN_RELEASE_MEDIA=%s\n' "$MRK_FROZEN_RELEASE_MEDIA" >> "$GITHUB_ENV"
          python3 -I -B desktop/tools/macos_release_media.py verify "$MRK_FROZEN_RELEASE_MEDIA" \
            --source "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-run "$BUILD_RUN" --carrier-run "$CARRIER_RUN"
          for asset in "$MRK_FROZEN_RELEASE_MEDIA"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml"
          done
          python3 -I -B desktop/tools/macos_release_media.py verify "$MRK_FROZEN_RELEASE_MEDIA" \
            --source "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-run "$BUILD_RUN" --carrier-run "$CARRIER_RUN" --selection "$work/selection.json"
      - name: Execute the production lifecycle or original installed XCTest
        env:
          GH_TOKEN: ${{ github.token }}
          MRK_CHECK_REFRESHED_RUNTIME: ${{ matrix.mode == 'fresh' }}
          MRK_CHECK_QUARANTINED_REMOVE_MEDIA: ${{ matrix.mode == 'uninstaller' }}
        run: |
          set -euo pipefail
          python3 -I -B desktop/tools/macos_update_check.py --selection "$MRK_UPDATE_WORK/selection.json" \
            --work "$MRK_UPDATE_WORK" --mode '${{ matrix.mode }}'
      - name: Retain scenario result and bounded evidence
        if: ${{ !cancelled() && env.MRK_UPDATE_WORK != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-qualification-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_UPDATE_WORK }}/evidence
          if-no-files-found: warn
          retention-days: 30

  qualification-proof:
    if: ${{ needs.qualify-frozen.result == 'success' }}
    needs: qualify-frozen
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: macos-release-qualification-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification
      - name: Bind every original scenario to one frozen manifest
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          CARRIER_RUN: ${{ inputs.carrier_run }}
          CARRIER_ATTEMPT: ${{ inputs.carrier_attempt }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qualification"
          reports=("$root"/*/RESULT.json)
          [[ "${#reports[@]}" == 10 ]]
          jq -e -s --arg sha "$GITHUB_SHA" --arg build "$BUILD_RUN" --arg carrier "$CARRIER_RUN" \
            --arg attempt "$CARRIER_ATTEMPT" '
            (map(.mode) | sort) == ["archived-upgrade", "core-recovery", "delete-data", "fresh",
              "performance-long", "post-reinstall-prepare", "recovery-xctest", "uninstaller",
              "update-credentials", "workspace-xctest"] and
            all(.[]; .passed == true and .frozenRelease.sourceCommit == $sha and
              .frozenRelease.buildRun == $build and .frozenRelease.carrierRun == $carrier and
              .frozenRelease.carrierAttempt == $attempt) and (map(.frozenRelease) | unique | length) == 1
            ' "${reports[@]}" > /dev/null
          mkdir "$RUNNER_TEMP/proof"
          jq -s --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            {qualificationRun: $run, qualificationAttempt: $attempt, modes: map(.mode), frozenRelease: .[0].frozenRelease}' \
            "${reports[@]}" > "$RUNNER_TEMP/proof/QUALIFIED.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-qualified-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof/QUALIFIED.json
          if-no-files-found: error
          retention-days: 30

  update-check:
    name: update-check (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [update, fresh, remove, uninstaller]
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.ref == 'refs/heads/verify/desktop-macos-update-check'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BASH_ENV: ''
      ENV: ''
    steps:
      - name: Admit only a fresh hosted Apple Silicon macOS 26 runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
          [[ ! -e "/Library/Application Support/MobileReleaseKit" && ! -e "$HOME/Library/Application Support/dev.mobile-release-kit.desktop" ]]

      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run the update check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/mrk-update-check.XXXXXXXX")"
          echo "MRK_UPDATE_WORK=$work" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -B desktop/tools/macos_update_check.py \
            --selection desktop/macos-installed-inputs/update-check-selection.json --work "$work" \
            --mode "${{ matrix.mode }}"

      - name: Retain bounded update evidence
        if: ${{ !cancelled() && env.MRK_UPDATE_WORK != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-update-check-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRK_UPDATE_WORK }}/evidence
          if-no-files-found: warn
          retention-days: 30

  ios-input-roster:
    name: Measure project-directory effects of the original Xcode archive command
    if: >-
      github.repository == 'Apdelrahman1911/mobile-release-kit' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/macos-0213-ios-input-roster' &&
      inputs.expected_sha == '7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc' &&
      inputs.build_run == '46048925911' && inputs.carrier_run == '46067290901' && inputs.carrier_attempt == '1'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc
          persist-credentials: false
      - name: Compare the disposable Swift fixture before and after the actual archive
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_ARCH" == ARM64 && "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 26.* && "$(id -u)" != 0 ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == fb712e594936256ff1d515cfaa1d269ae4e6d9a1 ]]
          python3 -I -B - <<'PY'
          import base64, hashlib, json, os, re, stat, subprocess, tempfile
          from pathlib import Path

          fixture = Path("desktop/native/macos-normal-ui/MRKNormalAppUITests/Fixtures/normal-ios-unsigned-v1.json")
          raw = fixture.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "999a48f946b2a26164d250086d5ece7588f3ff9b2b88824e596168b82faa8daf"
          spec = json.loads(raw)
          assert spec["schemaVersion"] == 1 and len(spec["files"]) == 9 and not spec["stages"]

          def snapshot(project):
              entries = {}
              for folder, dirs, files in os.walk(project, followlinks=False):
                  assert len(entries) < 64 and len(dirs) + len(files) < 64
                  for leaf in dirs + files:
                      entry = Path(folder) / leaf
                      relative = entry.relative_to(project)
                      assert len(relative.parts) <= 12 and all(re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", item) for item in relative.parts)
                      info = entry.lstat()
                      record = {"kind": stat.S_IFMT(info.st_mode), "identity": [info.st_dev, info.st_ino],
                                "mode": oct(stat.S_IMODE(info.st_mode))}
                      if stat.S_ISREG(info.st_mode):
                          assert 0 <= info.st_size <= 32 * 1024
                          record["sha256"] = hashlib.sha256(entry.read_bytes()).hexdigest()
                      entries[relative.as_posix()] = record
              return entries

          with tempfile.TemporaryDirectory(prefix="mrk-archive-project-roster-", dir="/private/tmp") as name:
              root = Path(name)
              for relative, encoded in spec["files"].items():
                  entry = Path(relative)
                  assert entry.parts[0] == "project" and not {"..", "."} & set(entry.parts)
                  target = root / entry
                  target.parent.mkdir(parents=True, exist_ok=True)
                  body = base64.b64decode(encoded, validate=True)
                  assert 0 < len(body) < 32 * 1024
                  target.write_bytes(body)
              project = root / "project"
              work = root / "work"
              for directory in ("home", "tmp", "DerivedData"):
                  (work / directory).mkdir(mode=0o700, parents=True)
              developer = Path("/Applications/Xcode.app").resolve(strict=True) / "Contents/Developer"
              assert developer.parents[1].parent == Path("/Applications")
              sdk = (developer / "Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk").resolve(strict=True)
              command = developer / "usr/bin/xcodebuild"
              env = {"PATH": f"{developer}/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin", "DEVELOPER_DIR": str(developer),
                     "SDKROOT": str(sdk), "HOME": str(work / "home"), "TMPDIR": str(work / "tmp"),
                     "CFFIXED_USER_HOME": str(work / "home"), "LANG": "en_US.UTF-8", "LC_ALL": "en_US.UTF-8",
                     "CI": "true", "MOBILE_RELEASE_DEFER_EXTERNAL_UPLOADS": "1",
                     "MOBILE_RELEASE_VERSION_NAME": "1.2.3", "MOBILE_RELEASE_BUILD_NUMBER": "7"}
              archive = work / "archive.xcarchive"
              argv = [str(command), "-project", str(project / "ios/MRKObserved.xcodeproj"), "-scheme", "MRKObserved",
                      "-configuration", "Release", "-destination", "generic/platform=iOS",
                      "-archivePath", str(archive), "-derivedDataPath", str(work / "DerivedData"), "archive",
                      "MARKETING_VERSION=1.2.3", "CURRENT_PROJECT_VERSION=7",
                      "CODE_SIGNING_ALLOWED=NO", "CODE_SIGNING_REQUIRED=NO"]
              before = snapshot(project)
              result = subprocess.run(argv, cwd=project, env=env, capture_output=True, timeout=120)
              after = snapshot(project)
              report = {"source": "7e2b0eaa4e320f72a82468c84d4c61e322dbe7fc", "xcode": developer.parents[1].name,
                        "archivePresent": archive.is_dir(), "return": result.returncode,
                        "added": {name: after[name]["kind"] for name in sorted(after.keys() - before.keys())},
                        "removed": sorted(before.keys() - after.keys()),
                        "changed": sorted(name for name in before.keys() & after.keys() if before[name] != after[name])}
              print(json.dumps(report, sort_keys=True))
              evidence = Path(os.environ["RUNNER_TEMP"]) / "roster-evidence"
              evidence.mkdir(mode=0o700)
              (evidence / "XCODE-ROSTER.json").write_text(json.dumps(report, indent=2) + "\n")
              assert result.returncode == 0 and archive.is_dir()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: xcode-project-roster-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/roster-evidence/XCODE-ROSTER.json
          if-no-files-found: error
          retention-days: 30
