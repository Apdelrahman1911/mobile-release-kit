name: Desktop macOS deep packaging checks

on:
  push:
    branches: [verify/desktop-macos-deep-data]

permissions:
  contents: read

jobs:
  packaging-data:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit'
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Test packaging and maintenance on a disposable host
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          evidence="$RUNNER_TEMP/deep-packaging"
          mkdir "$evidence"
          TMPDIR="$(mktemp -d "$RUNNER_TEMP/mrk-deep-data.XXXXXXXX")"
          export TMPDIR
          chgrp "$(id -gn)" "$TMPDIR"
          export MRK_PART_TEST_ROOT="$TMPDIR"
          touch "$TMPDIR/.volume-probe"
          [[ -z "$(/usr/bin/xattr "$TMPDIR/.volume-probe")" ]]
          git rev-parse HEAD "HEAD^{tree}" > "$evidence/source.txt"
          sw_vers >> "$evidence/source.txt"
          set +e
          python3 -B -m unittest tests.desktop.test_macos_install_maintenance tests.desktop.test_macos_installed_staging tests.desktop.test_macos_desktop_update tests.desktop.test_macos_update_verification tests.desktop.test_macos_source_packaging_inputs > "$evidence/tests.log" 2>&1
          result=$?
          set -e
          sed -n '/^FAIL:/p; /^ERROR:/p; /^Ran /p; /^FAILED /p; /^OK/p' "$evidence/tests.log"
          exit "$result"
      - name: Retain exact disposable test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-packaging-${{ github.sha }}
          path: ${{ runner.temp }}/deep-packaging
          retention-days: 14
          if-no-files-found: error
