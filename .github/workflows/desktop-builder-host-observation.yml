                    need(key not in result)
                    result[key] = value
                return result
            
            
            def gap(code, ref):
                item = [code, ref]
                if item not in GAPS:
                    guard(len(GAPS) < 256, "GAP_COUNT")
                    GAPS.append(item)
            
            
            def ident(s):
                return dict(zip(("device", "inode", "mode", "uid", "gid", "links", "bytes", "blocks", "mtimeNs", "ctimeNs"),
                                (s.st_dev, s.st_ino, stat.S_IMODE(s.st_mode), s.st_uid, s.st_gid, s.st_nlink,
                                 s.st_size, s.st_blocks, s.st_mtime_ns, s.st_ctime_ns)))
            
            
            def parent(path):
                global META, BODY
                need(guard(path.startswith("/"), "PATH_ABSOLUTE")
                     and guard(os.path.normpath(path) == path, "PATH_CANONICAL")
                     and guard(len(path) <= 512, "PATH_LENGTH"))
                # Only this kernel-defined self alias is admitted; never scan processes/FDs.
                if path.startswith("/proc/self/"):
                    need(path in ("/proc/self/cgroup", "/proc/self/mountinfo"))
                    proc = directory("/proc")
                    try:
                        need(META + 4096 <= 8 * 2**20 and BODY + 4096 <= 3 * 2**30)
                        link = os.readlink("self", dir_fd=proc)
                        META += len(os.fsencode(link))
                        BODY += len(os.fsencode(link))
                        need(link == str(os.getpid()))
                        return os.open("self", D & ~os.O_NOFOLLOW, dir_fd=proc), path.rsplit("/", 1)[1]
                    finally:
                        os.close(proc)
                fd = os.open("/", D)
                try:
                    parts = path.split("/")[1:]
                    for part in parts[:-1]:
                        nxt = os.open(part, D, dir_fd=fd)
                        os.close(fd)
                        fd = nxt
                    return fd, parts[-1]
                except BaseException:
                    os.close(fd)
                    raise
            
            
            def at(path):
                fd, name = parent(path)
                try:
                    return os.stat(name, dir_fd=fd, follow_symlinks=False)
                finally:
                    os.close(fd)
            
            
            def directory(path):
                fd, name = parent(path)
                try:
                    return os.open(name, D, dir_fd=fd)
                finally:
                    os.close(fd)
            
            
            def body(path, cap, metadata=False, support=False):
                global BODY, META, SUPPORT
                if path in CACHE:
                    row, raw = CACHE[path]
                    need(guard(ident(at(path)) == row["stat"], "CACHE_IDENTITY")
                         and size_guard(row["stat"]["bytes"] <= cap, "CACHE", cap))
                    return row, raw
                pfd, name = parent(path)
                fd = None
                try:
                    before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    need(guard(stat.S_ISREG(before.st_mode), "FILE_TYPE")
                         and size_guard(before.st_size <= cap, "FILE", cap))
                    fd = os.open(name, F, dir_fd=pfd)
                    guard(ident(os.fstat(fd)) == ident(before), "OPEN_IDENTITY")
                    digest, raw, total = hashlib.sha256(), bytearray(), 0
                    pseudo = path.startswith(("/proc/", "/sys/fs/cgroup/"))
                    while True:
                        # Ordinary files use their checked exact size; pseudo-files require
                        # a real EOF before their cap. Reserve every read before issuing it.
                        if not pseudo and total == before.st_size:
                            break
                        room = min(cap - total, 3 * 2**30 - BODY,
                                   8 * 2**20 - META if metadata else cap,
                                   2 * 2**30 - SUPPORT if support else cap)
                        guard(room > 0, "READ_ROOM")
                        chunk = os.read(fd, min(65536, room, cap if pseudo else before.st_size - total))
                        if not chunk:
                            break
                        total += len(chunk)
                        BODY += len(chunk)
                        META += len(chunk) if metadata else 0
                        SUPPORT += len(chunk) if support else 0
                        need(guard(total <= cap, "READ_FILE_BOUND")
                             and guard(BODY <= 3 * 2**30, "READ_TOTAL_BOUND")
                             and guard(META <= 8 * 2**20, "READ_METADATA_BOUND")
                             and guard(SUPPORT <= 2 * 2**30, "READ_SUPPORT_BOUND"))
                        digest.update(chunk)
                        if metadata:
                            raw.extend(chunk)
                    guard(total == before.st_size or pseudo, "READ_EXACT_OR_PSEUDO")
                    before_identity, fd_identity = ident(before), ident(os.fstat(fd))
                    need(guard(before_identity == fd_identity, "FINAL_FD_IDENTITY")
                         and guard(fd_identity == ident(at(path)), "FINAL_PATH_IDENTITY"))
                    row = {"path": path, "kind": "regular", "stat": ident(before), "sha256": digest.hexdigest(), "aliasTarget": None, "readBytes": total}
                    CACHE[path] = (row, bytes(raw))
                    return CACHE[path]
                finally:
                    if fd is not None:
                        os.close(fd)
                    os.close(pfd)
            
            
            def measure(path, cap=512 * 2**20, metadata=False, support=False, aliases=()):
                global META, BODY
                try:
                    before = at(path)
                    if stat.S_ISREG(before.st_mode):
                        return body(path, cap, metadata, support)[0]
                    target = None
                    if stat.S_ISLNK(before.st_mode):
                        # Linux readlink bodies fit one 4096-byte reservation. A needed
                        # target is returned only when independently in the fixed read set.
                        need(guard(before.st_size <= 512, "ALIAS_LSTAT_SIZE")
                             and guard(META + 4096 <= 8 * 2**20, "ALIAS_METADATA_RESERVE")
                             and guard(BODY + 4096 <= 3 * 2**30, "ALIAS_TOTAL_RESERVE"))
                        fd, name = parent(path)
                        try:
                            link = os.readlink(name, dir_fd=fd)
                        finally:
                            os.close(fd)
                        META += len(os.fsencode(link))
                        BODY += len(os.fsencode(link))
                        guard(len(os.fsencode(link)) <= 512, "ALIAS_READLINK_SIZE")
                        dest = os.path.normpath(os.path.join(os.path.dirname(path), link))
                        if dest in aliases:
                            target = dest
                    guard(ident(before) == ident(at(path)), "ALIAS_IDENTITY")
                    kind = "alias" if stat.S_ISLNK(before.st_mode) else "directory" if stat.S_ISDIR(before.st_mode) else "nonordinary"
                    return {"path": path, "kind": kind, "stat": ident(before), "sha256": None, "aliasTarget": target, "readBytes": 0}
                except OSError as exc:
                    guard(exc.errno in (errno.ENOENT, errno.EACCES, errno.EPERM, errno.ENOTDIR, errno.ELOOP), "MEASURE_ERRNO")
                    return {"path": path, "kind": "unavailable", "stat": None, "sha256": None, "aliasTarget": None, "readBytes": 0}
            
            
            def metadata(path, cap, reference=None):
                row = measure(path, cap, metadata=True)
                if row["kind"] != "regular":
                    gap("METADATA", reference or path)
                    return row, None
                return row, CACHE[path][1]
            
            
            def charge(s):
                return max(s.st_blocks * 512, ((s.st_size + 4095) // 4096) * 4096) + 4096
            
            
            def census(root, files_cap, dirs_cap):
                files, dirs, pending, allocation = {}, {}, [(root, ident(at(root)))], 0
                while pending:
                    path, expected = pending.pop()
                    fd = directory(path)
                    try:
                        before = os.fstat(fd)
                        need(ident(before) == expected)
                        dirs[path] = ident(before)
                        allocation += charge(before)
                        with os.scandir(fd) as entries:
                            count = 0
                            for item in entries:
                                count += 1
                                need(count <= files_cap + dirs_cap and len(item.name) <= 255)
                                child = path + "/" + item.name
                                need(len(child) <= 512)
                                s = os.stat(item.name, dir_fd=fd, follow_symlinks=False)
                                if stat.S_ISDIR(s.st_mode):
                                    need(len(dirs) + len(pending) < dirs_cap)
                                    pending.append((child, ident(s)))
                                else:
                                    need(len(files) < files_cap)
                                    files[child] = (ident(s), stat.S_ISREG(s.st_mode))
                                    allocation += charge(s)
                                need(allocation <= 32 * 2**20)
                        need(ident(before) == ident(os.fstat(fd)) == ident(at(path)))
                    finally:
                        os.close(fd)
                return files, dirs, allocation
            
            
            def context():
                global PHASE
                e = dict(os.environ)
                need(set(e) == set(P["environment"]))
                for key, pattern in P["patterns"].items():
                    need(re.fullmatch(pattern, e[key]) is not None)
                for key, value in P["fixedEnvironment"].items():
                    need(e[key] == value)
                s = "/tmp/mrk-builder-host-observe-" + e["GITHUB_RUN_ID"] + "-" + e["GITHUB_RUN_ATTEMPT"]
                for key in ("TMPDIR", "TMP", "TEMP"):
                    need(e[key] == s + "/tmp")
                need(e["HOME"] == s + "/home" and os.getcwd() == s + "/neutral")
                need(os.getuid() == os.geteuid() != 0 and os.getgid() == os.getegid())
                PHASE = "EVENT"
                event_row, raw = metadata(e["GITHUB_EVENT_PATH"], 2**20)
                need(raw is not None)
                event = json.loads(raw, object_pairs_hook=unique)
                need(type(event) is dict and event.get("deleted") is False and event.get("ref") == e["GITHUB_REF"])
                need(event.get("after") == e["GITHUB_SHA"] and type(event.get("repository")) is dict)
                need(event["repository"].get("full_name") == e["GITHUB_REPOSITORY"])
                return e, s, event_row
            
            
            def vm(e):
                uname = os.uname()
                need(all(re.fullmatch(r"[A-Za-z0-9_.+-]{1,128}", v) for v in (uname.sysname, uname.release, uname.machine)))
                rows, selected = [], {}
                alias = measure("/etc/os-release", 65536, metadata=True, aliases=("/usr/lib/os-release",))
                rows.append(alias)
                path = "/etc/os-release" if alias["kind"] == "regular" else "/usr/lib/os-release"
                if alias["kind"] != "regular" and alias["aliasTarget"] != path:
                    gap("METADATA", "/etc/os-release")
                row, raw = metadata(path, 65536)
                if path != "/etc/os-release":
                    rows.append(row)
                if raw is not None:
                    for line in raw.decode("utf-8").splitlines():
                        key, sep, value = line.partition("=")
                        if sep and key in ("ID", "VERSION_ID", "VERSION_CODENAME", "BUILD_ID"):
                            value = value.strip('"')
                            need(key not in selected and re.fullmatch(r"[A-Za-z0-9_.+-]{1,64}", value))
                            selected[key] = value
                row, raw = metadata("/proc/meminfo", 65536)
                rows.append(row)
                memory = re.search(rb"(?m)^MemTotal: +([0-9]+) kB$", raw or b"")
                physical = int(memory[1]) * 1024 if memory else None
                if physical is None:
                    gap("METADATA", "/proc/meminfo")
                row, raw = metadata("/proc/self/mountinfo", 2**20)
                rows.append(row)
                mounts = []
                for line in (raw or b"").decode("ascii").splitlines():
                    need(len(mounts) < 4096)
                    fields = line.split()
                    at_sep = fields.index("-")
                    need(at_sep >= 6 and len(fields) >= at_sep + 4 and re.fullmatch(r"[0-9]{1,12}:[0-9]{1,12}", fields[2]))
                    need(re.fullmatch(r"[0-9]{1,12}", fields[0]) and re.fullmatch(r"[a-z0-9._-]{1,32}", fields[at_sep + 1]))
                    point = re.sub(r"\\([0-7]{3})", lambda m: chr(int(m[1], 8)), fields[4])
                    mounts.append((point, fields[3], fields[at_sep + 1], int(fields[0]), fields[2], fields[5]))
                row, raw = metadata("/proc/filesystems", 65536)
                rows.append(row)
                fs = sorted(set((raw or b"").decode("ascii").split()) & {"ext4", "overlay", "tmpfs", "cgroup2", "xfs"})
                row, raw = metadata("/proc/self/cgroup", 65536)
                rows.append(row)
                cg = (raw or b"").decode("ascii").splitlines()
                limits, complete = [], False
                if len(cg) == 1 and cg[0].startswith("0::/") and sum(m[:3] == ("/sys/fs/cgroup", "/", "cgroup2") for m in mounts) == 1:
                    value = cg[0][3:]
                    need(os.path.normpath(value) == value and re.fullmatch(r"/[A-Za-z0-9_./:-]*", value))
                    parts = value.strip("/").split("/") if value != "/" else []
                    need(len(parts) <= 16 and all(p not in ("", ".", "..") for p in parts))
                    complete = True
                    for depth in range(len(parts), -1, -1):
                        path = "/sys/fs/cgroup" + ("/" + "/".join(parts[:depth]) if depth else "") + "/memory.max"
                        row, value_raw = metadata(path, 64, "host-facts.json#/memory/cgroupAncestors/" + str(len(limits)))
                        value = (value_raw or b"").strip()
                        valid = value == b"max" or bool(re.fullmatch(rb"[0-9]{1,20}", value))
                        complete &= valid
                        limits.append({"ancestorDepth": depth, "bytes": int(value) if value.isdigit() else None, "read": valid,
                                       "stat": row["stat"], "sha256": row["sha256"], "readBytes": row["readBytes"]})
                if not complete:
                    gap("CGROUP", "host-facts.json#/memory")
                finite = [r["bytes"] for r in limits if r["bytes"] is not None]
                minimum = min(finite) if finite else None
                result = {"schema": "mrk-h0-host-facts-1", "scope": "candidate-only", "policySha256": POLICY_SHA256,
                          "run": {k: e[k] for k in P["publicRun"]}, "uid": os.getuid(), "gid": os.getgid(),
                          "kernel": {"system": uname.sysname, "release": uname.release, "machine": uname.machine},
                          "osRelease": selected, "metadata": rows, "filesystemsPresent": fs,
                          "memory": {"physicalMemTotalBytes": physical, "cgroupAncestors": limits, "ancestryComplete": complete,
                                     "observedFiniteMinimumBytes": minimum, "effectiveCgroupLimitBytes": minimum if complete else None},
                          "procSelfAlias": "kernel-self-checked-no-process-scan"}
                if (e["ImageOS"], e["ImageVersion"], uname.release, uname.machine) != ("ubuntu24", "20260907.300.1", "6.17.0-1022-azure", "x86_64"):
                    gap("STARTING_CANDIDATE", "host-facts.json#/kernel")
                return result, mounts
            
            
            def candidates():
                tools = [measure(path) for path in P["tools"]]
                for i, row in enumerate(tools):
                    if row["kind"] != "regular":
                        gap("TOOL", "host-candidate-files.json#/tools/" + str(i))
                aliases = [measure(path, aliases=(target,)) for path, target in P["rootAliases"].items()]
                for i, row in enumerate(aliases):
                    if row["kind"] != "alias" or row["aliasTarget"] is None:
                        gap("SUPPORT", "host-candidate-files.json#/aliases/" + str(i))
                ready_aliases = {r["path"]: r["aliasTarget"] for r in aliases if r["kind"] == "alias" and r["aliasTarget"]}
                providers, paths = [], set(P["supportFixed"])
                for path in P["providers"]:
                    row, raw = metadata(path, 256 * 1024)
                    providers.append(row)
                    for name in (raw or b"").decode("utf-8").splitlines():
                        for old, new in ready_aliases.items():
                            if name.startswith(old + "/"):
                                name = new + name[len(old):]
                                break
                        if any(name.startswith(root) for root in P["supportRoots"]):
                            need(guard(len(name) <= 256, "PROVIDER_PATH_LENGTH")
                                 and guard(os.path.normpath(name) == name, "PROVIDER_PATH_CANONICAL")
                                 and guard(re.fullmatch(r"/[A-Za-z0-9_./+@=-]+", name), "PROVIDER_PATH_CHARSET"))
                            paths.add(name)
                            guard(len(paths) <= 4096, "SUPPORT_PATH_COUNT")
                support = []
                for path in sorted(paths - set(P["tools"])):
                    row = measure(path, support=True, aliases=paths)
                    if row["kind"] == "directory":
                        continue
                    support.append(row)
                    if row["kind"] not in ("regular", "alias") or (row["kind"] == "alias" and row["aliasTarget"] is None):
                        gap("SUPPORT", "host-candidate-files.json#/support/" + str(len(support) - 1))
                versions, row_raw = {}, metadata("/var/lib/dpkg/status", 4 * 2**20)
                providers.append(row_raw[0])
                packages = {os.path.basename(p).removesuffix(".list").split(":")[0] for p in P["providers"]}
                for stanza in (row_raw[1] or b"").decode("utf-8").split("\n\n"):
                    fields = dict(line.split(": ", 1) for line in stanza.splitlines() if not line.startswith(" ") and ": " in line)
                    if fields.get("Package") in packages and fields.get("Status") == "install ok installed":
                        vals = [fields.get("Version", ""), fields.get("Architecture", "")]
                        need(all(guard(re.fullmatch(r"[A-Za-z0-9_.+:~=-]{1,96}", v),
                                       "PACKAGE_VERSION" if i == 0 else "PACKAGE_ARCHITECTURE")
                                 for i, v in enumerate(vals)))
                        versions[fields["Package"] + ":" + vals[1]] = {"version": vals[0], "architecture": vals[1]}
                runner, version = [], None
                try:
                    fd = directory("/home/runner/runners")
                    try:
                        before, names = os.fstat(fd), []
                        with os.scandir(fd) as entries:
                            for entry in entries:
                                guard(len(names) < 8, "RUNNER_ENTRY_COUNT")
                                names.append(entry.name)
                        before_identity, fd_identity = ident(before), ident(os.fstat(fd))
                        need(guard(before_identity == fd_identity, "RUNNER_FD_IDENTITY")
                             and guard(fd_identity == ident(at("/home/runner/runners")), "RUNNER_PATH_IDENTITY"))
                        if len(names) == 1 and re.fullmatch(r"[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", names[0]):
                            if stat.S_ISDIR(os.stat(names[0], dir_fd=fd, follow_symlinks=False).st_mode):
                                version = names[0]
                    finally:
                        os.close(fd)
                except OSError:
                    pass
                if version:
                    for relative in P["runnerFiles"]:
                        row = measure("/home/runner/runners/" + version + "/" + relative, 256 * 2**20)
                        runner.append(row)
                        if row["kind"] != "regular":
                            gap("RUNNER_FILE", "host-candidate-files.json#/runner/" + str(len(runner) - 1))
                else:
                    gap("RUNNER_SELECTION", "host-candidate-files.json#/runnerVersionDirectory")
                return {"schema": "mrk-h0-host-candidate-files-1", "scope": "candidate-not-complete-closure", "tools": tools,
                        "support": support, "aliases": aliases, "providers": providers, "packageVersions": versions,
                        "runnerVersionDirectory": version, "runner": runner}
            
            
            def ci(e, scratch, mounts):
                roots = {"workspace": e["GITHUB_WORKSPACE"], "temp": e["RUNNER_TEMP"], "actions": "/home/runner/work/_actions", "scratch": scratch}
                locations = {}
                for role, path in roots.items():
                    try:
                        fd = directory(path)
                        try:
                            before, v = os.fstat(fd), os.fstatvfs(fd)
                            found = [m for m in mounts if path == m[0] or path.startswith(m[0].rstrip("/") + "/")]
                            chosen = max(found, key=lambda m: len(m[0])) if found else None
                            mount = None if chosen is None else {"mountId": chosen[3], "device": chosen[4], "filesystem": chosen[2],
                                "mountPointSha256": hashlib.sha256(chosen[0].encode()).hexdigest(),
                                "options": sorted(set(chosen[5].split(",")) & {"ro", "rw", "noexec", "nodev", "nosuid", "sync", "noatime", "relatime", "strictatime"})}
                            locations[role] = {"path": path, "stat": ident(before), "mount": mount,
                                               "freeBytes": v.f_bavail * v.f_frsize, "fragmentBytes": v.f_frsize,
                                               "directoryChargeBytes": charge(before),
                                               "mountDeviceMatches": chosen is not None and chosen[4] == f"{os.major(before.st_dev)}:{os.minor(before.st_dev)}"}
                            if before.st_uid != os.getuid() or before.st_gid != os.getgid() or not locations[role]["mountDeviceMatches"]:
                                gap("CI_ROOT", "ci-shape.json#/locations/" + role)
                            if role == "workspace":
                                with os.scandir(fd) as entries:
                                    empty = next(entries, None) is None
                                locations[role]["empty"] = empty
                                if not empty:
                                    gap("WORKSPACE", "ci-shape.json#/locations/workspace")
                            need(ident(before) == ident(os.fstat(fd)) == ident(at(path)))
                        finally:
                            os.close(fd)
                    except OSError:
                        locations[role] = None
                        gap("CI_ROOT", "ci-shape.json#/locations/" + role)
                workspace = locations["workspace"]
                workspace_empty = workspace is not None and workspace["empty"]
                records, total = {}, workspace["directoryChargeBytes"] if workspace is not None else 0
                need(total <= 32 * 2**20)
                for role, fc, dc in (("actions", 512, 256), ("temp", 16, 16)):
                    if locations[role] is None:
                        records[role] = None
                        continue
                    files, dirs, allocation = census(roots[role], fc, dc)
                    total += allocation
                    need(total <= 32 * 2**20)
                    public, extra = [], 0
                    allowed_dirs = {roots[role]}
                    for relative in (P["actionPaths"] if role == "actions" else ("_github_home/x", "_github_workflow/x", "_runner_file_commands/x")):
                        relative = os.path.dirname(relative)
                        while relative:
                            allowed_dirs.add(roots[role] + "/" + relative)
                            relative = os.path.dirname(relative)
                    extra_dirs = len(set(dirs) - allowed_dirs)
                    for path, (expected, ordinary) in sorted(files.items()):
                        relative = path[len(roots[role]) + 1:]
                        allowed = relative in P["actionPaths"] if role == "actions" else bool(re.fullmatch(P["controlPattern"], relative))
                        if not allowed:
                            extra += 1
                            continue
                        row = measure(path, 2**20 if role == "temp" else 512 * 2**20)
                        need(row["stat"] == expected)
                        public.append(row)
                        if row["kind"] != "regular":
                            gap("CI_OBJECT", "ci-shape.json#/census/" + role)
                        if role == "temp" and relative.startswith("_runner_file_commands/") and expected["bytes"] != 0:
                            gap("CONTROL_NONEMPTY", "ci-shape.json#/census/temp")
                    if extra or extra_dirs:
                        gap("CI_EXTRA", "ci-shape.json#/census/" + role)
                    records[role] = {"files": len(files), "directories": len(dirs), "chargedBytes": allocation, "unreturnedExtraFiles": extra,
                                     "unreturnedExtraDirectories": extra_dirs, "objects": public}
                    if role == "actions":
                        actual = [[r["path"][len(roots[role]) + 1:], r["stat"]["bytes"], r["stat"]["mode"], r["sha256"]] for r in public]
                        match = hashlib.sha256(canonical(actual)).hexdigest() == P["actionDigest"] and extra == 0 and extra_dirs == 0
                        records[role]["manifestMatches"] = match
                        records[role]["expectedManifestSha256"] = P["actionManifestSha256"]
                        if not match:
                            gap("ACTION_MANIFEST", "ci-shape.json#/census/actions")
                    else:
                        for key in ("GITHUB_ENV", "GITHUB_OUTPUT", "GITHUB_PATH", "GITHUB_STEP_SUMMARY", "GITHUB_EVENT_PATH"):
                            if e[key] not in files:
                                gap("CI_OBJECT", "ci-shape.json#/census/temp")
                    for path, (expected, ordinary) in files.items():
                        need(ident(at(path)) == expected)
                    for path, expected in dirs.items():
                        need(ident(at(path)) == expected)
                snapshot = total if workspace_empty and all(records[k] is not None for k in ("actions", "temp")) else None
                return {"schema": "mrk-h0-ci-shape-1", "scope": "snapshot-not-peak-or-alias-closure", "locations": locations,
                        "census": records, "originalCiSnapshotCharge": snapshot, "originalObserver": None, "return": None}
            
            
            def main():
                global PHASE
                PHASE = "BOOTSTRAP_CONTEXT"
                os.umask(0o077)
                for key, value in ((resource.RLIMIT_AS, 512 * 2**20), (resource.RLIMIT_CPU, 60), (resource.RLIMIT_NOFILE, 128),
                                   (resource.RLIMIT_FSIZE, 8 * 2**20), (resource.RLIMIT_CORE, 0)):
                    resource.setrlimit(key, (value, value))
                e, scratch, event = context()
                PHASE = "OWNED_SCRATCH"
                owned_dirs = {p: ident(at(p)) for p in (scratch, scratch + "/home", scratch + "/tmp", scratch + "/neutral")}
                for path, s in owned_dirs.items():
                    need(s["uid"] == os.getuid() and s["mode"] == 0o700 and stat.S_ISDIR(at(path).st_mode))
                    fd = directory(path)
                    try:
                        names = []
                        with os.scandir(fd) as entries:
