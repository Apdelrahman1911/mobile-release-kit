name: Desktop shell compilation

on:
  push:
    branches: [verify/desktop-session-compile]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-session-compile.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed verification commit (no app or native test execution)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-session-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Shell compile only / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-26
          - platform: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MRK_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MRK_DESKTOP_HOSTED_CHECKS: shell-compile-v1
      MRK_EXPECTED_SHA: ${{ inputs.expected_sha }}
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Require exact disposable verification source
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-session-compile ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-session-compile.yml@$GITHUB_REF" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == push ]]
          fi
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed helper Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install Linux compilation inputs only on this disposable runner
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Prepare exact compiler-only source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire locked active-platform inputs without npm scripts
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile actual frontend and native shell without launching them
        timeout-minutes: 25
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Retain only the three public compile receipts
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-shell-compile-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Immediately remove positively settled compiler outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'
