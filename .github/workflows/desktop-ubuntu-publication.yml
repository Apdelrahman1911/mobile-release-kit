                  if not safe:
                      unsafe_count += 1
                      if len(unsafe) < 64:
                          unsafe.append({'path': path[:512], 'pathTruncated': len(path) > 512, **record(item)})
                  if not directory:
                      need(identity(os.stat(name, dir_fd=parent, follow_symlinks=False)) == identity(item),
                           'metadata-entry-changed')
                      return
