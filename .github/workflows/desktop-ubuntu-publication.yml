                  count += 1
                  need(count <= 32768 and depth <= 16, 'metadata-entry-depth-bound')
                  try:
                      item = os.stat(name, dir_fd=parent, follow_symlinks=False)
                  except FileNotFoundError:
                      need(depth == 0, 'metadata-member-disappeared')
                      return
