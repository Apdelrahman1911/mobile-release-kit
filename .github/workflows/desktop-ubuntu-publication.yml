name: Ubuntu publisher and package lifecycle verification

on:
  push:
    branches: [verify/desktop-ubuntu-publication]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-ubuntu-publication.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-ubuntu-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publisher-helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require exact disposable verification route
        shell: bash
        env:
          HOSTING: ${{ runner.environment }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          [[ "$HOSTING" == github-hosted && "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-ubuntu-publication ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_AFTER" == "$GITHUB_SHA" ]]
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Fixed pre/simulation/post DATA and returned apt success are required
      # before any compiler/native entry. Unknown/newer/held/partial inputs fail;
      # this is forward-only disposable-host preparation, not native qualification.
      - name: Establish only the reviewed forward glibc tuple set
        id: glibc
        timeout-minutes: 8
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          root="$RUNNER_TEMP/mrk-desktop-glibc89-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -- "$root"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          format='${Package}\t${Architecture}\t${Version}\t${source:Package}\t${source:Version}\t${Status}\n'
          /usr/bin/dpkg-query -W -f="$format" > "$root/before.tsv"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py plan > "$root/arguments.txt"
          mapfile -t packages < "$root/arguments.txt"
          [[ "${#packages[@]}" -ge 4 && "${#packages[@]}" -le 12 ]]
          apt=(sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get)
          options=(--no-install-recommends --no-remove --only-upgrade -o APT::Get::allow-Downgrades=false -o APT::Get::allow-Change-Held-Packages=false -o APT::Get::allow-Remove-Essential=false -o APT::Get::allow-Unauthenticated=false)
          "${apt[@]}" update -qq </dev/null
          "${apt[@]}" "${options[@]}" --simulate install "${packages[@]}" </dev/null > "$root/simulation.txt"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py simulation
          "${apt[@]}" "${options[@]}" -y install "${packages[@]}" </dev/null
          /usr/bin/dpkg-query -W -f="$format" > "$root/after.tsv"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py after
      - name: Retain original glibc prerequisite DATA including failures
        if: always() && steps.glibc.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ubuntu-glibc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.glibc.outputs.root }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Observe only the hosted Python body as public DATA
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            MRK_PUSH_EVENT_AFTER="$MRK_PUSH_EVENT_AFTER" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" /usr/bin/python3.12 -I -S -B desktop/tools/observe_hosted_python.py
      - name: Prepare one bounded package lifecycle check
        id: prepare
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
          MRK_UBUNTU_PUBLICATION_VERIFY: '1'
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py prepare
      # The token is confined to this fixed, read-only artifact transport.
      # The driver validates every admitted member before any compilation/use.
      - name: Download the exact accepted runtime preparation as DATA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: Apdelrahman1911/mobile-release-kit
          run-id: '35507734308'
          artifact-ids: '10604226841'
          github-token: ${{ github.token }}
          path: ${{ steps.prepare.outputs.root }}/work/admitted-a
          merge-multiple: true
      - name: Compile once and verify the fixed publisher package lifecycle
        id: verify
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
          MRK_UBUNTU_PUBLICATION_VERIFY: '1'
          MRK_UBUNTU_PUBLICATION_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_UBUNTU_PUBLICATION_PREPARATION_SHA256: ${{ steps.prepare.outputs.preparation_sha256 }}
          MRK_UBUNTU_PUBLICATION_DEADLINE: ${{ steps.prepare.outputs.deadline }}
          # Independently reviewed entry bytes; verified before root imports.
          MRK_UBUNTU_LIFECYCLE_ENTRY_SHA256: '57786e9c4e49b7f56f762848832f1e62f0d2ca1b78fd359239d8bfd5aed1ed10'
          MRK_UBUNTU_LIFECYCLE_BOOTSTRAP: |
            import hashlib, os, re, stat, sys
            from pathlib import Path
            def need(ok):
                if not ok: raise SystemExit(70)
            def identity(s):
                return (s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
            def read(p):
                for d in (p.parent,*p.parents): need(stat.S_ISDIR(d.lstat().st_mode))
                s=p.lstat(); need(stat.S_ISREG(s.st_mode) and s.st_nlink==1 and 0<s.st_size<=1048576)
                f=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)
                try:
                    need(identity(os.fstat(f))==identity(s)); b=b''
                    while True:
                        c=os.read(f,min(65536,s.st_size-len(b)+1))
                        if not c: break
                        b+=c; need(len(b)<=s.st_size)
                    need(len(b)==s.st_size and identity(os.fstat(f))==identity(s)==identity(p.lstat()))
                finally: os.close(f)
                return b
            def write(p,b):
                f=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o444)
                try:
                    os.fchmod(f,0o444)
                    for i in range(0,len(b),65536): need(os.write(f,b[i:i+65536])==len(b[i:i+65536]))
                    os.fsync(f)
                finally: os.close(f)
                need(read(p)==b)
            need(len(sys.argv)==6 and os.getresuid()==(0,0,0) and os.getresgid()==(0,0,0))
            entry,entry_sha,request,request_sha,root=sys.argv[1:]
            need(all(re.fullmatch(r'[0-9a-f]{64}',v) for v in (entry_sha,request_sha)))
            need(re.fullmatch(r'/var/lib/mrk-ubuntu-native-[1-9][0-9]{0,19}-[1-9][0-9]{0,19}',root))
            raw,control=read(Path(entry)),read(Path(request))
            need(hashlib.sha256(raw).hexdigest()==entry_sha and hashlib.sha256(control).hexdigest()==request_sha)
            r=Path(root)
            for d in r.parents:
                s=d.lstat(); need(stat.S_ISDIR(s.st_mode) and s.st_uid==s.st_gid==0 and not s.st_mode&0o022)
            os.umask(0o077); r.mkdir(mode=0o700); (r/'private').mkdir(mode=0o700)
            write(r/'entry.py',raw); write(r/'private/handoff.json',control)
            write(r/'private/bootstrap-pins.txt',(entry_sha+'\n'+request_sha+'\n').encode('ascii'))
            os.execv('/usr/bin/python3.12',['/usr/bin/python3.12','-I','-S','-B',str(r/'entry.py'),'unit-start'])
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py
      # Review bounded text records without downloading the compiled payloads.
      # The complete artifact below remains required for full-artifact consumers.
      - name: Retain lightweight lifecycle evidence
        if: always() && steps.prepare.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ubuntu-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public/*.stdout
            ${{ steps.prepare.outputs.root }}/public/*.stderr
            ${{ steps.prepare.outputs.root }}/public/*.json
            ${{ steps.prepare.outputs.root }}/public/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain original public package lifecycle evidence
        if: always() && steps.prepare.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ubuntu-publisher-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
