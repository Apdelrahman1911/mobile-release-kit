name: Installed production shell verification

on:
  push:
    branches: [verify/desktop-installed-shell]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-ubuntu-publication.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-installed-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MRK_INSTALLED_SHELL_CASE: compile
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
      MRK_UBUNTU_PUBLICATION_VERIFY: '1'
    outputs:
      shell_roster_sha256: ${{ steps.compile.outputs.shell_roster_sha256 }}
      shell_producer_attempt: ${{ steps.compile.outputs.shell_producer_attempt }}
      shell_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require the fixed disposable compile route
        shell: bash
        env:
          HOSTING: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$HOSTING" == github-hosted && "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-installed-shell ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_PUSH_EVENT_AFTER" == "$GITHUB_SHA" ]]
          [[ "$MRK_INSTALLED_SHELL_CASE" == compile ]]
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Prepare shared Ubuntu shell inputs only on this disposable runner
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
      - name: Prepare only fixed disposable Ubuntu DATA directory modes
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3.12 -I -S -B - <<'PY'
          import json, os, re, stat

          # Only these fixed public OS directories may lose group/other write. This is
          # disposable runner preparation, not recursive repair or runtime admission.
          PREPARE_DIRS = (
              '/usr/share', '/etc/gtk-3.0', '/etc/fonts', '/etc/fonts/conf.d',
              '/usr/share/fontconfig', '/usr/share/fontconfig/conf.avail', '/usr/share/fonts',
              '/usr/local/share/fonts', '/var/cache/fontconfig',
              '/usr/share/glib-2.0', '/usr/share/glib-2.0/schemas',
              '/usr/share/glvnd', '/usr/share/glvnd/egl_vendor.d', '/etc/glvnd', '/etc/glvnd/egl_vendor.d',
              '/usr/share/drirc.d', '/usr/share/X11', '/usr/share/X11/xkb', '/usr/share/X11/locale',
              '/usr/share/icons', '/usr/share/icons/Adwaita', '/usr/share/icons/hicolor',
              '/usr/share/themes', '/usr/share/themes/Adwaita', '/usr/share/mime',
              '/usr/share/hunspell', '/usr/share/hyphen',
          )
          DATA_ROOTS = (
              '/etc/gtk-3.0', '/etc/fonts', '/usr/share/fontconfig', '/usr/share/fonts',
              '/usr/local/share/fonts', '/var/cache/fontconfig', '/usr/share/glib-2.0/schemas',
              '/usr/share/glvnd/egl_vendor.d', '/etc/glvnd/egl_vendor.d', '/usr/share/drirc.d', '/etc/drirc',
              '/usr/share/X11/xkb', '/usr/share/X11/locale', '/usr/share/icons/Adwaita',
              '/usr/share/icons/hicolor', '/usr/share/themes/Adwaita', '/usr/share/mime/mime.cache',
              '/usr/share/hunspell', '/usr/share/hyphen',
              '/usr/lib/x86_64-linux-gnu/gio/modules/giomodule.cache',
              '/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache',
              '/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules.cache',
          )
          SCOPE = 'fixed-shell-data-directory-preparation'

          def need(ok, check, observed=None):
              if not ok:
                  diagnostic = json.dumps({'scope': SCOPE, 'failedCheck': check, 'observed': observed},
                                          sort_keys=True, separators=(',', ':'))
                  print(diagnostic if len(diagnostic.encode('ascii')) <= 2048
                        else 'Fixed directory preparation refused; diagnostic bound exceeded.', flush=True)
                  raise SystemExit(70)

          def identity(s):
              return (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid)

          def record(s):
              return {'dev': s.st_dev, 'ino': s.st_ino, 'uid': s.st_uid, 'gid': s.st_gid,
                      'mode': format(s.st_mode, '06o')}

          def protected(s, path):
              need(stat.S_ISDIR(s.st_mode) and s.st_uid == s.st_gid == 0 and not s.st_mode & 0o7022,
                   'protected-ancestor', {'path': path, **record(s)})

          def prepare_directory(path):
              need(path in PREPARE_DIRS, 'fixed-target')
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              fds, originals = [], []

              def recheck():
                  for fd, parent, name, expected in originals:
                      need(identity(os.fstat(fd)) == identity(expected)
                           == identity(os.stat(name, dir_fd=parent, follow_symlinks=False)), 'original-directory-changed')

              try:
                  root = os.open('/', flags)
                  fds.append(root)
                  before = os.fstat(root)
                  protected(before, '/')
                  originals.append((root, None, '/', before))
                  recheck()
                  parent, parts, current = root, path.split('/')[1:], ''
                  for index, name in enumerate(parts):
                      current += '/' + name
                      try:
                          fd = os.open(name, flags, dir_fd=parent)
                      except FileNotFoundError:
                          need(path != '/usr/share', 'required-share-directory')
                          recheck()
                          return {'path': path, 'absentAt': current}
                      fds.append(fd)
                      before = os.fstat(fd)
                      need(identity(before) == identity(os.stat(name, dir_fd=parent, follow_symlinks=False)),
                           'directory-name', {'path': current, **record(before)})
                      if index + 1 == len(parts):
                          need(stat.S_ISDIR(before.st_mode) and before.st_uid == before.st_gid == 0
                               and stat.S_IMODE(before.st_mode) in (0o755, 0o775, 0o777),
                               'target-policy', {'path': current, **record(before)})
                          if stat.S_IMODE(before.st_mode) != 0o755:
                              os.fchmod(fd, 0o755)
                          after = os.fstat(fd)
                          need(identity(after) == (before.st_dev, before.st_ino, before.st_mode & ~0o022,
                                                   before.st_uid, before.st_gid), 'same-object-mode-change')
                          originals.append((fd, parent, name, after))
                          recheck()
                          return {'path': path, 'before': record(before), 'after': record(after)}
                      protected(before, current)
                      originals.append((fd, parent, name, before))
                      parent = fd
                  need(False, 'missing-directory-target')
              finally:
                  failed_close = False
                  while fds:
                      fd = fds.pop()
                      try:
                          os.close(fd)
                      except OSError:
                          failed_close = True
                  need(not failed_close, 'original-directory-close')

          def metadata_preflight():
              # Read metadata through original no-follow directory FDs, never file
              # contents or symlink targets. Discovered names cannot become chmod
              # targets. Later full byte/ACL/mount admission remains unchanged.
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              count, unsafe_count, unsafe, fds = 0, 0, [], []

              def bound(fd, parent, name, item):
                  need(identity(os.fstat(fd)) == identity(item)
                       == identity(os.stat(name, dir_fd=parent, follow_symlinks=False)),
                       'metadata-directory-changed')

              def visit(parent, name, path, depth):
                  nonlocal count, unsafe_count
                  count += 1
                  need(count <= 32768 and depth <= 16, 'metadata-entry-depth-bound')
                  try:
                      item = os.stat(name, dir_fd=parent, follow_symlinks=False)
                  except FileNotFoundError:
                      need(depth == 0, 'metadata-member-disappeared')
                      return
                  link, directory = stat.S_ISLNK(item.st_mode), stat.S_ISDIR(item.st_mode)
                  ordinary = directory or stat.S_ISREG(item.st_mode) or link
                  safe = (ordinary and item.st_uid == item.st_gid == 0
                          and (link or not item.st_mode & 0o7022)
                          and (directory or link or not item.st_mode & 0o111))
                  if not safe:
                      unsafe_count += 1
                      if len(unsafe) < 64:
                          unsafe.append({'path': path[:512], 'pathTruncated': len(path) > 512, **record(item)})
                  if not directory:
                      need(identity(os.stat(name, dir_fd=parent, follow_symlinks=False)) == identity(item),
                           'metadata-entry-changed')
                      return
                  fd = os.open(name, flags, dir_fd=parent)
                  fds.append(fd)
                  try:
                      bound(fd, parent, name, item)
                      children = sorted(os.listdir(fd))
                      need(len(children) <= 8192 and all(re.fullmatch(r'[A-Za-z0-9_.+@\-]+', child) for child in children),
                           'metadata-membership-bound-grammar')
                      for child in children:
                          visit(fd, child, path + '/' + child, depth + 1)
                      bound(fd, parent, name, item)
                      need(sorted(os.listdir(fd)) == children, 'metadata-membership-changed')
                      bound(fd, parent, name, item)
                  finally:
                      fds.pop()  # Retire this original before its sole close attempt.
                      try:
                          os.close(fd)
                      except OSError:
                          need(False, 'metadata-directory-close')

              for root in DATA_ROOTS:
                  originals = []
                  try:
                      parent = os.open('/', flags)
                      fds.append(parent)
                      before = os.fstat(parent)
                      protected(before, '/')
                      originals.append((parent, None, '/', before))
                      bound(parent, None, '/', before)
                      parts, current = root.split('/')[1:], ''
                      for name in parts[:-1]:
                          current += '/' + name
                          try:
                              fd = os.open(name, flags, dir_fd=parent)
                          except FileNotFoundError:
                              count += 1
                              need(count <= 32768, 'metadata-entry-depth-bound')
                              break
                          fds.append(fd)
                          before = os.fstat(fd)
                          protected(before, current)
                          bound(fd, parent, name, before)
                          originals.append((fd, parent, name, before))
                          parent = fd
                      else:
                          visit(parent, parts[-1], root, 0)
                      for fd, parent, name, before in originals:
                          bound(fd, parent, name, before)
                  finally:
                      failed_close = False
                      while fds:
                          fd = fds.pop()
                          try:
                              os.close(fd)
                          except OSError:
                              failed_close = True
                      need(not failed_close, 'metadata-directory-close')
              return {'entries': count, 'unsafeCount': unsafe_count, 'unsafe': unsafe,
                      'unsafeListTruncated': unsafe_count > len(unsafe)}

          need(os.getresuid() == (0, 0, 0) and os.getresgid() == (0, 0, 0), 'root-credentials')
          prepared = [prepare_directory(path) for path in sorted(PREPARE_DIRS, key=lambda path: (path.count('/'), path))]
          metadata = metadata_preflight()
          receipt = json.dumps({'scope': SCOPE, 'prepared': prepared, 'metadata': metadata,
                                'runtimeAdmission': False}, sort_keys=True, separators=(',', ':'))
          need(len(receipt.encode('ascii')) <= 65536, 'receipt-bound')
          print(receipt, flush=True)
          need(metadata['unsafeCount'] == 0, 'unhandled-unsafe-data-metadata')
          PY
      - name: Prepare a fresh bounded compiler owner
        id: prepare
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py prepare
      - name: Download the exact accepted A runtime as DATA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: Apdelrahman1911/mobile-release-kit
          run-id: '35507734308'
          artifact-ids: '10604226841'
          github-token: ${{ github.token }}
          path: ${{ steps.prepare.outputs.root }}/work/admitted-a
          merge-multiple: true
      - name: Compile the normal shell and separate observer once without executing either
        id: compile
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_UBUNTU_PUBLICATION_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_UBUNTU_PUBLICATION_PREPARATION_SHA256: ${{ steps.prepare.outputs.preparation_sha256 }}
          MRK_UBUNTU_PUBLICATION_DEADLINE: ${{ steps.prepare.outputs.deadline }}
          # Exact independently reviewed shell lifecycle; not product qualification.
          MRK_UBUNTU_LIFECYCLE_ENTRY_SHA256: '7bf1e2374b522a8d6a3391aa9efc906f9b65953d9462e07dadcf12dc1e1858e4'
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py installed-shell-compile
      - name: Retain original compiler evidence and shell outputs
        id: upload
        if: always() && steps.prepare.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installed-shell-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  native:
    needs: compile
    name: installed-shell
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MRK_INSTALLED_SHELL_CASE: observe
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
      MRK_UBUNTU_PUBLICATION_VERIFY: '1'
    steps:
      - name: Require the fixed disposable native route
        shell: bash
        env:
          HOSTING: ${{ runner.environment }}
          MRK_INSTALLED_SHELL_ARTIFACT_ID: ${{ needs.compile.outputs.shell_artifact_id }}
          MRK_INSTALLED_SHELL_ROSTER_SHA256: ${{ needs.compile.outputs.shell_roster_sha256 }}
          MRK_INSTALLED_SHELL_PRODUCER_ATTEMPT: ${{ needs.compile.outputs.shell_producer_attempt }}
        run: |
          set -euo pipefail
          [[ "$HOSTING" == github-hosted && "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-installed-shell ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_PUSH_EVENT_AFTER" == "$GITHUB_SHA" ]]
          [[ "$MRK_INSTALLED_SHELL_CASE" == observe ]]
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import os, re
          values = [os.environ.get(name, '') for name in (
              'MRK_INSTALLED_SHELL_ARTIFACT_ID', 'MRK_INSTALLED_SHELL_PRODUCER_ATTEMPT', 'GITHUB_RUN_ATTEMPT')]
          if not all(re.fullmatch(r'[1-9][0-9]{0,19}', value) for value in values):
              raise SystemExit('Missing or malformed original compiler artifact/attempt output')
          if int(values[1]) > int(values[2]) or not re.fullmatch(r'[0-9a-f]{64}', os.environ.get('MRK_INSTALLED_SHELL_ROSTER_SHA256', '')):
              raise SystemExit('Original compiler roster/producer attempt differs')
          PY
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare shared Ubuntu shell inputs only on this disposable runner
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
      - name: Prepare only fixed disposable Ubuntu DATA directory modes
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3.12 -I -S -B - <<'PY'
          import json, os, re, stat

          # Only these fixed public OS directories may lose group/other write. This is
          # disposable runner preparation, not recursive repair or runtime admission.
          PREPARE_DIRS = (
              '/usr/share', '/etc/gtk-3.0', '/etc/fonts', '/etc/fonts/conf.d',
              '/usr/share/fontconfig', '/usr/share/fontconfig/conf.avail', '/usr/share/fonts',
              '/usr/local/share/fonts', '/var/cache/fontconfig',
              '/usr/share/glib-2.0', '/usr/share/glib-2.0/schemas',
              '/usr/share/glvnd', '/usr/share/glvnd/egl_vendor.d', '/etc/glvnd', '/etc/glvnd/egl_vendor.d',
              '/usr/share/drirc.d', '/usr/share/X11', '/usr/share/X11/xkb', '/usr/share/X11/locale',
              '/usr/share/icons', '/usr/share/icons/Adwaita', '/usr/share/icons/hicolor',
              '/usr/share/themes', '/usr/share/themes/Adwaita', '/usr/share/mime',
              '/usr/share/hunspell', '/usr/share/hyphen',
          )
          DATA_ROOTS = (
              '/etc/gtk-3.0', '/etc/fonts', '/usr/share/fontconfig', '/usr/share/fonts',
              '/usr/local/share/fonts', '/var/cache/fontconfig', '/usr/share/glib-2.0/schemas',
              '/usr/share/glvnd/egl_vendor.d', '/etc/glvnd/egl_vendor.d', '/usr/share/drirc.d', '/etc/drirc',
              '/usr/share/X11/xkb', '/usr/share/X11/locale', '/usr/share/icons/Adwaita',
              '/usr/share/icons/hicolor', '/usr/share/themes/Adwaita', '/usr/share/mime/mime.cache',
              '/usr/share/hunspell', '/usr/share/hyphen',
              '/usr/lib/x86_64-linux-gnu/gio/modules/giomodule.cache',
              '/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache',
              '/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules.cache',
          )
          SCOPE = 'fixed-shell-data-directory-preparation'

          def need(ok, check, observed=None):
              if not ok:
