              # Read metadata through original no-follow directory FDs, never file
              # contents or symlink targets. Discovered names cannot become chmod
              # targets. Later full byte/ACL/mount admission remains unchanged.
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
              count, unsafe_count, unsafe, fds = 0, 0, [], []

              def bound(fd, parent, name, item):
                  need(identity(os.fstat(fd)) == identity(item)
                       == identity(os.stat(name, dir_fd=parent, follow_symlinks=False)),
                       'metadata-directory-changed')

