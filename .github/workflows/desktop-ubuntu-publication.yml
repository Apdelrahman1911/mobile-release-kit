name: Installed production shell verification

on:
  push:
    branches: [verify/desktop-installed-shell, verify/desktop-shell-host-metadata]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-ubuntu-publication.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-installed-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: ${{ github.ref == 'refs/heads/verify/desktop-shell-host-metadata' && 'host-metadata-only' || 'compile' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-shell-host-metadata' && 10 || 50 }}
    env:
      MRK_INSTALLED_SHELL_CASE: ${{ github.ref == 'refs/heads/verify/desktop-shell-host-metadata' && 'host-metadata-only' || 'compile' }}
      MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
      MRK_UBUNTU_PUBLICATION_VERIFY: '1'
    steps:
      - name: Require one exact disposable preparation route
        shell: bash
        env:
          HOSTING: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$HOSTING" == github-hosted && "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_PUSH_EVENT_AFTER" == "$GITHUB_SHA" ]]
          case "$GITHUB_REF:$MRK_INSTALLED_SHELL_CASE" in
            refs/heads/verify/desktop-installed-shell:compile|refs/heads/verify/desktop-shell-host-metadata:host-metadata-only) ;;
            *) exit 70 ;;
          esac
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the fixed frontend compiler
        if: github.ref == 'refs/heads/verify/desktop-installed-shell'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Prepare shared Ubuntu shell inputs only on this disposable runner
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth xdotool dbus-daemon dbus-bin bubblewrap xdg-dbus-proxy
      # Fixed pre/simulation/post DATA and returned apt success are required
      # before any compiler/native entry. Unknown/newer/held/partial inputs fail;
      # this is forward-only disposable-host preparation, not native qualification.
      - name: Establish only the reviewed forward glibc tuple set
        id: glibc
        if: github.ref == 'refs/heads/verify/desktop-installed-shell'
        timeout-minutes: 8
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          root="$RUNNER_TEMP/mrk-desktop-glibc89-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -- "$root"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          format='${Package}\t${Architecture}\t${Version}\t${source:Package}\t${source:Version}\t${Status}\n'
          /usr/bin/dpkg-query -W -f="$format" > "$root/before.tsv"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py plan > "$root/arguments.txt"
          mapfile -t packages < "$root/arguments.txt"
          [[ "${#packages[@]}" -ge 4 && "${#packages[@]}" -le 12 ]]
          apt=(sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get)
          options=(--no-install-recommends --no-remove --only-upgrade -o APT::Get::allow-Downgrades=false -o APT::Get::allow-Change-Held-Packages=false -o APT::Get::allow-Remove-Essential=false -o APT::Get::allow-Unauthenticated=false)
          "${apt[@]}" update -qq </dev/null
          "${apt[@]}" "${options[@]}" --simulate install "${packages[@]}" </dev/null > "$root/simulation.txt"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py simulation
          "${apt[@]}" "${options[@]}" -y install "${packages[@]}" </dev/null
          /usr/bin/dpkg-query -W -f="$format" > "$root/after.tsv"
          /usr/bin/python3.12 -I -S -B desktop/tools/hosted_glibc_policy.py after
      - name: Retain original glibc prerequisite DATA including failures
        if: always() && steps.glibc.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ubuntu-glibc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.glibc.outputs.root }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Prepare only fixed disposable Ubuntu DATA modes
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent /usr/bin/python3.12 -I -S -B desktop/tools/prepare_hosted_ubuntu_data.py </dev/null
      - name: Observe only the hosted Python body as public DATA
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            MRK_PUSH_EVENT_AFTER="$MRK_PUSH_EVENT_AFTER" MRK_INSTALLED_SHELL_CASE="$MRK_INSTALLED_SHELL_CASE" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" /usr/bin/python3.12 -I -S -B desktop/tools/observe_hosted_python.py
      - name: Prepare a fresh bounded compiler owner
        if: github.ref == 'refs/heads/verify/desktop-installed-shell'
        id: prepare
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py prepare
      - name: Download the exact accepted A runtime as DATA
        if: github.ref == 'refs/heads/verify/desktop-installed-shell'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: Apdelrahman1911/mobile-release-kit
          run-id: '35507734308'
          artifact-ids: '10604226841'
          github-token: ${{ github.token }}
          path: ${{ steps.prepare.outputs.root }}/work/admitted-a
          merge-multiple: true
      - name: Compile the normal shell and separate observer once without executing either
        if: github.ref == 'refs/heads/verify/desktop-installed-shell'
        id: compile
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_UBUNTU_PUBLICATION_ROOT: ${{ steps.prepare.outputs.root }}
          MRK_UBUNTU_PUBLICATION_PREPARATION_SHA256: ${{ steps.prepare.outputs.preparation_sha256 }}
          MRK_UBUNTU_PUBLICATION_DEADLINE: ${{ steps.prepare.outputs.deadline }}
          # Exact independently reviewed shell lifecycle; not product qualification.
          MRK_UBUNTU_LIFECYCLE_ENTRY_SHA256: '9903bd24445453aef8adec69d7bb5a5d429a56b95c82266574718cc2ecc29ac6'
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py installed-shell-compile
      - name: Retain original compiler evidence and shell outputs
        id: upload
        if: always() && github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.prepare.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installed-shell-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Require the fixed disposable native route
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        shell: bash
        env:
          MRK_INSTALLED_SHELL_CASE: observe
          HOSTING: ${{ runner.environment }}
          MRK_INSTALLED_SHELL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          MRK_INSTALLED_SHELL_ROSTER_SHA256: ${{ steps.compile.outputs.shell_roster_sha256 }}
          MRK_INSTALLED_SHELL_PRODUCER_ATTEMPT: ${{ steps.compile.outputs.shell_producer_attempt }}
        run: |
          set -euo pipefail
          [[ "$HOSTING" == github-hosted && "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-installed-shell ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_PUSH_EVENT_AFTER" == "$GITHUB_SHA" ]]
          [[ "$MRK_INSTALLED_SHELL_CASE" == observe ]]
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import os, re
          values = [os.environ.get(name, '') for name in (
              'MRK_INSTALLED_SHELL_ARTIFACT_ID', 'MRK_INSTALLED_SHELL_PRODUCER_ATTEMPT', 'GITHUB_RUN_ATTEMPT')]
          if not all(re.fullmatch(r'[1-9][0-9]{0,19}', value) for value in values):
              raise SystemExit('Missing or malformed original compiler artifact/attempt output')
          if int(values[1]) > int(values[2]) or not re.fullmatch(r'[0-9a-f]{64}', os.environ.get('MRK_INSTALLED_SHELL_ROSTER_SHA256', '')):
              raise SystemExit('Original compiler roster/producer attempt differs')
          PY
      - name: Observe only the hosted Python body as public DATA
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        env:
          MRK_INSTALLED_SHELL_CASE: observe
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TZ=UTC HOME=/nonexistent \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            MRK_PUSH_EVENT_AFTER="$MRK_PUSH_EVENT_AFTER" MRK_INSTALLED_SHELL_CASE="$MRK_INSTALLED_SHELL_CASE" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" /usr/bin/python3.12 -I -S -B desktop/tools/observe_hosted_python.py
      - name: Prepare a fresh bounded native owner
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        id: prepare_native
        shell: bash
        env:
          MRK_INSTALLED_SHELL_CASE: observe
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py prepare
      - name: Download this run's exact original compiled shell outputs
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: Apdelrahman1911/mobile-release-kit
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ steps.prepare_native.outputs.root }}/work/admitted-shell
          merge-multiple: true
      - name: Download independently accepted U packages and original evidence
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: Apdelrahman1911/mobile-release-kit
          # Independently accepted U originals; full artifact membership is verified.
          run-id: '35783044845'
          artifact-ids: '10718458518'
          github-token: ${{ github.token }}
          path: ${{ steps.prepare_native.outputs.root }}/work/admitted-u
          merge-multiple: true
      - name: Observe only the fixed installed shell route with original finality
        if: github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.compile.outcome == 'success' && steps.upload.outcome == 'success'
        shell: bash
        env:
          MRK_INSTALLED_SHELL_CASE: observe
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_UBUNTU_PUBLICATION_ROOT: ${{ steps.prepare_native.outputs.root }}
          MRK_UBUNTU_PUBLICATION_PREPARATION_SHA256: ${{ steps.prepare_native.outputs.preparation_sha256 }}
          MRK_UBUNTU_PUBLICATION_DEADLINE: ${{ steps.prepare_native.outputs.deadline }}
          MRK_INSTALLED_SHELL_ROSTER_SHA256: ${{ steps.compile.outputs.shell_roster_sha256 }}
          MRK_INSTALLED_SHELL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          MRK_INSTALLED_SHELL_PRODUCER_ATTEMPT: ${{ steps.compile.outputs.shell_producer_attempt }}
          # Exact independently reviewed shell lifecycle; not product qualification.
          MRK_UBUNTU_LIFECYCLE_ENTRY_SHA256: '9903bd24445453aef8adec69d7bb5a5d429a56b95c82266574718cc2ecc29ac6'
          MRK_UBUNTU_LIFECYCLE_BOOTSTRAP: |
            import hashlib, os, re, stat, sys
            from pathlib import Path
            def need(ok):
                if not ok: raise SystemExit(70)
            def identity(s):
                return (s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
            def read(p):
                for d in (p.parent,*p.parents): need(stat.S_ISDIR(d.lstat().st_mode))
                s=p.lstat(); need(stat.S_ISREG(s.st_mode) and s.st_nlink==1 and 0<s.st_size<=1048576)
                f=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)
                try:
                    need(identity(os.fstat(f))==identity(s)); b=b''
                    while True:
                        c=os.read(f,min(65536,s.st_size-len(b)+1))
                        if not c: break
                        b+=c; need(len(b)<=s.st_size)
                    need(len(b)==s.st_size and identity(os.fstat(f))==identity(s)==identity(p.lstat()))
                finally: os.close(f)
                return b
            def write(p,b):
                f=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o444)
                try:
                    os.fchmod(f,0o444)
                    for i in range(0,len(b),65536): need(os.write(f,b[i:i+65536])==len(b[i:i+65536]))
                    os.fsync(f)
                finally: os.close(f)
                need(read(p)==b)
            need(len(sys.argv)==6 and os.getresuid()==(0,0,0) and os.getresgid()==(0,0,0))
            entry,entry_sha,request,request_sha,root=sys.argv[1:]
            need(all(re.fullmatch(r'[0-9a-f]{64}',v) for v in (entry_sha,request_sha)))
            need(re.fullmatch(r'/var/lib/mrk-ubuntu-native-[1-9][0-9]{0,19}-[1-9][0-9]{0,19}',root))
            raw,control=read(Path(entry)),read(Path(request))
            need(hashlib.sha256(raw).hexdigest()==entry_sha and hashlib.sha256(control).hexdigest()==request_sha)
            r=Path(root)
            for d in r.parents:
                s=d.lstat(); need(stat.S_ISDIR(s.st_mode) and s.st_uid==s.st_gid==0 and not s.st_mode&0o022)
            os.umask(0o077); r.mkdir(mode=0o700); (r/'private').mkdir(mode=0o700)
            write(r/'entry.py',raw); write(r/'private/handoff.json',control)
            write(r/'private/bootstrap-pins.txt',(entry_sha+'\n'+request_sha+'\n').encode('ascii'))
            os.execv('/usr/bin/python3.12',['/usr/bin/python3.12','-I','-S','-B',str(r/'entry.py'),'unit-start'])
        run: /usr/bin/python3.12 -I -S -B desktop/tools/ci_ubuntu_publication.py installed-shell
      - name: Retain only original public evidence for this shell observation
        if: always() && github.ref == 'refs/heads/verify/desktop-installed-shell' && steps.prepare_native.outputs.root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installed-shell-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_native.outputs.root }}/public
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
