          [[ "$SELECTED_SOURCE" == 4ab9e7b6c97136a15d6df8ce0bb09e1f5259e73c && "$SELECTED_RUN" == 41233002402 && "$SELECTED_GROUP" == git-local ]] || exit 1
        fi
        case "$MRK_MACOS_TARGET/$RUNNER_ARCH/$(/usr/bin/uname -m)" in
          aarch64-apple-darwin/ARM64/arm64|x86_64-apple-darwin/X64/x86_64) ;;
          *) exit 1 ;;
        esac
        expected_host_major=26
        if [[ "$MRK_MACOS_NATIVE_SCOPE" == git-native ]]; then expected_host_major=27; fi
        [[ "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/sw_vers -productVersion)" == "$expected_host_major".* ]] || exit 1

        [[ "$SELECTED_OPERATION" == local-desktop-carrier && "$SELECTED_SOURCE" == "$GITHUB_SHA" && "$MRK_MACOS_PACKAGE_ROLE" == ordinary-image && "$MRK_MACOS_NATIVE_SCOPE" == disabled ]] || exit 1
    - name: Check signing credential availability before downloading the package
      timeout-minutes: 1
      shell: bash
      env:
        SIGNING_IDENTITY: "${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}"
        SIGNING_PASSWORD: "${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}"
      run: |
        set +x
        set -euo pipefail
        if [[ -z "$SIGNING_IDENTITY" || -z "$SIGNING_PASSWORD" ]]; then
          printf '%s\n' '::error::The test job did not receive its macos-developer-id signing credentials.'
          exit 1
        fi
        unset SIGNING_IDENTITY SIGNING_PASSWORD
    - name: Check out the exact current harness source without credentials
      timeout-minutes: 3
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: Select DATA Python, never the packaged interpreter
      id: python
      timeout-minutes: 3
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.7
    - name: Reserve one fresh consumer work directory
      id: work
      timeout-minutes: 1
      shell: bash
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail
        umask 077
        [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
        [[ "$(/usr/bin/git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        tree=$(/usr/bin/git rev-parse 'HEAD^{tree}')
        [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
        root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
        printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
        printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nMRK_CONSUMER_TREE=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$tree" "$root" >> "$GITHUB_ENV"
    - name: Select the one closed upstream target checkpoint without matrix output
        ambiguity
      id: prepared
      timeout-minutes: 4
      shell: bash
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
        PRODUCER_SOURCE: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_source
          || github.sha }}"
        PRODUCER_RUN: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run
          || github.run_id }}"
        GH_TOKEN: "${{ github.token }}"
        GH_HOST: github.com
      run: |
        set +x
        set -euo pipefail
        set -o noclobber
        umask 077
        ulimit -c 0
        [[ "$PRODUCER_SOURCE" =~ ^[0-9a-f]{40}$ && "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
        fetch() { (ulimit -f 16384; gh api "$1" > "$2"); }
        fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/artifacts?per_page=100" "$MRK_MACOS_WORK/prepared-artifacts.json"
        printf '0\n' > "$MRK_MACOS_WORK/prepared-artifact-api.status"
        "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py producer-attempt --target "$MRK_MACOS_TARGET" \
          --producer-source "$PRODUCER_SOURCE" --producer-run "$PRODUCER_RUN" > "$MRK_MACOS_WORK/prepared-producer-attempt.txt"
        IFS= read -r producer_attempt < "$MRK_MACOS_WORK/prepared-producer-attempt.txt"
        [[ "$producer_attempt" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
        fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$producer_attempt/jobs?per_page=100" "$MRK_MACOS_WORK/prepared-jobs.json"
        "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py image-attempt --target "$MRK_MACOS_TARGET" \
          --producer-source "$PRODUCER_SOURCE" --producer-run "$PRODUCER_RUN" > "$MRK_MACOS_WORK/prepared-image-attempt.txt"
        IFS= read -r image_attempt < "$MRK_MACOS_WORK/prepared-image-attempt.txt"
        [[ "$image_attempt" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
        fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$image_attempt/jobs?per_page=100" "$MRK_MACOS_WORK/prepared-image-jobs.json"
        fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$image_attempt" "$MRK_MACOS_WORK/prepared-image-run.json"
        fetch "repos/$GITHUB_REPOSITORY/git/commits/$PRODUCER_SOURCE" "$MRK_MACOS_WORK/prepared-commit.json"
        printf '0\n' > "$MRK_MACOS_WORK/prepared-api.status"
        unset GH_TOKEN
        "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py select --target "$MRK_MACOS_TARGET" \
          --producer-source "$PRODUCER_SOURCE" --producer-run "$PRODUCER_RUN" > "$MRK_MACOS_WORK/prepared-selection.txt"
        /bin/cat "$MRK_MACOS_WORK/prepared-selection.txt" >> "$GITHUB_OUTPUT"
    - name: Capture the exact selected producer attempt, not the current rerun attempt
      timeout-minutes: 2
      shell: bash
      env:
        PRODUCER_RUN: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run
          || github.run_id }}"
        PRODUCER_ATTEMPT: "${{ steps.prepared.outputs.producer-attempt }}"
        PRODUCER_SOURCE: "${{ steps.prepared.outputs.producer-source }}"
        GH_TOKEN: "${{ github.token }}"
        GH_HOST: github.com
      run: |
        set +x
        set -euo pipefail
        set -o noclobber
        umask 077
        [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ && "$PRODUCER_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
        (ulimit -f 16384; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$PRODUCER_ATTEMPT" > "$MRK_MACOS_WORK/prepared-service/run.json")
        if [[ "$MRK_MACOS_PREPARED_RESUME" == true && "$PRODUCER_SOURCE" != "$GITHUB_SHA" ]]; then
          (ulimit -f 16384; gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCER_SOURCE...$GITHUB_SHA" > "$MRK_MACOS_WORK/prepared-service/compatibility.json")
        fi
        printf '0\n' > "$MRK_MACOS_WORK/prepared-service/metadata.status"
    - name: Download only the selected prepared artifact with service digest verification
      timeout-minutes: 5
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: "${{ steps.prepared.outputs.artifact-id }}"
        github-token: "${{ github.token }}"
        repository: Apdelrahman1911/mobile-release-kit
        run-id: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_run
          || github.run_id }}"
        path: "${{ steps.work.outputs.root }}/prepared-input"
        merge-multiple: true
        digest-mismatch: error
        skip-decompress: 'false'
    - name: Check out the immutable producer source for its package reader and producer
        build
      if: github.event_name == 'workflow_dispatch'
      timeout-minutes: 3
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ steps.prepared.outputs.producer-source }}"
        path: prepared-built-source
        persist-credentials: false
    - name: Reconstruct fresh script originals and repeat full finalized product audit
      timeout-minutes: 5
      shell: bash
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
      run: |
        set -euo pipefail
        ulimit -c 0
        "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py hydrate --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" > "$MRK_MACOS_WORK/prepared-runtime.env"
        /bin/cat "$MRK_MACOS_WORK/prepared-runtime.env" >> "$GITHUB_ENV"
    - name: Install and verify only the pinned producer toolchain
      timeout-minutes: 8
      shell: bash
      run: "/bin/bash desktop/tools/macos_installed_direct_rust.sh"
    - name: Fetch only the exact producer source dependencies before its unchanged
        offline build
      timeout-minutes: 8
      shell: bash
      env:
        BUILT_SOURCE: "${{ steps.prepared.outputs.producer-source }}"
      run: |
        set -euo pipefail
        checkout="$GITHUB_WORKSPACE"
        if [[ "$BUILT_SOURCE" != "$GITHUB_SHA" ]]; then checkout="$checkout/prepared-built-source"; fi
        [[ "$(/usr/bin/git -C "$checkout" rev-parse HEAD)" == "$BUILT_SOURCE" ]] || exit 1
        /usr/bin/env -i PATH="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
          HOME=/Users/runner CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
          RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
          DEVELOPER_DIR="$DEVELOPER_DIR" MACOSX_DEPLOYMENT_TARGET=26.0 \
          "/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/cargo" fetch \
            --manifest-path "$checkout/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
    - name: Standard Installer only is privileged; never execute the app or Python
        as root
      if: success()
      id: package_install
      timeout-minutes: 25
      shell: bash
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
        MRK_MACOS_DEVELOPER_ID_P12_BASE64: "${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64
          }}"
        MRK_MACOS_DEVELOPER_ID_P12_PASSWORD: "${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          }}"
      run: |
        set +x
        set +a
        export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
        set -euo pipefail
        set -o noclobber
        umask 077
        # Existing owner/deadlines cover signature, readonly mount, Installer
        # and V2 readback; earlier construction is not installation evidence.
        set +e
        MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
        MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py package-install --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" \
          > "$MRK_MACOS_WORK/package-install.stdout"
        package_status=$?
        printf '%s\n' "$package_status" > "$MRK_MACOS_WORK/package-install.status"
        package_status_saved=$?
        set -e
        if [[ "$package_status" != 0 ]]; then exit "$package_status"; fi
        [[ "$package_status_saved" == 0 ]] || exit "$package_status_saved"
        # The receipt is not its own exit proof: only this original0, the
        # saved Installer0, same-request readback and known detach permit use.
        # Unknown resources remain retained; no forced detach or root Python.
        unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
    - name: Retain bounded image signing and detach diagnostics
      if: "${{ !cancelled() && (steps.package_install.outcome == 'success' || steps.package_install.outcome
        == 'failure') }}"
      timeout-minutes: 2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-install-diagnostics-${{ matrix.group }}-${{ github.sha }}-${{
          github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.work.outputs.root }}/android-helper-distribution-sign.stderr
          ${{ steps.work.outputs.root }}/android-helper-distribution-sign.stdout
          ${{ steps.work.outputs.root }}/android-helper-distribution-sign.status
          ${{ steps.work.outputs.root }}/android-helper-observation-sign.stderr
          ${{ steps.work.outputs.root }}/android-helper-observation-sign.stdout
          ${{ steps.work.outputs.root }}/android-helper-observation-sign.status
          ${{ steps.work.outputs.root }}/android-helper-distribution-detach.stderr
          ${{ steps.work.outputs.root }}/android-helper-distribution-detach.status
        if-no-files-found: ignore
        retention-days: 14
    - name: Bind the closed Tool owner output for local transport
      id: local_carrier_export
      if: matrix.group == 'local-carrier' && steps.package_install.outcome == 'success'
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        "$MRK_PYTHON" -I -S -B - <<'PY'
        import os, stat, sys
        from pathlib import Path
        root = Path('/Users/runner/work/mobile-release-kit/mobile-release-kit')
        sys.path.insert(0, str(root))
        from desktop.tools import macos_prepared_package as P
        work = Path(os.environ['MRK_MACOS_WORK'])
        assert work.parent == Path('/Users/runner/work/_temp')
        fields = ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns','st_flags')
        def identity(info): return tuple(getattr(info,k) for k in fields)
        held, parents, values = [], {}, {}
        try:
            work_fd = os.open(work, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC)
            held.append(work_fd)
            work_pre = identity(os.fstat(work_fd))
            assert work_pre == identity(work.lstat())
            assert os.fstat(work_fd).st_uid == os.getuid() and stat.S_IMODE(os.fstat(work_fd).st_mode) == 0o700
            for name, wanted in (('producer-root', {'Install.pkg','producer.json','producer.sig'}), ('prepared-input', set(P.NAMES))):
                before = os.stat(name, dir_fd=work_fd, follow_symlinks=False)
                fd = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=work_fd)
                held.append(fd)
                assert identity(os.fstat(fd)) == identity(before)
                assert before.st_uid == os.getuid() and before.st_flags == 0 and set(os.listdir(fd)) == wanted
                parents[name] = (fd, identity(before))
            for name, limit in P.LOCAL_CARRIER_FILES.items():
                parent, leaf = name.rsplit('/',1) if '/' in name else ('',name)
                parent_fd = parents[parent][0] if parent else work_fd
                before = os.stat(leaf, dir_fd=parent_fd, follow_symlinks=False)
                assert stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_nlink == 1
                assert before.st_flags == 0 and not stat.S_IMODE(before.st_mode) & 0o7022 and 0 < before.st_size <= limit
                fd = os.open(leaf, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent_fd)
                held.append(fd)
                assert identity(os.fstat(fd)) == identity(before)
                body = os.pread(fd, before.st_size, 0)
                assert len(body) == before.st_size and not os.pread(fd, 1, before.st_size)
                assert identity(os.fstat(fd)) == identity(os.stat(leaf, dir_fd=parent_fd, follow_symlinks=False)) == identity(before)
                values[name] = body
            consumer = P.consumer_data(os.environ, os.environ['MRK_CONSUMER_TREE'], os.environ['MRK_MACOS_TARGET'])
            record = P.canonical(P.ordinary_local_carrier_transport_data(values, consumer))
            for name, (fd, before) in parents.items():
                assert identity(os.fstat(fd)) == identity(os.stat(name, dir_fd=work_fd, follow_symlinks=False)) == before
            assert identity(os.fstat(work_fd)) == identity(work.lstat()) == work_pre
            fd = os.open('LOCAL-CARRIER.json', os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600, dir_fd=work_fd)
            held.append(fd)
            offset = 0
            while offset < len(record):
                count = os.write(fd, record[offset:]); assert count > 0; offset += count
            os.fchmod(fd, 0o444); os.fsync(fd)
            assert os.pread(fd, len(record)+1, 0) == record
            assert identity(os.fstat(fd)) == identity(os.stat('LOCAL-CARRIER.json', dir_fd=work_fd, follow_symlinks=False))
        finally:
            for fd in reversed(held): os.close(fd)
        print('Closed ordinary Desktop package files bound for transport; local installation and service remain unqualified.')
        PY
    - name: Retain only authenticated files for the owner local installation
      if: matrix.group == 'local-carrier' && steps.local_carrier_export.outcome ==
        'success'
      timeout-minutes: 2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: candidate-local-carrier-${{ steps.prepared.outputs.producer-source }}-${{
          steps.prepared.outputs.producer-attempt }}-${{ github.sha }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        path: |
          ${{ steps.work.outputs.root }}/producer-root/producer.json
          ${{ steps.work.outputs.root }}/producer-root/producer.sig
          ${{ steps.work.outputs.root }}/prepared-input/PREPARED.json
          ${{ steps.work.outputs.root }}/android-helper-package-install.json
          ${{ steps.work.outputs.root }}/package-install.status
          ${{ steps.work.outputs.root }}/LOCAL-CARRIER.json
        if-no-files-found: error
        retention-days: 14
        overwrite: false
