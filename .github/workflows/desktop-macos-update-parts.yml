---
name: Focused ordinary Desktop update parts
'on':
  workflow_call: {}
permissions:
  contents: read
  actions: read
jobs:
  desktop26-prepare:
    name: "${{ matrix.native_scope == 'disabled' && 'macOS part (Desktop26 / prepare)' || 'Invalid Desktop update scope' }}"
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-candidate'
      && contains(github.event.head_commit.message, '[macos-desktop-update]')
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - native_scope: disabled
          target: aarch64-apple-darwin
          runner: macos-26
          machine: arm64
          hosted_job: github-hosted-macos26-arm64
          supplier_receipt: e6b23316078020c513ab1b05b3b55e4f87b8d15908a8dee022ad5ee03b8f763e
          supplier_tar: ead75b364118139561a34da6aa48e3c54791e152154ab32c46196b0223962359
          supplier_source: c6551aa07d0673436aa9587b3a039889d22449c3
          supplier_run: '40473858216'
          supplier_attempt: '1'
          supplier_artifact: '12719943283'
          removal_case: disabled
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJSON('{"aarch64-apple-darwin":"1.98.1","x86_64-apple-darwin":"1.98.0"}')[matrix.target]
        }}
      MRK_MACOS_TARGET: "${{ matrix.target }}"
      MRK_MACOS_RUNNER: "${{ matrix.runner }}"
      MRK_MACOS_MACHINE: "${{ matrix.machine }}"
      MRK_MACOS_HOSTED_JOB: "${{ matrix.hosted_job }}"
      MRK_EXPECTED_SHA: "${{ github.sha }}"
      MRK_MACOS_INSTALL_SOURCE_COMMIT: "${{ github.sha }}"
      MRK_MACOS_NATIVE_SCOPE: disabled
      MRK_MACOS_PACKAGE_ROLE: ordinary-image
      MRK_MACOS_SAME_PACKAGE_SCOPE: "${{ github.ref == 'refs/heads/verify/desktop-macos-preview'
        && 'same-package-noop' || 'disabled' }}"
      MRK_MACOS_REMOVAL_CASE: "${{ matrix.removal_case || 'disabled' }}"
      MRK_MACOS_ANDROID_UI_SCOPE: "${{ github.ref == 'refs/heads/verify/desktop-macos-installed'
        && 'android-signed-build' || 'disabled' }}"
      MRK_MACOS_IOS_UI_SCOPE: disabled
      MRK_MACOS_SAVED_FILE_UI_SCOPE: "${{ github.ref == 'refs/heads/verify/desktop-macos-preview'
        && 'remaining-three' || 'ordinary-seven' }}"
      MRK_MACOS_STORE_RUNTIME: signed-component
      MRK_BUNDLED_RUNTIME_SOURCE_SHA256: 10d3f2cf13155335444c8376a346d89581c03a43f0ae642e67401e379745dca2
      MRK_MACOS_RUNTIME_SUPPLIER: fresh-public-source
      MRK_MACOS_PYTHON_SUPPLIER_SHA256: "${{ matrix.supplier_receipt }}"
      MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256: "${{ matrix.supplier_tar }}"
      MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT: "${{ matrix.supplier_source }}"
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ID: "${{ matrix.supplier_run }}"
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT: "${{ matrix.supplier_attempt }}"
      MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID: "${{ matrix.supplier_artifact }}"
      MRK_BUNDLED_PROTOCOL_SHA256: '083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5'
      MRK_GITHUB_PREFLIGHT_TOOLING_SHA: d4a639b396eaa60385b223a154710e99a2862e67
      MRK_GITHUB_RELEASE_TOOLING_SHA: d4a639b396eaa60385b223a154710e99a2862e67
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: "/Library/Developer/CommandLineTools"
    outputs:
      work-root: "${{ steps.work.outputs.root }}"
    steps:
    - name: Admit only this exact disposable-hosted source route
      timeout-minutes: 1
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]] || exit 1
        case "$MRK_MACOS_NATIVE_SCOPE" in
          disabled) [[ "$MRK_MACOS_PACKAGE_ROLE" == ordinary-image ]] || exit 1 ;;
          project-identity-native|tool-setup|git-native)
            [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate && "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$MRK_MACOS_PACKAGE_ROLE" == installed-shell-observation ]] || exit 1
            [[ "$MRK_MACOS_SAME_PACKAGE_SCOPE" == disabled && "$MRK_MACOS_REMOVAL_CASE" == disabled && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
            [[ "${MRK_MACOS_AQUA_SCOPE:-disabled}" == disabled && "${MRK_MACOS_XCODE_SETUP_SCOPE:-disabled}" == disabled ]] || exit 1
            ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_SAME_PACKAGE_SCOPE" in
          disabled) ;;
          same-package-noop) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_ANDROID_UI_SCOPE" in
          disabled|android-signed-build) ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_IOS_UI_SCOPE" in
          disabled) ;;
          ios-unsigned-archive|ios-pending-recovery)
            [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
            ;;
          *) exit 1 ;;
        esac
        case "$MRK_MACOS_TARGET" in
          aarch64-apple-darwin)
            [[ "$RUNNER_ARCH" == ARM64 && "$MRK_MACOS_MACHINE" == arm64 && "$(/usr/bin/uname -m)" == arm64 ]] || exit 1
            case "$MRK_MACOS_RUNNER:$MRK_MACOS_HOSTED_JOB" in
              macos-26:github-hosted-macos26-arm64) expected_host_major=26 ;;
              xcode-27:github-hosted-xcode27-arm64)
                # Separate source-only matrix selection; never a tool or
                # ordinary image fallback, and never a Git nomination.
                [[ "$MRK_MACOS_NATIVE_SCOPE" == git-native && "$MRK_MACOS_PACKAGE_ROLE" == installed-shell-observation && "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ]] || exit 1
                expected_host_major=27
                ;;
              *) exit 1 ;;
            esac
            expected_supplier_receipt=e6b23316078020c513ab1b05b3b55e4f87b8d15908a8dee022ad5ee03b8f763e
            expected_supplier_tar=ead75b364118139561a34da6aa48e3c54791e152154ab32c46196b0223962359
            expected_supplier_source=c6551aa07d0673436aa9587b3a039889d22449c3
            expected_supplier_run=40473858216
            expected_supplier_attempt=1
            expected_supplier_artifact=12719943283
            ;;
          x86_64-apple-darwin)
            [[ "$MRK_MACOS_RUNNER" == macos-26-intel && "$RUNNER_ARCH" == X64 && "$MRK_MACOS_MACHINE" == x86_64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-x86_64 && "$(/usr/bin/uname -m)" == x86_64 ]] || exit 1
            expected_host_major=26
            expected_supplier_receipt=afba303207b19692b73fb1288b56afcd73378fc29b0b0ede4ff10eb2e0f949b8
            expected_supplier_tar=ff976626b48e95abc414d46ff91f1ebb183416356bb4706b8e673b7c9018ca9c
            expected_supplier_source=a2f7a10b4c86305f5ee65c6779ceaf6b128cd8fa
            expected_supplier_run=38343340695
            expected_supplier_attempt=1
            expected_supplier_artifact=11787588635
            ;;
          *) exit 1 ;;
        esac
        [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed || "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview || "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update || "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ) ]] || exit 1
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update ]]; then
          [[ "$MRK_MACOS_SAME_PACKAGE_SCOPE" == disabled && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
        fi
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature ]]; then
          [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
        fi
        if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle ]]; then
          [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
          case "$MRK_MACOS_REMOVAL_CASE" in ordinary|abrupt) ;; *) exit 1 ;; esac
        else
          [[ "$MRK_MACOS_REMOVAL_CASE" == disabled ]] || exit 1
        fi
        case "$MRK_MACOS_SAVED_FILE_UI_SCOPE" in
          ordinary-seven) ;;
          saved-version-recovery|workflow-refusal|release-evidence|remaining-three) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
          *) exit 1 ;;
        esac
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
        [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]] || exit 1
        # Fresh supplier pins never replace the separate current-core source binding.
        [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == 10d3f2cf13155335444c8376a346d89581c03a43f0ae642e67401e379745dca2 ]] || exit 1
        [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
        [[ "$MRK_MACOS_RUNTIME_SUPPLIER" == fresh-public-source ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" == "$expected_supplier_receipt" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" == "$expected_supplier_tar" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" == "$expected_supplier_source" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" == "$expected_supplier_run" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" == "$expected_supplier_attempt" ]] || exit 1
        [[ "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" == "$expected_supplier_artifact" ]] || exit 1
        [[ "$MRK_BUNDLED_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_PROTOCOL_SHA256" == 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5 ]] || exit 1
        [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == d4a639b396eaa60385b223a154710e99a2862e67 ]] || exit 1
        [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == d4a639b396eaa60385b223a154710e99a2862e67 ]] || exit 1
        [[ "$(/usr/bin/sw_vers -productVersion)" == "$expected_host_major".* ]] || exit 1
        [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]] || exit 1
    - name: Check out exact reviewed source without retained credentials
      timeout-minutes: 3
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      env:
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: core.autocrlf
        GIT_CONFIG_VALUE_0: 'false'
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: Select DATA stager Python, not the packaged interpreter
      timeout-minutes: 2
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.7
    - name: Check Mac installer transport and native dialog compilation before expensive
        preparation
      timeout-minutes: 3
      shell: bash
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      run: |
        set -euo pipefail
        umask 077
        "$MRK_PYTHON" -I -B desktop/tools/macos_local_preflight.py --transport \
          --output "$RUNNER_TEMP/mrk-fast-macos-preflight"
    - name: Refuse unconfigured update before any artifact download or native preparation
      if: github.ref == 'refs/heads/verify/desktop-macos-positive-update'
      id: update_selection
      timeout-minutes: 1
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      uses: "./.github/actions/macos-candidate-recipes/update_selection"
    - name: Select the fixed configured signed runtime before any payload download
      timeout-minutes: 1
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      uses: "./.github/actions/macos-candidate-recipes/select-the-fixed-configured-signed-runtime-before-an"
    - name: Select fixed frontend compiler
      timeout-minutes: 2
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.20.0
        package-manager-cache: false
    - name: Reserve fresh work and record exact source and actual tool bindings
      timeout-minutes: 2
      id: work
      env:
        MRK_PYTHON: "${{ steps.python.outputs.python-path }}"
      uses: "./.github/actions/macos-candidate-recipes/work"
    - name: Bind the complete reviewed first-party checkout before compilation
      timeout-minutes: 3
      id: source
      uses: "./.github/actions/macos-candidate-recipes/source"
    - name: Check fixed optional-array argv before native preparation
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C "$MRK_PYTHON" -I -S -B \
          tests/desktop/test_macos_optional_arrays.py \
          MacOSOptionalArraysTests.test_optional_arrays_preserve_empty_and_quoted_argv_under_nounset -v
    - name: Install and verify the pinned Mac Rust toolchain
      timeout-minutes: 8
      shell: bash
      run: "/bin/bash desktop/tools/macos_installed_direct_rust.sh"
    - name: Check actual Git and Library flags before the expensive candidate build
      timeout-minutes: 1
      uses: "./.github/actions/macos-candidate-recipes/check-actual-git-and-library-flags-before-the-expens"
    - name: Check the corrected macOS minimum and actual native host before signing
      if: github.ref == 'refs/heads/verify/desktop-macos-candidate' && env.MRK_MACOS_NATIVE_SCOPE
        == 'disabled'
      timeout-minutes: 10
      uses: "./.github/actions/macos-candidate-recipes/check-the-corrected-macos-minimum-and-actual-native-"
    - name: Admit only a fresh independently pinned Python transport destination
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        [[ "$MRK_PYTHON" == /* && -x "$MRK_PYTHON" ]] || exit 1
        [[ ! -e "$MRK_MACOS_WORK/fresh-python-transport" && ! -L "$MRK_MACOS_WORK/fresh-python-transport" ]] || exit 1
        [[ ! -e "$MRK_MACOS_WORK/signed-python-transport" && ! -L "$MRK_MACOS_WORK/signed-python-transport" ]] || exit 1
        [[ ! -e "$MRK_MACOS_WORK/signed-android-transport" && ! -L "$MRK_MACOS_WORK/signed-android-transport" ]] || exit 1
    - name: Download the independently accepted fresh Python transport
      timeout-minutes: 3
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: "${{ env.MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID }}"
        run-id: "${{ env.MRK_MACOS_PYTHON_SUPPLIER_RUN_ID }}"
        repository: Apdelrahman1911/mobile-release-kit
        github-token: "${{ github.token }}"
        path: "${{ steps.work.outputs.root }}/fresh-python-transport"
        merge-multiple: 'false'
        digest-mismatch: error
        skip-decompress: 'false'
    - name: Project the pinned fresh Python transport without executing it
      timeout-minutes: 3
      uses: "./.github/actions/macos-candidate-recipes/project-the-pinned-fresh-python-transport-without-ex"
    - name: Download only the configured signed Python capsule
      timeout-minutes: 3
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: "${{ env.MRK_MACOS_SIGNING_ARTIFACT_ID }}"
        run-id: "${{ env.MRK_MACOS_SIGNING_RUN_ID }}"
        repository: Apdelrahman1911/mobile-release-kit
        github-token: "${{ github.token }}"
        path: "${{ steps.work.outputs.root }}/signed-python-transport"
        merge-multiple: 'false'
        digest-mismatch: error
        skip-decompress: 'false'
    - name: Project the configured capsule as DATA without executing it
      timeout-minutes: 3
      shell: bash
      run: |
        set -euo pipefail
        set -o noclobber
        umask 077
        /usr/bin/env -i PATH=/usr/bin:/bin HOME="$MRK_MACOS_WORK" TMPDIR="$MRK_MACOS_WORK" LANG=C LC_ALL=C TZ=UTC \
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py project-signed-python \
          --target "$MRK_MACOS_TARGET" \
          --transport-root "$MRK_MACOS_WORK/signed-python-transport" \
          --output "$MRK_MACOS_WORK/signed-python-capsule" > "$MRK_MACOS_WORK/signed-python-transport-result.json"
    - name: Select only SOURCE-enrolled current signed GitHub tools
      id: github_tools
      timeout-minutes: 1
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
      uses: "./.github/actions/macos-candidate-recipes/github_tools"
    - name: Download exactly the nominated signed history provider
      if: steps.github_tools.outputs.history-enabled == 'true'
      timeout-minutes: 3
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: "${{ steps.github_tools.outputs.history-artifact-id }}"
        run-id: "${{ steps.github_tools.outputs.history-run-id }}"
        repository: Apdelrahman1911/mobile-release-kit
        github-token: "${{ github.token }}"
        path: "${{ steps.work.outputs.root }}/history-provider-transport"
        merge-multiple: 'false'
        digest-mismatch: error
        skip-decompress: 'false'
    - name: Download exactly the nominated signed seal helper
      if: steps.github_tools.outputs.seal-enabled == 'true'
      timeout-minutes: 3
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: "${{ steps.github_tools.outputs.seal-artifact-id }}"
        run-id: "${{ steps.github_tools.outputs.seal-run-id }}"
        repository: Apdelrahman1911/mobile-release-kit
        github-token: "${{ github.token }}"
        path: "${{ steps.work.outputs.root }}/github-seal-transport"
        merge-multiple: 'false'
        digest-mismatch: error
        skip-decompress: 'false'
    - name: Project current signed tools without executing either program
      id: app_tools
      timeout-minutes: 3
      env:
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
        HISTORY_ENABLED: "${{ steps.github_tools.outputs.history-enabled }}"
        SEAL_ENABLED: "${{ steps.github_tools.outputs.seal-enabled }}"
      uses: "./.github/actions/macos-candidate-recipes/app_tools"
    - name: Restore exactly the SOURCE-selected signed Store component without executing
        it
      timeout-minutes: 5
      shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        umask 077
        [[ "$MRK_MACOS_STORE_RUNTIME" == signed-component ]] || exit 1
        "$MRK_PYTHON" -I -S -B desktop/tools/macos_store_component.py restore-selected \
          "$MRK_MACOS_WORK/signed-store-component" --target "$MRK_MACOS_TARGET"
    - name: Prepare the current payload from the independently accepted fresh Python
        supplier
      id: app_runtime
      timeout-minutes: 3
      uses: "./.github/actions/macos-candidate-recipes/app_runtime"
      with:
        binding-1: "${{ matrix.native_scope || 'disabled' }}"
        binding-2: "${{ steps.github_tools.outputs.history-enabled }}"
    - name: Latch the same computed runtime binding before any application compilation
      timeout-minutes: 1
      uses: "./.github/actions/macos-candidate-recipes/latch-the-same-computed-runtime-binding-before-any-a"
    - name: Exercise projected signed Store native CRC32 and Fastlane without a Store
        lane
      timeout-minutes: 2
      uses: "./.github/actions/macos-candidate-recipes/exercise-projected-signed-store-native-crc32-and-fas"
    - name: Build only the external normal-app XCTest runner, not an instrumented
        app
      id: normal_ui_build
      if: github.ref != 'refs/heads/verify/desktop-macos-candidate' && (github.ref
        != 'refs/heads/verify/desktop-macos-app-signature' && (github.ref == 'refs/heads/verify/desktop-macos-positive-update'
        || github.ref == 'refs/heads/verify/desktop-macos-removal-lifecycle' || github.ref
        == 'refs/heads/verify/desktop-macos-preview' || (github.ref == 'refs/heads/verify/desktop-macos-installed'
        && env.MRK_MACOS_ANDROID_UI_SCOPE == 'android-signed-build') || (github.ref
        == 'refs/heads/verify/desktop-macos-installed' && (env.MRK_MACOS_IOS_UI_SCOPE
        == 'ios-unsigned-archive' || env.MRK_MACOS_IOS_UI_SCOPE == 'ios-pending-recovery')
        && env.MRK_MACOS_ANDROID_UI_SCOPE == 'disabled' && env.MRK_MACOS_SAVED_FILE_UI_SCOPE
        == 'ordinary-seven')))
      timeout-minutes: 9
      env:
        DEVELOPER_DIR: "/Applications/Xcode.app/Contents/Developer"
      uses: "./.github/actions/macos-candidate-recipes/normal_ui_build"
    - name: Require the fixed SOURCE producer identity and release before ordinary
        signing
