name: Desktop GTK session compilation

on:
  push:
    branches: [verify/desktop-session-gtk-compile]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-session-gtk-compile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-session-gtk-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: GTK session compile only / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create dedicated compilation outputs
        id: output
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/mrk-gtk-compile.XXXXXXXX")
          echo "root=$output" >> "$GITHUB_OUTPUT"
          echo "GTK_COMPILE_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$output/target" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$output/pycache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install Linux compiler prerequisites
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev libatspi2.0-dev
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Install frontend dependencies without lifecycle scripts
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Python and JavaScript syntax without executing the fixtures
        run: |
          python -m py_compile desktop/tools/qualify_session_gtk.py
          node --check desktop/src-tauri/tests/session_gtk_recipe.js
      - name: Compile the DBus and AT-SPI fixture without running it
        run: |
          cc -std=c11 -O2 -Wall -Wextra \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            desktop/native/session_gtk_input_linux.c \
            -o "$GTK_COMPILE_OUTPUT/session-gtk-input" \
            $(pkg-config --cflags --libs dbus-1 glib-2.0 atspi-2)
      - name: Build the frontend
        working-directory: desktop
        run: npm run build
      - name: Compile the GTK integration test without running it
        timeout-minutes: 28
        working-directory: desktop/src-tauri
        run: cargo test --locked --no-default-features --test session-gtk-qualification --no-run --features desktop-shell,development-runtime
      - name: Remove only this job's compilation outputs
        if: always() && steps.output.outputs.root != ''
        run: |
          [[ -n "$GTK_COMPILE_OUTPUT" && "$GTK_COMPILE_OUTPUT" == "$RUNNER_TEMP"/mrk-gtk-compile.* ]]
          rm -rf -- "$GTK_COMPILE_OUTPUT" \
            "$GITHUB_WORKSPACE/desktop/node_modules" "$GITHUB_WORKSPACE/desktop/dist"
