name: Desktop Mac normal package and limited early preview (Aqua gate separate)

on:
  push:
    branches:
      - verify/desktop-macos-installed
      - verify/desktop-macos-preview
      - verify/desktop-macos-image-compile

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering-install:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/verify/desktop-macos-installed' || github.ref == 'refs/heads/verify/desktop-macos-preview')
    environment: macos-developer-id
    name: normal-installed-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Raw timed-step union535min; disjoint scopes retain the350min hard job cap.
    # Pre-Remove baseline preview345 / recovery339 / installed210, plus5 overhead.
    # Remove preview adds90 nominal step maxima; this sum establishes no fit.
    # Dormant Android272 / iOS248 include5 overhead; no native qualification claimed.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            machine: arm64
            hosted_job: github-hosted-macos26-arm64
            supplier_receipt: '2f9cf013c0598b08e89fd9b26d1d74d8ab08be2c22c152ae27cb3219139cd81d'
            supplier_tar: 'ff7883185cf8226e9366b1ee9a3dcb3eb8ee761dbc1f697f952510a6bd858695'
            supplier_source: '158cdff422e3837f7ab5e6192af76a578faf6fab'
            supplier_run: '37467019389'
            supplier_attempt: '1'
            supplier_artifact: '11415902210'
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            machine: x86_64
            hosted_job: github-hosted-macos26-x86_64
            supplier_receipt: 'a46f6838afdb7c20c3539e8f65891312aa8df10e2de67e9b9e3ddbf449883b4b'
            supplier_tar: '739cc8b8b3c68daffba8d7b9cb7cb54ca730eef2c5842302ae8a2682bf64d5bd'
            supplier_source: '079ab2a2c8fef88f01bf909e7669c685f07e1375'
            supplier_run: '37476532238'
            supplier_attempt: '1'
            supplier_artifact: '11419502465'
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJSON('{"aarch64-apple-darwin":"1.98.1","x86_64-apple-darwin":"1.98.0"}')[matrix.target] }}
      MRK_MACOS_TARGET: ${{ matrix.target }}
      MRK_MACOS_RUNNER: ${{ matrix.runner }}
      MRK_MACOS_MACHINE: ${{ matrix.machine }}
      MRK_MACOS_HOSTED_JOB: ${{ matrix.hosted_job }}
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      MRK_MACOS_PACKAGE_ROLE: ordinary-image
      # SOURCE-owned and OFF: legal/signing/current protected-copy prerequisites remain.
      MRK_MACOS_ANDROID_UI_SCOPE: disabled
      # Separately reviewed unsigned archive UI; an installed app is still mandatory.
      MRK_MACOS_IOS_UI_SCOPE: disabled
      # A separate reviewed SOURCE change selects the targeted recovery run.
      # Default seven cases and the singleton are distinct native obligations.
      MRK_MACOS_SAVED_FILE_UI_SCOPE: ordinary-seven
      # Final signed M comes only from the fixed configured SOURCE nomination.
      MRK_BUNDLED_RUNTIME_SOURCE_SHA256: fa624512af03437f075f2da10357b3808d1a58c8f36e1db6103bc2abe54150e0
      # Independently accepted paired supplier six pins; each signed target requires a new final M.
      MRK_MACOS_RUNTIME_SUPPLIER: fresh-public-source
      MRK_MACOS_PYTHON_SUPPLIER_SHA256: ${{ matrix.supplier_receipt }}
      MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256: ${{ matrix.supplier_tar }}
      MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT: ${{ matrix.supplier_source }}
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ID: ${{ matrix.supplier_run }}
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT: ${{ matrix.supplier_attempt }}
      MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID: ${{ matrix.supplier_artifact }}
      MRK_BUNDLED_PROTOCOL_SHA256: 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5
      # Independent immutable publisher bindings; caller hashes come from build.rs.
      MRK_GITHUB_PREFLIGHT_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MRK_GITHUB_RELEASE_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only this exact disposable-hosted source route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]] || exit 1
          case "$MRK_MACOS_ANDROID_UI_SCOPE" in
            disabled|android-signed-build) ;;
            *) exit 1 ;;
          esac
          case "$MRK_MACOS_IOS_UI_SCOPE" in
            disabled) ;;
            ios-unsigned-archive)
              [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          case "$MRK_MACOS_TARGET" in
            aarch64-apple-darwin)
              [[ "$MRK_MACOS_RUNNER" == macos-26 && "$RUNNER_ARCH" == ARM64 && "$MRK_MACOS_MACHINE" == arm64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-arm64 && "$(/usr/bin/uname -m)" == arm64 ]] || exit 1
              expected_supplier_receipt=2f9cf013c0598b08e89fd9b26d1d74d8ab08be2c22c152ae27cb3219139cd81d
              expected_supplier_tar=ff7883185cf8226e9366b1ee9a3dcb3eb8ee761dbc1f697f952510a6bd858695
              expected_supplier_source=158cdff422e3837f7ab5e6192af76a578faf6fab
              expected_supplier_run=37467019389
              expected_supplier_attempt=1
              expected_supplier_artifact=11415902210
              ;;
            x86_64-apple-darwin)
              [[ "$MRK_MACOS_RUNNER" == macos-26-intel && "$RUNNER_ARCH" == X64 && "$MRK_MACOS_MACHINE" == x86_64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-x86_64 && "$(/usr/bin/uname -m)" == x86_64 ]] || exit 1
              expected_supplier_receipt=a46f6838afdb7c20c3539e8f65891312aa8df10e2de67e9b9e3ddbf449883b4b
              expected_supplier_tar=739cc8b8b3c68daffba8d7b9cb7cb54ca730eef2c5842302ae8a2682bf64d5bd
              expected_supplier_source=079ab2a2c8fef88f01bf909e7669c685f07e1375
              expected_supplier_run=37476532238
              expected_supplier_attempt=1
              expected_supplier_artifact=11419502465
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed || "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ) ]] || exit 1
          case "$MRK_MACOS_SAVED_FILE_UI_SCOPE" in
            ordinary-seven) ;;
            saved-version-recovery) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]] || exit 1
          # Fresh supplier pins never replace the separate current-core source binding.
          [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == fa624512af03437f075f2da10357b3808d1a58c8f36e1db6103bc2abe54150e0 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
          [[ "$MRK_MACOS_RUNTIME_SUPPLIER" == fresh-public-source ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" == "$expected_supplier_receipt" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" == "$expected_supplier_tar" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" == "$expected_supplier_source" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" == "$expected_supplier_run" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" == "$expected_supplier_attempt" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" == "$expected_supplier_artifact" ]] || exit 1
          [[ "$MRK_BUNDLED_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_PROTOCOL_SHA256" == 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5 ]] || exit 1
          [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]] || exit 1
      - name: Check out exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select DATA stager Python, not the packaged interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select the fixed configured signed runtime before any payload download
        timeout-minutes: 1
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$MRK_PYTHON" == /* && -x "$MRK_PYTHON" ]] || exit 1
          selection=$(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C TZ=UTC \
            "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py runtime-signing-selection --target "$MRK_MACOS_TARGET")
          [[ ${#selection} -le 4096 ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$selection" <<'PY_SIGNING_SELECTION'
          import json, os, re, stat, sys
          value = json.loads(sys.argv[1])
          fields = {
              "runtimeManifestSha256": "MRK_BUNDLED_RUNTIME_MANIFEST_SHA256",
              "signedPythonSha256": "MRK_MACOS_SIGNED_PYTHON_SHA256",
              "signingReceiptSha256": "MRK_MACOS_SIGNING_RECEIPT_SHA256",
              "signingSourceCommit": "MRK_MACOS_SIGNING_SOURCE_COMMIT",
              "signingRunId": "MRK_MACOS_SIGNING_RUN_ID",
              "signingRunAttempt": "MRK_MACOS_SIGNING_RUN_ATTEMPT",
              "signingArtifactId": "MRK_MACOS_SIGNING_ARTIFACT_ID",
              "producerProfileSha256": "MRK_MACOS_SIGNING_PRODUCER_PROFILE_SHA256",
              "serviceProfileSha256": "MRK_MACOS_SIGNING_SERVICE_PROFILE_SHA256",
              "nominationSha256": "MRK_MACOS_SIGNING_BINDING_SHA256",
          }
          fixed = {"schemaVersion", "kind", "target", "state", "sourceInputsSha256", "nativeAuthority"}
          if (type(value) is not dict or set(value) != set(fields) | fixed
                  or type(value["schemaVersion"]) is not int or value["schemaVersion"] != 1
                  or value["kind"] != "configured-signed-runtime-selection-data"
                  or value["state"] != "configured" or value["target"] != os.environ["MRK_MACOS_TARGET"]
                  or value["nativeAuthority"] is not False
                  or value["sourceInputsSha256"] != os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"]):
              raise ValueError("fixed configured runtime selection required")
          for key in fields:
              item = value[key]
              if key in ("signingRunId", "signingRunAttempt", "signingArtifactId"):
                  valid = type(item) is str and re.fullmatch(r"[1-9][0-9]{0,15}", item) and int(item) <= 9007199254740991
              else:
                  width = 40 if key == "signingSourceCommit" else 64
                  valid = type(item) is str and re.fullmatch(r"[0-9a-f]{" + str(width) + r"}", item) and item != "0" * width
              if not valid: raise ValueError("fixed public signing field refused")
          body = "".join(name + "=" + value[key] + "\n" for key, name in fields.items()).encode("ascii")
          if len(body) > 4096: raise ValueError("signing selection output bound")
          fd = os.open(os.environ["GITHUB_ENV"], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.getuid():
                  raise ValueError("original workflow environment file refused")
              view = memoryview(body)
              while view:
                  count = os.write(fd, view)
                  if count <= 0: raise OSError("signing selection write refused")
                  view = view[count:]
              os.fsync(fd)
          finally:
              os.close(fd)
          PY_SIGNING_SELECTION
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Reserve fresh work and record exact source and actual tool bindings
        id: work
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
          [[ ! -e desktop/node_modules && ! -L desktop/node_modules && ! -e desktop/dist && ! -L desktop/dist ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$root" >> "$GITHUB_ENV"
          "$MRK_PYTHON" -I -S -B - "$root/source-binding.json" <<'PY'
          import json, os, subprocess, sys
          build_target = os.environ["MRK_MACOS_TARGET"]
          supplier_routes = {
              "aarch64-apple-darwin": (".github/workflows/desktop-macos-cpython-source-build.yml", "refs/heads/verify/desktop-macos-cpython-source-build"),
              "x86_64-apple-darwin": (".github/workflows/desktop-macos-cpython-source-build-intel.yml", "refs/heads/verify/desktop-macos-cpython-source-build-intel"),
          }
          if build_target not in supplier_routes: raise ValueError("source-binding-target")
          tools = {}
          for name, command in (
              ("cltSdkPath", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-path"]),
              ("cltSdkVersion", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-version"]),
              ("cltSdkBuild", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-build-version"]),
              ("cltCompiler", ["/usr/bin/xcrun", "--sdk", "macosx", "clang", "--version"]),
              ("node", ["node", "--version"]),
              ("python", [sys.executable, "-I", "-S", "-B", "--version"]),
          ):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True, timeout=15)
              if not result.stdout or len(result.stdout) > 4096: raise ValueError("tool version output refused")
              tools[name] = {"command": command, "output": result.stdout.decode("utf-8", "strict").strip()}
          work_info = os.stat(os.path.dirname(sys.argv[1]), follow_symlinks=False)
          source_tree = subprocess.run(["git", "-c", "core.fsmonitor=false", "rev-parse", "HEAD^{tree}"], check=True, stdout=subprocess.PIPE, timeout=15).stdout.decode().strip()
          value = {"schemaVersion": 1, "source": os.environ["GITHUB_SHA"], "workflowSource": os.environ["GITHUB_WORKFLOW_SHA"],
                   "tree": source_tree, "workDirectory": [work_info.st_dev, work_info.st_ino, work_info.st_uid],
                   "packageRole": os.environ["MRK_MACOS_PACKAGE_ROLE"], "target": build_target,
                   "frontendAbsentAtAdmission": True,
                   "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                   "runtimeManifestSha256": os.environ["MRK_BUNDLED_RUNTIME_MANIFEST_SHA256"],
                   "runtimeSourceInputsSha256": os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"],
                   "protocolSha256": os.environ["MRK_BUNDLED_PROTOCOL_SHA256"],
                   "githubPreflightToolingSha": os.environ["MRK_GITHUB_PREFLIGHT_TOOLING_SHA"],
                   "githubReleaseToolingSha": os.environ["MRK_GITHUB_RELEASE_TOOLING_SHA"],
                   "signedPythonDerivation": {
                       "nominationSha256": os.environ["MRK_MACOS_SIGNING_BINDING_SHA256"],
                       "signingSourceCommit": os.environ["MRK_MACOS_SIGNING_SOURCE_COMMIT"],
                       "runId": os.environ["MRK_MACOS_SIGNING_RUN_ID"],
                       "runAttempt": os.environ["MRK_MACOS_SIGNING_RUN_ATTEMPT"],
                       "artifactId": os.environ["MRK_MACOS_SIGNING_ARTIFACT_ID"],
                       "signedPythonSha256": os.environ["MRK_MACOS_SIGNED_PYTHON_SHA256"],
                       "signingReceiptSha256": os.environ["MRK_MACOS_SIGNING_RECEIPT_SHA256"],
                       "producerProfileSha256": os.environ["MRK_MACOS_SIGNING_PRODUCER_PROFILE_SHA256"],
                       "serviceProfileSha256": os.environ["MRK_MACOS_SIGNING_SERVICE_PROFILE_SHA256"],
                   },
                   "freshPythonSupplier": {
                       "origin": os.environ["MRK_MACOS_RUNTIME_SUPPLIER"],
                       "repository": "Apdelrahman1911/mobile-release-kit",
                       "workflow": supplier_routes[build_target][0],
                       "ref": supplier_routes[build_target][1],
                       "source": os.environ["MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT"],
                       "runId": os.environ["MRK_MACOS_PYTHON_SUPPLIER_RUN_ID"],
                       "runAttempt": os.environ["MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT"],
                       "artifactId": os.environ["MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID"],
                       "receiptSha256": os.environ["MRK_MACOS_PYTHON_SUPPLIER_SHA256"],
                       "tarSha256": os.environ["MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256"],
                   },
                   "scope": "engineering-acl-probe-five-regressions-fixed-fixture-package-install-only", "fixedFixtureCases": 8,
                   "aclPrimitiveCases": 6,
                   "selectedRegressionGroups": [2, 1, 2], "developerDir": os.environ["DEVELOPER_DIR"], "tools": tools,
                   "actualAquaSaveGate": "pending"}
          if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-preview":
              value.update({"scope": "normal-macos-early-preview", "fixedFixtureCases": 8, "aclPrimitiveCases": 0,
                            "selectedRegressionGroups": [], "instrumented": False, "applicationLaunched": False,
                            "fullUIQualified": False, "distributionQualified": False})
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 65536: raise ValueError("source/tool binding size refused")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          try:
              while data:
                  n = os.write(fd, data)
                  if not n: raise RuntimeError("write refused")
                  data = data[n:]
              os.fsync(fd)
          finally: os.close(fd)
          PY
      - name: Bind the complete reviewed first-party checkout before compilation
        id: source
        shell: bash
        run: &mrk_installed_source_inventory |
          set -euo pipefail
          set -o noclobber
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$MRK_MACOS_WORK/source-inventory.json" <<'PY_SOURCE'
          import hashlib, json, os, stat, subprocess, sys
          def git(*args):
              return subprocess.run(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null", *args], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15).stdout
          rows = git("ls-tree", "-r", "-z", "--full-tree", "HEAD").split(b"\0")
          if rows[-1] or len(rows) > 4096: raise ValueError("tracked inventory bound")
          files = []
          for row in rows[:-1]:
              header, raw_name = row.split(b"\t", 1)
              mode, kind, blob = header.split(b" ")
              name = raw_name.decode("utf-8", "strict")
              if kind != b"blob" or mode not in (b"100644", b"100755") or any(p in ("", ".", "..") for p in name.split("/")): raise ValueError("tracked inventory path/type")
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 32 * 1024 * 1024: raise ValueError("tracked input refused")
                  digest = hashlib.sha256()
                  blob_digest = hashlib.sha1(b"blob " + str(before.st_size).encode() + b"\0")
                  size = 0
                  while block := os.read(fd, 65536):
                      size += len(block)
                      if size > before.st_size: raise ValueError("tracked input grew")
                      digest.update(block)
                      blob_digest.update(block)
                  after = os.fstat(fd)
                  sig = lambda s: (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  if size != before.st_size or sig(before) != sig(after) or sig(after) != sig(os.stat(name, follow_symlinks=False)): raise ValueError("tracked input changed")
              finally:
                  os.close(fd)
              if blob_digest.hexdigest() != blob.decode() or bool(before.st_mode & 0o111) != (mode == b"100755"): raise ValueError("tracked blob or executable mode mismatch")
              files.append({"path": name, "gitMode": mode.decode(), "blob": blob.decode(), "size": size, "sha256": digest.hexdigest()})
          value = {"source": os.environ["GITHUB_SHA"], "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 2 * 1024 * 1024: raise ValueError("source inventory output bound")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
              stream.flush()
              os.fsync(stream.fileno())
          PY_SOURCE
      - name: Admit the fixed image Rust tools without installing a distribution
        timeout-minutes: 4
        shell: bash
        run: &mrk_installed_direct_rust |
          set -euo pipefail
          "$MRK_PYTHON" -I -S -B - <<'PY_DIRECT_RUST'
          import importlib.util, os, re, stat, subprocess, sys, tomllib
          from pathlib import Path

          checkout = Path('/Users/runner/work/mobile-release-kit/mobile-release-kit')
          home = Path('/Users/runner')
          cargo_home, rustup_home = home / '.cargo', home / '.rustup'
          build_target = os.environ['MRK_MACOS_TARGET']
          machines = {'aarch64-apple-darwin': 'arm64', 'x86_64-apple-darwin': 'x86_64'}
          if build_target not in machines: raise ValueError('direct-rust-target')
          rust_tuples = {
              "aarch64-apple-darwin": ("1.98.1", "48a229ceaefd4985c50990b14116b6d856af0985"),
              "x86_64-apple-darwin": ("1.98.0", "88d9e12ae178fab0fb5cc050a94da85685d449ea"),
          }
          rust_release, rust_commit = rust_tuples[build_target]
          bin_directory = rustup_home / ('toolchains/stable-' + build_target + '/bin')
          compiler_path = str(bin_directory) + ':/usr/bin:/bin:/usr/sbin:/sbin'
          def need(value, reason):
              if not value: raise ValueError(reason)
          need(sys.platform == 'darwin' and sys.maxsize == 2**63-1 and os.uname().machine == machines[build_target]
               and os.getuid() != 0 and os.getuid() == os.geteuid() and os.getgid() == os.getegid(), 'direct-rust-host')
          need(os.environ.get('HOME') == str(home) and os.environ.get('GITHUB_WORKSPACE') == str(checkout)
               and os.environ.get('RUSTUP_TOOLCHAIN') == rust_release
               and os.environ.get('CARGO_HOME', str(cargo_home)) == str(cargo_home)
               and os.environ.get('RUSTUP_HOME', str(rustup_home)) == str(rustup_home)
               and os.environ.get('RUSTC', str(bin_directory / 'rustc')) == str(bin_directory / 'rustc')
               and os.environ.get('RUSTUP_AUTO_INSTALL', '0') == '0', 'direct-rust-source-route')
          allowed_cargo = {'CARGO_HOME', 'CARGO_TARGET_DIR', 'CARGO_INCREMENTAL'}
          allowed_rust = {'RUSTC', 'RUSTUP_HOME', 'RUSTUP_TOOLCHAIN', 'RUSTUP_AUTO_INSTALL'}
          need(not any((key.startswith('CARGO_') and key not in allowed_cargo)
                       or (key.startswith('RUST') and key not in allowed_rust) for key in os.environ), 'direct-rust-ambient-selector')
          need(os.environ.get('CARGO_INCREMENTAL', '0') == '0'
               and os.environ.get('CARGO_TARGET_DIR') == str(Path(os.environ['MRK_MACOS_WORK']) / 'cargo-target'), 'direct-rust-target-route')
          cwd_names = ('desktop/src-tauri', 'desktop/native/macos-installed-native',
                       'desktop/helpers/macos-android-register', 'desktop/helpers/macos-desktop-image',
                       'desktop/helpers/macos-vault-helper')
          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
          originals, directories, absent, close_errors = [], {}, set(), []
          pending_call = False
          failure = None
          def signature(s):
              return (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink,
                      s.st_size, s.st_mtime_ns, s.st_ctime_ns)
          def current(row):
              need(row['fd'] is not None and row['identity'] is not None, 'direct-rust-original-unbound')
              parent = row['parent']
              named = os.stat(str(row['path']) if parent is None else row['path'].name,
                              dir_fd=None if parent is None else parent['fd'], follow_symlinks=False)
              width = len(row['identity'])
              need(signature(os.fstat(row['fd']))[:width] == row['identity']
                   == signature(named)[:width], 'direct-rust-original-changed')
          def directory(path):
              if path in directories:
                  current(directories[path]); return directories[path]
              need(path.is_absolute() and str(path) == os.path.normpath(path) and len(path.parts) <= 24
                   and len(originals) < 96, 'direct-rust-fixed-directory-bound')
              parent = None if path == Path('/') else directory(path.parent)
              need(len(originals) < 96, 'direct-rust-original-bound')
              fd = os.open(str(path) if parent is None else path.name, flags | os.O_DIRECTORY,
                           dir_fd=None if parent is None else parent['fd'])
              row = {'fd': fd, 'path': path, 'parent': parent, 'identity': None, 'closed': False}
              originals.append(row)
              info = os.fstat(fd)
              need(stat.S_ISDIR(info.st_mode) and info.st_uid in (0, os.getuid())
                   and not info.st_mode & 0o022, 'direct-rust-directory-policy')
              row['identity'] = signature(info)[:5]
              directories[path] = row
              current(row)
              return row
          def original_file(path, *, executable=False):
              parent = directory(path.parent)
              need(len(originals) < 96, 'direct-rust-original-bound')
              fd = os.open(path.name, flags, dir_fd=parent['fd'])
              row = {'fd': fd, 'path': path, 'parent': parent, 'identity': None, 'closed': False}
              originals.append(row)
              info = os.fstat(fd)
              need(stat.S_ISREG(info.st_mode) and info.st_uid in (0, os.getuid())
                   and not info.st_mode & 0o022 and info.st_nlink > 0
                   and (not executable or info.st_mode & 0o111), 'direct-rust-file-policy')
              row['identity'] = signature(info)
              current(row)
              return row
          def no_configuration():
              searched = {cargo_home}
              for name in cwd_names:
                  cwd = checkout / name
                  searched.update(parent / '.cargo' for parent in (cwd, *cwd.parents))
              need(len(searched) <= 32, 'direct-rust-configuration-bound')
              for path in sorted(searched):
                  parent = directory(path.parent)
                  try: info = os.stat(path.name, dir_fd=parent['fd'], follow_symlinks=False)
                  except FileNotFoundError:
                      need(path not in directories, 'direct-rust-configuration-disappeared')
                      absent.add(path); continue
                  need(path not in absent and stat.S_ISDIR(info.st_mode), 'direct-rust-configuration-directory')
                  held = directory(path)
                  for name in ('config', 'config.toml', 'credentials', 'credentials.toml'):
                      try: os.stat(name, dir_fd=held['fd'], follow_symlinks=False)
                      except FileNotFoundError: pass
                      else: raise ValueError('direct-rust-ambient-configuration')
          def check_originals():
              for row in originals: current(row)

          try:
              directory(cargo_home); directory(rustup_home); directory(bin_directory)
              selected = original_file(checkout / 'desktop/rust-toolchain.toml')
              size = selected['identity'][6]
              need(0 < size <= 4096, 'direct-rust-repository-default-bound')
              raw = os.pread(selected['fd'], size + 1, 0)
              need(len(raw) == size and os.pread(selected['fd'], 1, size) == b'', 'direct-rust-repository-default-read')
              current(selected)
              need(tomllib.loads(raw.decode('utf-8'))['toolchain']['channel'] == '1.98.0', 'direct-rust-repository-default')
              for tool in ('cargo', 'rustc'): original_file(bin_directory / tool, executable=True)
              no_configuration(); check_originals()
              spec = importlib.util.spec_from_file_location('_mrk_direct_rust_existing_owner_loader', checkout / 'desktop/tools/macos_aqua_qualification.py')
              qualification = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = qualification
              spec.loader.exec_module(qualification)
              owner = qualification.load_owner(checkout)
              environment = dict(PATH=compiler_path, HOME=str(home), CARGO_HOME=str(cargo_home), RUSTUP_HOME=str(rustup_home),
                                 RUSTC=str(bin_directory / 'rustc'), RUSTUP_TOOLCHAIN=rust_release, RUSTUP_AUTO_INSTALL='0',
                                 LANG='C', LC_ALL='C', TZ='UTC', DEVELOPER_DIR=os.environ['DEVELOPER_DIR'],
                                 MACOSX_DEPLOYMENT_TARGET=os.environ['MACOSX_DEPLOYMENT_TARGET'])
              for tool in ('rustc', 'cargo'):
                  no_configuration(); check_originals()
                  argv = [str(bin_directory / tool), '--version', '--verbose']
                  pending_call = True
                  result = owner.run_owned(argv, environ=environment, cwd=checkout / 'desktop/src-tauri',
                                           timeout=15, capture=True, text=False, output_limit=4096)
                  need(type(result) is subprocess.CompletedProcess and type(result.args) is list and result.args == argv
                       and type(result.returncode) is int and type(result.stdout) is bytes and type(result.stderr) is bytes
                       and len(result.stdout) + len(result.stderr) <= 4096, 'direct-rust-original-return')
                  pending_call = False  # Only this original complete return settles the command.
                  need(result.returncode == 0 and not result.stderr and result.stdout, 'direct-rust-version-return')
                  lines = result.stdout.decode('utf-8', 'strict').strip().splitlines()
                  need(lines[0].startswith(tool + ' ') and [line for line in lines if line.partition(':')[0].strip() == 'release'] == ['release: ' + rust_release]
                       and [line for line in lines if line.partition(':')[0].strip() == 'host'] == ['host: ' + build_target], 'direct-rust-version-host')
                  if tool == 'rustc':
                      need([line for line in lines if line.partition(':')[0].strip() == 'commit-hash'] == ['commit-hash: ' + rust_commit], 'direct-rust-clock-commit')
                  no_configuration(); check_originals()
          except BaseException as error:
              failure = error
          finally:
              # No second query or manual retirement after an unreturned original. The
              # original Python process's kernel exit releases retained read-only FDs.
              if not pending_call:
                  for row in reversed(originals):
                      fd, row['fd'] = row['fd'], None  # One consuming close, never retry.
                      if fd is None: continue
                      try: os.close(fd); row['closed'] = True
                      except OSError: close_errors.append('direct-rust-close-unknown')
          if failure is not None or pending_call or close_errors or not all(row['closed'] for row in originals):
              raise SystemExit('Fixed direct Rust admission refused; no toolchain install or fallback.')
          print('Fixed direct Rust' + rust_release + ' compiler and Cargo admitted; no distribution install performed.')
          PY_DIRECT_RUST
      - name: Admit only a fresh independently pinned Python transport destination
