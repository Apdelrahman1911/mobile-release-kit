                       and hashlib.sha1(b'blob ' + str(len(body)).encode() + b'\0' + body).hexdigest() == row.get('blob'),
                       'ui-source-original')
                  return body
              modules = []
              for name, relative in (('mrk_android_ui_normal', 'desktop/tools/macos_normal_ui_runner.py'),
