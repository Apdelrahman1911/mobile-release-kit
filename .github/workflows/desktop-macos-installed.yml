      - name: Exercise one ordinary unsigned iOS archive and normal Quit
        id: normal_ios_ui_test
        if: github.ref == 'refs/heads/verify/desktop-macos-installed' && env.MRK_MACOS_IOS_UI_SCOPE == 'ios-unsigned-archive' && env.MRK_MACOS_ANDROID_UI_SCOPE == 'disabled' && env.MRK_MACOS_SAVED_FILE_UI_SCOPE == 'ordinary-seven' && steps.normal_ui_build.outcome == 'success' && steps.package_install.outcome == 'success'
        timeout-minutes: 22
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          set +x
          set +a
          set -euo pipefail
          set -o noclobber
          umask 077
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$MRK_MACOS_IOS_UI_SCOPE" == ios-unsigned-archive ]] || exit 1
          [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_SHA" == "$MRK_EXPECTED_SHA" ]] || exit 1
          [[ "$MRK_MACOS_WORK" =~ ^/Users/runner/work/_temp/mrk-macos-installed\.[A-Za-z0-9]{8}$ ]] || exit 1
          # Actual same-job installed producer and fresh external-runner originals
          # are required above. No engineering app, signing substitute, SDK
          # download, test key or product operation is introduced by this wrapper.
          ulimit -f 1048576
          set +e
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/Users/runner USER=runner LOGNAME=runner \
            "TMPDIR=$MRK_MACOS_WORK/normal-ui/tmp/" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 TZ=UTC \
            "DEVELOPER_DIR=$DEVELOPER_DIR" "TEST_RUNNER_MRK_NORMAL_UI_HOSTED_JOB=$MRK_MACOS_HOSTED_JOB" \
            "TEST_RUNNER_MRK_NORMAL_UI_APPLICATION_SOURCE=$GITHUB_SHA" "TEST_RUNNER_MRK_NORMAL_UI_HARNESS_SOURCE=$GITHUB_SHA" \
            "$MRK_PYTHON" -I -S -B desktop/tools/macos_normal_ui_runner.py --target "$MRK_MACOS_TARGET" --normal-ios-unsigned-archive-test \
            > "$MRK_MACOS_WORK/normal-ui/ios-unsigned-archive-test.log" 2>&1
          ios_test_status=$?
          printf '%s\n' "$ios_test_status" > "$MRK_MACOS_WORK/normal-ui/ios-unsigned-archive-test.status"
          ios_test_status_saved=$?
          set -e
          if [[ "$ios_test_status" != 0 ]]; then exit "$ios_test_status"; fi
          [[ "$ios_test_status_saved" == 0 ]] || exit 1
          # One900s case /1020s original /1245s phase; success observation must
          # latch by750s. The same original reserve is for failure/cancel/close,
          # not a replacement Start. Raw log, xcresult and archive stay PRIVATE.

