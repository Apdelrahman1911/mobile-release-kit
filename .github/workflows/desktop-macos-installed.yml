                          or type(row["size"]) is not int or not 0 <= row["size"] <= 32 * 1024 * 1024
                          or type(row["sha256"]) is not str or re.fullmatch(r"[0-9a-f]{64}", row["sha256"]) is None
                          or type(row["blob"]) is not str or re.fullmatch(r"[0-9a-f]{40}", row["blob"]) is None):
