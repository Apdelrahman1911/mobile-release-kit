name: Desktop Mac Android helper diagnostic only (not application qualification)

# Temporary diagnostic branch composition only. Restore the canonical installed
# workflow when composing product changes; this is not an app delivery gate.
on:
  push:
    branches: [verify/desktop-macos-preview]

permissions:
  contents: read

concurrency:
  group: desktop-macos-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helper-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-preview'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit the actual fixed hosted helper-only source route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]] || exit 1
          [[ "$(/usr/bin/uname -m)" == arm64 && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]] || exit 1
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
      - name: Check out this exact source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the same pinned Apple compiler
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin --no-self-update
          rustc --version --verbose
      - name: Select the same DATA driver Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Reserve one fresh helper work directory
        id: work
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\n' "$root" "$MRK_PYTHON" >> "$GITHUB_ENV"
      - name: Bind the complete source and actual selected tool versions
        id: source
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git -c core.fsmonitor=false rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          "$MRK_PYTHON" -I -S -B - <<'PY_BIND'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE'])
          work = Path(os.environ['MRK_MACOS_WORK'])
          def command(argv):
              result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=15)
              if len(result.stdout) + len(result.stderr) > 2 * 1024 * 1024: raise ValueError('command-output-bound')
              return result.stdout
          def git(*args):
              return command(['git', '-c', 'core.fsmonitor=false', '-c', 'core.hooksPath=/dev/null', *args])
          if (source / '.git/HEAD').read_bytes() != (os.environ['GITHUB_SHA'] + '\n').encode('ascii'): raise ValueError('detached-source-required')
          rows = git('ls-tree', '-r', '-z', '--full-tree', 'HEAD').split(b'\0')
          if rows[-1] or not 1 < len(rows) <= 4096: raise ValueError('source-count')
          files = []
          signature = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_nlink, s.st_uid, s.st_gid, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
          for row in rows[:-1]:
              header, raw_name = row.split(b'\t', 1)
              mode, kind, blob = header.split(b' ')
              name = raw_name.decode('utf-8', 'strict')
              if kind != b'blob' or mode not in (b'100644', b'100755') or any(p in ('', '.', '..') for p in name.split('/')): raise ValueError('source-path-type')
              fd = os.open(source / name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 32 * 1024 * 1024: raise ValueError('source-file-bound')
                  sha = hashlib.sha256()
                  obj = hashlib.sha1(b'blob ' + str(before.st_size).encode() + b'\0')
                  size = 0
                  while block := os.read(fd, 65536):
                      size += len(block)
                      if size > before.st_size: raise ValueError('source-grew')
                      sha.update(block); obj.update(block)
                  if size != before.st_size or signature(before) != signature(os.fstat(fd)) or signature(before) != signature((source / name).lstat()): raise ValueError('source-changed')
              finally:
                  os.close(fd)
              if obj.hexdigest() != blob.decode('ascii') or bool(before.st_mode & 0o111) != (mode == b'100755'): raise ValueError('source-git-identity')
              files.append({'path': name, 'bytes': size, 'sha256': sha.hexdigest(), 'gitMode': mode.decode('ascii'), 'original': signature(before)})
          versions = {name: command(argv).decode('utf-8', 'strict').strip() for name, argv in (
              ('rust', ['rustc', '--version', '--verbose']), ('cargo', ['cargo', '--version']),
              ('python', [os.environ['MRK_PYTHON'], '-I', '-S', '-B', '--version']),
              ('sdk', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version']))}
          if any(len(value) > 4096 for value in versions.values()): raise ValueError('version-bound')
          work_info = work.lstat()
          value = {'schemaVersion': 1, 'scope': 'helper-only-diagnostic-not-app-qualification',
                   'source': os.environ['GITHUB_SHA'], 'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                   'workflowSource': os.environ['GITHUB_WORKFLOW_SHA'], 'workflow': os.environ['GITHUB_WORKFLOW_REF'],
                   'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'files': files, 'versions': versions, 'appBuilt': False, 'serviceRegistered': False,
                   'workIdentity': [work_info.st_dev, work_info.st_ino, work_info.st_mode, work_info.st_uid, work_info.st_gid]}
          body = (json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n').encode()
          if len(body) > 2 * 1024 * 1024: raise ValueError('source-binding-bound')
          fd = os.open(work / 'source-binding.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(body); stream.flush(); os.fsync(stream.fileno())
          PY_BIND
      - name: Run only the genuine separate helper compiler and signature owner
        id: helper
        timeout-minutes: 10
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -uo pipefail
          set -o noclobber
          umask 077
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_android_helper_package.py prepare > "$MRK_MACOS_WORK/helper-entry.stdout" 2> "$MRK_MACOS_WORK/helper-entry.stderr"
          status=$?
          printf '%s\n' "$status" > "$MRK_MACOS_WORK/helper-entry.status" || exit 125
          exit "$status"
      - name: Recheck original source and preserve only bounded helper diagnostics
        id: evidence
        if: always() && steps.source.outcome == 'success' && steps.work.outputs.root != ''
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$MRK_PYTHON" -I -S -B - <<'PY_EVIDENCE'
          import hashlib, json, os, stat
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE']); work = Path(os.environ['MRK_MACOS_WORK'])
          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK
          signature = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_nlink, s.st_uid, s.st_gid, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
          def read(path, limit):
              fd = os.open(path, flags)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or not 0 <= before.st_size <= limit: raise ValueError('evidence-file-bound')
                  parts, used = [], 0
                  while part := os.read(fd, 65536):
                      used += len(part)
                      if used > before.st_size: raise ValueError('evidence-grew')
                      parts.append(part)
                  if used != before.st_size or signature(before) != signature(os.fstat(fd)) or signature(before) != signature(path.lstat()): raise ValueError('evidence-changed')
                  return b''.join(parts), before
              finally: os.close(fd)
          binding, _ = read(work / 'source-binding.json', 2 * 1024 * 1024)
          before = json.loads(binding)
          work_info = work.lstat()
          if [work_info.st_dev, work_info.st_ino, work_info.st_mode, work_info.st_uid, work_info.st_gid] != before['workIdentity']: raise ValueError('work-directory-original')
          source_ok = True
          for row in before['files']:
              try:
                  body, info = read(source / row['path'], 32 * 1024 * 1024)
                  source_ok &= list(signature(info)) == row['original'] and len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256']
              except (OSError, ValueError):
                  source_ok = False  # Preserve original diagnostics, then fail this postcheck.
          output = work / 'helper-evidence'; output.mkdir(mode=0o700)
          limits = {'source-binding.json': 2 * 1024 * 1024, 'android-helper-prepare.json': 65536,
                    'helper-entry.stdout': 1024, 'helper-entry.stderr': 1024, 'helper-entry.status': 16,
                    'android-helper-build.jsonl': 4 * 1024 * 1024, 'android-helper-build.stderr': 4 * 1024 * 1024,
                    'android-helper-build.status': 16, 'android-helper-sign.stdout': 65536,
                    'android-helper-sign.stderr': 65536, 'android-helper-sign.status': 16,
                    'android-helper-verify-signed.stdout': 65536, 'android-helper-verify-signed.stderr': 65536,
                    'android-helper-verify-signed.status': 16}
          records, absent, total = [], [], 0
          for name, limit in limits.items():
              try: body, _ = read(work / name, limit)
              except FileNotFoundError:
                  absent.append(name); continue
              total += len(body)
              if total > 11 * 1024 * 1024: raise ValueError('evidence-aggregate-bound')
              fd = os.open(output / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(body); stream.flush(); os.fsync(stream.fileno())
              records.append({'path': name, 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()})
          value = {'scope': 'helper-only-diagnostic-not-app-qualification', 'source': os.environ['GITHUB_SHA'],
                   'sourceOriginalsUnchanged': source_ok, 'files': records, 'absent': absent,
                   'absentIsNotEmptyOrCompleted': True, 'oldUnknownFinalityUnchanged': True,
                   'runnerTeardownIsNotNativeFinality': True, 'appBuilt': False, 'serviceRegistered': False}
          body = (json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n').encode()
          fd = os.open(output / 'evidence-inventory.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(body); stream.flush(); os.fsync(stream.fileno())
          if not source_ok: raise ValueError('source-postcheck-failed')
          PY_EVIDENCE
      - name: Preserve the bounded diagnostic evidence, never an application pass
        if: always() && steps.work.outputs.root != '' && steps.source.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-android-helper-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.work.outputs.root }}/helper-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # The helper itself immediately retires only its known-complete target.
      # Never remove or stop unknown compiler originals. Hosted teardown is not
      # proof of native finality; the original helper receipt stays authoritative.
      # No frontend/runtime acquisition, app/package/Installer/XCTest, service
      # registration, Store operation, public release or product delivery occurs.
