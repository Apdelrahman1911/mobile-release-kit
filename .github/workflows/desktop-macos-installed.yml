      # Do not start a payload build, host scan, notice-only task, service,
      # publication of a release, Store workflow, or synthetic GUI success here.
      # The focused real Aqua/Save procedure and separate command/result gates
      # are in desktop/packaging/macos-installed.md.
      - name: Remove only this completed preview build's disposable compiler outputs
        if: always() && steps.preview_upload.outcome == 'success' && steps.normal_ui_result.outcome == 'success' && steps.normal_persistence_ui_result.outcome == 'success' && steps.normal_project_ui_result.outcome == 'success' && steps.normal_diagnostics_ui_result.outcome == 'success' && ((env.MRK_MACOS_SAVED_FILE_UI_SCOPE == 'ordinary-seven' && steps.normal_saved_checks_ui_result.outcome == 'success') || (env.MRK_MACOS_SAVED_FILE_UI_SCOPE == 'saved-version-recovery' && steps.normal_saved_version_recovery_ui_result.outcome == 'success')) && steps.data_contracts.outcome == 'success' && steps.evidence.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # Original build, DATA/Python, Installer, XCTest and result commands returned successfully.
          # The normal app reached notRunning through its genuine Quit action; this is
          # not proof of every macOS service/worker's finality. Never stop shared services.
          # Retain package/evidence and protected installation; never touch shared caches.
          "$MRK_PYTHON" -I -S -B - <<'PY_CLEAN'
          import json, os, shutil, stat
          from pathlib import Path
          root = Path(os.environ["MRK_MACOS_WORK"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          if root.parent != Path("/Users/runner/work/_temp") or not root.name.startswith("mrk-macos-installed.") or workspace != Path("/Users/runner/work/mobile-release-kit/mobile-release-kit"):
              raise ValueError("task cleanup route refused")
          fd = os.open(root / "source-binding.json", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size > 65536:
                  raise ValueError("task cleanup binding refused")
              data = os.read(fd, 65537)
              if len(data) != info.st_size: raise ValueError("task cleanup binding incomplete")
              binding = json.loads(data)
          finally:
              os.close(fd)
          original = binding["workDirectory"]
          current = os.lstat(root)
          if (not stat.S_ISDIR(current.st_mode) or current.st_uid != os.getuid() or os.getuid() == 0
                  or [current.st_dev, current.st_ino, current.st_uid] != original
                  or binding["source"] != os.environ["GITHUB_SHA"]
                  or binding["frontendAbsentAtAdmission"] is not True or not shutil.rmtree.avoids_symlink_attacks):
              raise ValueError("task cleanup original refused")
          scope = os.environ["MRK_MACOS_SAVED_FILE_UI_SCOPE"]
          if scope not in ("ordinary-seven", "saved-version-recovery"):
              raise ValueError("task cleanup SOURCE scope refused")
          test_stem, summary_stem = (("saved-checks-test", "saved-checks-summary") if scope == "ordinary-seven"
                                    else ("saved-version-recovery-test", "saved-version-recovery-summary"))
          # The skipped cohort supplies no finality or cleanup authority.
          saved_directory = root / ("normal-ui/" + test_stem + ".xcresult")
          saved_logs = (test_stem + ".log", summary_stem + ".raw.json", summary_stem + ".stderr")
          for path in (root / "cargo-target", root / "vault-helper-target", root / "remover-target", root / "npm-cache", workspace / "desktop/node_modules", workspace / "desktop/dist",
                       root / "normal-ui/DerivedData", root / "normal-ui/test.xcresult", root / "normal-ui/persistence-test.xcresult", root / "normal-ui/project-test.xcresult", root / "normal-ui/diagnostics-test.xcresult", saved_directory, root / "normal-ui/tmp",
                       root / "data-contracts/tmp"):
              try: selected = os.lstat(path)
              except FileNotFoundError: continue
              if not stat.S_ISDIR(selected.st_mode) or selected.st_uid != os.getuid() or selected.st_dev != current.st_dev:
                  raise ValueError("task cleanup output refused")
              shutil.rmtree(path)
          for name in ("build.log", "test.log", "summary.raw.json", "summary.stderr",
                       "persistence-test.log", "persistence-summary.raw.json", "persistence-summary.stderr",
                       "project-test.log", "project-summary.raw.json", "project-summary.stderr",
                       "diagnostics-test.log", "diagnostics-summary.raw.json", "diagnostics-summary.stderr",
                       *saved_logs):
              path = root / "normal-ui" / name
              try: selected = os.lstat(path)
              except FileNotFoundError: continue
              if not stat.S_ISREG(selected.st_mode) or selected.st_uid != os.getuid() or selected.st_nlink != 1 or selected.st_dev != current.st_dev:
                  raise ValueError("task cleanup closed log refused")
              os.unlink(path)
          PY_CLEAN

  # Compile the real shipping graph only: no signing environment, installed app,
  # supplier receipt, launch, package or Store operation. Independent of the
  # configured installed/preview engineering job above.
  shipping-image-compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-image-compile'
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MRK_MACOS_TARGET: aarch64-apple-darwin
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_HOME: /Users/runner/.cargo
      RUSTUP_HOME: /Users/runner/.rustup
      CARGO_INCREMENTAL: '0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - name: Check out only the compile job's exact current SOURCE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the existing public hosted Python for compile control
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - name: Select the fixed Node frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Admit the exact nonroot ARM compile-only route and fresh work
        id: compile_work
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set +a
          umask 077
          git config --local core.autocrlf false
          python3 -I -S -B - <<'PY_SHIPPING_COMPILE_ADMIT'
          import json, os, platform, re, stat, sys, tempfile
          from pathlib import Path


          def need(value, reason):
              if not value: raise ValueError(reason)


          source = os.environ['GITHUB_SHA']
          checkout = Path('/Users/runner/work/mobile-release-kit/mobile-release-kit')
          ref = 'refs/heads/verify/desktop-macos-image-compile'
          need(sys.platform == 'darwin' and sys.maxsize == 2**63 - 1 and platform.machine() == 'arm64'
               and platform.mac_ver()[0].startswith('26.') and os.getuid() != 0
               and os.getuid() == os.geteuid() and os.getgid() == os.getegid(), 'shipping-compile-host')
          need(re.fullmatch(r'[0-9a-f]{40}', source) and source != '0' * 40, 'shipping-compile-source')
          expected = dict(GITHUB_ACTIONS='true', RUNNER_ENVIRONMENT='github-hosted', RUNNER_OS='macOS', RUNNER_ARCH='ARM64',
                          GITHUB_EVENT_NAME='push', GITHUB_REPOSITORY='Apdelrahman1911/mobile-release-kit', GITHUB_REF=ref,
                          GITHUB_WORKFLOW_REF='Apdelrahman1911/mobile-release-kit/.github/workflows/desktop-macos-installed.yml@' + ref,
                          GITHUB_WORKFLOW_SHA=source, GITHUB_WORKSPACE=str(checkout), RUNNER_TEMP='/Users/runner/work/_temp',
                          MRK_MACOS_TARGET='aarch64-apple-darwin', RUSTUP_TOOLCHAIN='1.98.1', HOME='/Users/runner',
                          DEVELOPER_DIR='/Library/Developer/CommandLineTools', MACOSX_DEPLOYMENT_TARGET='26.0')
          need(all(os.environ.get(name) == value for name, value in expected.items()), 'shipping-compile-route')
          need(all(re.fullmatch(r'[1-9][0-9]{0,19}', os.environ[name]) for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')), 'shipping-compile-run')
          need(Path(os.environ['DEVELOPER_DIR']).is_dir(), 'shipping-compile-clt')
          for name in ('node_modules', 'dist'):
              try: (checkout / 'desktop' / name).lstat()
              except FileNotFoundError: pass
              else: raise ValueError('shipping-compile-existing-frontend')
          os.umask(0o077)
          work = Path(tempfile.mkdtemp(prefix='mrk-macos-image-compile.', dir='/Users/runner/work/_temp'))
          info = work.lstat()
          need(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700 and info.st_uid == os.getuid(), 'shipping-compile-original-work')
          binding = dict(schemaVersion=1, source=source, workflowSource=source,
                         runId=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         workDirectory=[info.st_dev, info.st_ino, info.st_uid], frontendAbsentAtAdmission=True)
          fd = os.open(work / 'compile-binding.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          try:
              with os.fdopen(fd, 'wb', closefd=False) as stream:
                  raw = (json.dumps(binding, sort_keys=True, separators=(',', ':')) + '\n').encode('ascii')
                  need(stream.write(raw) == len(raw), 'shipping-compile-binding-write')
                  stream.flush(); os.fsync(stream.fileno())
          finally:
              os.close(fd)
          python = str(Path(sys.executable).resolve(strict=True))
          need('\n' not in python and '\n' not in str(work), 'shipping-compile-path')
          # Existing Actions command files, not a reusable input or compilation permit.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('MRK_MACOS_WORK=' + str(work) + '\nMRK_PYTHON=' + python + '\nCARGO_TARGET_DIR=' + str(work / 'cargo-target') + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('root=' + str(work) + '\n')
          PY_SHIPPING_COMPILE_ADMIT
      - name: Bind compile-only SOURCE with the unchanged installed source inventory
