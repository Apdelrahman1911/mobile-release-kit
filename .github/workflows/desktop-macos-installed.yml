                       ('workflow', 'GITHUB_WORKFLOW_REF'), ('runId', 'GITHUB_RUN_ID'), ('runAttempt', 'GITHUB_RUN_ATTEMPT')))
                   and owner.get('imageSourceCommit') == source and owner.get('imageReleaseId') == release['release']
