              if (len(data) != before.st_size - offset or identity(before) != identity(os.fstat(fd))
                      or identity(before) != identity(os.stat(path, follow_symlinks=False))):
                  raise ValueError("fixed UI diagnostic log changed")
          finally: os.close(fd)
