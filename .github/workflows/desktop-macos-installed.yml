            cd desktop/src-tauri || exit
            PATH="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            RUSTC="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/rustc" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            CARGO_TARGET_DIR="$MRK_MACOS_WORK/xcode-setup-target" \
              /usr/bin/env -u MRK_MACOS_INSTALL_INVENTORY_SHA256 -u MRK_MACOS_STORE_RUNTIME \
              "/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/cargo" build \
                --locked --release --no-default-features --features macos-xcode-setup \
                --target "$MRK_MACOS_TARGET" --bin mrk-macos-xcode-setup
          )
          build_status=$?
          printf '%s\n' "$build_status" > "$MRK_MACOS_WORK/xcode-setup-build.status"
          status_saved=$?
          set -e
          if [[ "$build_status" != 0 ]]; then
            printf 'Fixed Xcode setup compile failed with original status %s; see the compiler diagnostics above.\n' "$build_status" >&2 || :
            exit "$build_status"
          fi
          [[ "$status_saved" == 0 ]] || exit "$status_saved"
      - name: Sign only the completed fixed Xcode setup with the Application identity
        id: xcode_setup_sign
        if: steps.xcode_setup_build.outcome == 'success'
        timeout-minutes: 4
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          set -euo pipefail
          set -o noclobber
          umask 077
          set +e
          result=$(MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
          CARGO_TARGET_DIR="$MRK_MACOS_WORK/xcode-setup-target" \
            /usr/bin/env -u MRK_MACOS_STORE_RUNTIME "$MRK_PYTHON" -I -S -B \
              desktop/tools/macos_android_helper_package.py sign-xcode-setup --target "$MRK_MACOS_TARGET")
          sign_status=$?
          printf '%s\n' "$sign_status" > "$MRK_MACOS_WORK/xcode-setup-sign.status"
          status_saved=$?
          unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          set -e
          if [[ "$sign_status" != 0 ]]; then exit "$sign_status"; fi
          [[ "$status_saved" == 0 ]] || exit "$status_saved"
          [[ "$result" =~ ^sha256=[0-9a-f]{64}$ ]] || exit 1
          # This digest is the original completed signer result, not a reopened
          # file hash that could falsely stand in for signing/close success.
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Finalize only the standalone Prepare Xcode companion package
        id: xcode_setup_finalize
        if: steps.xcode_setup_sign.outcome == 'success'
        timeout-minutes: 32
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_XCODE_SETUP_SHA256: ${{ steps.xcode_setup_sign.outputs.sha256 }}
          MRK_MACOS_INSTALLER_P12_BASE64: ${{ secrets.MRK_MACOS_INSTALLER_P12_BASE64 }}
          MRK_MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MRK_MACOS_INSTALLER_P12_PASSWORD }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_INSTALLER_P12_BASE64 MRK_MACOS_INSTALLER_P12_PASSWORD MRK_MACOS_NOTARY_API_KEY_BASE64
          set -euo pipefail
          set -o noclobber
          umask 077
          # Same C2 original14 roles and1740/1800 endpoints. Installer context
          # closes before notary; no Application credential or Store runtime.
          set +e
          MRK_MACOS_INSTALLER_P12_BASE64="$MRK_MACOS_INSTALLER_P12_BASE64" \
          MRK_MACOS_INSTALLER_P12_PASSWORD="$MRK_MACOS_INSTALLER_P12_PASSWORD" \
          MRK_MACOS_NOTARY_API_KEY_BASE64="$MRK_MACOS_NOTARY_API_KEY_BASE64" \
            /usr/bin/env -u MRK_MACOS_STORE_RUNTIME "$MRK_PYTHON" -I -S -B \
              desktop/tools/macos_android_helper_package.py finalize-xcode-setup-package --target "$MRK_MACOS_TARGET" \
              > "$MRK_MACOS_WORK/xcode-setup-finalization.stdout"
          finalization_status=$?
          printf '%s\n' "$finalization_status" > "$MRK_MACOS_WORK/xcode-setup-finalization.status"
          status_saved=$?
          unset MRK_MACOS_INSTALLER_P12_BASE64 MRK_MACOS_INSTALLER_P12_PASSWORD MRK_MACOS_NOTARY_API_KEY_BASE64
          set -e
          if [[ "$finalization_status" != 0 ]]; then exit "$finalization_status"; fi
          [[ "$status_saved" == 0 ]] || exit "$status_saved"
      - name: Retain only the finalized standalone Xcode companion and closed public facts
        id: xcode_setup_upload
        if: steps.xcode_setup_finalize.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-kit-macos26-${{ inputs.target }}-xcode-setup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.work.outputs.root }}/xcode-setup-final/Prepare Xcode.pkg
            ${{ steps.work.outputs.root }}/android-helper-finalize-xcode-setup-package.json
            ${{ steps.work.outputs.root }}/xcode-setup-finalization.status
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retire only the completed standalone compiler outputs
        id: xcode_setup_compiler_retire
        if: steps.xcode_setup_finalize.outcome == 'success' && steps.xcode_setup_upload.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          "$MRK_PYTHON" -I -S -B - <<'PY_SETUP_COMPILER_CLEAN'
          import os, re, shutil, stat
          from pathlib import Path
          root = Path(os.environ['MRK_MACOS_WORK'])
          assert root.parent == Path('/Users/runner/work/_temp') and re.fullmatch(r'mrk-macos-installed\.[A-Za-z0-9]{8}', root.name)
          assert shutil.rmtree.avoids_symlink_attacks
          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_DIRECTORY
          fd = os.open(root, flags)
          try:
              info = os.fstat(fd)
              named = root.lstat()
              sig = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid)
              assert sig(info) == sig(named) and info.st_uid == os.getuid() != 0 and stat.S_IMODE(info.st_mode) == 0o700
              for name in ('xcode-setup-build.status', 'xcode-setup-sign.status', 'xcode-setup-finalization.status'):
                  status = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC, dir_fd=fd)
                  try:
                      before = os.fstat(status)
                      assert stat.S_ISREG(before.st_mode) and stat.S_IMODE(before.st_mode) == 0o600 and before.st_uid == os.getuid() and before.st_nlink == 1 and before.st_size == 2
                      stable = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      assert os.read(status, 3) == b'0\n' and stable(before) == stable(os.fstat(status))
                  finally:
                      os.close(status)
              current = os.stat('xcode-setup-target', dir_fd=fd, follow_symlinks=False)
              assert stat.S_ISDIR(current.st_mode) and current.st_uid == os.getuid() and current.st_dev == info.st_dev
              shutil.rmtree('xcode-setup-target', dir_fd=fd)
              assert sig(os.fstat(fd)) == sig(root.lstat()) == sig(info)
              try: os.stat('xcode-setup-target', dir_fd=fd, follow_symlinks=False)
              except FileNotFoundError: pass
              else: raise ValueError('setup compiler retirement incomplete')
          finally:
              os.close(fd)
          # Retain all signed setup-inputs, final package and original statuses
          # for verification; no main binding or main artifact is fabricated.
          PY_SETUP_COMPILER_CLEAN
      - name: Qualify the same standalone setup package through first install and repeat
        id: xcode_setup_verify
        if: steps.xcode_setup_upload.outcome == 'success' && steps.xcode_setup_compiler_retire.outcome == 'success'
        timeout-minutes: 85
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_XCODE_SETUP_SHA256: ${{ steps.xcode_setup_sign.outputs.sha256 }}
        run: |
          set +x
          set +a
          set -euo pipefail
          set -o noclobber
          umask 077
          # No signing credentials. This phase uses the same retained C2 inputs,
          # not the retired Cargo tree or a downloaded self-authorizing receipt.
          set +e
          /usr/bin/env -u MRK_MACOS_STORE_RUNTIME "$MRK_PYTHON" -I -S -B \
            desktop/tools/macos_android_helper_package.py verify-xcode-setup-package --target "$MRK_MACOS_TARGET" \
            > "$MRK_MACOS_WORK/xcode-setup-verification.stdout"
          verification_status=$?
          printf '%s\n' "$verification_status" > "$MRK_MACOS_WORK/xcode-setup-verification.status"
          status_saved=$?
          set -e
          if [[ "$verification_status" != 0 ]]; then exit "$verification_status"; fi
          [[ "$status_saved" == 0 ]] || exit "$status_saved"
      - name: Check actual app-native managed Xcode admission on this qualified VM
        id: xcode_setup_native_admission
        if: steps.xcode_setup_verify.outcome == 'success' && steps.xcode_setup_native_compile.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: /bin/bash desktop/tools/macos_xcode_native_admission.sh verify
      - name: Retain bounded standalone setup qualification facts, never Installer transcripts
        if: always() && steps.xcode_setup_verify.outcome != 'skipped'
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-kit-macos26-${{ inputs.target }}-xcode-setup-check-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.work.outputs.root }}/android-helper-verify-xcode-setup-package.json
            ${{ steps.work.outputs.root }}/xcode-setup-verification.status
          if-no-files-found: error
          retention-days: 7

  prepared-install:
    needs: engineering-install
    if: always() && github.ref == 'refs/heads/verify/desktop-macos-candidate' && ((github.event_name == 'push' && needs.engineering-install.outputs['prepared-input-ready'] == 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'prepared-install'))
    environment: macos-developer-id
    name: prepared-installed-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.target == 'aarch64-apple-darwin' && '[{"target":"aarch64-apple-darwin","runner":"macos-26","machine":"arm64","hosted_job":"github-hosted-macos26-arm64"}]' || '[{"target":"x86_64-apple-darwin","runner":"macos-26-intel","machine":"x86_64","hosted_job":"github-hosted-macos26-x86_64"}]') || '[{"target":"aarch64-apple-darwin","runner":"macos-26","machine":"arm64","hosted_job":"github-hosted-macos26-arm64"}]') }}
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJSON('{"aarch64-apple-darwin":"1.98.1","x86_64-apple-darwin":"1.98.0"}')[matrix.target] }}
      MRK_MACOS_TARGET: ${{ matrix.target }}
      MRK_MACOS_RUNNER: ${{ matrix.runner }}
      MRK_MACOS_MACHINE: ${{ matrix.machine }}
      MRK_MACOS_HOSTED_JOB: ${{ matrix.hosted_job }}
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      MRK_MACOS_PACKAGE_ROLE: ordinary-image
      MRK_MACOS_STORE_RUNTIME: signed-component
      MRK_MACOS_SAME_PACKAGE_SCOPE: disabled
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only the disposable hosted prepared-input route
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$GITHUB_REF" == refs/heads/verify/desktop-macos-candidate ]] || exit 1
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
          case "$MRK_MACOS_TARGET/$RUNNER_ARCH/$(/usr/bin/uname -m)" in
            aarch64-apple-darwin/ARM64/arm64|x86_64-apple-darwin/X64/x86_64) ;;
            *) exit 1 ;;
          esac
          [[ "$(/usr/bin/id -u)" != 0 && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
      - name: Check out the exact current harness source without credentials
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select DATA Python, never the packaged interpreter
        id: python
        timeout-minutes: 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Reserve one fresh consumer work directory
        id: work
        timeout-minutes: 1
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
          [[ "$(/usr/bin/git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          tree=$(/usr/bin/git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nMRK_CONSUMER_TREE=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$tree" "$root" >> "$GITHUB_ENV"
      - name: Select the one closed upstream target checkpoint without matrix output ambiguity
        id: prepared
        timeout-minutes: 4
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PRODUCER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_source || github.sha }}
          PRODUCER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_run || github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          ulimit -c 0
          [[ "$PRODUCER_SOURCE" =~ ^[0-9a-f]{40}$ && "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          fetch() { (ulimit -f 16384; gh api "$1" > "$2"); }
          fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/jobs?filter=all&per_page=100" "$MRK_MACOS_WORK/prepared-jobs.json"
          fetch "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/artifacts?per_page=100" "$MRK_MACOS_WORK/prepared-artifacts.json"
          fetch "repos/$GITHUB_REPOSITORY/git/commits/$PRODUCER_SOURCE" "$MRK_MACOS_WORK/prepared-commit.json"
          printf '0\n' > "$MRK_MACOS_WORK/prepared-api.status"
          unset GH_TOKEN
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py select --target "$MRK_MACOS_TARGET" \
            --producer-source "$PRODUCER_SOURCE" --producer-run "$PRODUCER_RUN" > "$MRK_MACOS_WORK/prepared-selection.txt"
          /bin/cat "$MRK_MACOS_WORK/prepared-selection.txt" >> "$GITHUB_OUTPUT"
      - name: Capture the exact selected producer attempt, not the current rerun attempt
        timeout-minutes: 2
        shell: bash
        env:
          PRODUCER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_run || github.run_id }}
          PRODUCER_ATTEMPT: ${{ steps.prepared.outputs.producer-attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          (ulimit -f 16384; gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/attempts/$PRODUCER_ATTEMPT" > "$MRK_MACOS_WORK/prepared-service/run.json")
          printf '0\n' > "$MRK_MACOS_WORK/prepared-service/metadata.status"
      - name: Download only the selected prepared artifact with service digest verification
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.prepared.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: Apdelrahman1911/mobile-release-kit
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_run || github.run_id }}
          path: ${{ steps.work.outputs.root }}/prepared-input
          merge-multiple: true
          digest-mismatch: error
          skip-decompress: 'false'
      - name: Check out the authentic built source separately for diagnostic-only retry
        if: github.event_name == 'workflow_dispatch' && steps.prepared.outputs.producer-source != github.sha
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepared.outputs.producer-source }}
          path: prepared-built-source
          persist-credentials: false
      - name: Reconstruct fresh script originals and repeat full finalized product audit
        timeout-minutes: 5
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          ulimit -c 0
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py hydrate --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE"
      - name: Install and verify only the pinned producer toolchain
        timeout-minutes: 8
        shell: bash
        run: *mrk_installed_direct_rust
      - name: Fetch only the exact producer source dependencies before its unchanged offline build
        timeout-minutes: 8
        shell: bash
        env:
          BUILT_SOURCE: ${{ steps.prepared.outputs.producer-source }}
        run: |
          set -euo pipefail
          checkout="$GITHUB_WORKSPACE"
          if [[ "$BUILT_SOURCE" != "$GITHUB_SHA" ]]; then checkout="$checkout/prepared-built-source"; fi
          [[ "$(/usr/bin/git -C "$checkout" rev-parse HEAD)" == "$BUILT_SOURCE" ]] || exit 1
          /usr/bin/env -i PATH="/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME=/Users/runner CARGO_HOME=/Users/runner/.cargo RUSTUP_HOME=/Users/runner/.rustup \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" RUSTUP_AUTO_INSTALL=0 \
            DEVELOPER_DIR="$DEVELOPER_DIR" MACOSX_DEPLOYMENT_TARGET=26.0 \
            "/Users/runner/.rustup/toolchains/${RUSTUP_TOOLCHAIN}-$MRK_MACOS_TARGET/bin/cargo" fetch \
              --manifest-path "$checkout/desktop/src-tauri/Cargo.toml" --locked --target "$MRK_MACOS_TARGET"
      - name: Standard Installer only is privileged; never execute the app or Python as root
        if: success()
        id: package_install
        timeout-minutes: 18
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_BASE64 }}
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MRK_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
          set -euo pipefail
          set -o noclobber
          umask 077
          # Existing owner/deadlines cover signature, readonly mount, Installer
          # and V2 readback; earlier construction is not installation evidence.
          set +e
          MRK_MACOS_DEVELOPER_ID_P12_BASE64="$MRK_MACOS_DEVELOPER_ID_P12_BASE64" \
          MRK_MACOS_DEVELOPER_ID_P12_PASSWORD="$MRK_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py package-install --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" \
            > "$MRK_MACOS_WORK/package-install.stdout"
          package_status=$?
          printf '%s\n' "$package_status" > "$MRK_MACOS_WORK/package-install.status"
          package_status_saved=$?
          set -e
          if [[ "$package_status" != 0 ]]; then exit "$package_status"; fi
          [[ "$package_status_saved" == 0 ]] || exit "$package_status_saved"
          # The receipt is not its own exit proof: only this original0, the
          # saved Installer0, same-request readback and known detach permit use.
          # Unknown resources remain retained; no forced detach or root Python.
          unset MRK_MACOS_DEVELOPER_ID_P12_BASE64 MRK_MACOS_DEVELOPER_ID_P12_PASSWORD
      - name: Notarize, staple and verify only the final user image
        id: finalize_image
        if: github.event_name == 'push' && steps.package_install.outcome == 'success'
        timeout-minutes: 32
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MRK_MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set +x
          set +a
          export -n MRK_MACOS_NOTARY_API_KEY_BASE64
          set -euo pipefail
          set -o noclobber
          umask 077
          # Finalize only our copy; readonly contents stay bound to P/producer.
          set +e
          MRK_MACOS_NOTARY_API_KEY_BASE64="$MRK_MACOS_NOTARY_API_KEY_BASE64" \
            "$MRK_PYTHON" -I -S -B desktop/tools/macos_prepared_package.py finalize-image --target "$MRK_MACOS_TARGET" --consumer-tree "$MRK_CONSUMER_TREE" \
            > "$MRK_MACOS_WORK/image-finalization.stdout"
          image_status=$?
          printf '%s\n' "$image_status" > "$MRK_MACOS_WORK/image-finalization.status"
          image_status_saved=$?
          unset MRK_MACOS_NOTARY_API_KEY_BASE64
          set -e
          if [[ "$image_status" != 0 ]]; then exit "$image_status"; fi
          [[ "$image_status_saved" == 0 ]] || exit "$image_status_saved"
          # Require original0; no old-image fallback.
      - name: Stage the current signed candidate only after actual installation and final-image verification
        id: candidate_stage
        if: github.event_name == 'push' && steps.package_install.outcome == 'success' && steps.finalize_image.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
