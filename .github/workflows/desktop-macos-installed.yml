                          info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
              def opened(path, parent=None, name=None, directory=False):
                  cut()
                  fd = os.open(str(path) if parent is None else name,
                               flags | (os.O_DIRECTORY if directory else 0), dir_fd=parent)
                  row = dict(fd=fd, parent=parent, name=name, path=path, identity=None)
                  originals.append(row)  # Same original is enrolled before fallible inspection.
                  info = os.fstat(fd)
                  named = os.stat(path if parent is None else name, dir_fd=parent, follow_symlinks=False)
                  need(identity(info) == identity(named) and info.st_uid in (0, os.getuid()))
                  if directory:
