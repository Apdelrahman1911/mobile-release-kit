                  + (P.CREDENTIAL_ROLES[:17] + ('search-final', 'default-after')) * 3, credentials=True)
              contexts = owner.get('credentialContexts')
              need(type(contexts) is list and len(contexts) == 3 and all(type(row) is dict for row in contexts)
