name: Desktop Mac normal package and limited early preview (Aqua gate separate)

on:
  push:
    branches:
      - verify/desktop-macos-installed
      - verify/desktop-macos-preview
      - verify/desktop-macos-image-compile
      - verify/desktop-macos-removal-lifecycle
      - verify/desktop-macos-app-signature
      - verify/desktop-macos-app-absence-fixture
      - verify/desktop-macos-positive-update

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering-install:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/verify/desktop-macos-preview' || github.ref == 'refs/heads/verify/desktop-macos-removal-lifecycle' || github.ref == 'refs/heads/verify/desktop-macos-app-signature' || github.ref == 'refs/heads/verify/desktop-macos-app-absence-fixture' || github.ref == 'refs/heads/verify/desktop-macos-positive-update')
    environment: macos-developer-id
    name: normal-installed-${{ matrix.target }}${{ matrix.removal_case && format('-removal-{0}', matrix.removal_case) || '' }}
    runs-on: ${{ matrix.runner }}
    # Historical pre-installed-UI raw timed-step union602min (ARM) /642min (Intel) includes the retained42min alternative.
    # Late installed-only DATA adds mutually exclusive28 nominal minutes; no current-route fit is claimed.
    # Remaining-three additionally requires ordinary saved-checks2; both cohorts are independent.
    # Adds28 singleton minutes plus17 saved-checks minutes; no350min fit is claimed.
    # The unchanged350min job cap is containing authority, never renewed per case.
    # Installed-only carrier retention adds7 nominal minutes; unchanged350min cap still prevails.
    # Installed normal10 uses the same app/runner and single retained passive carrier.
    # All scheduled originals/results and public evidence precede export retirement; no350min fit is claimed.
    # Historical pre-Remove baselines: preview345 / recovery339 / installed210, plus5 overhead.
    # Remove preview adds90 nominal step maxima; Intel app-build adds24 to the old allocation.
    # Dormant Android272 / iOS248 include5 overhead; historical baselines, not fit proofs.
    # Fixed removal uses its own two fresh ARM rows, the same350min ceiling,
    # separate baseline Install/UI-build preparation, O3 work1740/hard1800,
    # then one removal owner990 (fixed segment sum963); no budget restart.
    # App-signature: ARM99 / Intel139 timed preparation +14 bounded setup
    # +7 summary/cleanup/upload;7 overhead. Independent110 hard cap takes precedence.
    timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 110 || 350 }}
    strategy:
      fail-fast: false
      matrix:
        # Only this fixed ref selects two fresh ARM machines; no cross-product or Intel removal case.
        include: ${{ fromJSON(github.ref == 'refs/heads/verify/desktop-macos-removal-lifecycle' && '[{"target":"aarch64-apple-darwin","runner":"macos-26","machine":"arm64","hosted_job":"github-hosted-macos26-arm64","supplier_receipt":"1e7a28664e9234660fe8377a7a7b3bee5438faf09d40224d2db81ba2d9358809","supplier_tar":"2835fd45d443c429c2a9f12e9cdbcff109f35a15207ca5a086da24c0b6e338a5","supplier_source":"52485f9fd837f0dacb8dc9621e5a1bee30803506","supplier_run":"38343324660","supplier_attempt":"1","supplier_artifact":"11788410124","removal_case":"ordinary"},{"target":"aarch64-apple-darwin","runner":"macos-26","machine":"arm64","hosted_job":"github-hosted-macos26-arm64","supplier_receipt":"1e7a28664e9234660fe8377a7a7b3bee5438faf09d40224d2db81ba2d9358809","supplier_tar":"2835fd45d443c429c2a9f12e9cdbcff109f35a15207ca5a086da24c0b6e338a5","supplier_source":"52485f9fd837f0dacb8dc9621e5a1bee30803506","supplier_run":"38343324660","supplier_attempt":"1","supplier_artifact":"11788410124","removal_case":"abrupt"}]' || '[{"target":"aarch64-apple-darwin","runner":"macos-26","machine":"arm64","hosted_job":"github-hosted-macos26-arm64","supplier_receipt":"1e7a28664e9234660fe8377a7a7b3bee5438faf09d40224d2db81ba2d9358809","supplier_tar":"2835fd45d443c429c2a9f12e9cdbcff109f35a15207ca5a086da24c0b6e338a5","supplier_source":"52485f9fd837f0dacb8dc9621e5a1bee30803506","supplier_run":"38343324660","supplier_attempt":"1","supplier_artifact":"11788410124"},{"target":"x86_64-apple-darwin","runner":"macos-26-intel","machine":"x86_64","hosted_job":"github-hosted-macos26-x86_64","supplier_receipt":"afba303207b19692b73fb1288b56afcd73378fc29b0b0ede4ff10eb2e0f949b8","supplier_tar":"ff976626b48e95abc414d46ff91f1ebb183416356bb4706b8e673b7c9018ca9c","supplier_source":"a2f7a10b4c86305f5ee65c6779ceaf6b128cd8fa","supplier_run":"38343340695","supplier_attempt":"1","supplier_artifact":"11787588635"}]') }}
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJSON('{"aarch64-apple-darwin":"1.98.1","x86_64-apple-darwin":"1.98.0"}')[matrix.target] }}
      MRK_MACOS_TARGET: ${{ matrix.target }}
      MRK_MACOS_RUNNER: ${{ matrix.runner }}
      MRK_MACOS_MACHINE: ${{ matrix.machine }}
      MRK_MACOS_HOSTED_JOB: ${{ matrix.hosted_job }}
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      MRK_MACOS_PACKAGE_ROLE: ordinary-image
      # Separate reviewed activation only; baseline and later UI remain independent.
      MRK_MACOS_SAME_PACKAGE_SCOPE: ${{ github.ref == 'refs/heads/verify/desktop-macos-preview' && 'same-package-noop' || 'disabled' }}
      MRK_MACOS_REMOVAL_CASE: ${{ matrix.removal_case || 'disabled' }}
      # This installed verification run exercises iOS; Android keeps its separate qualification.
      MRK_MACOS_ANDROID_UI_SCOPE: disabled
      # SOURCE-owned: unsigned iOS archive journey only on the fixed installed verification ref.
      MRK_MACOS_IOS_UI_SCOPE: ${{ github.ref == 'refs/heads/verify/desktop-macos-installed' && 'ios-unsigned-archive' || 'disabled' }}
      # A separate reviewed SOURCE change selects the targeted recovery run.
      # Default seven cases and each closed singleton are distinct native obligations.
      MRK_MACOS_SAVED_FILE_UI_SCOPE: ${{ github.ref == 'refs/heads/verify/desktop-macos-preview' && 'remaining-three' || 'ordinary-seven' }}
      # Final signed M comes only from the fixed configured SOURCE nomination.
      MRK_BUNDLED_RUNTIME_SOURCE_SHA256: 10d3f2cf13155335444c8376a346d89581c03a43f0ae642e67401e379745dca2
      # Independently accepted paired supplier six pins; each signed target requires a new final M.
      MRK_MACOS_RUNTIME_SUPPLIER: fresh-public-source
      MRK_MACOS_PYTHON_SUPPLIER_SHA256: ${{ matrix.supplier_receipt }}
      MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256: ${{ matrix.supplier_tar }}
      MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT: ${{ matrix.supplier_source }}
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ID: ${{ matrix.supplier_run }}
      MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT: ${{ matrix.supplier_attempt }}
      MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID: ${{ matrix.supplier_artifact }}
      MRK_BUNDLED_PROTOCOL_SHA256: 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5
      # Independent immutable publisher bindings; caller hashes come from build.rs.
      MRK_GITHUB_PREFLIGHT_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MRK_GITHUB_RELEASE_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only this exact disposable-hosted source route
        timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 1 || 350 }}
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]] || exit 1
          case "$MRK_MACOS_SAME_PACKAGE_SCOPE" in
            disabled) ;;
            same-package-noop) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
            *) exit 1 ;;
          esac
          case "$MRK_MACOS_ANDROID_UI_SCOPE" in
            disabled|android-signed-build) ;;
            *) exit 1 ;;
          esac
          case "$MRK_MACOS_IOS_UI_SCOPE" in
            disabled) ;;
            ios-unsigned-archive|ios-pending-recovery)
              [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          case "$MRK_MACOS_TARGET" in
            aarch64-apple-darwin)
              [[ "$MRK_MACOS_RUNNER" == macos-26 && "$RUNNER_ARCH" == ARM64 && "$MRK_MACOS_MACHINE" == arm64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-arm64 && "$(/usr/bin/uname -m)" == arm64 ]] || exit 1
              expected_supplier_receipt=1e7a28664e9234660fe8377a7a7b3bee5438faf09d40224d2db81ba2d9358809
              expected_supplier_tar=2835fd45d443c429c2a9f12e9cdbcff109f35a15207ca5a086da24c0b6e338a5
              expected_supplier_source=52485f9fd837f0dacb8dc9621e5a1bee30803506
              expected_supplier_run=38343324660
              expected_supplier_attempt=1
              expected_supplier_artifact=11788410124
              ;;
            x86_64-apple-darwin)
              [[ "$MRK_MACOS_RUNNER" == macos-26-intel && "$RUNNER_ARCH" == X64 && "$MRK_MACOS_MACHINE" == x86_64 && "$MRK_MACOS_HOSTED_JOB" == github-hosted-macos26-x86_64 && "$(/usr/bin/uname -m)" == x86_64 ]] || exit 1
              expected_supplier_receipt=afba303207b19692b73fb1288b56afcd73378fc29b0b0ede4ff10eb2e0f949b8
              expected_supplier_tar=ff976626b48e95abc414d46ff91f1ebb183416356bb4706b8e673b7c9018ca9c
              expected_supplier_source=a2f7a10b4c86305f5ee65c6779ceaf6b128cd8fa
              expected_supplier_run=38343340695
              expected_supplier_attempt=1
              expected_supplier_artifact=11787588635
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed || "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview || "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature || "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update ) ]] || exit 1
          if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-absence-fixture || "$GITHUB_REF" == refs/heads/verify/desktop-macos-positive-update ]]; then
            [[ "$MRK_MACOS_SAME_PACKAGE_SCOPE" == disabled && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-app-signature ]]; then
            [[ "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-removal-lifecycle ]]; then
            [[ "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$MRK_MACOS_ANDROID_UI_SCOPE" == disabled && "$MRK_MACOS_IOS_UI_SCOPE" == disabled && "$MRK_MACOS_SAVED_FILE_UI_SCOPE" == ordinary-seven ]] || exit 1
            case "$MRK_MACOS_REMOVAL_CASE" in ordinary|abrupt) ;; *) exit 1 ;; esac
          else
            [[ "$MRK_MACOS_REMOVAL_CASE" == disabled ]] || exit 1
          fi
          case "$MRK_MACOS_SAVED_FILE_UI_SCOPE" in
            ordinary-seven) ;;
            saved-version-recovery|workflow-refusal|release-evidence|remaining-three) [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ]] || exit 1 ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]] || exit 1
          # Fresh supplier pins never replace the separate current-core source binding.
          [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == 10d3f2cf13155335444c8376a346d89581c03a43f0ae642e67401e379745dca2 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit ]] || exit 1
          [[ "$MRK_MACOS_RUNTIME_SUPPLIER" == fresh-public-source ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SHA256" == "$expected_supplier_receipt" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_MACOS_PYTHON_SUPPLIER_TAR_SHA256" == "$expected_supplier_tar" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$MRK_MACOS_PYTHON_SUPPLIER_SOURCE_COMMIT" == "$expected_supplier_source" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ID" == "$expected_supplier_run" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_RUN_ATTEMPT" == "$expected_supplier_attempt" ]] || exit 1
          [[ "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" -le 9007199254740991 && "$MRK_MACOS_PYTHON_SUPPLIER_ARTIFACT_ID" == "$expected_supplier_artifact" ]] || exit 1
          [[ "$MRK_BUNDLED_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_PROTOCOL_SHA256" == 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5 ]] || exit 1
          [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]] || exit 1
          [[ "$(/usr/bin/sw_vers -productVersion)" == 26.* ]] || exit 1
          [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]] || exit 1
      - name: Check out exact reviewed source without retained credentials
        timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 3 || 350 }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select DATA stager Python, not the packaged interpreter
        timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 2 || 350 }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Refuse unconfigured update before any artifact download or native preparation
        if: github.ref == 'refs/heads/verify/desktop-macos-positive-update'
        id: update_selection
        timeout-minutes: 1
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          selection=$("$MRK_PYTHON" -I -S -B desktop/tools/macos_update_verification.py select --target "$MRK_MACOS_TARGET")
          [[ ${#selection} -le 1024 && "$HOME" == /* ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$selection" <<'PY_UPDATE_SELECT'
          import json, os, re, sys
          value = json.loads(sys.argv[1])
          if set(value) != {"artifactId", "runId", "artifactBytes", "additionalDiskBytes"}: raise ValueError("update selection")
          rows = {}
          for field, key in (("artifactId", "MRK_UPDATE_ARTIFACT_ID"), ("runId", "MRK_UPDATE_RUN_ID")):
              v = value[field]
              if type(v) is not str or re.fullmatch(r"[1-9][0-9]{0,19}", v) is None: raise ValueError("update identity")
              rows[key] = v
          for key in ("artifactBytes", "additionalDiskBytes"):
              if type(value[key]) is not int or not 0 < value[key] <= 8 * 1024**3: raise ValueError("update quote")
          rows["MRK_UPDATE_DISK_BYTES"] = str(value["additionalDiskBytes"])
          home = os.environ["HOME"]
          if not home.startswith("/") or any(c in home for c in "\r\n\0"): raise ValueError("update GUI home")
          rows["MRK_MACOS_GUI_HOME"] = home
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in rows.items(): output.write(key + "=" + value + "\n")
          PY_UPDATE_SELECT

      - name: Select the fixed configured signed runtime before any payload download
        timeout-minutes: 1
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$MRK_PYTHON" == /* && -x "$MRK_PYTHON" ]] || exit 1
          selection=$(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C TZ=UTC \
            "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py runtime-signing-selection --target "$MRK_MACOS_TARGET")
          [[ ${#selection} -le 4096 ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$selection" <<'PY_SIGNING_SELECTION'
          import json, os, re, stat, sys
          value = json.loads(sys.argv[1])
          fields = {
              "runtimeManifestSha256": "MRK_BUNDLED_RUNTIME_MANIFEST_SHA256",
              "signedPythonSha256": "MRK_MACOS_SIGNED_PYTHON_SHA256",
              "signingReceiptSha256": "MRK_MACOS_SIGNING_RECEIPT_SHA256",
              "signingSourceCommit": "MRK_MACOS_SIGNING_SOURCE_COMMIT",
              "signingRunId": "MRK_MACOS_SIGNING_RUN_ID",
              "signingRunAttempt": "MRK_MACOS_SIGNING_RUN_ATTEMPT",
              "signingArtifactId": "MRK_MACOS_SIGNING_ARTIFACT_ID",
              "producerProfileSha256": "MRK_MACOS_SIGNING_PRODUCER_PROFILE_SHA256",
              "serviceProfileSha256": "MRK_MACOS_SIGNING_SERVICE_PROFILE_SHA256",
              "nominationSha256": "MRK_MACOS_SIGNING_BINDING_SHA256",
          }
          fixed = {"schemaVersion", "kind", "target", "state", "sourceInputsSha256", "nativeAuthority"}
          if (type(value) is not dict or set(value) != set(fields) | fixed
                  or type(value["schemaVersion"]) is not int or value["schemaVersion"] != 1
                  or value["kind"] != "configured-signed-runtime-selection-data"
                  or value["state"] != "configured" or value["target"] != os.environ["MRK_MACOS_TARGET"]
                  or value["nativeAuthority"] is not False
                  or value["sourceInputsSha256"] != os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"]):
              raise ValueError("fixed configured runtime selection required")
          for key in fields:
              item = value[key]
              if key in ("signingRunId", "signingRunAttempt", "signingArtifactId"):
                  valid = type(item) is str and re.fullmatch(r"[1-9][0-9]{0,15}", item) and int(item) <= 9007199254740991
              else:
                  width = 40 if key == "signingSourceCommit" else 64
                  valid = type(item) is str and re.fullmatch(r"[0-9a-f]{" + str(width) + r"}", item) and item != "0" * width
              if not valid: raise ValueError("fixed public signing field refused")
          body = "".join(name + "=" + value[key] + "\n" for key, name in fields.items()).encode("ascii")
          if len(body) > 4096: raise ValueError("signing selection output bound")
          fd = os.open(os.environ["GITHUB_ENV"], os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.getuid():
                  raise ValueError("original workflow environment file refused")
              view = memoryview(body)
              while view:
                  count = os.write(fd, view)
                  if count <= 0: raise OSError("signing selection write refused")
                  view = view[count:]
              os.fsync(fd)
          finally:
              os.close(fd)
          PY_SIGNING_SELECTION
      - name: Select fixed frontend compiler
        timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 2 || 350 }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Reserve fresh work and record exact source and actual tool bindings
        timeout-minutes: ${{ github.ref == 'refs/heads/verify/desktop-macos-app-signature' && 2 || 350 }}
        id: work
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]] || exit 1
          [[ ! -e desktop/node_modules && ! -L desktop/node_modules && ! -e desktop/dist && ! -L desktop/dist ]] || exit 1
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$root" >> "$GITHUB_ENV"
          "$MRK_PYTHON" -I -S -B - "$root/source-binding.json" <<'PY'
          import json, os, subprocess, sys
          build_target = os.environ["MRK_MACOS_TARGET"]
          supplier_routes = {
              "aarch64-apple-darwin": (".github/workflows/desktop-macos-cpython-source-build.yml", "refs/heads/verify/desktop-macos-cpython-source-build"),
