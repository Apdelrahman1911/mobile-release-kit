                      or identity(before) != identity(os.stat(path, follow_symlinks=False))):
                  raise ValueError("fixed UI diagnostic log changed")
          finally: os.close(fd)
          stages = {"diagnostics-" + name for name in ("launch", "fixture", "project-open", "context", "original-report", "readback-and-quit")}
