              if type(commands) is not list or len(commands) != len(roles):
                  raise ValueError("normal original command roster refused")
              for command, (role, cap, output_limit) in zip(commands, roles):
                  if (type(command) is not dict or command.get("role") != role
                          or type(command.get("returncode")) is not int or command["returncode"] != 0
                          or type(command.get("roleCapSeconds")) is not int or command["roleCapSeconds"] != cap
                          or type(command.get("timeoutSeconds")) is not int or not 1 <= command["timeoutSeconds"] <= cap
                          or type(command.get("outputLimitBytes")) is not int or command["outputLimitBytes"] != output_limit
                          or any(type(command.get(k)) is not int or not 0 <= command[k] <= output_limit for k in ("stdoutBytes", "stderrBytes"))
                          or command["stdoutBytes"] + command["stderrBytes"] > output_limit
                          or any(type(command.get(k)) is not str or re.fullmatch(r"[0-9a-f]{64}", command[k]) is None
