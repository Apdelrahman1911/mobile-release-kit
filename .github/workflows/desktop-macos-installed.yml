                  row = opened(Path('/'), directory=True)
                  for part in path.parts[1:]:
                      row = opened(row['path'] / part, row['fd'], part, True)
                  return row
              def post(row):
                  cut()
                  named = os.stat(row['path'] if row['parent'] is None else row['name'],
                                  dir_fd=row['parent'], follow_symlinks=False)
                  need(row['identity'] == identity(os.fstat(row['fd'])) == identity(named))
              def read(parent, name, limit):
