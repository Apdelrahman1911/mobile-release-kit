          retention-days: 14
          compression-level: 0
      # Do not start a payload build, host scan, notice-only task, service,
      # publication of a release, Store workflow, or synthetic GUI success here.
      # The focused real Aqua/Save procedure and separate command/result gates
      # are in desktop/packaging/macos-installed.md.
      - name: Remove only this completed preview build's disposable compiler outputs
        if: always() && steps.preview_upload.outcome == 'success' && steps.normal_ui_result.outcome == 'success' && steps.normal_persistence_ui_result.outcome == 'success' && steps.normal_project_ui_result.outcome == 'success' && steps.normal_diagnostics_ui_result.outcome == 'success' && steps.normal_saved_checks_ui_result.outcome == 'success' && steps.data_contracts.outcome == 'success' && steps.evidence.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # Original build, DATA/Python, Installer, XCTest and result commands returned successfully.
          # The normal app reached notRunning through its genuine Quit action; this is
          # not proof of every macOS service/worker's finality. Never stop shared services.
          # Retain package/evidence and protected installation; never touch shared caches.
          "$MRK_PYTHON" -I -S -B - <<'PY_CLEAN'
          import json, os, shutil, stat
          from pathlib import Path
          root = Path(os.environ["MRK_MACOS_WORK"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          if root.parent != Path("/Users/runner/work/_temp") or not root.name.startswith("mrk-macos-installed.") or workspace != Path("/Users/runner/work/mobile-release-kit/mobile-release-kit"):
              raise ValueError("task cleanup route refused")
          fd = os.open(root / "source-binding.json", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size > 65536:
                  raise ValueError("task cleanup binding refused")
              data = os.read(fd, 65537)
              if len(data) != info.st_size: raise ValueError("task cleanup binding incomplete")
              binding = json.loads(data)
          finally:
              os.close(fd)
          original = binding["workDirectory"]
          current = os.lstat(root)
          if (not stat.S_ISDIR(current.st_mode) or current.st_uid != os.getuid() or os.getuid() == 0
                  or [current.st_dev, current.st_ino, current.st_uid] != original
                  or binding["source"] != os.environ["GITHUB_SHA"]
                  or binding["frontendAbsentAtAdmission"] is not True or not shutil.rmtree.avoids_symlink_attacks):
              raise ValueError("task cleanup original refused")
          for path in (root / "cargo-target", root / "vault-helper-target", root / "npm-cache", workspace / "desktop/node_modules", workspace / "desktop/dist",
                       root / "normal-ui/DerivedData", root / "normal-ui/test.xcresult", root / "normal-ui/persistence-test.xcresult", root / "normal-ui/project-test.xcresult", root / "normal-ui/diagnostics-test.xcresult", root / "normal-ui/saved-checks-test.xcresult", root / "normal-ui/tmp",
                       root / "data-contracts/tmp"):
              try: selected = os.lstat(path)
              except FileNotFoundError: continue
              if not stat.S_ISDIR(selected.st_mode) or selected.st_uid != os.getuid() or selected.st_dev != current.st_dev:
                  raise ValueError("task cleanup output refused")
              shutil.rmtree(path)
          for name in ("build.log", "test.log", "summary.raw.json", "summary.stderr",
                       "persistence-test.log", "persistence-summary.raw.json", "persistence-summary.stderr",
                       "project-test.log", "project-summary.raw.json", "project-summary.stderr",
                       "diagnostics-test.log", "diagnostics-summary.raw.json", "diagnostics-summary.stderr",
                       "saved-checks-test.log", "saved-checks-summary.raw.json", "saved-checks-summary.stderr"):
              path = root / "normal-ui" / name
              try: selected = os.lstat(path)
              except FileNotFoundError: continue
              if not stat.S_ISREG(selected.st_mode) or selected.st_uid != os.getuid() or selected.st_nlink != 1 or selected.st_dev != current.st_dev:
                  raise ValueError("task cleanup closed log refused")
              os.unlink(path)
          PY_CLEAN
