              match = re.fullmatch(rb"MRK_NORMAL_PROJECT_STAGE=([a-z0-9-]+);result=(started|passed|failed)(;laterStages=not-run)?", raw.strip())
              if match and match[1].decode("ascii") in stages:
                  events.append({"stage": match[1].decode("ascii"), "result": match[2].decode("ascii")})
              match = re.fullmatch(rb"MRK_NORMAL_PROJECT_QUERY=stage:([a-z0-9-]+);buttons:([0-9]{1,3});textFields:([0-9]{1,3});comboBoxes:([0-9]{1,3});sheets:([0-9]{1,2})", raw.strip())
              if match and match[1].decode("ascii") in stages:
                  counts = list(map(int, match.groups()[1:]))
                  if all(value <= 256 for value in counts[:3]) and counts[3] <= 16:
                      events.append({"stage": match[1].decode("ascii"), "roleCounts": counts})
              if len(events) > 64: raise ValueError("fixed UI diagnostic event bound")
          result = {"schemaVersion": 1, "scope": "normal-saved-offline-and-empty-recovery-ui-diagnostics-only",
                    "sourceCommit": os.environ["GITHUB_SHA"], "workflowSourceCommit": os.environ["GITHUB_WORKFLOW_SHA"],
                    "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "boundedTailBytes": len(data), "originalLogBytes": before.st_size, "events": events,
                    "nativeSuccessInferred": False, "rawTextExported": False}
          fd = os.open(root / "saved-checks-safe-facts.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
