          selection=$("$MRK_PYTHON" -I -S -B desktop/tools/macos_android_helper_package.py select-github-tools-signed --target "$MRK_MACOS_TARGET")
          [[ ${#selection} -le 16384 ]] || exit 1
          "$MRK_PYTHON" -I -S -B - "$selection" <<'PY_TOOL_SELECTION'
          import json, os, re, sys
          value = json.loads(sys.argv[1]); output = {}; environment = {}
          for purpose, key in [('history-provider', 'history'), ('github-seal', 'seal')]:
              row = value['tools'][purpose]; output[key + '-enabled'] = 'false' if row is None else 'true'
              if row is not None:
                  signed = row['signed']
