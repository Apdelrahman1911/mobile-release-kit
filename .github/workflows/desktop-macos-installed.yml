name: Desktop Mac normal package and limited early preview (Aqua gate separate)

on:
  push:
    branches:
      - verify/desktop-macos-installed
      - verify/desktop-macos-preview

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering-install:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/verify/desktop-macos-installed' || github.ref == 'refs/heads/verify/desktop-macos-preview')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      MRK_EXPECTED_SHA: ${{ github.sha }}
      MRK_MACOS_INSTALL_SOURCE_COMMIT: ${{ github.sha }}
      # Exact accepted current-payload DATA; ordinary installation is not Aqua qualification.
      MRK_BUNDLED_RUNTIME_MANIFEST_SHA256: b030d127c8507ddcc3db4641ac03f440c6ac4c8128fa08053eb12e00856f429b
      MRK_BUNDLED_RUNTIME_SOURCE_SHA256: 4dee7a2c1f59b742fde0128df49efad5e848958b35d8d2683a595706615e7659
      MRK_BUNDLED_PROTOCOL_SHA256: 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5
      # Independent immutable publisher bindings; caller hashes come from build.rs.
      MRK_GITHUB_PREFLIGHT_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MRK_GITHUB_RELEASE_TOOLING_SHA: b4cb582837a244f67e4c926f2ce2bb42ad8cfe37
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit only this exact disposable-hosted source route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/verify/desktop-macos-installed || "$GITHUB_REF" == refs/heads/verify/desktop-macos-preview ) ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" && "$MRK_MACOS_INSTALL_SOURCE_COMMIT" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-installed.yml@$GITHUB_REF" ]]
          # Historical archive reuse supplies the interpreter, not the current core.
          [[ "$MRK_BUNDLED_RUNTIME_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_MANIFEST_SHA256" == b030d127c8507ddcc3db4641ac03f440c6ac4c8128fa08053eb12e00856f429b ]]
          [[ "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_RUNTIME_SOURCE_SHA256" == 4dee7a2c1f59b742fde0128df49efad5e848958b35d8d2683a595706615e7659 ]]
          [[ "$MRK_BUNDLED_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ && "$MRK_BUNDLED_PROTOCOL_SHA256" == 083e6afae3e329c4e0d81bad00dd0c9920f77491b38ce0d23aa602996f4c4bf5 ]]
          [[ "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_PREFLIGHT_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]]
          [[ "$MRK_GITHUB_RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ && "$MRK_GITHUB_RELEASE_TOOLING_SHA" == b4cb582837a244f67e4c926f2ce2bb42ad8cfe37 ]]
          [[ "$(/usr/bin/uname -m)" == arm64 && "$(/usr/bin/sw_vers -productVersion)" == 26.* ]]
          [[ "$(/usr/bin/id -u)" != 0 && -d "$DEVELOPER_DIR" ]]
      - name: Check out exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the pinned Apple Instant clock toolchain
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin --no-self-update
          rustc --version --verbose
      - name: Select DATA stager Python, not the packaged interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Reserve fresh work and record exact source and actual tool bindings
        id: work
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_TEMP" == /Users/runner/work/_temp && "$GITHUB_WORKSPACE" == /Users/runner/work/mobile-release-kit/mobile-release-kit ]]
          [[ ! -e desktop/node_modules && ! -L desktop/node_modules && ! -e desktop/dist && ! -L desktop/dist ]]
          root=$(/usr/bin/mktemp -d "$RUNNER_TEMP/mrk-macos-installed.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'MRK_MACOS_WORK=%s\nMRK_PYTHON=%s\nCARGO_TARGET_DIR=%s/cargo-target\n' "$root" "$MRK_PYTHON" "$root" >> "$GITHUB_ENV"
          "$MRK_PYTHON" -I -S -B - "$root/source-binding.json" <<'PY'
          import json, os, subprocess, sys
          tools = {}
          for name, command in (
              ("cltSdkPath", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-path"]),
              ("cltSdkVersion", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-version"]),
              ("cltSdkBuild", ["/usr/bin/xcrun", "--sdk", "macosx", "--show-sdk-build-version"]),
              ("cltCompiler", ["/usr/bin/xcrun", "--sdk", "macosx", "clang", "--version"]),
              ("node", ["node", "--version"]),
              ("python", [sys.executable, "-I", "-S", "-B", "--version"]),
          ):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True, timeout=15)
              if not result.stdout or len(result.stdout) > 4096: raise ValueError("tool version output refused")
              tools[name] = {"command": command, "output": result.stdout.decode("utf-8", "strict").strip()}
          work_info = os.stat(os.path.dirname(sys.argv[1]), follow_symlinks=False)
          source_tree = subprocess.run(["git", "-c", "core.fsmonitor=false", "rev-parse", "HEAD^{tree}"], check=True, stdout=subprocess.PIPE, timeout=15).stdout.decode().strip()
          value = {"schemaVersion": 1, "source": os.environ["GITHUB_SHA"], "workflowSource": os.environ["GITHUB_WORKFLOW_SHA"],
                   "tree": source_tree, "workDirectory": [work_info.st_dev, work_info.st_ino, work_info.st_uid],
                   "frontendAbsentAtAdmission": True,
                   "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                   "runtimeManifestSha256": os.environ["MRK_BUNDLED_RUNTIME_MANIFEST_SHA256"],
                   "runtimeSourceInputsSha256": os.environ["MRK_BUNDLED_RUNTIME_SOURCE_SHA256"],
                   "protocolSha256": os.environ["MRK_BUNDLED_PROTOCOL_SHA256"],
                   "githubPreflightToolingSha": os.environ["MRK_GITHUB_PREFLIGHT_TOOLING_SHA"],
                   "githubReleaseToolingSha": os.environ["MRK_GITHUB_RELEASE_TOOLING_SHA"],
                   "reusedRun": "35602474108/1", "reusedArtifactId": "10639324707",
                   "reusedSupplierOnly": True,
                   "scope": "engineering-acl-probe-five-regressions-fixed-fixture-package-install-only", "fixedFixtureCases": 8,
                   "aclPrimitiveCases": 6,
                   "selectedRegressionGroups": [2, 1, 2], "developerDir": os.environ["DEVELOPER_DIR"], "tools": tools,
                   "actualAquaSaveGate": "pending"}
          if os.environ["GITHUB_REF"] == "refs/heads/verify/desktop-macos-preview":
              value.update({"scope": "normal-macos-early-preview", "fixedFixtureCases": 8, "aclPrimitiveCases": 0,
                            "selectedRegressionGroups": [], "instrumented": False, "applicationLaunched": False,
                            "fullUIQualified": False, "distributionQualified": False})
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 65536: raise ValueError("source/tool binding size refused")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          try:
              while data:
                  n = os.write(fd, data)
                  if not n: raise RuntimeError("write refused")
                  data = data[n:]
              os.fsync(fd)
          finally: os.close(fd)
          PY
      - name: Bind the complete reviewed first-party checkout before compilation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]
          "$MRK_PYTHON" -I -S -B - "$MRK_MACOS_WORK/source-inventory.json" <<'PY_SOURCE'
          import hashlib, json, os, stat, subprocess, sys
          def git(*args):
              return subprocess.run(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null", *args], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15).stdout
          rows = git("ls-tree", "-r", "-z", "--full-tree", "HEAD").split(b"\0")
          if rows[-1] or len(rows) > 4096: raise ValueError("tracked inventory bound")
          files = []
          for row in rows[:-1]:
              header, raw_name = row.split(b"\t", 1)
              mode, kind, blob = header.split(b" ")
              name = raw_name.decode("utf-8", "strict")
              if kind != b"blob" or mode not in (b"100644", b"100755") or any(p in ("", ".", "..") for p in name.split("/")): raise ValueError("tracked inventory path/type")
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 32 * 1024 * 1024: raise ValueError("tracked input refused")
                  digest = hashlib.sha256()
                  blob_digest = hashlib.sha1(b"blob " + str(before.st_size).encode() + b"\0")
                  size = 0
                  while block := os.read(fd, 65536):
                      size += len(block)
                      if size > before.st_size: raise ValueError("tracked input grew")
                      digest.update(block)
                      blob_digest.update(block)
                  after = os.fstat(fd)
                  sig = lambda s: (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  if size != before.st_size or sig(before) != sig(after) or sig(after) != sig(os.stat(name, follow_symlinks=False)): raise ValueError("tracked input changed")
              finally:
                  os.close(fd)
              if blob_digest.hexdigest() != blob.decode() or bool(before.st_mode & 0o111) != (mode == b"100755"): raise ValueError("tracked blob or executable mode mismatch")
              files.append({"path": name, "gitMode": mode.decode(), "blob": blob.decode(), "size": size, "sha256": digest.hexdigest()})
          value = {"source": os.environ["GITHUB_SHA"], "tree": git("rev-parse", "HEAD^{tree}").decode().strip(), "files": files}
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 2 * 1024 * 1024: raise ValueError("source inventory output bound")
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
              stream.flush()
              os.fsync(stream.fileno())
          PY_SOURCE
      - name: Fail fast on native Scripts ownership and package format (never Installer)
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          [[ "$(/usr/bin/id -u)" != 0 ]]
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py package-format-input \
            --output "$MRK_MACOS_WORK/package-format-scripts" > "$MRK_MACOS_WORK/package-format-input.json"
          [[ ! -e "$MRK_MACOS_WORK/PackageFormat-original.pkg" && ! -L "$MRK_MACOS_WORK/PackageFormat-original.pkg" ]]
          /usr/bin/pkgbuild --nopayload --scripts "$MRK_MACOS_WORK/package-format-scripts" \
            --identifier dev.mobile-release-kit.desktop.installed --version 0.1.0 \
            --install-location / --ownership recommended "$MRK_MACOS_WORK/PackageFormat-original.pkg"
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py prepare-package \
            --scripts "$MRK_MACOS_WORK/package-format-scripts" --package "$MRK_MACOS_WORK/PackageFormat-original.pkg" \
            --output "$MRK_MACOS_WORK/package-format-parts" > "$MRK_MACOS_WORK/package-format-prepare.json"
          # Native tools only write fresh outputs as this nonroot account.
          # Preparation is not final0:0 acceptance; preserve the original pkg.
          # BSD tar pads stdout even when compressed; use the fresh private file.
          [[ ! -e "$MRK_MACOS_WORK/package-format-parts/Scripts" && ! -L "$MRK_MACOS_WORK/package-format-parts/Scripts" ]]
          set +e
          (
            cd "$MRK_MACOS_WORK/package-format-scripts" || exit
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
              /usr/bin/tar -c -z -f "$MRK_MACOS_WORK/package-format-parts/Scripts" --format=odc --uid=0 --gid=0 \
              --no-acls --no-xattrs --no-fflags --no-mac-metadata .
          )
          tar_status=$?
          set -e
          printf '%s\n' "$tar_status" > "$MRK_MACOS_WORK/package-format-tar.status"
          [[ $tar_status == 0 ]]
          # xar is not a streaming/O_EXCL tool: reserve its private output parent.
          /bin/mkdir -m 700 "$MRK_MACOS_WORK/package-format-final"
          [[ ! -e "$MRK_MACOS_WORK/package-format-final/PackageFormat.pkg" && ! -L "$MRK_MACOS_WORK/package-format-final/PackageFormat.pkg" ]]
          set +e
          (
            cd "$MRK_MACOS_WORK/package-format-parts" || exit
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC COPYFILE_DISABLE=1 \
              /usr/bin/xar -c -f "$MRK_MACOS_WORK/package-format-final/PackageFormat.pkg" \
              --compression=none PackageInfo Scripts
          )
          xar_status=$?
          set -e
          printf '%s\n' "$xar_status" > "$MRK_MACOS_WORK/package-format-xar.status"
          [[ $xar_status == 0 ]]
          "$MRK_PYTHON" -I -S -B desktop/tools/stage_macos_installed.py audit-package \
            --scripts "$MRK_MACOS_WORK/package-format-scripts" --package "$MRK_MACOS_WORK/package-format-final/PackageFormat.pkg" \
            --original-package "$MRK_MACOS_WORK/PackageFormat-original.pkg" > "$MRK_MACOS_WORK/package-format-audit.json"
          # Only inert archive bytes were checked. Never run this exit97 hook.
      - name: Fail fast on the selected SDK actual no-ACL and ACE-refusal primitive
        if: github.ref == 'refs/heads/verify/desktop-macos-installed'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          [[ "$(/usr/bin/id -u)" != 0 && "$GITHUB_SHA" == "$MRK_MACOS_INSTALL_SOURCE_COMMIT" ]]
          [[ ! -e "$MRK_MACOS_WORK/acl-probe" && ! -L "$MRK_MACOS_WORK/acl-probe" ]]
          # Two reviewed translation units, one compile/link product. No root,
          # application, interpreter build, GUI, network or general scenario runner.
          set +e
          /usr/bin/xcrun --sdk macosx clang -arch arm64 -mmacosx-version-min=26.0 -fno-objc-arc -fblocks \
            desktop/native/macos-installed-native/src/native.m desktop/native/macos-installed-native/tests/acl_probe.m \
            -framework AppKit -framework Foundation -o "$MRK_MACOS_WORK/acl-probe" 2>&1 \
            | /usr/bin/tail -c 131072 > "$MRK_MACOS_WORK/native-acl-compile.log"
          compile_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${compile_status[*]}" > "$MRK_MACOS_WORK/native-acl-compile.status"
          compile_status_saved=$?
          set -e
          [[ ${#compile_status[@]} == 2 ]]
          if [[ ${compile_status[0]} != 0 ]]; then exit "${compile_status[0]}"; fi
          [[ ${compile_status[1]} == 0 && $compile_status_saved == 0 ]]
          [[ -f "$MRK_MACOS_WORK/acl-probe" && ! -L "$MRK_MACOS_WORK/acl-probe" && -O "$MRK_MACOS_WORK/acl-probe" ]]
          binary_identity=$(/usr/bin/stat -f '%d:%i:%u:%g:%p:%l:%z:%m:%c' "$MRK_MACOS_WORK/acl-probe")
          [[ -n "$binary_identity" ]]
          /bin/mkdir -m 700 "$MRK_MACOS_WORK/acl-probe-data"
          [[ -d "$MRK_MACOS_WORK/acl-probe-data" && ! -L "$MRK_MACOS_WORK/acl-probe-data" && -O "$MRK_MACOS_WORK/acl-probe-data" ]]
          # Children legitimately change directory size/timestamps/link count.
          # Device/inode/type/owner/group/mode remain the original identity.
          directory_identity=$(/usr/bin/stat -f '%d:%i:%u:%g:%p' "$MRK_MACOS_WORK/acl-probe-data")
          [[ -n "$directory_identity" ]]
          set +e
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C TZ=UTC "$MRK_MACOS_WORK/acl-probe" "$MRK_MACOS_WORK/acl-probe-data" 2>&1 \
            | /usr/bin/tail -c 131072 > "$MRK_MACOS_WORK/native-acl-probe.log"
          probe_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${probe_status[*]}" > "$MRK_MACOS_WORK/native-acl-probe.status"
          probe_status_saved=$?
          # The completed one-shot probe owns no worker. Retire its known
          # executable now; on failure retain any unresolved fixture originals.
          binary_cleanup=1
          if [[ -f "$MRK_MACOS_WORK/acl-probe" && ! -L "$MRK_MACOS_WORK/acl-probe" && -O "$MRK_MACOS_WORK/acl-probe" ]] &&
             [[ "$(/usr/bin/stat -f '%d:%i:%u:%g:%p:%l:%z:%m:%c' "$MRK_MACOS_WORK/acl-probe")" == "$binary_identity" ]]; then
            /bin/rm -- "$MRK_MACOS_WORK/acl-probe"
            binary_cleanup=$?
          fi
          directory_cleanup=not-attempted
          if [[ ${#probe_status[@]} == 2 && ${probe_status[0]} == 0 && ${probe_status[1]} == 0 ]]; then
            directory_cleanup=1
            if [[ -d "$MRK_MACOS_WORK/acl-probe-data" && ! -L "$MRK_MACOS_WORK/acl-probe-data" && -O "$MRK_MACOS_WORK/acl-probe-data" ]] &&
               [[ "$(/usr/bin/stat -f '%d:%i:%u:%g:%p' "$MRK_MACOS_WORK/acl-probe-data")" == "$directory_identity" ]]; then
              /bin/rmdir -- "$MRK_MACOS_WORK/acl-probe-data"
              directory_cleanup=$?
            fi
          fi
          printf '%s %s\n' "$binary_cleanup" "$directory_cleanup" > "$MRK_MACOS_WORK/native-acl-cleanup.status"
          cleanup_status_saved=$?
          set -e
          [[ ${#probe_status[@]} == 2 ]]
          if [[ ${probe_status[0]} != 0 ]]; then exit "${probe_status[0]}"; fi
          [[ ${probe_status[1]} == 0 && $probe_status_saved == 0 && $cleanup_status_saved == 0 && $binary_cleanup == 0 && $directory_cleanup == 0 ]]
          "$MRK_PYTHON" -I -S -B - <<'PYDATA'
          import hashlib, json, os, re, stat
          root = os.environ["MRK_MACOS_WORK"]
          def read(name, limit):
              fd = os.open(os.path.join(root, name), os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit: raise ValueError("ACL probe output refused")
                  body = os.read(fd, limit + 1)
                  after = os.fstat(fd)
                  sig = lambda s: (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_uid,s.st_gid,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  if sig(before) != sig(after) or len(body) != before.st_size: raise ValueError("ACL probe output changed")
                  return body
              finally: os.close(fd)
          logs = {}
          for name in ("native-acl-compile", "native-acl-probe"):
              if read(name + ".status", 32) != b"0 0\n": raise ValueError("original ACL pipeline failed")
              body = read(name + ".log", 131072)
              logs[name] = {"bytes":len(body), "sha256":hashlib.sha256(body).hexdigest(), "pipelineStatuses":[0,0], "retention":"bounded-original-tail"}
          if read("native-acl-cleanup.status", 64) != b"0 0\n": raise ValueError("ACL cleanup unresolved")
          names = ["parent-no-ace", "fresh-file-no-acl", "fresh-directory-no-acl", "explicit-empty-no-ace", "real-ace-refused", "invalid-fd-refused"]
          lines = read("native-acl-probe.log", 131072).decode("utf-8", "strict").splitlines()
          if len(lines) != len(names) + 1: raise ValueError("ACL probe output count")
          for name, line in zip(names, lines):
              if not re.fullmatch(r"MRK_ACL_PROBE_CASE=" + re.escape(name) + r";ok=1;phase=[0-9]{1,2};result=[0-9]{1,10};call=-?[0-9]{1,10};errno=[0-9]{1,10};freeCall=0;freeErrno=0", line):
                  raise ValueError("ACL probe exact case missing")
          if lines[-1] != "MRK_ACL_PROBE_FINAL=cases=6;cleanup=1;passed=1": raise ValueError("ACL probe finality missing")
          source_paths = ("desktop/native/macos-installed-native/src/native.m", "desktop/native/macos-installed-native/tests/acl_probe.m")
          hashes = {}
          for path in source_paths:
              with open(path, "rb") as stream: body = stream.read(131073)
              if len(body) > 131072: raise ValueError("ACL source bound")
              hashes[path] = hashlib.sha256(body).hexdigest()
          value = {"schemaVersion":1, "source":os.environ["GITHUB_SHA"], "workflowSource":os.environ["GITHUB_WORKFLOW_SHA"],
                   "runId":os.environ["GITHUB_RUN_ID"], "runAttempt":os.environ["GITHUB_RUN_ATTEMPT"],
                   "nativeSourceSha256":hashes, "cases":names, "logs":logs, "cleanup":"checked-original-closes-fixed-entry-retirement",
                   "qualification":"native-acl-primitive-only-not-Installer-runtime-Aqua-or-Save"}
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if len(data) > 16384: raise ValueError("ACL result bound")
          fd = os.open(os.path.join(root, "native-acl-probe-result.json"), os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(data); stream.flush(); os.fsync(stream.fileno())
          PYDATA
      - name: Acquire and verify the two fixed Android support archives as DATA
        timeout-minutes: 4
