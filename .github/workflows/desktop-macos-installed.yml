              for row in inventory["files"]:
                  if (type(row) is not dict or set(row) != {"path", "gitMode", "blob", "size", "sha256"}
                          or type(row["path"]) is not str or not 0 < len(row["path"].encode("utf-8")) <= 1024
                          or "\x00" in row["path"] or any(part in ("", ".", "..") for part in row["path"].split("/"))
