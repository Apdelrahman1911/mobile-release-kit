name: Desktop macOS read-only original-panel probe

on:
  push:
    branches: [verify/desktop-macos-panel-probe]

permissions:
  contents: read

concurrency:
  group: desktop-macos-panel-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  panel-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-panel-probe'
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Admit this one credential-free native diagnostic route
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == ARM64 ]]
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/verify/desktop-macos-panel-probe ]]
          [[ "$GITHUB_REPOSITORY" == Apdelrahman1911/mobile-release-kit && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_SHA" == '${{ github.event.after }}' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-panel-probe.yml@$GITHUB_REF" ]]
          [[ "$(/usr/bin/uname -m)" == arm64 && "$(/usr/bin/sw_vers -productVersion)" == 26.* && "$(/usr/bin/id -u)" != 0 ]]
      - name: Check out exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select only the DATA adapter interpreter
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Compile the tiny probe and run once through the original command owner
        id: observation
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          root="/private/tmp/mrk-macos-panel-probe-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$root" && ! -L "$root" ]]
          printf 'evidence=%s/evidence\n' "$root" >> "$GITHUB_OUTPUT"
          [[ "$(git -c core.fsmonitor=false rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignored)" ]]
          "$MRK_PYTHON" -I -S -B desktop/tools/macos_panel_reachability.py
      - name: Confirm no source or checkout outputs changed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -c core.fsmonitor=false rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignored)" ]]
      - name: Retain only the closed normalized observation report
        if: always() && steps.observation.outputs.evidence != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-panel-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.observation.outputs.evidence }}/result.json
          if-no-files-found: error
          retention-days: 14
