name: Desktop public Installer certificate chain comparison only

on:
  push:
    branches:
      - verify/desktop-macos-installer-chain

permissions:
  contents: read

concurrency:
  group: desktop-macos-installer-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-installer-chain'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed source without retained credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare only the three public certificate originals
        id: probe
        timeout-minutes: 2
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +x
          set -euo pipefail
          set -o noclobber
          umask 077
          /usr/bin/python3 -I -S -B desktop/tools/macos_installer_chain_probe.py > installer-chain-public.json
      - name: Retain only the closed comparison observation
        if: steps.probe.outcome == 'success'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-chain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: installer-chain-public.json
          if-no-files-found: error
          retention-days: 14
