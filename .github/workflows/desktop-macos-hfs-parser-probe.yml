name: Observe tiny original HFS readonly parser facts

on:
  push:
    branches: [verify/desktop-macos-hfs-parser-probe]
permissions:
  contents: read
concurrency:
  group: desktop-macos-hfs-parser-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hfs-parser:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/desktop-macos-hfs-parser-probe'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Select the existing supported public CI interpreter
        id: python
        timeout-minutes: 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Check out exact reviewed source without retained credentials
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Observe only synthetic readonly HFS DATA and retire originals
        id: probe
        timeout-minutes: 4
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MRK_HFS_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_HFS_TARGET: ${{ matrix.target }}
          MRK_PUSH_EVENT_AFTER: ${{ github.event.after }}
          MRK_HFS_SOURCE_SHA256: 57bd5c4f9cc43a921228fe5d2b46849ab8214797722fb56c348c4d1a83b0e359
        run: |
          set +x
          set +a
          set -euo pipefail
          umask 077
          "${MRK_HFS_PYTHON}" -I -S -B desktop/tools/macos_hfs_readonly_parser_probe.py
      - name: Preserve only the closed finite parser observation
        if: always() && hashFiles('hfs-parser-public.json') != ''
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hfs-parser-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hfs-parser-public.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
