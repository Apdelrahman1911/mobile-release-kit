name: Mac normal compilation only

on:
  push:
    branches: [verify/desktop-macos-normal-compile]
    paths:
      - desktop/**
      - src/mobile_release/**
      - tests/desktop/**
      - .github/workflows/desktop-macos-normal-compile.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed verification commit (no app or native test execution)
        required: true
        type: string
      target:
        description: Fixed compiler rows (both full graphs, or remaining Intel plus ARM vault)
        required: false
        type: choice
        default: both
        options: [both, arm, intel, remaining]

permissions:
  contents: read

concurrency:
  group: desktop-macos-normal-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile only / ${{ matrix.target }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.target == 'remaining' && '[{"platform":"macos","os":"macos-26","target":"aarch64-apple-darwin","mode":"vault-only"},{"platform":"macos","os":"macos-26-intel","target":"x86_64-apple-darwin","mode":"full4"}]' || inputs.target == 'arm' && '[{"platform":"macos","os":"macos-26","target":"aarch64-apple-darwin","mode":"full4"}]' || inputs.target == 'intel' && '[{"platform":"macos","os":"macos-26-intel","target":"x86_64-apple-darwin","mode":"full4"}]' || '[{"platform":"macos","os":"macos-26","target":"aarch64-apple-darwin","mode":"full4"},{"platform":"macos","os":"macos-26-intel","target":"x86_64-apple-darwin","mode":"full4"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.target == 'x86_64-apple-darwin' && 120 || matrix.mode == 'full4' && 50 || 45 }}
    env:
      MRK_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MRK_MACOS_TARGET: ${{ matrix.target }}
      MRK_MACOS_COMPILE_MODE: ${{ matrix.mode }}
      MRK_DESKTOP_HOSTED_CHECKS: macos-normal-compile-v1
      MRK_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MRK_COMPILE_SELECTION: ${{ inputs.target || 'both' }}
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Require exact disposable verification source
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_REF" == refs/heads/verify/desktop-macos-normal-compile ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/desktop-macos-normal-compile.yml@$GITHUB_REF" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MRK_EXPECTED_SHA" == "$GITHUB_SHA" ]]
            case "$MRK_COMPILE_SELECTION" in
              both) [[ "$MRK_MACOS_COMPILE_MODE" == full4 ]] ;;
              arm) [[ "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$MRK_MACOS_COMPILE_MODE" == full4 ]] ;;
              intel) [[ "$MRK_MACOS_TARGET" == x86_64-apple-darwin && "$MRK_MACOS_COMPILE_MODE" == full4 ]] ;;
              remaining) [[ ( "$MRK_MACOS_TARGET" == aarch64-apple-darwin && "$MRK_MACOS_COMPILE_MODE" == vault-only ) || ( "$MRK_MACOS_TARGET" == x86_64-apple-darwin && "$MRK_MACOS_COMPILE_MODE" == full4 ) ]] ;;
              *) exit 1 ;;
            esac
          else
            [[ "$GITHUB_EVENT_NAME" == push && "$MRK_COMPILE_SELECTION" == both && "$MRK_MACOS_COMPILE_MODE" == full4 ]]
          fi
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed helper Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Select fixed frontend compiler
        if: matrix.mode == 'full4'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Prepare exact compiler-only source bindings
        id: prepare
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py prepare'
      - name: Acquire locked active-platform inputs without npm scripts
        timeout-minutes: 15
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py acquire'
      - name: Compile selected graphs without launching outputs
        timeout-minutes: ${{ matrix.target == 'x86_64-apple-darwin' && 92 || matrix.mode == 'full4' && 32 || 25 }}
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py compile'
      - name: Retain only the three public compile receipts
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-normal-compile-${{ matrix.target }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/public-bindings.json
            ${{ steps.prepare.outputs.root }}/acquire-checks.json
            ${{ steps.prepare.outputs.root }}/compile-checks.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
      - name: Immediately remove positively settled compiler outputs
        if: success()
        shell: bash
        env:
          MRK_PYTHON: ${{ steps.python.outputs.python-path }}
          MRK_DESKTOP_CI_ROOT: ${{ steps.prepare.outputs.root }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: '"$MRK_PYTHON" -I -S -B desktop/tools/ci_foundation.py clean'
