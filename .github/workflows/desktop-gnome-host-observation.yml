                    need(ident(at(row["path"])) == row["stat"])
                elif row["kind"] == "absent":
                    try:
                        at(row["path"])
                    except FileNotFoundError:
                        pass
                    else:
                        raise Refused()
            for row in DIRECTORIES.values():
                need(ident(at(row["path"])) == row["stat"])
            value = {"schema": "mrk-gnome-host-observation-1", "scope": "candidate-only-no-admission",
                     "binding": binding(e, event_digest), "facts": facts, "python": py,
                     "files": [ROWS[p] for p in sorted(ROWS)],
                     "directories": [DIRECTORIES[p] for p in sorted(DIRECTORIES)],
                     "packageVersions": versions, "configuration": config, "gaps": GAPS,
                     "readBytes": {"total": BODY, "metadata": META},
                     "bootstrapTrust": P["bootstrapTrust"], "nonClaims": P["nonClaims"],
                     "hostQualified": False, "nativeQualified": False,
                     "original": {"directories": dirs, "captures": captures,
                                  "observerArgv": ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"]}}
            raw = canonical(value)
            need(len(raw) <= P["caps"]["outputBytes"])
            root = directory(scratch)
            try:
                output = write_owned(root, "observation.json", raw)
                index = {"schema": "mrk-gnome-host-observation-index-1", "binding": value["binding"],
                         "directories": dirs, "observation": output}
                write_owned(root, "index.json", canonical(index))
                os.fsync(root)
            finally:
                os.close(root)
        
        
        def public_observation(value, expected_binding):
            """Reject foreign or widened return DTOs before emitting any body."""
            need(set(value) == {"schema", "scope", "binding", "facts", "python", "files", "directories",
                "packageVersions", "configuration", "gaps", "readBytes", "bootstrapTrust", "nonClaims",
                "hostQualified", "nativeQualified", "original"})
            need(value["schema"] == "mrk-gnome-host-observation-1" and value["scope"] == "candidate-only-no-admission")
            need(value["binding"] == expected_binding and value["hostQualified"] is False and value["nativeQualified"] is False)
            need(value["bootstrapTrust"] == P["bootstrapTrust"] and value["nonClaims"] == P["nonClaims"])
            digest_ok = lambda s: type(s) is str and re.fullmatch(r"[0-9a-f]{64}", s) is not None
            stat_ok = lambda s: type(s) is dict and set(s) == set(STAT_KEYS) and all(type(v) is int for v in s.values())
            facts = value["facts"]
            need(set(facts) == {"kernel", "osRelease", "uid", "gid"} and facts["uid"] == os.getuid() and facts["gid"] == os.getgid())
            need(set(facts["kernel"]) == {"system", "release", "machine"}
                 and all(re.fullmatch(r"[A-Za-z0-9_.+-]{1,128}", v) for v in facts["kernel"].values()))
            need(set(facts["osRelease"]) <= {"ID", "VERSION_ID", "VERSION_CODENAME", "BUILD_ID"}
                 and all(re.fullmatch(r"[A-Za-z0-9_.+-]{1,64}", v) for v in facts["osRelease"].values()))
            py = value["python"]
            need(set(py) == {"selectionMatches", "selected", "search", "version", "flags", "pycachePrefixAbsent",
                "modules", "kernelExecutableMatchesNamedBody", "kernelExecutableTextSha256", "bytecodeCount", "moduleEvidenceScope"})
            need(all(type(py[k]) is bool for k in ("selectionMatches", "pycachePrefixAbsent", "kernelExecutableMatchesNamedBody")))
            need(digest_ok(py["kernelExecutableTextSha256"]) and type(py["bytecodeCount"]) is int and 0 <= py["bytecodeCount"] <= P["caps"]["paths"])
            need(py["moduleEvidenceScope"] == "diagnostic-import-metadata-only; cachedHint-not-proof-of-pyc-consumption; no-C-A-W-imports")
            need(set(py["selected"]) == {"executable", "baseExecutable", "prefix", "basePrefix", "execPrefix", "baseExecPrefix"})
            for row in py["selected"].values():
                need(set(row) == {"matches", "textSha256"} and type(row["matches"]) is bool and digest_ok(row["textSha256"]))
            need(type(py["version"]) is list and len(py["version"]) == 3 and all(type(v) is int and 0 <= v < 1000 for v in py["version"]))
            need(set(py["flags"]) == {"isolated", "no_site", "ignore_environment", "optimize", "dont_write_bytecode", "safe_path"}
                 and all(type(v) in (int, bool) and 0 <= v <= 2 for v in py["flags"].values()))
            need(type(py["search"]) is list and len(py["search"]) <= 16)
            for row in py["search"]:
                need(set(row) == {"path", "textSha256"} and (row["path"] is None or row["path"] in P["python"]["search"]) and digest_ok(row["textSha256"]))
            need(type(py["modules"]) is list and len(py["modules"]) <= 512)
            for row in py["modules"]:
                need(set(row) == {"name", "file", "cachedHint", "originClass"} and re.fullmatch(r"[A-Za-z0-9_.]{1,160}", row["name"]))
                need(row["originClass"] in ("built-in", "frozen", "file", "unknown"))
                need(all(row[k] is None or (path_ok(row[k]) and row[k].startswith(P["python"]["root"] + "/")) for k in ("file", "cachedHint")))
            config = value["configuration"]
            need(set(config) == {"hostsProviderClasses", "hostsTokensRecognized", "selectionScope"}
                 and type(config["hostsTokensRecognized"]) is bool and len(config["hostsProviderClasses"]) <= 64
                 and all(v in ("files", "dns", "resolve", "myhostname") for v in config["hostsProviderClasses"]))
            need(config["selectionScope"] == "digests-and-limited-hosts-token-classification; config-includes-cache-provider-selection-unproved")
            need(set(value["readBytes"]) == {"total", "metadata"}
                 and type(value["readBytes"]["total"]) is int and 0 <= value["readBytes"]["total"] <= P["caps"]["bodyBytes"]
                 and type(value["readBytes"]["metadata"]) is int and 0 <= value["readBytes"]["metadata"] <= P["caps"]["metadataBytes"])
            original = value["original"]
            need(set(original) == {"directories", "captures", "observerArgv"} and set(original["captures"]) == {"stdout.bin", "stderr.bin"})
            need(original["observerArgv"] == ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"])
            need(all(stat_ok(v) for v in original["captures"].values()) and all(stat_ok(v) for v in original["directories"].values()))
            fixed = {x["path"] for x in P["files"]} | set(P["data"] + P["expectedAbsent"] + P["metadata"]
                + P["configFiles"] + P["optionalResolverFiles"] + P["metadataOnlyDirectories"])
            fixed |= set(P["aliases"]) | set(P["rootAliases"]) | set(P["configAliases"])
            allowed = lambda p: path_ok(p) and (p in fixed or any(p == t["path"] or p.startswith(t["path"] + "/") for t in P["trees"]))
            need(type(value["files"]) is list and len(value["files"]) <= P["caps"]["paths"])
            paths = [r["path"] for r in value["files"]]
            need(paths == sorted(set(paths)))
            for row in value["files"]:
                need(set(row) == FILE_KEYS and allowed(row["path"]))
                need(row["kind"] in ("regular", "alias", "directory", "nonordinary", "absent", "unavailable", "oversize", "budget", "present-unread"))
                need(row["stat"] is None or stat_ok(row["stat"]))
                need(all(row[k] is None or re.fullmatch(r"[0-9a-f]{64}", row[k]) for k in ("sha256", "aliasTextSha256")))
                need(row["aliasTarget"] is None or path_ok(row["aliasTarget"]))
                need(row["aliasText"] is None or (type(row["aliasText"]) is str and len(row["aliasText"]) <= 512
                     and re.fullmatch(r"[A-Za-z0-9_./+@=-]+", row["aliasText"]) and row["aliasTarget"] is not None))
                if row["aliasText"] is not None:
                    link = row["aliasText"]
                    need(hashlib.sha256(link.encode()).hexdigest() == row["aliasTextSha256"])
                    need(os.path.normpath(os.path.join(os.path.dirname(row["path"]), link)) == row["aliasTarget"])
                    fixed_links = {**P["rootAliases"], **P["aliases"]}
                    need(fixed_links.get(row["path"]) == link or link in P["configAliases"].get(row["path"], [])
                         or (row["path"] == "/etc/os-release" and link in ("../usr/lib/os-release", "/usr/lib/os-release"))
                         or (any(row["path"].startswith(t["path"] + "/") for t in P["trees"]) and row["aliasTarget"] in paths))
                need(type(row["readBytes"]) is int and 0 <= row["readBytes"] <= P["caps"]["fileBytes"])
                need(row["referenceMatch"] is None or type(row["referenceMatch"]) is bool)
                header = row["pycHeader"]
                need(header is None or (set(header) == {"magic", "flags", "payload8Hex", "classification"}
                     and re.fullmatch(r"[0-9a-f]{8}", header["magic"]) and re.fullmatch(r"[0-9a-f]{16}", header["payload8Hex"])
                     and type(header["flags"]) is int and header["classification"] in ("hash", "timestamp", "unknown")))
            need(type(value["directories"]) is list and len(value["directories"]) <= 1024)
            need([r["path"] for r in value["directories"]] == sorted({r["path"] for r in value["directories"]}))
            for row in value["directories"]:
                need(set(row) == {"path", "stat", "entries", "completeNames", "scope"} and allowed(row["path"]))
                need(stat_ok(row["stat"]) and type(row["completeNames"]) is bool)
                need(row["scope"] in [t["scope"] for t in P["trees"]] + ["provider-directory-metadata-only"])
                need(len(row["entries"]) <= P["caps"]["directoryEntries"] and all(name_ok(n) for n in row["entries"])
                     and row["entries"] == sorted(set(row["entries"])))
            need(len(value["gaps"]) <= P["caps"]["gaps"])
            for code, subject in value["gaps"]:
                need(code in GAP_CODES and (allowed(subject) or subject in ("runtime", "modules", "kernel-executable", "provider-image") or subject in P["packages"]))
            for key, row in value["packageVersions"].items():
                name, sep, arch = key.rpartition(":")
                need(sep and name in P["packages"] and arch in ("amd64", "all") and set(row) == {"version", "architecture"})
                need(row["architecture"] == arch and re.fullmatch(r"[A-Za-z0-9_.+:~=-]{1,96}", row["version"]))
            return value
        
        
        def return_data(e, scratch, event_digest):
            root = directory(scratch)
            try:
                root_stat = os.fstat(root)
                need(root_stat.st_uid == os.getuid() and stat.S_IMODE(root_stat.st_mode) == 0o700
                     and ident(root_stat) == ident(at(scratch)))
                wait_raw, wait_pin = read_owned(root, "wait.json", 4096)
                wait = decode(wait_raw, True)
                need(set(wait) == {"schema", "status", "startUnix", "endUnix"} and wait["schema"] == "mrk-gnome-host-observer-wait-1")
                need(type(wait["status"]) is int and 0 <= wait["status"] <= 255)
                need(all(re.fullmatch(r"[0-9]{10,12}\.[0-9]{6}", wait[k]) for k in ("startUnix", "endUnix")))
                need(int(wait["endUnix"].replace(".", "")) >= int(wait["startUnix"].replace(".", "")))
                if wait["status"] != 0:
                    os.write(1, ("MRK-GNOME ORIGINAL-WAIT-NONZERO " + str(wait["status"]) + "\n").encode())
                    return wait["status"]
                index_raw, index_pin = read_owned(root, "index.json", 65536)
                index = decode(index_raw, True)
                expected_binding = binding(e, event_digest)
                need(set(index) == {"schema", "binding", "directories", "observation"})
                need(index["schema"] == "mrk-gnome-host-observation-index-1" and index["binding"] == expected_binding)
                current = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin", "wait.json", "observation.json", "index.json"})
                need(set(current) == set(index["directories"]))
                need(all(owned_identity(current[p], index["directories"][p]) for p in current))
                raw, pin = read_owned(root, "observation.json", P["caps"]["outputBytes"], index["observation"])
                value = public_observation(decode(raw, True), expected_binding)
                need(value["original"]["directories"] == index["directories"])
                captures = {}
                for name in ("stdout.bin", "stderr.bin"):
                    capture, capture_pin = read_owned(root, name, 0)
                    need(capture == b"" and capture_pin["stat"] == value["original"]["captures"][name])
                    captures[name] = capture_pin
                # Pending return wait/disposal is explicit. Neither is self-certified.
                receipt = {"schema": "mrk-gnome-host-return-1", "binding": expected_binding,
                           "observation": pin, "index": index_pin, "originalWait": wait,
                           "waitFile": wait_pin, "emptyCaptures": captures,
                           "returnWait": "pending-original-shell-wait", "jobDisposal": "requires-provider-job-evidence"}
                bodies = [("observation.json", raw), ("return.json", canonical(receipt))]
                need(sum(len(b) for _, b in bodies) <= P["caps"]["outputBytes"] + 16384)
                frames, summary = [], []
                for number, (name, body) in enumerate(bodies, 1):
                    digest, parts = hashlib.sha256(body).hexdigest(), (len(body) + 3071) // 3072
                    frames.append(f"MRK-GNOME BEGIN {number} {name} {len(body)} {digest}\n".encode())
                    for part, offset in enumerate(range(0, len(body), 3072), 1):
                        frames.append(f"MRK-GNOME DATA {number} {part:06d} ".encode() + base64.b64encode(body[offset:offset + 3072]) + b"\n")
                    frames.append(f"MRK-GNOME END {number} {parts} {len(body)} {digest}\n".encode())
                    summary.append([number, name, len(body), parts, digest])
                frames.append(f"MRK-GNOME COMPLETE 2 {sum(len(b) for _, b in bodies)} {hashlib.sha256(canonical(summary)).hexdigest()}\n".encode())
                need(sum(map(len, frames)) <= P["caps"]["frameBytes"])
                for frame in frames:
                    view = memoryview(frame)
                    while view:
                        count = os.write(1, view)
                        need(count > 0)
                        view = view[count:]
                return 0
            finally:
                os.close(root)
        
        
        def main():
            os.umask(0o077)
            for key, value in ((resource.RLIMIT_AS, 512 * 2**20), (resource.RLIMIT_CPU, 60),
                               (resource.RLIMIT_NOFILE, 128), (resource.RLIMIT_FSIZE, 8 * 2**20),
                               (resource.RLIMIT_CORE, 0)):
                resource.setrlimit(key, (value, value))
            need(sys.argv in (["-", "observe"], ["-", "return"]))
            e, scratch, event_digest = context()
            if sys.argv[1] == "observe":
                observe(e, scratch, event_digest)
                return 0
            return return_data(e, scratch, event_digest)
        
        
        if __name__ == "__main__":
            try:
                status = main()
            except BaseException as error:
                # Closed errors, no paths, config/event text, environment or traceback.
                status = 72 if isinstance(error, Refused) else 73 if isinstance(error, OSError) else 74 if isinstance(error, (ValueError, UnicodeError)) else 75
                os.write(2, ("MRK-GNOME REFUSED " + str(status) + "\n").encode())
            sys.exit(status)
