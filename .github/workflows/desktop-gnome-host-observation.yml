            flags = int.from_bytes(prefix[4:8], "little")
            return {"magic": prefix[:4].hex(), "flags": flags,
                    "payload8Hex": prefix[8:16].hex(),
                    "classification": "hash" if flags in (1, 3) else "timestamp" if flags == 0 else "unknown"}
        
        
        def node(path, cap=None, metadata=False):
            """Hash an original regular descriptor; never execute, mmap or decode ELF."""
            global BODY, META
            if path in ROWS:
                row = ROWS[path]
                if row["stat"] is not None:
                    need(ident(at(path)) == row["stat"])
                else:
                    try:
                        at(path)
                    except OSError:
                        pass
                    else:
                        raise Refused()
                need(not metadata or row["kind"] != "regular" or path in RAW)
                return row
            need(len(ROWS) < P["caps"]["paths"] and path_ok(path))
            cap = P["caps"]["fileBytes"] if cap is None else cap
            row = dict(zip(FILE_KEYS, [None] * len(FILE_KEYS)))
            row.update(path=path, kind="unavailable", readBytes=0)
            try:
                before = at(path)
                row["stat"] = ident(before)
                if stat.S_ISREG(before.st_mode):
                    row["kind"] = "regular"
                    if not 0 <= before.st_size <= cap:
                        row["kind"] = "oversize"
                        gap("BUDGET", path)
                    elif BODY + before.st_size + 1 > P["caps"]["bodyBytes"] or (
                            metadata and META + before.st_size + 1 > P["caps"]["metadataBytes"]):
                        row["kind"] = "budget"
                        gap("BUDGET", path)
                    else:
                        pfd, name = parent(path)
                        fd = None
                        try:
                            fd = os.open(name, F, dir_fd=pfd)
                            need(ident(os.fstat(fd)) == ident(before))
                            digest, raw, prefix, size = hashlib.sha256(), bytearray(), bytearray(), 0
                            while size < before.st_size:
                                chunk = os.read(fd, min(65536, before.st_size - size))
                                need(chunk)
                                size += len(chunk)
                                BODY += len(chunk)
                                META += len(chunk) if metadata else 0
                                digest.update(chunk)
                                prefix.extend(chunk[:max(0, 16 - len(prefix))])
                                if metadata:
                                    raw.extend(chunk)
                            need(os.read(fd, 1) == b"")
                            need(ident(before) == ident(os.fstat(fd)) == ident(at(path)))
                            row.update(sha256=digest.hexdigest(), readBytes=size)
                            if metadata:
                                RAW[path] = bytes(raw)
                            if path.endswith(".pyc"):
                                row["pycHeader"] = pyc_header(bytes(prefix))
                                if row["pycHeader"] is None or row["pycHeader"]["classification"] == "unknown":
                                    gap("PYC_HEADER", path)
                        finally:
                            if fd is not None:
                                os.close(fd)
                            os.close(pfd)
                elif stat.S_ISLNK(before.st_mode):
                    row["kind"] = "alias"
                    need(before.st_size <= P["caps"]["aliasBytes"])
                    need(META + 4096 <= P["caps"]["metadataBytes"] and BODY + 4096 <= P["caps"]["bodyBytes"])
                    pfd, name = parent(path)
                    try:
                        link = os.readlink(name, dir_fd=pfd)
                    finally:
                        os.close(pfd)
                    raw = os.fsencode(link)
                    need(len(raw) <= P["caps"]["aliasBytes"] and ident(before) == ident(at(path)))
                    BODY += len(raw)
                    META += len(raw)
                    LINKS[path] = link
                    row["aliasTextSha256"] = hashlib.sha256(raw).hexdigest()
                else:
                    row["kind"] = "directory" if stat.S_ISDIR(before.st_mode) else "nonordinary"
                need(ident(before) == ident(at(path)))
            except OSError as exc:
                need(exc.errno in (errno.ENOENT, errno.EACCES, errno.EPERM, errno.ENOTDIR, errno.ELOOP))
                row.update(kind="absent" if exc.errno == errno.ENOENT else "unavailable", stat=None)
            ROWS[path] = row
            return row
        
        
        def regular(path, cap=None, metadata=False, optional=False):
            row = node(path, cap, metadata)
            if row["kind"] != "regular" and not (optional and row["kind"] == "absent"):
                gap("BODY_UNAVAILABLE", path)
            if row["stat"] and (row["stat"]["uid"] != 0 or row["stat"]["gid"] != 0
                                 or row["stat"]["mode"] & 0o022):
                gap("OWNER_MODE", path)
            return row
        
        
        def tree(spec):
            """Bounded roster only under a frozen search root; directory aliases stop."""
            root, pending, nodes, dirs, charged = spec["path"], [(spec["path"], 0)], 0, 0, 0
            while pending:
                path, depth = pending.pop()
                try:
                    fd = directory(path)
                except OSError as exc:
                    need(exc.errno in (errno.ENOENT, errno.EACCES, errno.EPERM, errno.ENOTDIR, errno.ELOOP))
                    node(path)
                    gap("DIRECTORY_UNAVAILABLE", path)
                    continue
                try:
                    before = ident(os.fstat(fd))
                    need(dirs < spec["dirs"])
                    dirs += 1
                    names = entries(fd, min(spec["nodes"], P["caps"]["directoryEntries"]))
                    need(nodes + len(names) <= spec["nodes"])
                    nodes += len(names)
                    # Invalid names are not exported, followed, or interpreted.
                    public = [name for name in names if name_ok(name)]
                    if len(public) != len(names):
                        gap("TREE_ENTRY", path)
                    DIRECTORIES[path] = {"path": path, "stat": before, "entries": public,
                                         "completeNames": len(public) == len(names), "scope": spec["scope"]}
                    if before["uid"] != 0 or before["gid"] != 0 or before["mode"] & 0o022:
                        gap("OWNER_MODE", path)
                    for name in public:
                        child = path + "/" + name
                        if not path_ok(child):
                            gap("TREE_ENTRY", path)
                            continue
                        s = os.stat(name, dir_fd=fd, follow_symlinks=False)
                        if stat.S_ISDIR(s.st_mode):
                            if depth >= spec["depth"] or dirs + len(pending) >= spec["dirs"]:
                                gap("BUDGET", child)
                                node(child)
                            else:
                                pending.append((child, depth + 1))
                            continue
                        # Only public cert/config suffixes are body-readable outside Python.
                        suffix_ok = (spec["scope"] == "python-search-roster" or stat.S_ISLNK(s.st_mode)
                                     or name.endswith((".crt", ".pem", ".conf")))
                        if not suffix_ok:
                            gap("TREE_ENTRY", child)
                            continue
                        if stat.S_ISREG(s.st_mode) and charged + s.st_size > spec["bodyBytes"]:
                            gap("BUDGET", child)
                            continue
                        charged += s.st_size if stat.S_ISREG(s.st_mode) else 0
                        regular(child, min(P["caps"]["fileBytes"], spec["bodyBytes"])) if not stat.S_ISLNK(s.st_mode) else node(child)
                    need(ident(os.fstat(fd)) == before == ident(at(path)))
                finally:
                    os.close(fd)
        
        
        def aliases():
            fixed = {**P["rootAliases"], **P["aliases"]}
            for path, link in sorted(LINKS.items()):
                row = ROWS[path]
                dest = os.path.normpath(os.path.join(os.path.dirname(path), link))
                good = fixed.get(path) == link or link in P["configAliases"].get(path, [])
                if path == "/etc/os-release":
                    good = link in ("../usr/lib/os-release", "/usr/lib/os-release")
                in_tree = any(path.startswith(t["path"] + "/") for t in P["trees"])
                # A tree alias may point only to an independently enumerated regular
                # file or another enumerated public CA alias, never a new directory.
                if in_tree and path_ok(dest) and dest in ROWS:
                    target = dest
                    seen = set()
                    while target in LINKS and target not in seen and len(seen) < 8:
                        seen.add(target)
                        target = os.path.normpath(os.path.join(os.path.dirname(target), LINKS[target]))
                    good = (target in ROWS and ROWS[target]["kind"] == "regular"
                            and (not path.startswith(P["python"]["root"] + "/") or not seen))
                if good and path_ok(dest) and re.fullmatch(r"[A-Za-z0-9_./+@=-]+", link):
                    row.update(aliasText=link, aliasTarget=dest)
                else:
                    gap("ALIAS_UNKNOWN", path)
        
        
        def python_runtime():
            py = P["python"]
            expected_flags = {"isolated": 1, "no_site": 1, "ignore_environment": 1,
                              "optimize": 0, "dont_write_bytecode": 1, "safe_path": True}
            actual_flags = {key: getattr(sys.flags, key) for key in expected_flags}
            values = {"executable": sys.executable, "baseExecutable": getattr(sys, "_base_executable", None),
                      "prefix": sys.prefix, "basePrefix": sys.base_prefix,
                      "execPrefix": sys.exec_prefix, "baseExecPrefix": sys.base_exec_prefix}
            selected = {key: {"matches": value == (py["executable"] if "Executable" in key or key == "executable" else py["prefix"]),
                              "textSha256": hashlib.sha256(str(value).encode()).hexdigest()} for key, value in values.items()}
            search = [{"path": p if p in py["search"] else None,
                       "textSha256": hashlib.sha256(str(p).encode()).hexdigest()} for p in sys.path]
            need(len(search) <= 16)
            selection_matches = (all(x["matches"] for x in selected.values()) and list(sys.path) == py["search"]
                                 and actual_flags == expected_flags and sys.pycache_prefix is None
                                 and sys.implementation.name == py["implementation"]
                                 and sys.implementation.cache_tag == py["cacheTag"])
            if not selection_matches:
                gap("PYTHON_SELECTION", "runtime")
            modules = []
            for name, module in sorted(tuple(sys.modules.items())):
                need(len(modules) < 512 and re.fullmatch(r"[A-Za-z0-9_.]{1,160}", name))
                if name == "__main__":
                    continue
                data = vars(module) if module is not None else {}
                path, cached = data.get("__file__"), data.get("__cached__")
                spec = data.get("__spec__")
                origin = getattr(spec, "origin", None)
                public = lambda value: value if type(value) is str and path_ok(value) and value.startswith(py["root"] + "/") else None
                if path is not None and public(path) is None:
                    gap("PYTHON_SELECTION", "modules")
                modules.append({"name": name, "file": public(path), "cachedHint": public(cached),
                                "originClass": origin if origin in ("built-in", "frozen") else "file" if public(path) else "unknown"})
            # Kernel-owned own-process link is the sole proc exception. No process scan.
            proc, link, exe_stat = directory("/proc"), None, None
            try:
                need(os.readlink("self", dir_fd=proc) == str(os.getpid()))
                own = os.open(str(os.getpid()), D, dir_fd=proc)
                try:
                    before = ident(os.stat("exe", dir_fd=own, follow_symlinks=False))
                    link = os.readlink("exe", dir_fd=own)
                    need(len(os.fsencode(link)) <= 512)
                    if link == py["executable"]:
                        exe_stat = ident(os.stat("exe", dir_fd=own, follow_symlinks=True))
                    need(ident(os.stat("exe", dir_fd=own, follow_symlinks=False)) == before)
                finally:
                    os.close(own)
            finally:
                os.close(proc)
            body = ROWS.get(py["executable"], {}).get("stat")
            exe_matches = exe_stat is not None and body == exe_stat
            if not exe_matches:
                gap("PYTHON_SELECTION", "kernel-executable")
            gap("PYTHON_ROSTER_REVIEW", py["root"])
            return {"selectionMatches": selection_matches, "selected": selected, "search": search,
                    "version": list(sys.version_info[:3]), "flags": actual_flags,
                    "pycachePrefixAbsent": sys.pycache_prefix is None, "modules": modules,
                    "kernelExecutableMatchesNamedBody": exe_matches,
                    "kernelExecutableTextSha256": hashlib.sha256(os.fsencode(link)).hexdigest(),
                    "bytecodeCount": sum(p.endswith(".pyc") for p in ROWS),
                    "moduleEvidenceScope": "diagnostic-import-metadata-only; cachedHint-not-proof-of-pyc-consumption; no-C-A-W-imports"}
        
        
        def packages():
            path = "/var/lib/dpkg/status"
            regular(path, P["caps"]["metadataFileBytes"], metadata=True)
            versions = {}
            raw = RAW.get(path)
            if raw is not None:
                try:
                    text = raw.decode("utf-8")
                except UnicodeError:
                    text = ""
                    gap("PACKAGE_METADATA", path)
                for stanza in text.split("\n\n"):
                    fields = {}
                    for line in stanza.splitlines():
                        if line.startswith((" ", "\t")):
                            continue
                        key, sep, value = line.partition(": ")
                        if sep and key in ("Package", "Status", "Version", "Architecture"):
                            need(key not in fields)
                            fields[key] = value
                    name = fields.get("Package")
                    if name not in P["packages"] or fields.get("Status") != "install ok installed":
                        continue
                    version, architecture = fields.get("Version", ""), fields.get("Architecture", "")
                    if not re.fullmatch(r"[A-Za-z0-9_.+:~=-]{1,96}", version) or architecture not in ("amd64", "all"):
                        gap("PACKAGE_METADATA", name)
                        continue
                    key = name + ":" + architecture
                    need(key not in versions)
                    versions[key] = {"version": version, "architecture": architecture}
            if not versions:
                gap("PACKAGE_METADATA", path)
            return versions
        
        
        def configuration():
            for path in P["configFiles"]:
                node(path, 65536, metadata=True)
                gap("CONFIG_REVIEW", path)
            for path in P["configAliases"]:
                node(path, 65536, metadata=True)
            # Only the hosts database is classified. Unknown tokens are withheld and
            # never converted into paths, includes, commands, or service operations.
            classes, known = [], True
            raw = RAW.get("/etc/nsswitch.conf")
            hosts = []
            try:
                text = (raw or b"").decode("utf-8")
            except UnicodeError:
                text, known = "", False
            for line in text.splitlines():
                line = line.split("#", 1)[0]
                key, sep, value = line.partition(":")
                if sep and key.strip() == "hosts":
                    hosts.append(value)
            if len(hosts) == 1:
                body = re.sub(r"\[[^\]\n]{0,128}\]", " ", hosts[0])
                for token in body.split():
                    if token in ("files", "dns", "resolve", "myhostname"):
                        if len(classes) < 64:
                            classes.append(token)
                        else:
                            known = False
                    else:
                        known = False
            else:
                known = False
            if not known:
                gap("NSS_SELECTION", "/etc/nsswitch.conf")
            for path in P["optionalResolverFiles"]:
                row = regular(path, optional=True)
                if row["kind"] != "absent":
                    gap("RESOLVER_PROVIDER_REVIEW", path)
            return {"hostsProviderClasses": classes, "hostsTokensRecognized": known,
                    "selectionScope": "digests-and-limited-hosts-token-classification; config-includes-cache-provider-selection-unproved"}
        
        
        def os_facts(e):
            uname = os.uname()
            need(all(re.fullmatch(r"[A-Za-z0-9_.+-]{1,128}", v) for v in (uname.sysname, uname.release, uname.machine)))
            alias = node("/etc/os-release", 65536, metadata=True)
            path = "/etc/os-release" if alias["kind"] == "regular" else "/usr/lib/os-release"
            node(path, 65536, metadata=True)
            fields = {}
            try:
                text = RAW.get(path, b"").decode("utf-8")
            except UnicodeError:
                text = ""
                gap("OS_METADATA", path)
            for line in text.splitlines():
                key, sep, value = line.partition("=")
                if sep and key in ("ID", "VERSION_ID", "VERSION_CODENAME", "BUILD_ID"):
                    value = value.strip('"')
                    if key in fields or re.fullmatch(r"[A-Za-z0-9_.+-]{1,64}", value) is None:
                        gap("OS_METADATA", path)
                        continue
                    fields[key] = value
            if not fields:
                gap("OS_METADATA", path)
            if {k: e[k] for k in P["historicalImage"]} != P["historicalImage"]:
                gap("IMAGE_DIFFERS", "provider-image")
            return {"kernel": {"system": uname.sysname, "release": uname.release, "machine": uname.machine},
                    "osRelease": fields, "uid": os.getuid(), "gid": os.getgid()}
        
        
        def context():
            e = dict(os.environ)
            fixed = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC",
                     "GITHUB_REPOSITORY": P["repository"], "GITHUB_REF": P["ref"],
                     "GITHUB_EVENT_NAME": P["event"], "GITHUB_RUN_ATTEMPT": P["attempt"],
                     "RUNNER_ENVIRONMENT": "github-hosted",
                     "GITHUB_EVENT_PATH": "/home/runner/work/_temp/_github_workflow/event.json"}
            need(set(e) == set(RUN_KEYS) | set(fixed) | {"HOME", "TMPDIR", "TMP", "TEMP", "MRK_GNO_SOURCE_SHA256"})
            need(all(e[k] == v for k, v in fixed.items()))
            need(re.fullmatch(r"[1-9][0-9]{0,19}", e["GITHUB_RUN_ID"]))
            need(re.fullmatch(r"(?!0{40}$)[0-9a-f]{40}", e["GITHUB_SHA"]))
            need(e["GITHUB_WORKFLOW_SHA"] == e["GITHUB_SHA"])
            need(e["GITHUB_WORKFLOW_REF"] == P["repository"] + "/" + P["workflow"] + "@" + P["ref"])
            need(re.fullmatch(r"[0-9a-f]{64}", e["MRK_GNO_SOURCE_SHA256"]))
            need(re.fullmatch(r"[A-Za-z0-9_.-]{1,32}", e["ImageOS"]))
            need(re.fullmatch(r"[0-9]{8}\.[0-9]{1,6}\.[0-9]{1,6}", e["ImageVersion"]))
            scratch = "/tmp/mrk-gnome-host-observe-" + e["GITHUB_RUN_ID"] + "-1"
            need(e["HOME"] == scratch + "/home" and os.getcwd() == scratch + "/neutral")
            need(all(e[k] == scratch + "/tmp" for k in ("TMPDIR", "TMP", "TEMP")))
            need(os.getuid() == os.geteuid() != 0 and os.getgid() == os.getegid())
            event_path = e["GITHUB_EVENT_PATH"]
            node(event_path, 2**20, metadata=True)
            event = decode(RAW.get(event_path, b""))
            need(event.get("deleted") is False and event.get("ref") == e["GITHUB_REF"]
                 and event.get("after") == e["GITHUB_SHA"] and type(event.get("repository")) is dict
                 and event["repository"].get("full_name") == e["GITHUB_REPOSITORY"])
            # The event body is discarded; only its digest is returned.
            event_digest = ROWS.pop(event_path)["sha256"]
            RAW.pop(event_path)
            return e, scratch, event_digest
        
        
        def binding(e, event_digest):
            return {"policySha256": POLICY_SHA256, "sourceSha256": e["MRK_GNO_SOURCE_SHA256"],
                    "run": {k: e[k] for k in RUN_KEYS}, "eventSha256": event_digest}
        
        
        def scratch_state(scratch, expected_names):
            result = {}
            for path in (scratch, scratch + "/home", scratch + "/tmp", scratch + "/neutral"):
                fd = directory(path)
                try:
                    s = ident(os.fstat(fd))
                    need(s["uid"] == os.getuid() and s["mode"] == 0o700 and s == ident(at(path)))
                    need(set(entries(fd, 12)) == (expected_names if path == scratch else set()))
                    result[path] = s
                finally:
                    os.close(fd)
            return result
        
        
        def write_owned(root, name, raw):
            need(len(raw) <= P["caps"]["outputBytes"])
            fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
                         0o600, dir_fd=root)
            try:
                view = memoryview(raw)
                while view:
                    count = os.write(fd, view)
                    need(count > 0)
                    view = view[count:]
                os.fsync(fd)
                need(ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                return {"stat": ident(os.fstat(fd)), "sha256": hashlib.sha256(raw).hexdigest()}
            finally:
                os.close(fd)
        
        
        def read_owned(root, name, cap, expected=None):
            before = os.stat(name, dir_fd=root, follow_symlinks=False)
            need(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid()
                 and stat.S_IMODE(before.st_mode) == 0o600 and before.st_nlink == 1 and before.st_size <= cap)
            fd = os.open(name, F, dir_fd=root)
            try:
                need(ident(os.fstat(fd)) == ident(before))
                raw = bytearray()
                while len(raw) < before.st_size:
                    chunk = os.read(fd, min(65536, before.st_size - len(raw)))
                    need(chunk)
                    raw.extend(chunk)
                need(os.read(fd, 1) == b"")
                need(ident(before) == ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                row = {"stat": ident(before), "sha256": hashlib.sha256(raw).hexdigest()}
                need(expected is None or row == expected)
                return bytes(raw), row
            finally:
                os.close(fd)
        
        
        def observe(e, scratch, event_digest):
            dirs = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin"})
