# PROPOSED SOURCE ONLY. Publication/dispatch/execution require separate root admission.
name: GNOME hosted supplier metadata observation
on:
  push:
    branches: [verify/desktop-gnome-host-observation]
permissions: {}
concurrency:
  group: gnome-host-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'push' && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      MRK_GNO_SOURCE_SHA256: f52ba1a41d8cc07918e98de41b0fc1305b40ecbc6d6f1a0887f2edeb7e1e9a1d
      MRK_GNO_PROGRAM: |-
        """Two fixed public Python alias texts; no target file observation or admission.
        
        Reuse the original provider bootstrap, private owner, foreground wait and return.
        Only the five protected original supplier parents and two readlinks are observed.
        """
        import base64
        import errno
        import hashlib
        import json
        import os
        import re
        import resource
        import stat
        import sys
        
        POLICY_SHA256 = "d645ade62ac5f45f310e549fc37bc9e61fe45c808576af4ef4294d4a3f6543a5"
        RUNTIME_POLICY_JSON = r'''{"attempt":"1","bootstrapTrust":"provider-managed disposable runner/OS, workflow shell, env/timeout/initial isolated Python; post-use hashes are not retroactive admission","caps":{"frameBytes":65536,"outputBytes":16384,"pathBytes":512},"event":"push","links":[{"basename":"libpython3.12.so","normalizedPublicTargetPrefix":"/usr/lib/x86_64-linux-gnu/","parent":"/usr/lib/python3.12/config-3.12-x86_64-linux-gnu","path":"/usr/lib/python3.12/config-3.12-x86_64-linux-gnu/libpython3.12.so","sha256":"925cccb5e8c295cbbf5acb9934ce6f6eccab5dcd459a53fb046278c06ea300ea","utf8Bytes":41},{"basename":"sitecustomize.py","normalizedPublicTargetPrefix":"/etc/python3.12/","parent":"/usr/lib/python3.12","path":"/usr/lib/python3.12/sitecustomize.py","sha256":"32f1de153f7e1e3f9b543ada197eb2630524868b92869513a393775d30c77cbd","utf8Bytes":32}],"nonClaims":["not a C/A/W or native fixture run","no initial interpreter self-authentication","no actual loader/cache mapping or unknown config/provider closure","no sudo/PAM/policy/account bodies or account reservation proof","no continuity to H0 or any later VM","no compiler-wide or service/runner/checkout/action/Node/Docker census","all future exact source/runtime/native/account/ownership gates remain required","exact two alias texts only; normalized targets are not target-file or ancestry evidence","no supplier directory listing, target stat/read, CA alias, proc read or body census"],"parents":["/","/usr","/usr/lib","/usr/lib/python3.12","/usr/lib/python3.12/config-3.12-x86_64-linux-gnu"],"ref":"refs/heads/verify/desktop-gnome-host-observation","repository":"Apdelrahman1911/mobile-release-kit","workflow":".github/workflows/desktop-gnome-host-observation.yml"}'''
        P = json.loads(RUNTIME_POLICY_JSON)
        D = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
        F = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
        ROWS, RAW = {}, {}
        STAT_KEYS = ("device", "inode", "mode", "uid", "gid", "links", "bytes",
                     "blocks", "mtimeNs", "ctimeNs")
        RUN_KEYS = ("GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA", "GITHUB_WORKFLOW_REF",
                    "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                    "GITHUB_EVENT_NAME", "RUNNER_ENVIRONMENT", "ImageOS", "ImageVersion")
        
        class Refused(Exception):
            pass
        
        
        def need(ok):
            if not ok:
                raise Refused()
        
        
        def canonical(value):
            return (json.dumps(value, sort_keys=True, ensure_ascii=True,
                               separators=(",", ":"), allow_nan=False) + "\n").encode("ascii")
        
        
        def unique(pairs):
            result = {}
            for key, value in pairs:
                need(key not in result)
                result[key] = value
            return result
        
        
        def decode(raw, canonical_only=False):
            value = json.loads(raw, object_pairs_hook=unique,
                               parse_constant=lambda _: (_ for _ in ()).throw(Refused()))
            need(type(value) is dict and (not canonical_only or canonical(value) == raw))
            return value
        
        
        def ident(s):
            return dict(zip(STAT_KEYS, (s.st_dev, s.st_ino, stat.S_IMODE(s.st_mode),
                s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_blocks, s.st_mtime_ns, s.st_ctime_ns)))
        
        
        def owned_identity(actual, expected):
            # Scratch directory contents change as our fixed files are created. This
            # relates only this original run, never an inode from a different VM/run.
            return all(actual[k] == expected[k] for k in ("device", "inode", "mode", "uid", "gid"))
        
        
        def path_ok(path):
            return (type(path) is str and 0 < len(path) <= P["caps"]["pathBytes"]
                    and re.fullmatch(r"/[A-Za-z0-9_./+@=-]+", path) is not None
                    and os.path.normpath(path) == path and "//" not in path)
        
        
        def name_ok(name):
            return (type(name) is str and name not in (".", "..")
                    and re.fullmatch(r"[A-Za-z0-9_.+@=-]{1,255}", name) is not None)
        
        
        
        
        def parent(path):
            need(path_ok(path))
            fd = os.open("/", D)
            try:
                parts = path.split("/")[1:]
                for part in parts[:-1]:
                    nxt = os.open(part, D, dir_fd=fd)
                    os.close(fd)
                    fd = nxt
                return fd, parts[-1]
            except BaseException:
                os.close(fd)
                raise
        
        
        def at(path):
            fd, name = parent(path)
            try:
                return os.stat(name, dir_fd=fd, follow_symlinks=False)
            finally:
                os.close(fd)
        
        
        def directory(path):
            fd, name = parent(path)
            try:
                return os.open(name, D, dir_fd=fd)
            finally:
                os.close(fd)
        
        
        def entries(fd, cap):
            before, names = ident(os.fstat(fd)), []
            with os.scandir(fd) as original:
                for entry in original:
                    need(len(names) < cap)
                    names.append(entry.name)
            need(ident(os.fstat(fd)) == before)
            return sorted(names)
        
        
        def node(path, cap=None, metadata=False):
            """The original fixed private event check, not a supplier body reader."""
            need(path == "/home/runner/work/_temp/_github_workflow/event.json"
                 and cap == 2**20 and metadata is True and not ROWS and not RAW)
            pfd, name = parent(path)
            fd = None
            original_error = None
            close_failed = False
            row, raw = None, bytearray()
            try:
                before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                     and 0 <= before.st_size <= cap)
                fd = os.open(name, F, dir_fd=pfd)
                need(ident(os.fstat(fd)) == ident(before))
                while len(raw) < before.st_size:
                    chunk = os.read(fd, min(65536, before.st_size - len(raw)))
                    need(chunk)
                    raw.extend(chunk)
                need(os.read(fd, 1) == b"")
                after = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                need(stat.S_ISREG(after.st_mode)
                     and ident(before) == ident(os.fstat(fd)) == ident(after))
                row = {"sha256": hashlib.sha256(raw).hexdigest()}
            except BaseException as error:
                original_error = error
            finally:
                owned, fd, pfd = (fd, pfd), None, None
                for held in owned:
                    if held is not None:
                        try:
                            os.close(held)
                        except BaseException:
                            close_failed = True
            if original_error is not None:
                raise original_error
            need(not close_failed)
            ROWS[path], RAW[path] = row, bytes(raw)
            return row
        
        
        def protected_parent(s):
            need(stat.S_ISDIR(s.st_mode) and s.st_uid == 0 and s.st_gid == 0
                 and s.st_nlink > 0 and not stat.S_IMODE(s.st_mode) & 0o022)
        
        
        def fixed_alias_shape(s, spec):
            need(stat.S_ISLNK(s.st_mode) and s.st_uid == 0 and s.st_gid == 0
                 and s.st_nlink == 1 and stat.S_IMODE(s.st_mode) == 0o777
                 and s.st_size == spec["utf8Bytes"])
        
        
        def public_alias_text(raw, spec):
            need(type(raw) is bytes and len(raw) == spec["utf8Bytes"]
                 and hashlib.sha256(raw).hexdigest() == spec["sha256"])
            text = raw.decode("utf-8")
            need(text.encode("utf-8") == raw
                 and re.fullmatch(r"[A-Za-z0-9_./+@=-]+", text) is not None)
            target = os.path.normpath(os.path.join(os.path.dirname(spec["path"]), text))
            need(path_ok(target) and target.startswith(spec["normalizedPublicTargetPrefix"]))
            return text, target
        
        
        def fixed_alias_texts():
            """Only two readlinks through the five original protected parent FDs."""
            paths = P["parents"]
            fds = [None] * len(paths)
            parent_rows, links, closed = [], [], []
            original_error = None
            close_failed = False
            try:
                for number, path in enumerate(paths):
                    if number == 0:
                        before = os.stat("/", follow_symlinks=False)
                        protected_parent(before)
                        fds[number] = os.open("/", D)
                    else:
                        name = path.rsplit("/", 1)[1]
                        before = os.stat(name, dir_fd=fds[number - 1], follow_symlinks=False)
                        protected_parent(before)
                        fds[number] = os.open(name, D, dir_fd=fds[number - 1])
                    held = os.fstat(fds[number])
                    protected_parent(held)
                    need(ident(before) == ident(held) and not os.get_inheritable(fds[number]))
                    parent_rows.append({"path": path, "before": ident(held), "after": None})
                for spec in P["links"]:
                    pfd = fds[paths.index(spec["parent"])]
                    name = spec["basename"]
                    before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    fixed_alias_shape(before, spec)
                    raw = os.readlink(name.encode("ascii"), dir_fd=pfd)
                    after = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    fixed_alias_shape(after, spec)
                    need(ident(before) == ident(after))
                    text, target = public_alias_text(raw, spec)
                    links.append({"path": spec["path"], "before": ident(before), "after": ident(after),
                                  "text": text, "utf8Bytes": len(raw), "sha256": spec["sha256"],
                                  "normalizedTarget": target, "targetObserved": False})
                for row, spec in zip(links, P["links"]):
                    last = os.stat(spec["basename"], dir_fd=fds[paths.index(spec["parent"])],
                                   follow_symlinks=False)
                    fixed_alias_shape(last, spec)
                    need(ident(last) == row["before"] == row["after"])
                for number, row in enumerate(parent_rows):
                    named = (os.stat("/", follow_symlinks=False) if number == 0 else
                             os.stat(paths[number].rsplit("/", 1)[1],
                                     dir_fd=fds[number - 1], follow_symlinks=False))
                    held = os.fstat(fds[number])
                    protected_parent(named)
                    protected_parent(held)
                    need(ident(named) == ident(held) == row["before"]
                         and not os.get_inheritable(fds[number]))
                    row["after"] = ident(held)
            except BaseException as error:
                original_error = error
            finally:
                for number in range(len(fds) - 1, -1, -1):
                    held, fds[number] = fds[number], None
                    if held is not None:
                        try:
                            os.close(held)
                        except BaseException:
                            close_failed = True
                        else:
                            closed.append(paths[number])
            if original_error is not None:
                raise original_error
            need(not close_failed and closed == list(reversed(paths)))
            return links, parent_rows, {"order": closed, "allReturned": True}
        
        
        def context():
            e = dict(os.environ)
            fixed = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC",
                     "GITHUB_REPOSITORY": P["repository"], "GITHUB_REF": P["ref"],
                     "GITHUB_EVENT_NAME": P["event"], "GITHUB_RUN_ATTEMPT": P["attempt"],
                     "RUNNER_ENVIRONMENT": "github-hosted",
                     "GITHUB_EVENT_PATH": "/home/runner/work/_temp/_github_workflow/event.json"}
            need(set(e) == set(RUN_KEYS) | set(fixed) | {"HOME", "TMPDIR", "TMP", "TEMP", "MRK_GNO_SOURCE_SHA256"})
            need(all(e[k] == v for k, v in fixed.items()))
            need(re.fullmatch(r"[1-9][0-9]{0,19}", e["GITHUB_RUN_ID"]))
            need(re.fullmatch(r"(?!0{40}$)[0-9a-f]{40}", e["GITHUB_SHA"]))
            need(e["GITHUB_WORKFLOW_SHA"] == e["GITHUB_SHA"])
            need(e["GITHUB_WORKFLOW_REF"] == P["repository"] + "/" + P["workflow"] + "@" + P["ref"])
            need(re.fullmatch(r"[0-9a-f]{64}", e["MRK_GNO_SOURCE_SHA256"]))
            need(re.fullmatch(r"[A-Za-z0-9_.-]{1,32}", e["ImageOS"]))
            need(re.fullmatch(r"[0-9]{8}\.[0-9]{1,6}\.[0-9]{1,6}", e["ImageVersion"]))
            scratch = "/tmp/mrk-gnome-host-observe-" + e["GITHUB_RUN_ID"] + "-1"
            need(e["HOME"] == scratch + "/home" and os.getcwd() == scratch + "/neutral")
            need(all(e[k] == scratch + "/tmp" for k in ("TMPDIR", "TMP", "TEMP")))
            need(os.getuid() == os.geteuid() != 0 and os.getgid() == os.getegid())
            event_path = e["GITHUB_EVENT_PATH"]
            node(event_path, 2**20, metadata=True)
            event = decode(RAW.get(event_path, b""))
            need(event.get("deleted") is False and event.get("ref") == e["GITHUB_REF"]
                 and event.get("after") == e["GITHUB_SHA"] and type(event.get("repository")) is dict
                 and event["repository"].get("full_name") == e["GITHUB_REPOSITORY"])
            # The event body is discarded; only its digest is returned.
            event_digest = ROWS.pop(event_path)["sha256"]
            RAW.pop(event_path)
            return e, scratch, event_digest
        
        
        def binding(e, event_digest):
            return {"policySha256": POLICY_SHA256, "sourceSha256": e["MRK_GNO_SOURCE_SHA256"],
                    "run": {k: e[k] for k in RUN_KEYS}, "eventSha256": event_digest}
        
        
        def scratch_state(scratch, expected_names):
            result = {}
            for path in (scratch, scratch + "/home", scratch + "/tmp", scratch + "/neutral"):
                fd = directory(path)
                try:
                    s = ident(os.fstat(fd))
                    need(s["uid"] == os.getuid() and s["mode"] == 0o700 and s == ident(at(path)))
                    need(set(entries(fd, 12)) == (expected_names if path == scratch else set()))
                    result[path] = s
                finally:
                    os.close(fd)
            return result
        
        
        def write_owned(root, name, raw):
            need(len(raw) <= P["caps"]["outputBytes"])
            fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
                         0o600, dir_fd=root)
            try:
                view = memoryview(raw)
                while view:
                    count = os.write(fd, view)
                    need(count > 0)
                    view = view[count:]
                os.fsync(fd)
                need(ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                return {"stat": ident(os.fstat(fd)), "sha256": hashlib.sha256(raw).hexdigest()}
            finally:
                os.close(fd)
        
        
        def read_owned(root, name, cap, expected=None):
            before = os.stat(name, dir_fd=root, follow_symlinks=False)
            need(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid()
                 and stat.S_IMODE(before.st_mode) == 0o600 and before.st_nlink == 1 and before.st_size <= cap)
            fd = os.open(name, F, dir_fd=root)
            try:
                need(ident(os.fstat(fd)) == ident(before))
                raw = bytearray()
                while len(raw) < before.st_size:
                    chunk = os.read(fd, min(65536, before.st_size - len(raw)))
                    need(chunk)
                    raw.extend(chunk)
                need(os.read(fd, 1) == b"")
                need(ident(before) == ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                row = {"stat": ident(before), "sha256": hashlib.sha256(raw).hexdigest()}
                need(expected is None or row == expected)
                return bytes(raw), row
            finally:
                os.close(fd)
        
        
        def observe(e, scratch, event_digest):
            dirs = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin"})
            captures = {}
            for fd, name in ((1, "stdout.bin"), (2, "stderr.bin")):
                s = os.fstat(fd)
                need(stat.S_ISREG(s.st_mode) and ident(s) == ident(at(scratch + "/" + name))
                     and s.st_uid == os.getuid() and stat.S_IMODE(s.st_mode) == 0o600
                     and s.st_nlink == 1 and s.st_size == 0)
                captures[name] = ident(s)
            links, parents, closes = fixed_alias_texts()
            value = {"schema": "mrk-gnome-python-alias-text-observation-1",
                     "scope": "two-fixed-python-alias-texts-only-no-admission",
                     "binding": binding(e, event_digest), "links": links, "parents": parents,
                     "parentCloses": closes,
                     "supplierReads": {"symlinkTexts": 2, "symlinkBytes": 73, "regularBodyBytes": 0},
                     "bootstrapTrust": P["bootstrapTrust"], "nonClaims": P["nonClaims"],
                     "hostQualified": False, "nativeQualified": False,
                     "original": {"directories": dirs, "captures": captures,
                                  "observerArgv": ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"]}}
            public_observation(value, binding(e, event_digest))
            raw = canonical(value)
            need(len(raw) <= P["caps"]["outputBytes"])
            root = directory(scratch)
            try:
                output = write_owned(root, "observation.json", raw)
                index = {"schema": "mrk-gnome-host-observation-index-1", "binding": value["binding"],
                         "directories": dirs, "observation": output}
                write_owned(root, "index.json", canonical(index))
                os.fsync(root)
            finally:
                os.close(root)
        
        
        def public_observation(value, expected_binding):
            """Only the two fixed public texts after their exact digest/privacy checks."""
            need(type(value) is dict and set(value) == {"schema", "scope", "binding", "links", "parents",
                "parentCloses", "supplierReads", "bootstrapTrust", "nonClaims",
                "hostQualified", "nativeQualified", "original"})
            need(value["schema"] == "mrk-gnome-python-alias-text-observation-1"
                 and value["scope"] == "two-fixed-python-alias-texts-only-no-admission")
            need(value["binding"] == expected_binding
                 and value["hostQualified"] is False and value["nativeQualified"] is False)
            need(value["bootstrapTrust"] == P["bootstrapTrust"] and value["nonClaims"] == P["nonClaims"])
            stat_ok = lambda s: (type(s) is dict and set(s) == set(STAT_KEYS)
                                and all(type(v) is int for v in s.values()))
            need(type(value["links"]) is list and len(value["links"]) == 2)
            for row, spec in zip(value["links"], P["links"]):
                need(type(row) is dict and set(row) == {"path", "before", "after", "text",
                     "utf8Bytes", "sha256", "normalizedTarget", "targetObserved"})
                need(row["path"] == spec["path"] and stat_ok(row["before"]) and stat_ok(row["after"]))
                need(row["before"] == row["after"])
                s = row["before"]
                need(s["uid"] == s["gid"] == 0 and s["links"] == 1
                     and s["mode"] == 0o777 and s["bytes"] == spec["utf8Bytes"])
                need(type(row["text"]) is str and type(row["utf8Bytes"]) is int
                     and row["utf8Bytes"] == spec["utf8Bytes"] and row["sha256"] == spec["sha256"]
                     and row["targetObserved"] is False)
                text, target = public_alias_text(row["text"].encode("utf-8"), spec)
                need(row["text"] == text and row["normalizedTarget"] == target)
            need(type(value["parents"]) is list and len(value["parents"]) == 5)
            for row, path in zip(value["parents"], P["parents"]):
                need(type(row) is dict and set(row) == {"path", "before", "after"} and row["path"] == path)
                need(stat_ok(row["before"]) and stat_ok(row["after"]) and row["before"] == row["after"])
                s = row["before"]
                need(s["uid"] == s["gid"] == 0 and s["links"] > 0
                     and 0 <= s["mode"] <= 0o7777 and not s["mode"] & 0o022)
            closes = value["parentCloses"]
            need(type(closes) is dict and set(closes) == {"order", "allReturned"}
                 and closes["order"] == list(reversed(P["parents"])) and closes["allReturned"] is True)
            reads = value["supplierReads"]
            need(type(reads) is dict and all(type(v) is int for v in reads.values())
                 and reads == {"symlinkTexts": 2, "symlinkBytes": 73, "regularBodyBytes": 0})
            original = value["original"]
            need(set(original) == {"directories", "captures", "observerArgv"}
                 and set(original["captures"]) == {"stdout.bin", "stderr.bin"})
            need(original["observerArgv"] == ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"])
            need(all(stat_ok(v) for v in original["captures"].values())
                 and all(stat_ok(v) for v in original["directories"].values()))
            return value
        
        
        def return_data(e, scratch, event_digest):
            root = directory(scratch)
            try:
                root_stat = os.fstat(root)
                need(root_stat.st_uid == os.getuid() and stat.S_IMODE(root_stat.st_mode) == 0o700
                     and ident(root_stat) == ident(at(scratch)))
                wait_raw, wait_pin = read_owned(root, "wait.json", 4096)
                wait = decode(wait_raw, True)
                need(set(wait) == {"schema", "status", "startUnix", "endUnix"} and wait["schema"] == "mrk-gnome-host-observer-wait-1")
                need(type(wait["status"]) is int and 0 <= wait["status"] <= 255)
                need(all(re.fullmatch(r"[0-9]{10,12}\.[0-9]{6}", wait[k]) for k in ("startUnix", "endUnix")))
                need(int(wait["endUnix"].replace(".", "")) >= int(wait["startUnix"].replace(".", "")))
                if wait["status"] != 0:
                    os.write(1, ("MRK-GNOME ORIGINAL-WAIT-NONZERO " + str(wait["status"]) + "\n").encode())
                    return wait["status"]
                index_raw, index_pin = read_owned(root, "index.json", 65536)
                index = decode(index_raw, True)
                expected_binding = binding(e, event_digest)
                need(set(index) == {"schema", "binding", "directories", "observation"})
                need(index["schema"] == "mrk-gnome-host-observation-index-1" and index["binding"] == expected_binding)
                current = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin", "wait.json", "observation.json", "index.json"})
                need(set(current) == set(index["directories"]))
                need(all(owned_identity(current[p], index["directories"][p]) for p in current))
                raw, pin = read_owned(root, "observation.json", P["caps"]["outputBytes"], index["observation"])
                value = public_observation(decode(raw, True), expected_binding)
                need(value["original"]["directories"] == index["directories"])
                captures = {}
                for name in ("stdout.bin", "stderr.bin"):
                    capture, capture_pin = read_owned(root, name, 0)
                    need(capture == b"" and capture_pin["stat"] == value["original"]["captures"][name])
                    captures[name] = capture_pin
                # Pending return wait/disposal is explicit. Neither is self-certified.
                receipt = {"schema": "mrk-gnome-host-return-1", "binding": expected_binding,
                           "observation": pin, "index": index_pin, "originalWait": wait,
                           "waitFile": wait_pin, "emptyCaptures": captures,
