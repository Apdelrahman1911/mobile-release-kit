        P = json.loads(RUNTIME_POLICY_JSON)
        D = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
        F = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
        ROWS, RAW, LINKS, DIRECTORIES, GAPS = {}, {}, {}, {}, []
        BODY = META = 0
        FILE_KEYS = {"path", "kind", "stat", "sha256", "readBytes", "aliasTextSha256",
                     "aliasText", "aliasTarget", "pycHeader", "referenceMatch"}
        STAT_KEYS = ("device", "inode", "mode", "uid", "gid", "links", "bytes",
                     "blocks", "mtimeNs", "ctimeNs")
        RUN_KEYS = ("GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA", "GITHUB_WORKFLOW_REF",
                    "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                    "GITHUB_EVENT_NAME", "RUNNER_ENVIRONMENT", "ImageOS", "ImageVersion")
        GAP_CODES = {"BODY_UNAVAILABLE", "BODY_DIFFERS", "OWNER_MODE", "ALIAS_UNKNOWN",
                     "ABSENCE_REQUIRED", "IMAGE_DIFFERS", "PYTHON_SELECTION",
                     "PYTHON_ROSTER_REVIEW", "PYC_HEADER", "CONFIG_REVIEW", "NSS_SELECTION",
                     "RESOLVER_PROVIDER_REVIEW", "DIRECTORY_UNAVAILABLE", "TREE_ENTRY",
                     "BUDGET", "PACKAGE_METADATA", "OS_METADATA", "ELF_SELECTION_REVIEW"}
        
        
        class Refused(Exception):
            pass
        
        
        def need(ok):
            if not ok:
                raise Refused()
        
        
        def canonical(value):
            return (json.dumps(value, sort_keys=True, ensure_ascii=True,
                               separators=(",", ":"), allow_nan=False) + "\n").encode("ascii")
        
        
        def unique(pairs):
            result = {}
            for key, value in pairs:
                need(key not in result)
                result[key] = value
            return result
        
        
        def decode(raw, canonical_only=False):
            value = json.loads(raw, object_pairs_hook=unique,
                               parse_constant=lambda _: (_ for _ in ()).throw(Refused()))
            need(type(value) is dict and (not canonical_only or canonical(value) == raw))
            return value
        
        
        def ident(s):
            return dict(zip(STAT_KEYS, (s.st_dev, s.st_ino, stat.S_IMODE(s.st_mode),
                s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_blocks, s.st_mtime_ns, s.st_ctime_ns)))
        
        
        def owned_identity(actual, expected):
            # Scratch directory contents change as our fixed files are created. This
            # relates only this original run, never an inode from a different VM/run.
            return all(actual[k] == expected[k] for k in ("device", "inode", "mode", "uid", "gid"))
        
        
        def path_ok(path):
            return (type(path) is str and 0 < len(path) <= P["caps"]["pathBytes"]
                    and re.fullmatch(r"/[A-Za-z0-9_./+@=-]+", path) is not None
                    and os.path.normpath(path) == path and "//" not in path)
        
        
        def name_ok(name):
            return (type(name) is str and name not in (".", "..")
                    and re.fullmatch(r"[A-Za-z0-9_.+@=-]{1,255}", name) is not None)
        
        
        def gap(code, subject):
            need(code in GAP_CODES and type(subject) is str and len(subject) <= 512)
            item = [code, subject]
            if item not in GAPS:
                need(len(GAPS) < P["caps"]["gaps"])
                GAPS.append(item)
        
        
        def parent(path):
            need(path_ok(path))
            fd = os.open("/", D)
            try:
                parts = path.split("/")[1:]
                for part in parts[:-1]:
                    nxt = os.open(part, D, dir_fd=fd)
                    os.close(fd)
                    fd = nxt
                return fd, parts[-1]
            except BaseException:
                os.close(fd)
                raise
        
        
        def at(path):
            fd, name = parent(path)
            try:
                return os.stat(name, dir_fd=fd, follow_symlinks=False)
            finally:
                os.close(fd)
        
        
        def directory(path):
            fd, name = parent(path)
            try:
                return os.open(name, D, dir_fd=fd)
            finally:
                os.close(fd)
        
        
        def entries(fd, cap):
