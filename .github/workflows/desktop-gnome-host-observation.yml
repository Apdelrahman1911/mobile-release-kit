# PROPOSED SOURCE ONLY. Publication/dispatch/execution require separate root admission.
name: GNOME hosted supplier metadata observation
on:
  push:
    branches: [verify/desktop-gnome-host-observation]
permissions: {}
concurrency:
  group: gnome-host-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Apdelrahman1911/mobile-release-kit' && github.event_name == 'push' && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      MRK_GNO_SOURCE_SHA256: 1f6f047c22f9355ff7c7bb562c366c9dfa89cf9d633b39526b0954cd3bb4b99b
      MRK_GNO_PROGRAM: |-
        """Three fixed targets and twelve parent originals; installed-version DATA only.
        
        Reuse the original provider bootstrap, private owner, foreground wait and return.
        Only bounded library/parent facts, three body hashes and selected package fields are public.
        """
        import base64
        import errno
        import hashlib
        import json
        import os
        import re
        import resource
        import stat
        import sys
        
        POLICY_SHA256 = "a86c09d013f95300a3e96253a3902faf0b348333168b616d80d74893b4287133"
        RUNTIME_POLICY_JSON = r'''{"attempt":"1","bootstrapTrust":"provider-managed disposable runner/OS, workflow shell, env/timeout/initial isolated Python; post-use hashes are not retroactive admission","caps":{"frameBytes":65536,"linkTextBytes":512,"outputBytes":16384,"pathBytes":512,"streamBytes":65536},"event":"push","nonClaims":["not a C/A/W or native fixture run","no initial interpreter self-authentication","no actual loader/cache mapping or unknown config/provider closure","no sudo/PAM/policy/account bodies or account reservation proof","no continuity to H0, earlier observations or any later VM","no compiler-wide or service/runner/checkout/action/Node/Docker census","all future exact source/runtime/native/account/ownership gates remain required","host target measurements are not package provenance, G2 closure or consumer admission","no source-alias reread, supplier directory listing, resolver body, CA alias or proc read","only validated numeric library-alias texts, body hashes and selected installed-package fields are public; no regular body export","resolver service ownership applies to one metadata-only parent, not root-trusted hostFiles","installed package status is not signed supplier authority, installation history, atomic package-manager state, loader closure or later-consumer continuity"],"packageStatus":{"architecture":"amd64","fieldNameBytes":64,"fieldValueBytes":192,"lineBytes":65536,"package":"libpython3.12t64","status":"install ok installed","targetIndex":2},"parents":[{"gid":0,"mode":493,"parent":null,"path":"/","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":0,"path":"/usr","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":1,"path":"/usr/lib","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":2,"path":"/usr/lib/x86_64-linux-gnu","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":0,"path":"/etc","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":4,"path":"/etc/python3.12","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":0,"path":"/run","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":6,"path":"/run/systemd","role":"protected-parent","uid":0},{"gid":991,"mode":493,"parent":7,"path":"/run/systemd/resolve","role":"resolver-parent-metadata-only","uid":991},{"gid":0,"mode":493,"parent":0,"path":"/var","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":9,"path":"/var/lib","role":"protected-parent","uid":0},{"gid":0,"mode":493,"parent":10,"path":"/var/lib/dpkg","role":"protected-parent","uid":0}],"ref":"refs/heads/verify/desktop-gnome-host-observation","repository":"Apdelrahman1911/mobile-release-kit","targets":[{"maxBytes":16777216,"maxEdges":2,"parent":3,"path":"/usr/lib/x86_64-linux-gnu/libpython3.12.so.1"},{"maxBytes":16384,"maxEdges":0,"parent":5,"path":"/etc/python3.12/sitecustomize.py"},{"maxBytes":16777216,"maxEdges":0,"mode":420,"parent":11,"path":"/var/lib/dpkg/status"}],"workflow":".github/workflows/desktop-gnome-host-observation.yml"}'''
        P = json.loads(RUNTIME_POLICY_JSON)
        D = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
        F = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
        ROWS, RAW = {}, {}
        STAT_KEYS = ("device", "inode", "mode", "uid", "gid", "links", "bytes",
                     "blocks", "mtimeNs", "ctimeNs")
        RUN_KEYS = ("GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA", "GITHUB_WORKFLOW_REF",
                    "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                    "GITHUB_EVENT_NAME", "RUNNER_ENVIRONMENT", "ImageOS", "ImageVersion")
        
        class Refused(Exception):
            pass
        
        
        def need(ok):
            if not ok:
                raise Refused()
        
        
        def canonical(value):
            return (json.dumps(value, sort_keys=True, ensure_ascii=True,
                               separators=(",", ":"), allow_nan=False) + "\n").encode("ascii")
        
        
        def unique(pairs):
            result = {}
            for key, value in pairs:
                need(key not in result)
                result[key] = value
            return result
        
        
        def decode(raw, canonical_only=False):
            value = json.loads(raw, object_pairs_hook=unique,
                               parse_constant=lambda _: (_ for _ in ()).throw(Refused()))
            need(type(value) is dict and (not canonical_only or canonical(value) == raw))
            return value
        
        
        def ident(s):
            return dict(zip(STAT_KEYS, (s.st_dev, s.st_ino, stat.S_IMODE(s.st_mode),
                s.st_uid, s.st_gid, s.st_nlink, s.st_size, s.st_blocks, s.st_mtime_ns, s.st_ctime_ns)))
        
        
        def owned_identity(actual, expected):
            # Scratch directory contents change as our fixed files are created. This
            # relates only this original run, never an inode from a different VM/run.
            return all(actual[k] == expected[k] for k in ("device", "inode", "mode", "uid", "gid"))
        
        
        def path_ok(path):
            return (type(path) is str and 0 < len(path) <= P["caps"]["pathBytes"]
                    and re.fullmatch(r"/[A-Za-z0-9_./+@=-]+", path) is not None
                    and os.path.normpath(path) == path and "//" not in path)
        
        
        def name_ok(name):
            return (type(name) is str and name not in (".", "..")
                    and re.fullmatch(r"[A-Za-z0-9_.+@=-]{1,255}", name) is not None)
        
        
        
        
        def parent(path):
            need(path_ok(path))
            fd = os.open("/", D)
            try:
                parts = path.split("/")[1:]
                for part in parts[:-1]:
                    nxt = os.open(part, D, dir_fd=fd)
                    os.close(fd)
                    fd = nxt
                return fd, parts[-1]
            except BaseException:
                os.close(fd)
                raise
        
        
        def at(path):
            fd, name = parent(path)
            try:
                return os.stat(name, dir_fd=fd, follow_symlinks=False)
            finally:
                os.close(fd)
        
        
        def directory(path):
            fd, name = parent(path)
            try:
                return os.open(name, D, dir_fd=fd)
            finally:
                os.close(fd)
        
        
        def entries(fd, cap):
            before, names = ident(os.fstat(fd)), []
            with os.scandir(fd) as original:
                for entry in original:
                    need(len(names) < cap)
                    names.append(entry.name)
            need(ident(os.fstat(fd)) == before)
            return sorted(names)
        
        
        def node(path, cap=None, metadata=False):
            """The original fixed private event check, not a supplier body reader."""
            need(path == "/home/runner/work/_temp/_github_workflow/event.json"
                 and cap == 2**20 and metadata is True and not ROWS and not RAW)
            pfd, name = parent(path)
            fd = None
            original_error = None
            close_failed = False
            row, raw = None, bytearray()
            try:
                before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                need(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                     and 0 <= before.st_size <= cap)
                fd = os.open(name, F, dir_fd=pfd)
                need(ident(os.fstat(fd)) == ident(before))
                while len(raw) < before.st_size:
                    chunk = os.read(fd, min(65536, before.st_size - len(raw)))
                    need(chunk)
                    raw.extend(chunk)
                need(os.read(fd, 1) == b"")
                after = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                need(stat.S_ISREG(after.st_mode)
                     and ident(before) == ident(os.fstat(fd)) == ident(after))
                row = {"sha256": hashlib.sha256(raw).hexdigest()}
            except BaseException as error:
                original_error = error
            finally:
                owned, fd, pfd = (fd, pfd), None, None
                for held in owned:
                    if held is not None:
                        try:
                            os.close(held)
                        except BaseException:
                            close_failed = True
            if original_error is not None:
                raise original_error
            need(not close_failed)
            ROWS[path], RAW[path] = row, bytes(raw)
            return row
        
        
        def protected_parent(s, spec):
            need(stat.S_ISDIR(s.st_mode) and s.st_uid == spec["uid"] and s.st_gid == spec["gid"]
                 and s.st_nlink > 0 and stat.S_IMODE(s.st_mode) == spec["mode"])
        
        
        def fixed_alias_shape(s):
            need(stat.S_ISLNK(s.st_mode) and s.st_uid == s.st_gid == 0
                 and s.st_nlink == 1 and stat.S_IMODE(s.st_mode) == 0o777
                 and 0 < s.st_size <= P["caps"]["linkTextBytes"])
        
        
        def fixed_regular_shape(s, spec):
            need(stat.S_ISREG(s.st_mode) and s.st_uid == s.st_gid == 0
                 and s.st_nlink == 1 and stat.S_IMODE(s.st_mode) in (0o644, 0o755)
                 and 0 < s.st_size <= spec["maxBytes"])
            if spec["path"] == "/var/lib/dpkg/status":
                need(stat.S_IMODE(s.st_mode) == 0o644 and spec["maxEdges"] == 0)


        def debian_version(value):
            """Bounded Debian Version spelling; preserved, never package/supplier authority."""
            need(type(value) is str and value.isascii()
                 and 0 < len(value) <= P["packageStatus"]["fieldValueBytes"])
            body = value
            if ":" in body:
                epoch, body = body.split(":", 1)
                need(re.fullmatch(r"[0-9]+", epoch) is not None)
            upstream, dash, revision = body.rpartition("-")
            if dash:
                need(re.fullmatch(r"[A-Za-z0-9+.~]+", revision) is not None)
            else:
                upstream = body
            need(re.fullmatch(r"[0-9][A-Za-z0-9.+:~\-]*", upstream) is not None)
            return value


        def public_package_status(value):
            expected = P["packageStatus"]
            need(type(value) is dict and set(value) ==
                 {"package", "architecture", "status", "version", "targetIndex"})
            need(all(type(value[k]) is str and value[k] == expected[k]
                     for k in ("package", "architecture", "status"))
                 and type(value["targetIndex"]) is int and value["targetIndex"] == expected["targetIndex"])
            debian_version(value["version"])
            return value


        def package_status(raw):
            """Read-only control paragraphs from the SAME bytes hashed by fixed_targets."""
            spec = P["packageStatus"]
            need(type(raw) is bytes and 0 < len(raw) <= P["targets"][spec["targetIndex"]]["maxBytes"]
                 and b"\0" not in raw and b"\r" not in raw)
            names = {b"package": b"Package", b"architecture": b"Architecture",
                     b"status": b"Status", b"version": b"Version"}
            fields, previous, found, offset = {}, None, None, 0
            # Iterate bounded individual lines rather than materializing a database roster.
            while offset <= len(raw):
                end = raw.find(b"\n", offset)
                if end < 0:
                    end = len(raw)
                need(end - offset <= spec["lineBytes"])
                line, offset = raw[offset:end], end + 1
                if not line:
                    if fields.get(b"package") == spec["package"].encode("ascii"):
                        need(found is None and set(fields) == set(names))
                        found = public_package_status({
                            "package": fields[b"package"].decode("ascii"),
                            "architecture": fields[b"architecture"].decode("ascii"),
                            "status": fields[b"status"].decode("ascii"),
                            "version": fields[b"version"].decode("ascii"),
                            "targetIndex": spec["targetIndex"],
                        })
                    fields, previous = {}, None
                    continue
                if line[:1] in (b" ", b"\t"):
                    need(previous is not None and previous not in names)
                    continue  # Unrelated description/asset text is neither decoded nor exported.
                key, separator, value = line.partition(b":")
                need(separator == b":" and 0 < len(key) <= spec["fieldNameBytes"]
                     and re.fullmatch(rb"[A-Za-z0-9][A-Za-z0-9-]*", key) is not None)
                previous = key.lower()
                if previous in names:
                    need(key == names[previous] and previous not in fields)
                    value = value[1:] if value.startswith(b" ") else value
                    need(0 < len(value) <= spec["fieldValueBytes"] and value.isascii()
                         and not any(c < 32 or c == 127 for c in value)
                         and value == value.strip(b" "))
                    fields[previous] = value
            # An unterminated final paragraph still needs the same single-target check.
            if fields.get(b"package") == spec["package"].encode("ascii"):
                need(found is None and set(fields) == set(names))
                found = public_package_status({
                    "package": fields[b"package"].decode("ascii"),
                    "architecture": fields[b"architecture"].decode("ascii"),
                    "status": fields[b"status"].decode("ascii"),
                    "version": fields[b"version"].decode("ascii"),
                    "targetIndex": spec["targetIndex"],
                })
            need(found is not None)
            return found
        
        
        def public_alias_text(raw):
            """Only an actual numeric library basename or its exact fixed absolute path."""
            need(type(raw) is bytes and 0 < len(raw) <= P["caps"]["linkTextBytes"])
            text = raw.decode("ascii")
            prefix = P["parents"][P["targets"][0]["parent"]]["path"] + "/"
            name = text[len(prefix):] if text.startswith(prefix) else text
            need(0 < len(name) <= 255
                 and re.fullmatch(r"libpython3\.12\.so\.[0-9]+(?:\.[0-9]+)*", name) is not None)
            target = prefix + name
            need(text in (name, target) and path_ok(target))
            return text, target
        
        
        def fixed_targets():
            """Three target seeds through one explicit twelve-parent DAG, no directory census."""
            specs = P["parents"]
            parent_fds, terminal_fds = [None] * len(specs), [None] * len(P["targets"])
            terminal_paths = [None] * len(P["targets"])
            parents, targets, closed = [], [], []
            selected_status = None
            reads = {"symlinkTexts": 0, "symlinkBytes": 0, "regularBodies": 0, "regularBodyBytes": 0}
            original_error, close_failed = None, False
            try:
                for number, spec in enumerate(specs):
                    edge = spec["parent"]
                    pfd = None if edge is None else parent_fds[edge]
                    name = "/" if edge is None else spec["path"].rsplit("/", 1)[1]
                    before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    protected_parent(before, spec)
                    # Immediate fixed-slot registration, before any further operation.
                    parent_fds[number] = os.open(name, D, dir_fd=pfd)
                    held = os.fstat(parent_fds[number])
                    named = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    protected_parent(held, spec)
                    protected_parent(named, spec)
                    need(ident(before) == ident(held) == ident(named)
                         and not os.get_inheritable(parent_fds[number]))
                    parents.append({"path": spec["path"], "parent": edge, "kind": "directory",
                                    "role": spec["role"], "before": ident(held), "after": None})
                for number, spec in enumerate(P["targets"]):
                    pfd = parent_fds[spec["parent"]]
                    current, seen, nodes = spec["path"], set(), []
                    for hop in range(spec["maxEdges"] + 1):
                        need(current not in seen)
                        seen.add(current)
                        name = current.rsplit("/", 1)[1]
                        before = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                        if stat.S_ISLNK(before.st_mode):
                            need(number == 0 and hop < spec["maxEdges"])
                            fixed_alias_shape(before)
                            raw = os.readlink(name.encode("ascii"), dir_fd=pfd)
                            named = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                            fixed_alias_shape(named)
                            need(ident(before) == ident(named) and len(raw) == before.st_size)
                            text, target = public_alias_text(raw)
                            need(target not in seen)
                            nodes.append({"path": current, "kind": "symlink", "before": ident(before),
                                          "after": ident(named), "text": text, "textBytes": len(raw),
                                          "sha256": hashlib.sha256(raw).hexdigest(), "nextPath": target})
                            reads["symlinkTexts"] += 1
                            reads["symlinkBytes"] += len(raw)
                            current = target
                            continue
                        fixed_regular_shape(before, spec)
                        terminal_paths[number] = current
                        terminal_fds[number] = os.open(name, F, dir_fd=pfd)
                        fd = terminal_fds[number]
                        held = os.fstat(fd)
                        named = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                        fixed_regular_shape(held, spec)
                        fixed_regular_shape(named, spec)
                        need(ident(before) == ident(held) == ident(named) and not os.get_inheritable(fd))
                        digest, size = hashlib.sha256(), 0
                        status_body = bytearray() if number == P["packageStatus"]["targetIndex"] else None
                        while size < before.st_size:
                            count = min(P["caps"]["streamBytes"], before.st_size - size)
                            chunk = os.read(fd, count)
                            need(type(chunk) is bytes and 0 < len(chunk) <= count)
                            digest.update(chunk)
                            if status_body is not None:
                                status_body.extend(chunk)
                            size += len(chunk)
                            reads["regularBodyBytes"] += len(chunk)
                        need(os.read(fd, 1) == b"")
                        held = os.fstat(fd)
                        named = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                        fixed_regular_shape(held, spec)
                        fixed_regular_shape(named, spec)
                        need(size == before.st_size and ident(before) == ident(held) == ident(named)
                             and not os.get_inheritable(fd))
                        nodes.append({"path": current, "kind": "regular", "before": ident(before),
                                      "after": ident(held), "bytes": size, "sha256": digest.hexdigest()})
                        if status_body is not None:
                            selected_status = package_status(bytes(status_body))
                            status_body = None
                        reads["regularBodies"] += 1
                        targets.append({"seed": spec["path"], "parent": spec["parent"], "nodes": nodes})
                        break
                    else:
                        need(False)
                for number, target in enumerate(targets):
                    spec = P["targets"][number]
                    pfd = parent_fds[spec["parent"]]
                    for row in target["nodes"]:
                        named = os.stat(row["path"].rsplit("/", 1)[1], dir_fd=pfd, follow_symlinks=False)
                        if row["kind"] == "symlink":
                            fixed_alias_shape(named)
                        else:
                            fixed_regular_shape(named, spec)
                            held = os.fstat(terminal_fds[number])
                            fixed_regular_shape(held, spec)
                            need(ident(held) == row["before"]
                                 and not os.get_inheritable(terminal_fds[number]))
                        need(ident(named) == row["before"] == row["after"])
                for number, (row, spec) in enumerate(zip(parents, specs)):
                    edge = spec["parent"]
                    pfd = None if edge is None else parent_fds[edge]
                    name = "/" if edge is None else spec["path"].rsplit("/", 1)[1]
                    named = os.stat(name, dir_fd=pfd, follow_symlinks=False)
                    held = os.fstat(parent_fds[number])
                    protected_parent(named, spec)
                    protected_parent(held, spec)
                    need(ident(named) == ident(held) == row["before"]
                         and not os.get_inheritable(parent_fds[number]))
                    row["after"] = ident(held)
            except BaseException as error:
                original_error = error
            finally:
                for number in range(len(terminal_fds) - 1, -1, -1):
                    fd, terminal_fds[number] = terminal_fds[number], None
                    if fd is not None:
                        try:
                            os.close(fd)
                        except BaseException:
                            close_failed = True
                        else:
                            closed.append(terminal_paths[number])
                for number in range(len(parent_fds) - 1, -1, -1):
                    fd, parent_fds[number] = parent_fds[number], None
                    if fd is not None:
                        try:
                            os.close(fd)
                        except BaseException:
                            close_failed = True
                        else:
                            closed.append(specs[number]["path"])
            if original_error is not None:
                raise original_error
            expected = list(reversed(terminal_paths)) + [s["path"] for s in reversed(specs)]
            need(not close_failed and closed == expected and selected_status is not None)
            return targets, parents, {"order": closed, "allReturned": True}, reads, selected_status
        
        
        def context():
            e = dict(os.environ)
            fixed = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TZ": "UTC",
                     "GITHUB_REPOSITORY": P["repository"], "GITHUB_REF": P["ref"],
                     "GITHUB_EVENT_NAME": P["event"], "GITHUB_RUN_ATTEMPT": P["attempt"],
                     "RUNNER_ENVIRONMENT": "github-hosted",
                     "GITHUB_EVENT_PATH": "/home/runner/work/_temp/_github_workflow/event.json"}
            need(set(e) == set(RUN_KEYS) | set(fixed) | {"HOME", "TMPDIR", "TMP", "TEMP", "MRK_GNO_SOURCE_SHA256"})
            need(all(e[k] == v for k, v in fixed.items()))
            need(re.fullmatch(r"[1-9][0-9]{0,19}", e["GITHUB_RUN_ID"]))
            need(re.fullmatch(r"(?!0{40}$)[0-9a-f]{40}", e["GITHUB_SHA"]))
            need(e["GITHUB_WORKFLOW_SHA"] == e["GITHUB_SHA"])
            need(e["GITHUB_WORKFLOW_REF"] == P["repository"] + "/" + P["workflow"] + "@" + P["ref"])
            need(re.fullmatch(r"[0-9a-f]{64}", e["MRK_GNO_SOURCE_SHA256"]))
            need(re.fullmatch(r"[A-Za-z0-9_.-]{1,32}", e["ImageOS"]))
            need(re.fullmatch(r"[0-9]{8}\.[0-9]{1,6}\.[0-9]{1,6}", e["ImageVersion"]))
            scratch = "/tmp/mrk-gnome-host-observe-" + e["GITHUB_RUN_ID"] + "-1"
            need(e["HOME"] == scratch + "/home" and os.getcwd() == scratch + "/neutral")
            need(all(e[k] == scratch + "/tmp" for k in ("TMPDIR", "TMP", "TEMP")))
            need(os.getuid() == os.geteuid() != 0 and os.getgid() == os.getegid())
            event_path = e["GITHUB_EVENT_PATH"]
            node(event_path, 2**20, metadata=True)
            event = decode(RAW.get(event_path, b""))
            need(event.get("deleted") is False and event.get("ref") == e["GITHUB_REF"]
                 and event.get("after") == e["GITHUB_SHA"] and type(event.get("repository")) is dict
                 and event["repository"].get("full_name") == e["GITHUB_REPOSITORY"])
            # The event body is discarded; only its digest is returned.
            event_digest = ROWS.pop(event_path)["sha256"]
            RAW.pop(event_path)
            return e, scratch, event_digest
        
        
        def binding(e, event_digest):
            return {"policySha256": POLICY_SHA256, "sourceSha256": e["MRK_GNO_SOURCE_SHA256"],
                    "run": {k: e[k] for k in RUN_KEYS}, "eventSha256": event_digest}
        
        
        def scratch_state(scratch, expected_names):
            result = {}
            for path in (scratch, scratch + "/home", scratch + "/tmp", scratch + "/neutral"):
                fd = directory(path)
                try:
                    s = ident(os.fstat(fd))
                    need(s["uid"] == os.getuid() and s["mode"] == 0o700 and s == ident(at(path)))
                    need(set(entries(fd, 12)) == (expected_names if path == scratch else set()))
                    result[path] = s
                finally:
                    os.close(fd)
            return result
        
        
        def write_owned(root, name, raw):
            need(len(raw) <= P["caps"]["outputBytes"])
            fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
                         0o600, dir_fd=root)
            try:
                view = memoryview(raw)
                while view:
                    count = os.write(fd, view)
                    need(count > 0)
                    view = view[count:]
                os.fsync(fd)
                need(ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                return {"stat": ident(os.fstat(fd)), "sha256": hashlib.sha256(raw).hexdigest()}
            finally:
                os.close(fd)
        
        
        def read_owned(root, name, cap, expected=None):
            before = os.stat(name, dir_fd=root, follow_symlinks=False)
            need(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid()
                 and stat.S_IMODE(before.st_mode) == 0o600 and before.st_nlink == 1 and before.st_size <= cap)
            fd = os.open(name, F, dir_fd=root)
            try:
                need(ident(os.fstat(fd)) == ident(before))
                raw = bytearray()
                while len(raw) < before.st_size:
                    chunk = os.read(fd, min(65536, before.st_size - len(raw)))
                    need(chunk)
                    raw.extend(chunk)
                need(os.read(fd, 1) == b"")
                need(ident(before) == ident(os.fstat(fd)) == ident(os.stat(name, dir_fd=root, follow_symlinks=False)))
                row = {"stat": ident(before), "sha256": hashlib.sha256(raw).hexdigest()}
                need(expected is None or row == expected)
                return bytes(raw), row
            finally:
                os.close(fd)
        
        
        def observe(e, scratch, event_digest):
            dirs = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin"})
            captures = {}
            for fd, name in ((1, "stdout.bin"), (2, "stderr.bin")):
                s = os.fstat(fd)
                need(stat.S_ISREG(s.st_mode) and ident(s) == ident(at(scratch + "/" + name))
                     and s.st_uid == os.getuid() and stat.S_IMODE(s.st_mode) == 0o600
                     and s.st_nlink == 1 and s.st_size == 0)
                captures[name] = ident(s)
            targets, parents, closes, reads, selected_status = fixed_targets()
            value = {"schema": "mrk-gnome-libpython-installed-version-observation-1",
                     "scope": "three-targets-twelve-parents-installed-version-no-admission",
                     "binding": binding(e, event_digest), "targets": targets, "parents": parents,
                     "originalCloses": closes, "supplierReads": reads, "packageStatus": selected_status,
                     "bootstrapTrust": P["bootstrapTrust"], "nonClaims": P["nonClaims"],
                     "hostQualified": False, "nativeQualified": False,
                     "original": {"directories": dirs, "captures": captures,
                                  "observerArgv": ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"]}}
            public_observation(value, binding(e, event_digest))
            raw = canonical(value)
            need(len(raw) <= P["caps"]["outputBytes"])
            root = directory(scratch)
            try:
                output = write_owned(root, "observation.json", raw)
                index = {"schema": "mrk-gnome-host-observation-index-1", "binding": value["binding"],
                         "directories": dirs, "observation": output}
                write_owned(root, "index.json", canonical(index))
                os.fsync(root)
            finally:
                os.close(root)
        
        
        def public_identity(value):
            need(type(value) is dict and set(value) == set(STAT_KEYS)
                 and all(type(v) is int for v in value.values()))
            need(all(value[k] >= 0 for k in ("device", "uid", "gid", "bytes", "blocks"))
                 and value["inode"] > 0 and value["links"] > 0 and 0 <= value["mode"] <= 0o7777
                 and all(-(2**63) <= value[k] < 2**63 for k in ("mtimeNs", "ctimeNs")))
            return value
        
        
        def public_pair(row):
            before, after = public_identity(row["before"]), public_identity(row["after"])
            need(before == after)
            return before
        
        
        def public_observation(value, expected_binding):
            """Strict saved DATA only; no supplier I/O or package/native acceptance."""
            need(type(value) is dict and set(value) == {"schema", "scope", "binding", "targets", "parents",
                 "originalCloses", "supplierReads", "packageStatus", "bootstrapTrust", "nonClaims",
                 "hostQualified", "nativeQualified", "original"})
            need(value["schema"] == "mrk-gnome-libpython-installed-version-observation-1"
                 and value["scope"] == "three-targets-twelve-parents-installed-version-no-admission")
            need(value["binding"] == expected_binding
                 and value["hostQualified"] is False and value["nativeQualified"] is False)
            need(value["bootstrapTrust"] == P["bootstrapTrust"] and value["nonClaims"] == P["nonClaims"])
            need(type(value["parents"]) is list and len(value["parents"]) == len(P["parents"]))
            for row, spec in zip(value["parents"], P["parents"]):
                need(type(row) is dict and set(row) == {"path", "parent", "kind", "role", "before", "after"})
                edge = row["parent"]
                need(row["path"] == spec["path"] and row["kind"] == "directory" and row["role"] == spec["role"]
                     and (edge is None if spec["parent"] is None else type(edge) is int and edge == spec["parent"]))
                s = public_pair(row)
                need(s["uid"] == spec["uid"] and s["gid"] == spec["gid"] and s["mode"] == spec["mode"])
            need(type(value["targets"]) is list and len(value["targets"]) == len(P["targets"]))
            reads = {"symlinkTexts": 0, "symlinkBytes": 0, "regularBodies": 0, "regularBodyBytes": 0}
            terminals = []
            for number, (target, spec) in enumerate(zip(value["targets"], P["targets"])):
                need(type(target) is dict and set(target) == {"seed", "parent", "nodes"}
                     and target["seed"] == spec["path"] and type(target["parent"]) is int
                     and target["parent"] == spec["parent"] and type(target["nodes"]) is list
                     and 1 <= len(target["nodes"]) <= spec["maxEdges"] + 1)
                expected, seen = spec["path"], set()
                for i, row in enumerate(target["nodes"]):
                    need(type(row) is dict and row.get("kind") in ("symlink", "regular"))
                    keys = {"path", "kind", "before", "after", "sha256"}
                    keys |= {"text", "textBytes", "nextPath"} if row["kind"] == "symlink" else {"bytes"}
                    need(set(row) == keys and row["path"] == expected and expected not in seen)
                    seen.add(expected)
                    s = public_pair(row)
                    need(s["uid"] == s["gid"] == 0 and s["links"] == 1
                         and type(row["sha256"]) is str and re.fullmatch(r"[0-9a-f]{64}", row["sha256"]) is not None)
                    if row["kind"] == "symlink":
                        need(number == 0 and i < len(target["nodes"]) - 1 and s["mode"] == 0o777
                             and type(row["text"]) is str and type(row["textBytes"]) is int
                             and 0 < row["textBytes"] == s["bytes"] <= P["caps"]["linkTextBytes"])
                        raw = row["text"].encode("ascii")
                        text, next_path = public_alias_text(raw)
                        need(len(raw) == row["textBytes"] and row["text"] == text
                             and row["nextPath"] == next_path and next_path not in seen
                             and row["sha256"] == hashlib.sha256(raw).hexdigest())
                        expected = next_path
                        reads["symlinkTexts"] += 1
                        reads["symlinkBytes"] += len(raw)
                    else:
                        need(i == len(target["nodes"]) - 1 and s["mode"] in (0o644, 0o755)
                             and type(row["bytes"]) is int and 0 < row["bytes"] == s["bytes"] <= spec["maxBytes"])
                        if spec["path"] == "/var/lib/dpkg/status":
                            need(s["mode"] == 0o644 and spec["maxEdges"] == 0)
                        terminals.append(row["path"])
                        reads["regularBodies"] += 1
                        reads["regularBodyBytes"] += row["bytes"]
            selected_status = public_package_status(value["packageStatus"])
            status_target = value["targets"][selected_status["targetIndex"]]
            need(status_target["seed"] == "/var/lib/dpkg/status" and len(status_target["nodes"]) == 1
                 and status_target["nodes"][0]["path"] == status_target["seed"]
                 and status_target["nodes"][0]["kind"] == "regular")
            need(reads["regularBodies"] == 3 and reads["symlinkTexts"] <= 2
                 and reads["symlinkBytes"] <= 1024)
            closes = value["originalCloses"]
            need(type(closes) is dict and set(closes) == {"order", "allReturned"}
                 and type(closes["order"]) is list
                 and closes["order"] == list(reversed(terminals)) + [s["path"] for s in reversed(P["parents"])]
                 and closes["allReturned"] is True)
            actual = value["supplierReads"]
            need(type(actual) is dict and set(actual) == set(reads)
                 and all(type(v) is int for v in actual.values()) and actual == reads)
            original = value["original"]
            need(type(original) is dict and set(original) == {"directories", "captures", "observerArgv"}
                 and type(original["captures"]) is dict
                 and set(original["captures"]) == {"stdout.bin", "stderr.bin"}
                 and type(original["directories"]) is dict)
            need(original["observerArgv"] == ["/usr/bin/python3.12", "-I", "-S", "-B", "-", "observe"])
            for group in ("captures", "directories"):
                for facts in original[group].values():
                    public_identity(facts)
            need(len(canonical(value)) <= P["caps"]["outputBytes"])
            return value
        
        
        def return_data(e, scratch, event_digest):
            root = directory(scratch)
            try:
                root_stat = os.fstat(root)
                need(root_stat.st_uid == os.getuid() and stat.S_IMODE(root_stat.st_mode) == 0o700
                     and ident(root_stat) == ident(at(scratch)))
                wait_raw, wait_pin = read_owned(root, "wait.json", 4096)
                wait = decode(wait_raw, True)
                need(set(wait) == {"schema", "status", "startUnix", "endUnix"} and wait["schema"] == "mrk-gnome-host-observer-wait-1")
                need(type(wait["status"]) is int and 0 <= wait["status"] <= 255)
                need(all(re.fullmatch(r"[0-9]{10,12}\.[0-9]{6}", wait[k]) for k in ("startUnix", "endUnix")))
                need(int(wait["endUnix"].replace(".", "")) >= int(wait["startUnix"].replace(".", "")))
                if wait["status"] != 0:
                    os.write(1, ("MRK-GNOME ORIGINAL-WAIT-NONZERO " + str(wait["status"]) + "\n").encode())
                    return wait["status"]
                index_raw, index_pin = read_owned(root, "index.json", 65536)
                index = decode(index_raw, True)
                expected_binding = binding(e, event_digest)
                need(set(index) == {"schema", "binding", "directories", "observation"})
                need(index["schema"] == "mrk-gnome-host-observation-index-1" and index["binding"] == expected_binding)
                current = scratch_state(scratch, {"home", "tmp", "neutral", "stdout.bin", "stderr.bin", "wait.json", "observation.json", "index.json"})
                need(set(current) == set(index["directories"]))
                need(all(owned_identity(current[p], index["directories"][p]) for p in current))
                raw, pin = read_owned(root, "observation.json", P["caps"]["outputBytes"], index["observation"])
                value = public_observation(decode(raw, True), expected_binding)
                need(value["original"]["directories"] == index["directories"])
                captures = {}
                for name in ("stdout.bin", "stderr.bin"):
                    capture, capture_pin = read_owned(root, name, 0)
                    need(capture == b"" and capture_pin["stat"] == value["original"]["captures"][name])
                    captures[name] = capture_pin
                # Pending return wait/disposal is explicit. Neither is self-certified.
                receipt = {"schema": "mrk-gnome-host-return-1", "binding": expected_binding,
                           "observation": pin, "index": index_pin, "originalWait": wait,
                           "waitFile": wait_pin, "emptyCaptures": captures,
                           "returnWait": "pending-original-shell-wait", "jobDisposal": "requires-provider-job-evidence"}
                bodies = [("observation.json", raw), ("return.json", canonical(receipt))]
                need(sum(len(b) for _, b in bodies) <= P["caps"]["outputBytes"] + 16384)
                frames, summary = [], []
                for number, (name, body) in enumerate(bodies, 1):
                    digest, parts = hashlib.sha256(body).hexdigest(), (len(body) + 3071) // 3072
                    frames.append(f"MRK-GNOME BEGIN {number} {name} {len(body)} {digest}\n".encode())
                    for part, offset in enumerate(range(0, len(body), 3072), 1):
                        frames.append(f"MRK-GNOME DATA {number} {part:06d} ".encode() + base64.b64encode(body[offset:offset + 3072]) + b"\n")
                    frames.append(f"MRK-GNOME END {number} {parts} {len(body)} {digest}\n".encode())
                    summary.append([number, name, len(body), parts, digest])
                frames.append(f"MRK-GNOME COMPLETE 2 {sum(len(b) for _, b in bodies)} {hashlib.sha256(canonical(summary)).hexdigest()}\n".encode())
                need(sum(map(len, frames)) <= P["caps"]["frameBytes"])
                for frame in frames:
                    view = memoryview(frame)
                    while view:
                        count = os.write(1, view)
                        need(count > 0)
                        view = view[count:]
                return 0
            finally:
                os.close(root)
        
        
        def main():
            os.umask(0o077)
            for key, value in ((resource.RLIMIT_AS, 512 * 2**20), (resource.RLIMIT_CPU, 60),
                               (resource.RLIMIT_NOFILE, 128), (resource.RLIMIT_FSIZE, 8 * 2**20),
                               (resource.RLIMIT_CORE, 0)):
                resource.setrlimit(key, (value, value))
            need(sys.argv in (["-", "observe"], ["-", "return"]))
            e, scratch, event_digest = context()
            if sys.argv[1] == "observe":
                observe(e, scratch, event_digest)
                return 0
            return return_data(e, scratch, event_digest)
        
        
        if __name__ == "__main__":
            try:
                status = main()
            except BaseException as error:
                # Closed errors, no paths, config/event text, environment or traceback.
                status = 72 if isinstance(error, Refused) else 73 if isinstance(error, OSError) else 74 if isinstance(error, (ValueError, UnicodeError)) else 75
                os.write(2, ("MRK-GNOME REFUSED " + str(status) + "\n").encode())
            sys.exit(status)
