name: Feature request
description: Suggest an idea or improvement for Mobile Release Kit.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This issue is public, so do not include tokens,
        keys, credentials or personal paths.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Mobile Release Kit is this about?
      options:
        - Desktop app
        - CLI toolkit
        - Shared workflows
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches or workarounds you have tried.
    validations:
      required: false
