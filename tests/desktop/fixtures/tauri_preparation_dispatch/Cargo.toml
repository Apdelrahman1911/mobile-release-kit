[package]
name = "mrk-tauri-preparation-dispatch-test"
version = "0.0.0"
edition = "2021"
publish = false

# Test-only MockRuntime: no Wry/WebKit, app startup, or native maintenance.
[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "sync"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.dev]
debug = 0
