name: Mobile internal candidate
run-name: ${{ inputs.desktop_request != '' && format('MRK Desktop candidate [{0}]', inputs.desktop_request) || 'Mobile internal candidate' }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, reserve, bind one future tag, or explicitly clean one encrypted known Play edit
        required: false
        default: candidate
        type: choice
        options:
        - candidate
        - reserve-version
        - reserve-future-tag
        - bind-version-tag
        - recover-play-edit
      platform:
        description: Platforms enabled in the saved configuration
        required: true
        type: choice
        options:
        - android
        - ios
        - both
      confirmation:
        description: candidate:<platform>:<version>:<build>; reserve-version:ios; or reserve-version:<android|both>:temporary-play-edit (may invalidate another Play edit); recover-play-edit:<candidateUUID>:<attemptUUID>; reserve-future-tag:<ios|android|both>[:temporary-play-edit]:refs/tags/T; bind-version-tag:<platform>:<candidateUUID>:<rowSHA256>:<finalSHA>
        required: true
        type: string
      recovery_run_id:
        description: Run holding the original intent or selected complete final; never replaces authorization.
        required: false
        default: ''
        type: string
      recovery_confirmation:
        description: Exact additional iOS recovery confirmation, only when requested by reconciliation.
        required: false
        default: ''
        type: string
      desktop_request:
        description: Optional exact Desktop request marker; use with reviewed source and full ref.
        required: false
        default: ''
        type: string
      desktop_source_sha:
        description: Optional Desktop-reviewed current dispatch commit; not a replacement for original recovery source.
        required: false
        default: ''
        type: string
      desktop_expected_ref:
        description: Optional Desktop-reviewed full branch ref; all three Desktop inputs must be supplied together.
        required: false
        default: ''
        type: string
permissions: {}
jobs:
  candidate:
    if: inputs.operation == 'candidate'
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: __MOBILE_RELEASE_KIT_REPOSITORY__/.github/workflows/reusable-candidate.yml@__MOBILE_RELEASE_KIT_SHA__
    with:
      operation: candidate
      tooling_sha: __MOBILE_RELEASE_KIT_SHA__
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
      confirmation: ${{ inputs.confirmation }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      recovery_confirmation: ${{ inputs.recovery_confirmation }}
      desktop_request: ${{ inputs.desktop_request }}
      desktop_source_sha: ${{ inputs.desktop_source_sha }}
      desktop_expected_ref: ${{ inputs.desktop_expected_ref }}
  reserve_version:
    if: inputs.operation == 'reserve-version' || inputs.operation == 'reserve-future-tag' || inputs.operation == 'bind-version-tag' || inputs.operation == 'recover-play-edit'
    permissions:
      actions: read
      contents: read
    uses: __MOBILE_RELEASE_KIT_REPOSITORY__/.github/workflows/reusable-candidate.yml@__MOBILE_RELEASE_KIT_SHA__
    with:
      operation: ${{ inputs.operation }}
      tooling_sha: __MOBILE_RELEASE_KIT_SHA__
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
      confirmation: ${{ inputs.confirmation }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      recovery_confirmation: ${{ inputs.recovery_confirmation }}
      desktop_request: ${{ inputs.desktop_request }}
      desktop_source_sha: ${{ inputs.desktop_source_sha }}
      desktop_expected_ref: ${{ inputs.desktop_expected_ref }}
    secrets:
      version_allocation_app_id: ${{ secrets.MOBILE_RELEASE_VERSION_APP_ID }}
      version_allocation_app_private_key: ${{ secrets.MOBILE_RELEASE_VERSION_APP_PRIVATE_KEY }}
