name: Mobile external testing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform whose exact internal build should be promoted
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string
      confirmation:
        description: external-testing:<platform>:<version>:<build>
        required: true
        type: string

permissions: {}

jobs:
  # The called jobs select mobile-external-testing; credentials must be scoped there.
  # This caller intentionally forwards no repository/organization secrets.
  external-testing:
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: __MOBILE_RELEASE_KIT_REPOSITORY__/.github/workflows/reusable-external-testing.yml@__MOBILE_RELEASE_KIT_SHA__
    with:
      tooling_sha: __MOBILE_RELEASE_KIT_SHA__
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      confirmation: ${{ inputs.confirmation }}
