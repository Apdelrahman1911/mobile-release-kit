name: Mobile production submission
run-name: ${{ inputs.desktop_request != '' && format('MRK Desktop production-submit [{0}]', inputs.desktop_request) || 'Mobile production submission' }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Exactly one platform to prepare for production review
        required: true
        type: choice
        options:
        - android
        - ios
      candidate_run_id:
        description: Common candidate evidence run; leave blank for per-platform or preserved recovery inputs.
        required: false
        default: ''
        type: string
      external_run_id:
        description: Common external evidence run; leave blank for per-platform or preserved recovery inputs.
        required: false
        default: ''
        type: string
      confirmation:
        description: production-submit:<platform>:<version>:<build>
        required: true
        type: string
      recovery_run_id:
        description: Run holding the original intent or selected complete final; never replaces authorization.
        required: false
        default: ''
        type: string
      recovery_confirmation:
        description: Exact additional iOS recovery confirmation, only when requested by reconciliation.
        required: false
        default: ''
        type: string
      candidate_android_run_id:
        description: android candidate evidence run; cannot conflict with a common run.
        required: false
        default: ''
        type: string
      candidate_ios_run_id:
        description: ios candidate evidence run; cannot conflict with a common run.
        required: false
        default: ''
        type: string
      external_android_run_id:
        description: android external evidence run; cannot conflict with a common run.
        required: false
        default: ''
        type: string
      external_ios_run_id:
        description: ios external evidence run; cannot conflict with a common run.
        required: false
        default: ''
        type: string
      desktop_request:
        description: Optional exact Desktop request marker; use with reviewed source and full ref.
        required: false
        default: ''
        type: string
      desktop_source_sha:
        description: Optional Desktop-reviewed current dispatch commit; not a replacement for original recovery source.
        required: false
        default: ''
        type: string
      desktop_expected_ref:
        description: Optional Desktop-reviewed full branch ref; all three Desktop inputs must be supplied together.
        required: false
        default: ''
        type: string
permissions: {}
jobs:
  production-submit:
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: __MOBILE_RELEASE_KIT_REPOSITORY__/.github/workflows/reusable-production-submit.yml@__MOBILE_RELEASE_KIT_SHA__
    with:
      tooling_sha: __MOBILE_RELEASE_KIT_SHA__
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      external_run_id: ${{ inputs.external_run_id }}
      confirmation: ${{ inputs.confirmation }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      recovery_confirmation: ${{ inputs.recovery_confirmation }}
      candidate_android_run_id: ${{ inputs.candidate_android_run_id }}
      candidate_ios_run_id: ${{ inputs.candidate_ios_run_id }}
      external_android_run_id: ${{ inputs.external_android_run_id }}
      external_ios_run_id: ${{ inputs.external_ios_run_id }}
      desktop_request: ${{ inputs.desktop_request }}
      desktop_source_sha: ${{ inputs.desktop_source_sha }}
      desktop_expected_ref: ${{ inputs.desktop_expected_ref }}
